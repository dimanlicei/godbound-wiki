name: Свобода
kind: canon
colors:
  glow: '#8fe8c8'
  deep: '#123028'
  dark: '#061410'
icon: images/icons/words/svoboda.webp
description: |-
  Божественное Слово Свободы охватывает вольность разума и тела и ничем не скованное проявление человеческой воли. Оно способно стирать принуждения, расторгать договоры, отпирать оковы и растворять связывающие узы. Такое освобождение проходит без непосредственных дурных последствий: расторгнутые договоры, например, не считаются нарушенными сделками, а разорванные узы не влекут за собой злобы. Божество Свободы может насаждать эту вольность даже неохотным подопечным, вынуждая их принять собственный выбор, хотят они того или нет.

  Обожествлённый Свободы обладает неуязвимой защитой от любого эффекта, управляющего разумом или влияющего на него, будь то магическая напасть или смертное пристрастие.
gifts:
- name: Клич Освободителя
  slug: klich-osvoboditelya
  tier: lesser
  icon: images/icons/gifts/svoboda/klich-osvoboditelya.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Криком или напряжением воли все желаемые цели в пределах 300
    футов освобождаются от любого ментального принуждения или физических пут. У заточённых в обычных темницах
    мгновенно отпираются все запертые двери на их пути. До конца сцены эти подопечные обладают неуязвимой
    защитой от ментального влияния и физических пут.
- name: Отринуть Нужду
  slug: otrinut-nuzhdu
  tier: lesser
  icon: images/icons/gifts/svoboda/otrinut-nuzhdu.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Обожествлённый освобождается от человеческих нужд в пище, воде, сне и воздухе. Действием он может
    излечить любую видимую цель от психических расстройств и любых душевных или телесных пристрастий.
- name: Путь к Свободе
  slug: put-k-svobode
  tier: lesser
  icon: images/icons/gifts/svoboda/put-k-svobode.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. До конца сцены Обожествлённый создаёт за собой чистый путь, и
    никакое обычное препятствие не может его остановить. Каменные стены, отвесные обрывы, кипящие лавовые
    озёра и даже путь прямо в воздух становятся проходимы. Шаги Обожествлённого оставляют безопасный проход
    сквозь все такие физические преграды, и он остаётся открытым до конца сцены.
- name: Раскованный Шаг
  slug: raskovannyy-shag
  tier: lesser
  icon: images/icons/gifts/svoboda/raskovannyy-shag.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: день'
  body: Обожествлённый обладает неуязвимой защитой от захвата, связывания и паралича. Обычные замки на
    его пути открываются перед ним сами, а магические обереги можно открыть, приложив Усилие до конца
    дня. Обожествлённый должен пройти сквозь так отпертые двери — он не может просто отпереть их и уйти.
- name: Сжечь Сделку
  slug: szhech-sdelku
  tier: lesser
  icon: images/icons/gifts/svoboda/szhech-sdelku.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня, указав определённую явную сделку или соглашение между двумя людьми.
    Сделка немедленно становится необязывающей, и все стороны это осознают. Ни один суд её не примет,
    ни один зависящий от неё магический эффект не сохранится, и ни один меньший противник не станет считаться
    с её существованием. Достойные противники могут пройти спасбросок Духа, чтобы продолжать добиваться
    её исполнения, но делать это им придётся самим, без одобрения общества. Магические договоры — например,
    с Несотворёнными — разрываются мгновенно и без вреда для заключившего их.
- name: Сломить Могучего
  slug: slomit-moguchego
  tier: lesser
  icon: images/icons/gifts/svoboda/slomit-moguchego.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: сцена'
  body: 'Приложите Усилие до конца сцены и выберите целью существо, у которого хотя бы один человек находится
    в подчинении. Это подчинение должно быть больше чем просто наём: оно должно быть как у господина над
    вассалом или у истязателя над жертвой. До конца сцены у этой цели класс защиты 9 против атак Обожествлённого.'
- name: Одинокий Огонь
  slug: odinokiy-ogon
  tier: greater
  icon: images/icons/gifts/svoboda/odinokiy-ogon.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Обожествлённый должен назвать определённые отношения или службу — например, «стражник герцога
    Лао», «муж Су Цинь» или «громила Тонга Алого Столпа», — прежде чем приложить Усилие до конца дня.
    Все выбранные цели в пределах 300 футов немедленно теряют эти отношения. Они больше не считают себя
    связанными прежними узами, будут пренебрегать их требованиями и не создадут эти отношения заново,
    если только не получат совершенно новых к тому побуждений. Достойные противники могут пройти спасбросок
    Духа, чтобы противостоять такой принудительной отставке.
- name: Раб Воздаёт
  slug: rab-vozdaet
  tier: greater
  icon: images/icons/gifts/svoboda/rab-vozdaet.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: день'
  body: Обожествлённый должен был когда-то быть слугой цели этого дара, исполнив хотя бы одно нежеланное
    указание и подчинив свою волю её воле. Обожествлённый может пойти на это и добровольно, но дар не
    действует, если цель, которой он служит, ему по нраву или прямо служит его собственным интересам.
    Когда этот дар применяется против такого бывшего хозяина и Усилие приложено до конца дня, цель лишается
    возможности тратить Усилие на автоматический спасбросок против сил Обожествлённого, а обычные атаки
    Обожествлённого по ней всегда попадают и наносят максимальный урон.
- name: С Тобой во Тьме
  slug: s-toboy-vo-tme
  tier: greater
  icon: images/icons/gifts/svoboda/s-toboy-vo-tme.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Обожествлённый должен знать имя определённого узника. Действием он может приложить Усилие до конца
    дня, чтобы вместе со спутниками появиться рядом с этим узником, независимо от расстояния и магических
    оберегов, что могли бы им помешать. Применить этот дар снова Обожествлённый не может, пока узник не
    будет мёртв или свободен. Этот дар может перенести Обожествлённого даже к душе, заточённой в Аду,
    но сделать этот шаг он может, лишь стоя на Ночной Дороге. Такого узника-душу придётся освободить из
    Ада, чтобы применить дар снова, ведь умереть он не может.
