name: Оборотничество
kind: canon
colors:
  glow: '#d8c184'
  deep: '#241e10'
  dark: '#0e0b06'
icon: images/icons/words/oborotnichestvo.webp
description: |-
  Слово Оборотничества повелевает телесными превращениями всех видов — как самого владельца, так и тех, на кого направлены его силы. Оборотничество — Слово весьма плотское и осязаемое; оно не изменяет умы дальше того озарения, что необходимо для пользования новыми конечностями или подражания другим. Вместо этого оно лепит плоть по желанию владельца.

  Оборотни используют правила превращения со стр. 160. При смене облика их немагическая одежда и личные вещи либо исчезают, либо преображаются в подходящие новому облику. Исчезнувшие вещи возвращаются, когда оборотень принимает облик, способный их носить или использовать, а преображённые вещи возвращают себе прежний вид. Преображённые вещи, сброшенные Обожествлённым, остаются в новом виде. Так, Обожествлённый, обратившийся в судью, при желании получит и подобающее такому лицу платье.

  Обожествлённые, связанные со Словом Оборотничества, обладают неуязвимой защитой от любого нежеланного эффекта, изменяющего их облик, — не считая простого урона, но включая увечья, татуировки, клейма и уродование. Раз в день они могут разгладить собственные раны, исцелив Мгновенным действием хиты, равные их уровню.
gifts:
- name: Дар Заимствованного Облика
  slug: dar-zaimstvovannogo-oblika
  tier: lesser
  icon: images/icons/gifts/oborotnichestvo/dar-zaimstvovannogo-oblika.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: по желанию'
  body: Принимая облик существа, вы можете перенять и его особые способности. Хотя вы не можете подражать
    связанным Словам, божественным дарам, теургии и иному выученному колдовству, вы можете обрести каменящий
    взгляд медузы, огненное дыхание дракона или иной магический дар. Старые бестиарии подскажут идеи для
    обликов, но перечень допустимых сил остаётся на усмотрение Ведущего. Каждый перенятый дар требует
    от вас приложить Усилие; когда вы покидаете облик, это Усилие возвращается в конце сцены.
- name: Десять Тысяч Шкур
  slug: desyat-tysyach-shkur
  tier: lesser
  icon: images/icons/gifts/oborotnichestvo/desyat-tysyach-shkur.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Вы можете превратиться в любое существо не меньше мыши и не крупнее лося. В этом облике вы сохраняете
    собственные атрибуты, хиты и боевые бонусы, но можете пользоваться любыми способами передвижения,
    свойственными новому облику. Нося облик зверя, вы можете общаться со зверями того же рода. Если вы
    приложите Усилие до конца сцены, вы можете использовать этот дар действием В ход.
- name: Зализать Раны
  slug: zalizat-rany
  tier: lesser
  icon: images/icons/gifts/oborotnichestvo/zalizat-rany.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Вы срастаете разорванную плоть и сломанные кости в собственном теле, на миг становясь текучим
    от жизненной силы. Приложите Усилие до конца дня, чтобы исцелить 1к6 хитов за каждые три уровня с
    округлением вверх. До начала вашего следующего хода вы невосприимчивы к физическому оружию и вреду
    от предметов.
- name: Когти, Что Настигают
  slug: kogti-chto-nastigayut
  tier: lesser
  icon: images/icons/gifts/oborotnichestvo/kogti-chto-nastigayut.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Вы можете явить когти или иное природное оружие в любом принятом облике, включая человеческие
    личины. Они наносят 1к10 повреждений и считаются магическим оружием. Вы также можете приложить Усилие
    до конца сцены, чтобы выделять яд, который убьёт или обездвижит меньшего противника, провалившего
    спасбросок Стойкости; этот яд наносится на каждую вашу физическую атаку в течение сцены. Против Толп
    меньших противников этот яд вместо своего эффекта заставляет вашу атаку наносить максимальный урон.
- name: Маскарад
  slug: maskarad
  tier: lesser
  icon: images/icons/gifts/oborotnichestvo/maskarad.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Вы можете принять любой гуманоидный облик по желанию, включая безупречную копию существующего
    человека, которого вы наблюдали. Голос и телесные повадки воспроизводятся в точности, но особого знания
    о том, как он себя ведёт и говорит, вы не получаете. Это тело можно вылепить в любой желаемый вид,
    но ваши собственные характеристики остаются прежними. Если вы приложите Усилие до конца сцены, вы
    можете использовать этот дар действием В ход.
- name: Текучее Тело
  slug: tekuchee-telo
  tier: lesser
  icon: images/icons/gifts/oborotnichestvo/tekuchee-telo.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Вы можете размягчить и разжижить свой облик, что позволяет проходить через любую преграду, проницаемую
    для жидкости, и двигаться при этом со своей обычной скоростью. Эта жидкая форма может сохранять человеческий
    вид, но она слишком мягка, чтобы управляться с предметами, атаковать противника или применять враждебные
    силы, — зато невосприимчива к немагическому оружию.
- name: Величие Внутри
  slug: velichie-vnutri
  tier: greater
  icon: images/icons/gifts/oborotnichestvo/velichie-vnutri.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: 'Природные способности оборотня к превращению усилены, что позволяет его дарам превращения — вроде
    «Десяти Тысяч Шкур» — принимать чрезвычайно крупные облики: размером с дракона, скромный дом или небольшое
    парусное судно. Смертный, превращённый в очень крупный облик — не меньше слона, — получает 3 хит-дайса,
    если его собственных не больше.'
- name: Ковка Плоти и Кости
  slug: kovka-ploti-i-kosti
  tier: greater
  icon: images/icons/gifts/oborotnichestvo/kovka-ploti-i-kosti.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: 'Приложите Усилие до конца дня. Вы можете изменить телесный облик видимой цели в любую форму,
    которую способны принять сами. Подопечные, превращённые в зверей, используют правила со стр. 160.
    Достойные противники могут пройти спасбросок Стойкости, чтобы противостоять этому изменению. Этот
    дар не может исцелить цель или восстановить искалеченные органы и конечности: увечье проявится и в
    новом облике. Это превращение постоянно, пока Обожествлённый его не снимет или оно не будет рассеяно.'
- name: Обманчивые Лица
  slug: obmanchivye-litsa
  tier: greater
  icon: images/icons/gifts/oborotnichestvo/obmanchivye-litsa.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Изображая кого-то, вы чутьём знаете языки и то, что нужно делать для поддержания личины, даже
    если у вас нет никакой возможности знать верные ответы или поступки. Всякий раз, когда вы хотите чего-то
    добиться, вы знаете, как это сделал бы сам оригинал, «оставаясь в образе». Достойные противники, которых
    вы изображаете, могут пройти спасбросок Духа, чтобы заблокировать этот дар.
- name: Холодная, Неподвижная Форма
  slug: holodnaya-nepodvizhnaya-forma
  tier: greater
  icon: images/icons/gifts/oborotnichestvo/holodnaya-nepodvizhnaya-forma.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Вы можете превратиться в неодушевлённый предмет не меньше ножа
    и не крупнее телеги. Предметом можно обычно пользоваться без вреда для вас, хотя попытки сломать или
    разобрать его затрагивают ваши хиты. В превращённом виде вы сохраняете осознание окружающего и можете
    двигать или иначе оживлять части предмета. Обратное превращение требует действия.
