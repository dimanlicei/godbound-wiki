name: Странствия
kind: canon
colors:
  glow: '#a9dcc6'
  deep: '#1c2a24'
  dark: '#0a100e'
icon: images/icons/words/stranstviya.webp
description: |-
  Со Словом Странствий герой забирается далеко: оно ведает дальними путешествиями, прохождением опасных троп и преодолением препятствий. Чудеса Странствий включают стремительное перемещение в желаемое место, разрушение преград на пути героя и избегание опасностей в дороге. Иные чудеса могут запечатывать или открывать существующие Ночные Дороги.

  Герои со Словом Странствий всегда точно знают, где находятся, никогда не сбиваются с пути к известной им цели и могут считать само путешествие столь же освежающим и питательным, как крепкий сон и добрая трапеза.
gifts:
- name: Дающий Задание
  slug: dayuschiy-zadanie
  tier: lesser
  icon: images/icons/gifts/stranstviya/dayuschiy-zadanie.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. Вы можете предложить задание любому Малому или Великому Герою,
    встреченному в пути, и, если оно хотя бы отдалённо правдоподобно, а сам он не настроен вас убить,
    будьте уверены — он сделает всё возможное, чтобы его выполнить. Если у него получится, он будет нутром
    чуять, где вас найти. Задания могут быть опасны и даже вести в ловушку, но герой, полностью обманутый
    этим даром, больше никогда не будет ему подвержен. Если выживет.
- name: Знающий Путь
  slug: znayuschiy-put
  tier: lesser
  icon: images/icons/gifts/stranstviya/znayuschiy-put.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Вы всегда знаете самый безопасный и лёгкий путь к любому месту, которое не скрыто от мира божеством
    могущественнее вас. Это включает и то, как достаточно добыть еду и кров для всех ваших спутников и
    что нужно сделать, чтобы благополучно довести их до цели, — если это хотя бы теоретически возможно.
    Кроме того, вы можете оставить небольшой предмет или послание на любом постоялом дворе, перекрёстке
    или у любого встречного путника и быть уверены, что оно дойдёт до адресата — рано или поздно. Правда,
    это может занять очень много времени, если адресат — затворник или живёт очень далеко.
- name: Открывая Путь
  slug: otkryvaya-put
  tier: lesser
  icon: images/icons/gifts/stranstviya/otkryvaya-put.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены, чтобы создать брешь в охране — будь то стражник, внезапно отошедший
    с поста, или разрыв в магическом барьере. Брешь откроет вам и вашим союзникам свободный путь внутрь
    места или мимо него и продержится столько, сколько практически нужно, но не менее пяти минут. Обычно
    такая брешь недостаточно велика, чтобы позволить свободно перемещаться внутри места, — только попасть
    туда.
- name: Повелитель Ключей
  slug: povelitel-klyuchey
  tier: lesser
  icon: images/icons/gifts/stranstviya/povelitel-klyuchey.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Вы мгновенно справляетесь с любой обычной ловушкой, замком, узлом, путами или печатью. Приложите
    Усилие до конца сцены, чтобы преодолеть магические преграды, ловушки и путы в пределах видимости,
    включая имеющие мысленную природу. Вы можете сделать это, даже если сковывающий эффект иначе оставил
    бы вас беспомощным.
- name: Путь Мчащегося Рассвета
  slug: put-mchaschegosya-rassveta
  tier: lesser
  icon: images/icons/gifts/stranstviya/put-mchaschegosya-rassveta.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: 'Приложите Усилие до конца дня. Вы и до дюжины спутников можете лететь или иначе игнорировать
    местность, двигаясь со скоростью 100 миль в час до конца сцены. В основном это позволяет пересекать
    короткие расстояния, которые иначе были бы непроходимы: полёт недостаточно точен, чтобы быть полезным
    в бою или в тесных помещениях.'
- name: Спокойный Проход
  slug: spokoynyy-prohod
  tier: lesser
  icon: images/icons/gifts/stranstviya/spokoynyy-prohod.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Пока вы путешествуете, вам и до дюжины ваших спутников никогда не помешают случайно
    встреченные существа или дурная погода. Достойные противники, бредущие вам навстречу, получают спасбросок
    Духа, чтобы вас заметить. Никому из вас никогда не вредят природные тяготы климата или окружения.
- name: Стремительное Продвижение
  slug: stremitelnoe-prodvizhenie
  tier: lesser
  icon: images/icons/gifts/stranstviya/stremitelnoe-prodvizhenie.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  - type: eff
    text: 'Усилие: день'
  body: 'Приложите Усилие. Вы и до дюжины спутников движетесь с утроенной обычной дневной скоростью путешествия
    и можете пересекать любую местность, как будто она ровная, — даже горы или моря. Если вы дополнительно
    приложите Усилие до конца дня, то вас и тех, кто с вами, не смогут настичь преследователи, пока вы
    продолжаете путь: ваша группа всегда будет двигаться быстрее них, какова бы ни была их скорость, пока
    вы не остановитесь.'
- name: Возглавить Исход
  slug: vozglavit-ishod
  tier: greater
  icon: images/icons/gifts/stranstviya/vozglavit-ishod.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Ваши дары Странствий могут распространяться на любое число согласных спутников
    в пределах видимости, включая целые армии или города.
- name: Дальноходец
  slug: dalnohodets
  tier: greater
  icon: images/icons/gifts/stranstviya/dalnohodets.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: 'Чтобы купить этот дар, вам нужен культ почитателей и малые дары «Стремительное Продвижение» и
    «Знающий Путь». Вас невозможно выследить никакими средствами, если только вы не остаётесь на одном
    месте дольше 24 часов, и раз в день вы можете перебросить один проваленный спасбросок Уклонения или
    Стойкости. Дорога — ваш дом: встреченные там путники всегда как бы случайно сообщат важную новость
    в нужный момент или добросовестно доставят нужное послание. В итоге ваш максимум Влияния навсегда
    возрастает на два очка.'
- name: Час Нужды
  slug: chas-nuzhdy
  tier: greater
  icon: images/icons/gifts/stranstviya/chas-nuzhdy.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. До дюжины союзников в пределах недельного пути осознали, что вы
    будете нуждаться в них здесь и сейчас, и прибудут в этом раунде, если готовы были прийти. Это может
    создать некоторые проблемы с причинностью, но сила дара позволяет им прибыть невзирая на это. Как
    вариант, вы можете приложить Усилие до конца дня, чтобы перенестись к постоялому двору или перекрёстку,
    ближайшему к любому человеку, с которым вы хотя бы раз делили трапезу. По прибытии вы будете смутно
    ощущать его близость. Это ощущение угасает через несколько секунд, но хотя бы направит вас в нужную
    сторону.
