name: Огонь
kind: canon
colors:
  glow: '#ffb057'
  deep: '#3a1206'
  dark: '#120503'
icon: /images/icons/words/ogon.webp
description: |-
  Рождённое из алого пламени, Слово Огня даёт силы жечь, плавить и уничтожать то, что герою не по нраву. Его же можно использовать, чтобы укрыть союзников от ярости пламени или исправить вред, который огонь причинил человеку или предмету. Его чудеса могут нести свет в тёмное место или скрывать всё пеленой удушливого дыма. Более тонкие чудеса могут воззвать к связи Огня со страстями ярости и вожделения, разжигая эти чувства в других или заставляя их перекидываться на окружающих, как разгорающееся пламя.

  Герои со Словом Огня обладают неуязвимой защитой от пламени и дыма. Они могут владеть огнём как магическим оружием с дальностью до 50 футов и костью урона 1к10.
gifts:
- name: Вернуть из Пепла
  slug: vernut-iz-pepla
  tier: lesser
  icon: /images/icons/gifts/ogon/vernut-iz-pepla.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Каждый раунд «разожгите обратно» предметы или существ в кубе 20 × 20 × 20 футов, исправляя повреждения
    и восстанавливая состояние обгоревших вещей. Урон от огня исцеляется без затрат Усилия, но мёртвых
    это не воскрешает.
- name: Владыка Горнила
  slug: vladyka-gornila
  tier: lesser
  icon: /images/icons/gifts/ogon/vladyka-gornila.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Придавайте форму и направляйте всё пламя в пределах видимости, направляя или
    гася его по своему желанию. Действием подожгите оставленный без присмотра неодушевлённый предмет в
    пределах видимости, если он горюч. Предметы крупнее телеги можно поджечь лишь частично.
- name: Идущий Сквозь Огонь
  slug: iduschiy-skvoz-ogon
  tier: lesser
  icon: /images/icons/gifts/ogon/iduschiy-skvoz-ogon.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Мгновенно узнайте местоположение всего огня в пределах мили.
    Действием телепортируйтесь и выйдите из любого пламени крупнее свечного, вместе с любыми согласными
    спутниками, соприкасающимися с вами. Вы не можете переместиться так более чем на одну милю в общей
    сложности за один час.
- name: Огненная Буря
  slug: ognennaya-burya
  tier: lesser
  icon: /images/icons/gifts/ogon/ognennaya-burya.webp
  badges:
  - type: act
    text: Действие
  - type: smite
    text: Кара
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Выберите точку в пределах видимости; каждую выбранную цель в
    пределах 100 футов от неё поражает падающее пламя, нанося кость урона 1к6 за уровень Обожествлённого,
    со спасброском Уклонения, чтобы уполовинить полученный урон с округлением вверх.
- name: Пламенный Нимб
  slug: plamennyy-nimb
  tier: lesser
  icon: /images/icons/gifts/ogon/plamennyy-nimb.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Вас окружает ореол опаляющего жара. Всякий, кто атакует вас в ближнем бою, получает
    1 очко урона огнём ещё до того, как атака будет разрешена. Нападающие могут получить лишь одно такое
    повреждение за раунд, даже если совершают несколько атак.
- name: Поглощающий Взгляд
  slug: pogloschayuschiy-vzglyad
  tier: lesser
  icon: /images/icons/gifts/ogon/pogloschayuschiy-vzglyad.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Предмет в пределах видимости размером до 20 × 20 × 20 футов охватывается пламенем и обращается
    в мелкий пепел, даже если обычно не горюч. Более крупные предметы могут прогорать несколько раундов.
    На предметы, которые кто-то несёт, это не действует. Правила создания стен пламени и других зон опасной
    местности см. на стр. 27.
- name: Жгучий Упрёк
  slug: zhguchiy-uprek
  tier: greater
  icon: /images/icons/gifts/ogon/zhguchiy-uprek.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Каждый противник, атакующий вас в гневе или страсти, получает урон огнём, равный
    вашей кости Схватки, ещё до разрешения каждой атаки — даже если у него больше хит-дайсов, чем у вас,
    или он совершает несколько атак. Обычно избежать этого урона способны лишь безмозглые твари или на
    редкость дисциплинированные противники. Толпы получают этот урон напрямую.
- name: Обжигающий Клинок
  slug: obzhigayuschiy-klinok
  tier: greater
  icon: /images/icons/gifts/ogon/obzhigayuschiy-klinok.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: 'Приложите Усилие. Вы владеете огнём как оружием: либо окутываете им клинок, либо мечете его как
    магическое оружие с дальностью 200 футов и костью урона 1к10. Отдельные жертвы, убитые таким образом,
    взрываются пламенем, нанося кость урона 1к6 всем желаемым целям в пределах 20 футов. Против Толп меньших
    противников урон этого дара всегда бросается напрямую.'
- name: Слова из Углей
  slug: slova-iz-ugley
  tier: greater
  icon: /images/icons/gifts/ogon/slova-iz-ugley.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Ваш голос опаляет врагов. Каждый меньший противник в пределах слышимости каждый
    раунд получает урон вашей кости Схватки. Раз в раунд вы можете свободным действием одним словом поджечь
    оставленный без присмотра предмет.
