name: Время
kind: canon
colors:
  glow: '#c8c8e4'
  deep: '#242433'
  dark: '#0e0e16'
icon: images/icons/words/vremya.webp
description: |-
  Время — сложное Слово, правящее событиями прошлого и будущего. Хотя временные дары часто позволяют видеть будущее, эти исходы не предрешены. Предсказания можно опрокинуть событиями и решениями, хотя некоторые дары Времени позволяют владельцу закрепить будущее наверняка — если только его волю не пересилит более могучая власть. Чудеса Времени могут менять прошлое и переписывать бывшие события, но обычно приходится работать с определёнными событиями, а не просто предписывать целый пласт истории. Временные ухищрения не могут убивать людей и стирать вещи великой оккультной силы, но могут изменить, как разворачивались прошлые события.

  Герои со Словом Времени всегда точно знают время и невосприимчивы к любым применениям этого Слова против них или для слежки за ними. Они могут установить значение Мудрости равным 16 или 18, если оно уже равно 16 или больше.
gifts:
- name: Взгляд в Будущее
  slug: vzglyad-v-buduschee
  tier: lesser
  icon: images/icons/gifts/vremya/vzglyad-v-buduschee.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. Задайте вопрос о будущем исходе некоего положения дел или о будущих
    поступках человека, которого вы прежде видели. Ведущий даёт ответ в одно предложение о наиболее вероятном,
    на его взгляд, исходе или поступках.
- name: Мгновенное Предвидение
  slug: mgnovennoe-predvidenie
  tier: lesser
  icon: images/icons/gifts/vremya/mgnovennoe-predvidenie.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Вас невозможно застать врасплох. Ваш естественный класс защиты равен 3, поскольку вы чутьём уходите
    от предвиденных ударов. Доспехи и щиты этот класс защиты не улучшают.
- name: Отражение Сожаления
  slug: otrazhenie-sozhaleniya
  tier: lesser
  icon: images/icons/gifts/vremya/otrazhenie-sozhaleniya.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Переиграйте своё действие за этот раунд так, будто ваших действий
    вовсе не было. Этот дар можно применять лишь раз за раунд, и его нельзя применить, если вы мертвы
    или обездвижены.
- name: Пророческое Прозрение
  slug: prorocheskoe-prozrenie
  tier: lesser
  icon: images/icons/gifts/vremya/prorocheskoe-prozrenie.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. Изреките пророчество об определённом событии, затрагивающем присутствующего
    человека. Оно сбудется, если не совершенно невероятно. Если оно напрямую затрагивает несогласного
    достойного противника, тот может пройти спасбросок Духа, чтобы сорвать эффект. События, немедленно
    затрагивающие более сотни человек, так предречь нельзя; нельзя предсказать и неминуемую смерть или
    великое разорение человека, если только он не считается меньшим противником. Да и тогда ему даётся
    спасбросок Духа.
- name: Час Увядания
  slug: chas-uvyadaniya
  tier: lesser
  icon: images/icons/gifts/vremya/chas-uvyadaniya.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Ваше оружие, взгляд или безоружные удары считаются магическим оружием, наносящим
    1к10 повреждений на дальности до 200 футов. Раненные этим эффектом стареют или ветшают — обтрёпываются
    даже бессмертные. Вместо того чтобы этим убить жертву, вы можете состарить её на произвольный срок.
- name: Эхо Прошлого
  slug: eho-proshlogo
  tier: lesser
  icon: images/icons/gifts/vremya/eho-proshlogo.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Выберите определённое время или известное вам событие прошлого,
    случившееся в этом месте, и станьте его свидетелем, будто вы там присутствовали.
- name: Переткать Время
  slug: peretkat-vremya
  tier: greater
  icon: images/icons/gifts/vremya/peretkat-vremya.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня и выберите событие в этой местности, случившееся за последний час.
    Вы можете переткать прошлое так, чтобы событие получило иной исход, при условии, что назначенный вами
    исход возможен. Такое перетыкание не может убивать или воскрешать существ, не может вернуть приложенное
    Усилие и должно ограничиваться событием длительностью не более 15 минут. Враждебный достойный противник,
    причастный к событиям, может пройти спасбросок Духа, чтобы сорвать перетыкание.
- name: Расколотое Мгновение
  slug: raskolotoe-mgnovenie
  tier: greater
  icon: images/icons/gifts/vremya/raskolotoe-mgnovenie.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: сцена'
  - type: eff
    text: 'Усилие: день'
  body: 'Приложите Усилие до конца сцены. Совершите своё действие за раунд, затем отмотайте время к его
    началу и совершите другое действие за раунд. Выберите предпочтительный раунд: его последствия становятся
    настоящими, а другой перестаёт существовать, даже если вы в нём погибли. Впрочем, вы помните оба раунда.
    Применение этого дара более одного раза за сцену повышает стоимость Усилия до приложения на день.'
- name: Рука на Весах
  slug: ruka-na-vesah
  tier: greater
  icon: images/icons/gifts/vremya/ruka-na-vesah.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня, выберите одно видимое существо или предмет и определите некий исход
    или событие, связанное с этой целью, сколь угодно широкое или узкое. Если этот исход или событие когда-либо
    будут вот-вот произойти, вы немедленно об этом узнаёте и можете совершить одно действие так, будто
    стоите рядом с целью. Вы можете атаковать цель, управиться с предметом, применить дар, воззвать к
    чуду или сделать что угодно другое, посильное за одно действие, воздействуя на цель и на всех присутствующих,
    — хотя на самом деле вас там нет, вас нельзя воспринять и на вас нельзя воздействовать. Эта сила может
    подействовать на данную цель лишь раз в день, и нельзя одновременно иметь несколько применений этого
    дара на одной цели.
