name: Солнце
kind: canon
colors:
  glow: '#ffdf6b'
  deep: '#3b2c06'
  dark: '#161003'
icon: /images/icons/words/solntse.webp
description: |-
  Свет, надежда, зрение и чистота — вот владения Слова Солнца. Солнце изгоняет злокозненное колдовство и своим сиянием даёт мужество. Чудеса солнца могут разбивать заклятия, открывать истину, дарить надежду или испепелять нечистых потоками небесного пламени. Око солнца всевидяще, и дары зрения тоже относятся к этой сфере.

  Герои со Словом Солнца могут по желанию источать дневной свет на расстояние до 200 футов, не могут быть ослеплены, и их зрению не мешают тьма или туманы; они обладают неуязвимой защитой от урона огнём. Их зрение пробивает повязки на глазах и сохраняется даже при физическом удалении глаз.
gifts:
- name: Надежда Зари
  slug: nadezhda-zari
  tier: lesser
  icon: /images/icons/gifts/solntse/nadezhda-zari.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Вы и союзники поблизости получаете Мораль 12 и неуязвимую защиту от магического
    влияния на чувства. Союзные НИП получают +1 хит-дайс и +1 к попаданию. Те, кто вас видит, чутьём осознают
    ваши желания, хотя повиноваться не обязаны.
- name: Осветить Сущее
  slug: osvetit-suschee
  tier: lesser
  icon: /images/icons/gifts/solntse/osvetit-suschee.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Ваше сияние очерчивает магические эффекты на людях, изгоняет магическую тьму,
    рассеивает смертные иллюзии и выявляет магические предметы. Обладатели даров Обмана или Ночи могут
    пройти спасбросок Духа, чтобы сохранить свои иллюзии или мглу.
- name: Освещённый Солнцем Взгляд
  slug: osveschennyy-solntsem-vzglyad
  tier: lesser
  icon: /images/icons/gifts/solntse/osveschennyy-solntsem-vzglyad.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Выберите место, где вы бывали и которое сейчас освещено прямым солнечным светом.
    Пока Усилие приложено, вы видите и слышите всё в этом месте, будто находитесь там. Ваш голос могут
    услышать те, кто там присутствует.
- name: Поспешить к Свету
  slug: pospeshit-k-svetu
  tier: lesser
  icon: /images/icons/gifts/solntse/pospeshit-k-svetu.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Мгновенно появитесь в любом месте, освещённом естественным солнечным
    светом или вашим собственным сиянием, если оно в пределах одной мили. Вы появляетесь у ближайшего
    подходящего света к желаемому месту. Этот дар не может перенести вас более чем на милю общего расстояния
    в час.
- name: Тело Горящего Света
  slug: telo-goryaschego-sveta
  tier: lesser
  icon: /images/icons/gifts/solntse/telo-goryaschego-sveta.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Ваше сияние делает вас почти невозможной мишенью для существ, полагающихся на
    зрение. Пока вы сияете, ваш естественный класс защиты против зрячих существ равен 3. Ваше оружие и
    безоружные атаки считаются магическим оружием с дальностью 200 футов и наносят не менее 1к10 повреждений.
    Ваша корона считается естественным солнечным светом для чувствительных к нему существ. Доспехи и щиты
    этот класс защиты не улучшают.
- name: Чистота Блистательного Закона
  slug: chistota-blistatelnogo-zakona
  tier: lesser
  icon: /images/icons/gifts/solntse/chistota-blistatelnogo-zakona.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Защитно рассейте враждебный магический эффект на себе либо наступательно
    подавите чужой дар на раунд, как если бы это удалось чудом. Этот дар действует быстрее обычного чуда
    рассеивания, и Усилие требуется прикладывать на меньший срок.
- name: Очищающее Полуденное Пламя
  slug: ochischayuschee-poludennoe-plamya
  tier: greater
  icon: /images/icons/gifts/solntse/ochischayuschee-poludennoe-plamya.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца сцены. Жгучий свет навсегда изгоняет всю нежелательную низкую магию
    на всю дальность видимости. Если приложить Усилие до конца дня, он подавляет все враждебные дары или
    магические силы одной цели на один раунд, как если бы к каждой из них было успешно применено чудо.
    Для такого наступательного рассеивания этот дар можно использовать лишь раз за сцену.
- name: Первый Свет Творения
  slug: pervyy-svet-tvoreniya
  tier: greater
  icon: /images/icons/gifts/solntse/pervyy-svet-tvoreniya.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Ваше зрение пробивает любую немагическую преграду, позволяя видеть что угодно
    вплоть до горизонта. Чтобы сосредоточиться на чём-то за пределами ближайшей округи, нужен раунд. Это
    зрение само собой пробивает иллюзии и видит истинный облик оборотней. Однако дары Слова Обмана оно
    пробить не может.
- name: Солнечный Удар
  slug: solnechnyy-udar
  tier: greater
  icon: /images/icons/gifts/solntse/solnechnyy-udar.webp
  badges:
  - type: act
    text: Действие
  - type: smite
    text: Кара
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Если солнце в небе, его сияние поражает желаемого видимого противника
    на 1к10 урона огнём за уровень Обожествлённого. Это пламя пробьёт любую крышу или потолок, не защищённые
    от божественных даров, чтобы достать цель. Если солнца в небе нет, разряд наносит 1к6 повреждений
    за уровень. Существа не из этого мира — призванные сущности, ангелы или Несотворённые — всегда получают
    1к10 повреждений за уровень, причём урон бросается дважды с выбором худшего для них результата.
