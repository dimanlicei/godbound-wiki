name: Мощь
kind: canon
colors:
  glow: '#ffc07f'
  deep: '#312414'
  dark: '#130e08'
icon: images/icons/words/mosch.webp
description: |-
  Первобытная сила воплощена в Слове Мощи. Многие воинственные Обожествлённые сильны, но Обожествлённый Мощи превосходит их всех в чистой телесной силе и может творить чудеса поднятия, метания и ломания вещей голыми руками. Он также способен благословлять союзников схожей милостью силы, хотя обычно для определённых действий или испытаний, а не как постоянную прибавку к их способностям.

  Обожествлённый Слова Мощи чудовищно силён: значение его Силы равно 19, а модификатор атрибута Силы — +4. Эта мощь позволяет ему поднять или сломать всё, с чем в принципе способен управиться человек, хотя по-настоящему сверхъестественные подвиги силы требуют применения дара или чуда.
gifts:
- name: Всплеск Силы
  slug: vsplesk-sily
  tier: lesser
  icon: images/icons/gifts/mosch/vsplesk-sily.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены, чтобы сделать максимальным любой один бросок урона, изменяемый
    Силой. Ваша аура чудовищной мощи такова, что по желанию вы можете применить это преимущество к союзнику
    в пределах видимости.
- name: Кулаки Чёрного Железа
  slug: kulaki-chernogo-zheleza
  tier: lesser
  icon: images/icons/gifts/mosch/kulaki-chernogo-zheleza.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Безоружные атаки и атаки оружием Обожествлённого питаются его чудовищной силой. Одноручное оружие
    в его руках наносит 1к10 повреждений, а двуручное или безоружные атаки со свободными обеими руками
    — 1к12. Эти атаки считаются магическим оружием.
- name: Падение Горы
  slug: padenie-gory
  tier: lesser
  icon: images/icons/gifts/mosch/padenie-gory.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Обожествлённый может метнуть любой предмет, который способен поднять, в любую точку в пределах
    видимости. При использовании как атаки он должен совершить обычный бросок на попадание с поправкой
    на Силу. Очень крупные или тяжёлые предметы — неуклюжее оружие и дают -4 к попаданию, но наносят 1к12
    повреждений всем в области падения с поправкой на Силу.
- name: Плечи Шириною в Мир
  slug: plechi-shirinoyu-v-mir
  tier: lesser
  icon: images/icons/gifts/mosch/plechi-shirinoyu-v-mir.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Обожествлённый может поднять любой предмет не крупнее боевого корабля и нести
    его со своей обычной скоростью передвижения. Дар позволяет предмету не развалиться, а Обожествлённому
    — не проваливаться в землю, но предмет слишком громоздок, чтобы использовать его для насилия.
- name: Сила Без Меры
  slug: sila-bez-mery
  tier: lesser
  icon: images/icons/gifts/mosch/sila-bez-mery.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Всякий раз, когда Обожествлённый участвует во встречной проверке Силы или состязании против другого
    существа либо противостоит ему в захвате или ином испытании силы, Обожествлённый всегда побеждает.
    Если борются два Обожествлённых с этим даром, проверка разрешается обычным порядком. Действием Обожествлённый
    может даровать преимущества этого дара своему последователю на одно состязание или действие.
- name: Удар Падающего Метеора
  slug: udar-padayuschego-meteora
  tier: lesser
  icon: images/icons/gifts/mosch/udar-padayuschego-meteora.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Сосредоточившись на миг, Обожествлённый может разбить любой немагический предмет менее десяти
    футов в поперечнике. Если предмет больше, в нём пробивается отверстие десяти футов в высоту, ширину
    и глубину. Если предмет магически прочен или устойчив, Обожествлённый должен приложить Усилие до конца
    сцены, чтобы его разбить. Требуемое для такого удара сосредоточение делает его бесполезным против
    подвижных врагов, но если Обожествлённый поразит этим даром неподвижную или беспомощную цель, та получает
    четыре очка урона за каждый его уровень.
- name: Жилы Богов
  slug: zhily-bogov
  tier: greater
  icon: images/icons/gifts/mosch/zhily-bogov.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Обожествлённый всегда способен поднять всё, что меньше большого здания, и пробить, разбить или
    выломать любое немагическое вещество как свободную часть своего передвижения или иных действий. Эта
    мощь применяется мгновенно, но недостаточно тонко управляема, чтобы помочь броскам урона или иным
    атакам.
- name: Перепрыгнуть Луну
  slug: pereprygnut-lunu
  tier: greater
  icon: images/icons/gifts/mosch/pereprygnut-lunu.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Обожествлённый может прыгать на чудовищные расстояния, полностью игнорируя урон
    от падения, и вместо действия передвижения за раунд прыгнуть в любую точку в пределах видимости. Он
    может сражаться с летающими врагами, используя действие передвижения, чтобы взмыть к ним перед ударом.
    Впрочем, он не может преодолеть прыжками более десяти миль в час в общей сложности.
- name: Расшатать Богу Зубы
  slug: rasshatat-bogu-zuby
  tier: greater
  icon: images/icons/gifts/mosch/rasshatat-bogu-zuby.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня и совершите одну атаку — вооружённую или безоружную. Если удар попадает,
    бросок урона читается напрямую. Этот бросок урона нельзя сделать максимальным другими дарами или способностями.
    Даже при промахе сотрясение от удара наносит вред как попадание с обычным уроном.
