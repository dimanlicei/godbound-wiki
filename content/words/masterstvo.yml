name: Мастерство
kind: canon
colors:
  glow: '#e8c79a'
  deep: '#2a2118'
  dark: '#100c09'
icon: images/icons/words/masterstvo.webp
description: |-
  Это Слово ремесленников, строителей и создателей дивных творений. Одни Обожествлённые выражают своё родство с ним через определённое ремесло — кузнечное дело или кораблестроение, — другие покровительствуют более широкому кругу созидательного труда. Впрочем, даже узкие мастера могут применять свои силы широко. Чудеса Мастерства связаны с созданием, управлением, починкой или разрушением физических предметов.

  Герои со Словом Мастерства могут действием на раунд создать любой немагический предмет, который способен нести обычный человек, используя любые подручные материалы. Пусть получившееся творение и выглядит странно, а любая «снедь» несъедобна, оно работает и служит не хуже обычного предмета своего рода и обычного состава. Дневной труд героя над ремеслом при необходимости оценивать считается за 100 работников на уровень персонажа.
gifts:
- name: Безукоризненный Ремонт
  slug: bezukoriznennyy-remont
  tier: lesser
  icon: images/icons/gifts/masterstvo/bezukoriznennyy-remont.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Вы можете починить что угодно при наличии материалов и инструментов. Каждый раунд можно сделать
    как новые предметы или постройки объёмом до куба 10 × 10 × 10 футов на уровень, если только они не
    уничтожены полностью. Устраняется всякая гниль, ветхость, повреждение и порча — даже у скоропортящегося,
    вроде продуктов. При починке магических или зачарованных вещей с каждым применением дара Усилие прикладывается
    до конца сцены.
- name: Десять Тысяч Инструментов
  slug: desyat-tysyach-instrumentov
  tier: lesser
  icon: images/icons/gifts/masterstvo/desyat-tysyach-instrumentov.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Ваши природные способности к созиданию усилены. Вместо целого раунда на создание переносного обычного
    предмета вам достаточно действия В ход, попутно с любым другим вашим действием. Этот предмет может
    быть создан навсегда или по вашему усмотрению исчезнуть после. Ваш дневной труд над проектами стоит
    1 000 работников на уровень. Обожествлённому, не связавшему это Слово, этот дар бесполезен.
- name: Отметить Создателя
  slug: otmetit-sozdatelya
  tier: lesser
  icon: images/icons/gifts/masterstvo/otmetit-sozdatelya.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Внимательно осмотрев предмет за одно действие, вы понимаете назначение и устройство любого рукотворного
    предмета, магического или обычного. Вы также получаете краткое видение каждого, кто существенно участвовал
    в его создании, и короткое описание того, что именно он в него вложил.
- name: Рука-Молот
  slug: ruka-molot
  tier: lesser
  icon: images/icons/gifts/masterstvo/ruka-molot.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Любая ваша атака оружием или безоружная атака бросает кость повреждений не меньше
    1к10 и считается магическим оружием. Против искусственных конструктов и неодушевлённых предметов этот
    бросок урона читается напрямую.
- name: Трансмутатор
  slug: transmutator
  tier: lesser
  icon: images/icons/gifts/masterstvo/transmutator.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  - type: eff
    text: 'Усилие: день'
  body: 'Приложите Усилие до конца сцены и превратите по одному кубу материала 10 × 10 × 10 футов на уровень
    героя из одного физического вещества в другое. Предметы, которые существо использует или держит в
    руках, изменить нельзя. Если эффект как-то применён во вред целям, они получают кость урона 1к6 за
    каждые два уровня персонажа героя с округлением вверх. Если создаваемое вещество редкое или драгоценное,
    Усилие нужно приложить до конца дня. Крайне редкие и магические вещества так создать нельзя, зато
    можно наплодить горы золота. Пределы использования такого новообретённого богатства смотрите в Слове
    Алчности: слишком уж легко ввергнуть хозяйство целой области в хаос.'
- name: Управлять Колёсами
  slug: upravlyat-kolesami
  tier: lesser
  icon: images/icons/gifts/masterstvo/upravlyat-kolesami.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Вы можете захватить управление любым видимым транспортным средством, механизмом,
    дверью или иным предметом с движущимися частями размером до небольшого корабля. Если предмет создан
    вами, ограничения по размеру нет. Пока Усилие приложено, предмет работает ровно так, как если бы им
    управляли, правили или вели вы сами. Каждое новое указание требует действия, а достойные противники
    могут пройти спасбросок Духа, чтобы отменить действие дара на используемые ими предметы.
- name: Вечное Совершенство
  slug: vechnoe-sovershenstvo
  tier: greater
  icon: images/icons/gifts/masterstvo/vechnoe-sovershenstvo.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: 'Всё, что вы делаете, безупречно и не поддаётся обычному износу и старению. Испортить это может
    только намеренное разрушение. Созданные вами оружие и доспехи считаются магическими предметами: они
    способны ранить сверхъестественных врагов и дают смертным владельцам +1 к броскам на попадание и урон.
    Вы и другие Обожествлённые слишком могущественны, чтобы получать от этой прибавки пользу.'
- name: Глаза Создателя
  slug: glaza-sozdatelya
  tier: greater
  icon: images/icons/gifts/masterstvo/glaza-sozdatelya.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: 'Действием вы можете мгновенно воспринять пространство вокруг любого созданного вами предмета
    так, будто находитесь там: видеть и слышать всё вокруг. Если вы приложите Усилие до конца сцены, то
    можете совершить одно действие этим предметом, как если бы вы были рядом и управляли им. Если вы выбираете
    для сосредоточения определённое место, вы смотрите через ближайший подходящий предмет.'
- name: Почтение Стали
  slug: pochtenie-stali
  tier: greater
  icon: images/icons/gifts/masterstvo/pochtenie-stali.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: 'Любая одежда или доспех, сделанные вами для себя, дают вам класс защиты 3 без штрафов к спасброскам.
    Если вы делаете доспех специально для другого, все штрафы к спасброскам на один класс легче: у среднего
    доспеха их нет вовсе, а у тяжёлого штрафуется лишь один спасбросок. Мгновенным действием приложите
    Усилие до конца сцены, чтобы свести на нет одно попадание по вам изготовленным или выкованным оружием.'
