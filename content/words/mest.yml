name: Месть
kind: canon
colors:
  glow: '#ff8d8d'
  deep: '#360d14'
  dark: '#130406'
icon: images/icons/words/mest.webp
description: |-
  Слово Мести требует расплаты за преступления. Однако это не подлинное правосудие, а самая грубая месть: боль за боль, око за око. Обожествлённый Мести обрушивает боль и кару на тех, кто первым совершил преступление. Это Слово не бьёт первым, но часто бьёт последним.

  Обожествлённые Мести воздают по долгам. Их обычные атаки всегда попадают по цели, которая в этой сцене нанесла им урон по хитам, и они могут бросить урон дважды, взяв лучший результат. Если они мстят за поистине великое зло или чудовищное злодеяние, по усмотрению Ведущего они могут получить бесплатное очко Усилия в бою против такого достойного противника.

  Многие силы Мести связаны с проступками или преступлениями существа. Хотя решать, что считать проступком, — дело Обожествлённого, и даже совершенно безобидные поступки могут быть сочтены преступлением, если ему так угодно, это Слово сильнее всего, когда хотя бы примерно совпадает с культурными ожиданиями окружающего населения. Идти против обычая обойдётся дороже в Усилии, Влиянии или Владычестве.
gifts:
- name: Заклеймить Нечестивца
  slug: zakleymit-nechestivtsa
  tier: lesser
  icon: images/icons/gifts/mest/zakleymit-nechestivtsa.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: 'Приложите Усилие до конца сцены и выберите целью видимое существо, обвинив его в определённом
    проступке. Если существо действительно совершило это деяние, на нём проступает несокрываемое мистическое
    клеймо. Это клеймо само собой доносит истинность обвинения до всех очевидцев, давая неоспоримое доказательство
    каждому, кто его увидит. Достойные противники могут приложить Усилие до конца дня, чтобы противостоять
    этой силе или свести уже поставленное клеймо за любое преступление, кроме несправедливого убийства.
    Даже божественным убийцам нет пощады: они остаются заклеймёнными, пока не уничтожат своего обвинителя
    или как-то не вынудят его отменить приговор.'
- name: Исполнить Закон
  slug: ispolnit-zakon
  tier: lesser
  icon: images/icons/gifts/mest/ispolnit-zakon.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня и выберите целью видимое разумное существо, назвав совершённый им
    проступок. Если оно когда-нибудь совершит по сути такое же деяние снова, оно немедленно погибает или,
    по вашему усмотрению, получает менее суровое проклятие. Названный проступок должен быть определённым
    нарушением, а не широким разрядом естественных занятий вроде еды или питья, — хотя запретить, скажем,
    пить хмельное можно. Достойные противники могут пройти спасбросок Духа, чтобы противостоять этой божественной
    каре. Иначе им придётся ей подчиниться. Этот дар не действует на поистине чуждые сущности вроде мерзостей
    пустоты.
- name: Кровь за Кровь
  slug: krov-za-krov
  tier: lesser
  icon: images/icons/gifts/mest/krov-za-krov.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Когда вы проваливаете или добровольно отказываетесь от спасброска против враждебного эффекта,
    нападающий автоматически проваливает свой следующий спасбросок против применённой вами против него
    силы. Он всё ещё может приложить Усилие, чтобы автоматически преуспеть, если у него есть такая способность
    и свободное Усилие.
- name: Мантия Немезиды
  slug: mantiya-nemezidy
  tier: lesser
  icon: images/icons/gifts/mest/mantiya-nemezidy.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены и выберите целью противника, который в прошлом обидел вас или
    вашего спутника, нанёс вам урон по хитам или причинил вред. Вы мгновенно сводите на нет применяемую
    целью способность, как если бы успешно наступательно или защитно рассеяли ту силу, которой она пользуется.
    Этот дар можно применить к цели лишь однажды, после чего ей нужно снова вас обидеть или навредить
    вам, чтобы она снова годилась.
- name: Обоюдоострый Меч
  slug: oboyudoostryy-mech
  tier: lesser
  icon: images/icons/gifts/mest/oboyudoostryy-mech.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Раз за сцену выберите целью существо, которое в прошлом раунде нанесло урон по хитам вам или союзнику.
    Это существо автоматически получает ровно столько же урона, сколько нанесло этой конкретной жертве
    за последний раунд. Достойные противники могут пройти спасбросок Духа, чтобы уполовинить его с округлением
    вверх.
- name: Пожать Вихрь
  slug: pozhat-vihr
  tier: lesser
  icon: images/icons/gifts/mest/pozhat-vihr.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Даже ваши слова бичуют тех, кто навлёк на себя ваш гнев. Ваши атаки оружием или безоружные атаки
    считаются магическим оружием 1к10 с дальностью до 200 футов. Если вы убиваете цель, которая в этой
    сцене первой начала против вас насилие, — этим даром или иной силой, — меньшие противники, видевшие
    это или узнавшие об этом, не смогут счесть эту смерть противозаконной, несправедливой или общественно
    неподобающей.
- name: Яростное Возмездие
  slug: yarostnoe-vozmezdie
  tier: lesser
  icon: images/icons/gifts/mest/yarostnoe-vozmezdie.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. До конца сцены всякий раз, когда по вам попадают обычной атакой
    и вы получаете урон, вы Мгновенным действием получаете ответную обычную атаку по виновнику, которая
    неизбежно попадает.
- name: Кроворукая Месть
  slug: krovorukaya-mest
  tier: greater
  icon: images/icons/gifts/mest/krovorukaya-mest.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены и выберите целью одного достойного противника, который в этой
    же сцене нанёс вам урон по хитам или применил против вас враждебную силу. До конца сцены ваши обычные
    атаки автоматически удаются и наносят максимальный урон, а любые кости урона от ваших сил бросаются
    дважды с выбором лучшего результата.
- name: Неумолимое Преследование
  slug: neumolimoe-presledovanie
  tier: greater
  icon: images/icons/gifts/mest/neumolimoe-presledovanie.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  - type: eff
    text: 'Усилие: день'
  body: 'Приложите Усилие и выберите существо, совершившее определённый проступок против вас или другого
    человека. Пока Усилие приложено, вы постоянно знаете местоположение цели и кратчайший путь к ней.
    Вы можете рассеивать любые магические преграды между вами, разрушать до десяти футов за раунд чего
    угодно, кроме божественных материалов, преграждающих вам путь, и при необходимости лететь, чтобы добраться
    до цели. Цель не может удалиться от вас, если вы того не позволите: если она уходит, вы магически
    следуете за ней на том же расстоянии. Так, если вы стоите рядом с ней, когда она телепортируется прочь,
    вы телепортируетесь вместе с ней, а если она умчится на быстром коне, вы магически последуете за ней
    со скоростью этого коня. Вы можете приложить Усилие до конца дня, чтобы распространить это преследование
    на находящихся рядом достойных союзников.'
- name: Проклясть Нечестивца
  slug: proklyast-nechestivtsa
  tier: greater
  icon: images/icons/gifts/mest/proklyast-nechestivtsa.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Чтобы купить этот дар, нужен малый дар «Заклеймить Нечестивца». Приложите Усилие до конца сцены
    и выберите целью существо, которое вы прежде видели, назвав определённое совершённое им деяние, которое
    вы считаете преступным. Если оно действительно это совершило, существо немедленно поражается проклятием
    или несчастьем по вашему выбору — вплоть до смертельного. Меньшие противники не могут этому противиться,
    а достойные противники могут пройти спасбросок Духа, чтобы избежать божественного гнева. Проклятие
    может влиять на поведение меньших противников вокруг жертвы, чтобы они исполнили вынесенный вами приговор,
    но на достойных противников оно не влияет.
