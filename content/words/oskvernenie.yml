name: Осквернение
kind: canon
colors:
  glow: '#c79bf0'
  deep: '#1d1226'
  dark: '#0a0710'
icon: images/icons/words/oskvernenie.webp
description: |-
  Где есть святость, есть и то, что живёт в её тени. Враги добродетели и света обретают своё покровительство в Слове Осквернения. Это Слово тех, кто рушит установленные порядки, оспаривает принятые понятия о нравственности и предаётся неописуемым нарушениям общественных устоев. В силу природы этого Слова связанные с Осквернением чаще всего оказываются вольными божествами, хотя некоторые всё же держат малые, разбросанные далеко друг от друга культы, что втайне правят свои кощунственные обряды и существуют в основном чтобы подтачивать господствующую в их краю религию.

  Обожествлённые Осквернения обычно способны на впечатляющие общественные подвиги и обладают острым чутьём. Они могут поднять Харизму или Мудрость до 16, или до 18, если выбранный атрибут уже равен 16 или больше.
gifts:
- name: Взгляд, Разъедающий Любовь
  slug: vzglyad-razedayuschiy-lyubov
  tier: lesser
  icon: images/icons/gifts/oskvernenie/vzglyad-razedayuschiy-lyubov.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: 'Выберите видимую цель. Назовите то, что, как вы знаете, ей дорого: предмет, установление, убеждение,
    желание, человека или землю. К следующему рассвету чувства цели к этому обратятся в противоположные.
    Любовь станет ненавистью, приязнь — обидой, признательность — отвращением и так далее. Достойные противники
    могут пройти спасбросок Духа, чтобы противостоять. Эту силу нельзя применять к одной цели чаще раза
    в день.'
- name: Лик Противника
  slug: lik-protivnika
  tier: lesser
  icon: images/icons/gifts/oskvernenie/lik-protivnika.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Пока Усилие приложено, вы можете ходить по миру незамеченным, пока не совершаете
    враждебных действий и не производите громкого шума. Духовенство всё же будет вас видеть, но вы предстанете
    перед ним злокозненным существом великой силы из мифологии их веры. Прочие не заметят, как святой
    человек на вас откликается, хотя он может пересказать пережитое — и его услышат, как только вы покинете
    эту местность. Достойные противники могут пройти спасбросок Духа, чтобы противостоять.
- name: Наш Маленький Секрет
  slug: nash-malenkiy-sekret
  tier: lesser
  icon: images/icons/gifts/oskvernenie/nash-malenkiy-sekret.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Вы можете лишить любого человека или маленькую Толпу возможности
    хоть как-то сообщить о непотребстве, свидетелями которого они стали. Точно так же вы можете коснуться
    свидетельства такого проступка и сделать так, что все, кто его увидит, больше не смогут о нём говорить.
    Это распространяется на общение любого рода, включая телепатическую речь, письменность, жесты и прочее.
    Непотребством считается любое деяние, которое вызвало бы потрясение, возмущение или скандал по обычным
    меркам общества его свидетелей. Этот эффект сохраняется и после того, как питающее его Усилие возвращено.
- name: Немощь Молитв без Подаяний
  slug: nemosch-molitv-bez-podayaniy
  tier: lesser
  icon: images/icons/gifts/oskvernenie/nemosch-molitv-bez-podayaniy.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Обожествлённый может выбрать целью культ или иную религиозную организацию. Пока
    Усилие приложено, у любого существа, получающего от этого культа молитвы в виде ежемесячных очков
    Владычества, их общее число уменьшается на уровень Обожествлённого. Если у Обожествлённого есть «Принять
    Фимиам Веры», он может перекачивать эти подавленные очки Владычества себе.
- name: Прана Пустого Сердца
  slug: prana-pustogo-serdtsa
  tier: lesser
  icon: images/icons/gifts/oskvernenie/prana-pustogo-serdtsa.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: 'Вы вобрали в себя пустоту безверия, сделав свои желания и намерения нечитаемыми — даже дарами
    Приказа и Страсти. Вас всё ещё могут уличить во лжи, но уличившие узнают лишь то, о чём именно вы
    солгали: по решению Ведущего они либо придут к ошибочному выводу о том, почему вы солгали, либо попросту
    не смогут этого понять. Это не мешает персонажам делать разумные предположения на основании ваших
    поступков, но любые попытки узнать наверняка ваши намерения и желания — обычные или сверхъестественные
    — проваливаются автоматически.'
- name: Чутьё, Провоцирующее Кощунство
  slug: chute-provotsiruyuschee-koschunstvo
  tier: lesser
  icon: images/icons/gifts/oskvernenie/chute-provotsiruyuschee-koschunstvo.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: по желанию'
  body: Обожествлённый чувствует религиозные убеждения и соотношение веры, надежды, сомнения и уныния
    у любого встреченного смертного. Точно так же он знает направление на места духовной значимости в
    своей округе, а также ощущает, какая вера там исповедуется и кто считает это место святым или нечестивым.
    Кроме того, он может приложить Усилие на действие, чтобы на сцену слышать молитвы всех, у кого поблизости
    есть крепкие духовные убеждения.
- name: Литургия Горького Урожая
  slug: liturgiya-gorkogo-urozhaya
  tier: greater
  icon: images/icons/gifts/oskvernenie/liturgiya-gorkogo-urozhaya.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: 'В круге радиусом в одну милю все источники воды и пищи становятся зловонными и негодными. Затрагиваются
    также животные и растения: первые обрастают опухолями и заболевают, вторые поражаются порчей. Перемена
    наступает немедленно, хотя её последствия в живых существах проявляются и становятся очевидны в обычные
    для этого сроки.'
- name: Мор, Разлагающий Веру
  slug: mor-razlagayuschiy-veru
  tier: greater
  icon: images/icons/gifts/oskvernenie/mor-razlagayuschiy-veru.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. Выберите группировку Мощи не выше уровня Обожествлённого, чьи члены
    составляют большинство в поселении или племенном сходе, где вы находитесь. В течение следующего месяца
    отношения членов этой группировки с её политическими установлениями, нравственно-философскими основами
    и религиозными обычаями необратимо переменятся. Политики станут продажными, чёрствыми и злобными,
    а насаждение религиозных обрядов и культурных обычаев будет всё больше скатываться к упадку, нигилизму
    и гнетущему насилию. Меньшие противники внутри группировки поддаются этой силе неотвратимо, а достойные
    противники получают спасбросок Духа, чтобы противостоять, каждый месяц, пока остаются в группировке.
    Из-за этого группировка обзаводится Бедами, которые не приносят никаких очков Владычества, что могли
    бы от неё поступать.
