name: Сны
kind: canon
colors:
  glow: '#b3a8ff'
  deep: '#1c1638'
  dark: '#0a0718'
icon: /images/icons/words/sny.webp
description: |-
  Связанные со Словом Снов обладают безупречной памятью и неуязвимой защитой от изменения воспоминаний и от насильного погружения в сон. Они не нуждаются во сне, но во время сна временно невосприимчивы ко всем немагическим опасностям и условиям окружения, включая старение и нужду в еде и питье.

  Они могут установить значение своей Мудрости равным 16 или 18, если атрибут уже равен 16 или больше.
gifts:
- name: Воплотить Сон
  slug: voplotit-son
  tier: lesser
  icon: /images/icons/gifts/sny/voplotit-son.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: Без Усилия
  body: Обожествлённый может вообразить определённый предмет или домашнее животное столь ясно, что оно
    становится осязаемым в его руках как временно проявленная химера. Предметы или животные должны быть
    не крупнее телеги и существуют, пока остаются рядом с персонажем. Съеденное или иначе употреблённое
    насыщает людей и работает как обычно. Магические предметы можно вспомнить в их внешнем виде, но чар
    настоящей вещи у них не будет.
- name: Клетка Мёртвого Прошлого
  slug: kletka-mertvogo-proshlogo
  tier: lesser
  icon: /images/icons/gifts/sny/kletka-mertvogo-proshlogo.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Обожествлённый может усыпить видимую цель, заставив её бесконечно видеть один и тот же сон вокруг
    некоего события прошлого. Обожествлённый может назвать конкретное событие или просто выбрать общий
    род воспоминаний. В этом состоянии жертва полностью парализована и не сознаёт окружающего; оно длится
    или повторяется столько, сколько пожелает Обожествлённый, — вплоть до обезвоживания или смерти. Обожествлённый
    ясно видит то воспоминание, которое жертва заново переживает. Достойные противники получают спасбросок
    Духа, чтобы противостоять этой способности на сцену.
- name: Отказ от Недоверия
  slug: otkaz-ot-nedoveriya
  tier: lesser
  icon: /images/icons/gifts/sny/otkaz-ot-nedoveriya.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: Без Усилия
  body: Обожествлённый без труда навевает грёзу наяву, которая охватывает всех присутствующих смертных,
    управляя тем, что они воспринимают и что запомнят о происходившем в текущей сцене. Сила затрагивает
    разом до Большой Толпы меньших противников плюс одного достойного противника. Меньшие противники получают
    спасбросок, если грёза становится слишком невероятной, чтобы в неё верить, или ставит их под непосредственную
    смертельную угрозу. Достойные противники могут пройти спасбросок Духа, чтобы противостоять дару на
    сцену.
- name: Прикосновение Леты
  slug: prikosnovenie-lety
  tier: lesser
  icon: /images/icons/gifts/sny/prikosnovenie-lety.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: 'Обожествлённый выбирает одну тему: это может быть интеллектуальный навык, событие или род событий,
    обязанность, отношения или иной определённый предмет. Цель в пределах видимости немедленно забывает
    об этом всё, пока эффект не будет рассеян или Обожествлённый её не отпустит. Этой силой можно затронуть
    до Большой Толпы меньших противников либо одного достойного противника. Достойные противники могут
    пройти спасбросок Духа, чтобы противостоять этой способности на сцену. Магические силы и боевые навыки
    этим даром стереть нельзя.'
- name: Ужасное Видение
  slug: uzhasnoe-videnie
  tier: lesser
  icon: /images/icons/gifts/sny/uzhasnoe-videnie.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Обожествлённый переполняет чувства жертвы тем, что кажется ожившим кошмаром,
    вырванным из её самых тёмных глубин, способным причинить и телесную боль, и душевную муку. Его взгляд
    становится оружием с дальностью 200 футов и костью урона 1к10 против мыслящих существ, включая животных.
    Против людей и иной разумной жизни он всегда наносит не менее 1 очка урона, даже при промахе. Цель,
    сведённая к нулю хитов, может покончить с собой или просто рухнуть в беспомощной агонии; сама по себе
    эта сила убить не может. Она не действует на некоторых редких и жутких созданий, что никогда не знали
    страха или потрясения либо питаются ими.
- name: Украденные Мгновения
  slug: ukradennye-mgnoveniya
  tier: lesser
  icon: /images/icons/gifts/sny/ukradennye-mgnoveniya.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Обожествлённый может мгновенно вытянуть из видимой цели воспоминания на любую нужную тему, узнав
    всё, что она может об этом вспомнить. Достойные противники могут пройти спасбросок Духа, чтобы противостоять
    этому дару на сцену, и требуют от Обожествлённого приложить Усилие до конца сцены. Жертвы воспринимают
    эту силу как внезапное сильное погружение в воспоминания о предмете; сведущие в магии могут догадаться,
    что происходит нечто противоестественное.
- name: Легенды в Туман
  slug: legendy-v-tuman
  tier: greater
  icon: /images/icons/gifts/sny/legendy-v-tuman.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. Обожествлённый может вложить определённое событие или мысль в память
    каждого человека в области или Группировке размером, равным половине его уровня с округлением вверх.
    Так, на первом уровне он может затронуть деревню, на третьем — городок, на пятом — провинцию, на седьмом
    — страну, а на девятом — теоретически подделать память, общую для целого царства. Впрочем, Эмпирейские
    Обереги на области увеличивают её действующий размер на половину рейтинга Оберега с округлением вниз.
    Достойные противники могут пройти спасбросок Духа, чтобы противостоять этому эффекту. Люди обойдутся
    с этим воспоминанием так, как им свойственно, но будут отметать любые опровергающие свидетельства,
    если только доказательства не окажутся сокрушительными.
- name: Развеять Пыль Веков
  slug: razveyat-pyl-vekov
  tier: greater
  icon: /images/icons/gifts/sny/razveyat-pyl-vekov.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  body: 'Приложите Усилие. Обожествлённый может назвать определённое событие, человека или отношения,
    которые ему известны. Все в его присутствии полностью забывают об этом, хотя достойные противники
    могут пройти спасбросок Духа, чтобы стать лично невосприимчивыми к этому конкретному применению силы.
    Более того, каждый затронутый становится переносчиком этого забвения: всякий, кто его увидит, тоже
    забудет об этом предмете. Пока Усилие приложено, затронутые цели не могут об этом вспомнить, даже
    если им напомнят. Столкнувшись с этим человеком или предметом лицом к лицу, они истолкуют его как
    что-то другое или даже вообразят себе схожую ситуацию.'
- name: Ткач Снов
  slug: tkach-snov
  tier: greater
  icon: /images/icons/gifts/sny/tkach-snov.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Обожествлённый может выбрать столько известных ему целей, сколько у него уровней, и менять их
    действием. Независимо от расстояния, всякий раз, когда одна из целей спит, персонаж может приложить
    Усилие до конца сцены, чтобы совершить одно действие так, будто он находится рядом с целью, — при
    этом на него ничто не может подействовать или повредить ему, и ощутить его может только сама цель.
    По желанию персонаж может просто пообщаться с целью без затрат Усилия или применить к ней любой дар
    Снов. Достойные противники получают спасбросок Духа, чтобы противостоять этой способности на сцену.
