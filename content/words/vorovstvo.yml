name: Воровство
kind: canon
colors:
  glow: '#b9bcc9'
  deep: '#1c1c22'
  dark: '#0a0a0e'
icon: images/icons/words/vorovstvo.webp
description: |-
  Слово Воровства властвует над всеми видами осязаемого хищения. Это не Слово мошенников и лжецов, а Слово тех, кто проникает в запретные места и уносит оттуда охраняемые вещи.

  Связанные со Словом Воровства неизменно вскрывают любой обычный замок, обходят любую обычную ловушку и без всякой возможности провала прокрадываются мимо любого меньшего противника или обчищают его карманы — при условии, что делают это хоть сколько-нибудь осмотрительно. Магические замки, ловушки и преграды они могут преодолеть, приложив Усилие до конца сцены.

  Божествами Воровства часто восхищаются преступники, пираты, карманники, беспризорники и разбойники, над которыми те могут иметь огромную власть, — но у более законопослушных народов и божеств они обычно не в чести.
gifts:
- name: Завистливая Тоска
  slug: zavistlivaya-toska
  tier: lesser
  icon: images/icons/gifts/vorovstvo/zavistlivaya-toska.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: 'Приложите Усилие до конца сцены и выберите целью видимое существо. Обожествлённый может пробудить
    в нём всепоглощающее желание завладеть тем, что ему не принадлежит: предметом, титулом или даже чужой
    женой. Оно пойдёт почти на что угодно — или согласится на любую сделку, — чтобы это получить. Обычно
    это принуждение длится сутки, и достойным противникам даётся спасбросок Духа, чтобы ему противостоять.
    Однако если предмет зависти — то, чего оно уже втайне желает, эффект сохраняется бессрочно и спасбросок
    не даётся.'
- name: Ловкость Рук
  slug: lovkost-ruk
  tier: lesser
  icon: images/icons/gifts/vorovstvo/lovkost-ruk.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: Без Усилия
  body: Мгновенным действием Обожествлённый может укрыть предмет, который держит или которого касается,
    не крупнее телеги с упряжкой. Этот дар может укрывать не более чем по одному предмету на уровень Обожествлённого.
    Никакой обыск не найдёт эти предметы при нём, и он может достать их обратно Действием. Предметы появляются
    немедленно, если Обожествлённый погибает или теряет сознание. Спрятанные так предметы находятся в
    застое. Живых существ тоже можно укрыть, но они должны быть согласны или быть обычными животными.
- name: Неуловимая Тень
  slug: neulovimaya-ten
  tier: lesser
  icon: images/icons/gifts/vorovstvo/neulovimaya-ten.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: 'Обожествлённый способен взбираться по отвесным поверхностям и нависающим выступам, как по ровной
    земле. Его врождённая скрытность теперь работает и против достойных противников, хотя такие существа
    получают спасбросок Духа, чтобы заметить Обожествлённого, если тот сделает что-то способное привлечь
    их внимание. Обожествлённый также может приложить Усилие до конца сцены: пока на него никто не смотрит,
    он может немедленно исчезнуть и появиться где угодно в пределах 100 футов, если за выбранным местом
    никто не наблюдает. Эта способность проходит сквозь всё, кроме божественных защит и преград.'
- name: Обобрать Дочиста
  slug: obobrat-dochista
  tier: lesser
  icon: images/icons/gifts/vorovstvo/obobrat-dochista.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие. Обожествлённый способен выкрасть у меньших противников любое одно чувство —
    и они лишаются его навсегда, пока он его не вернёт. Чтобы украсть чувства достойного противника, Обожествлённому
    нужно приложить Усилие до конца сцены, а достойному противнику даётся спасбросок Духа. Если он провален,
    тот может пытаться пройти новый спасбросок Духа каждое утро.
- name: Принц Воров
  slug: prints-vorov
  tier: lesser
  icon: images/icons/gifts/vorovstvo/prints-vorov.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Обожествлённый может вращаться среди любого преступного люда — банды разбойников с большой дороги,
    пиратской команды или шайки карманников — и быть принятым как свой в доску, товарищ, за которого стоит
    убить и даже умереть. Кроме того, Обожествлённого не могут обокрасть смертные, если он сам этого почему-либо
    не позволит. Любая попытка обокрасть, надуть или обжулить Обожествлённого на телесное добро немедленно
    ему очевидна, если только в дело не вмешаны божественные силы вроде Слова Обмана. Да и тогда Обожествлённый
    может перебросить любой спасбросок Духа, чтобы этому противостоять.
- name: Узреть Скрытый Путь
  slug: uzret-skrytyy-put
  tier: lesser
  icon: images/icons/gifts/vorovstvo/uzret-skrytyy-put.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Глядя на определённое место или строение, Обожествлённый чутьём узнаёт, где
    находятся сокровища или предметы, наиболее отвечающие его желаниям, каков самый удобный путь к ним
    и какие стражи, ловушки или защиты стоят на этом пути. Усилие, приложенное к этому дару, нельзя вернуть,
    пока он честно не попытается похитить что-нибудь ценное или иначе осмысленно воспользоваться этими
    сведениями, если это возможно.
- name: Кража Мысли
  slug: krazha-mysli
  tier: greater
  icon: images/icons/gifts/vorovstvo/krazha-mysli.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Выберите целью видимое существо, приложив Усилие до конца сцены, если это достойный противник.
    Вы можете украсть либо воспоминание, либо сиюминутное побуждение. Вы должны указать конкретное воспоминание
    или побуждение для кражи, причём оно не может длиться в общей сложности дольше суток. Достойные противники
    могут пройти спасбросок Духа, чтобы противостоять любой из этих краж. Содержание украденного у достойного
    противника воспоминания вы воспринять не можете, но оно остаётся невосстановимым, пока вы не решите
    его вернуть. Этот дар можно применить к цели лишь раз за сцену, и защитно рассеять его могут только
    Обожествлённые со Словами, связанными с воровством, плутовством или обманом.
- name: Покровитель Проказ
  slug: pokrovitel-prokaz
  tier: greater
  icon: images/icons/gifts/vorovstvo/pokrovitel-prokaz.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: по желанию'
  body: Чтобы получать пользу от этого дара, Обожествлённому нужен посвящённый ему культ или гильдия.
    Немедленно получите 2 постоянных очка Влияния. Всякий раз, когда последователи Обожествлённого отправляются
    на дело, чтобы что-нибудь украсть, они могут принести подношения, чтобы снискать ваше руководство
    и вмешательство. Если Обожествлённый пожелает, он может наделить их одним из своих малых даров, выделив
    им очко Влияния. Они теряют доступ к дару, когда это очко Влияния отзывается. Вам всё ещё нужно приложить
    Усилие, чтобы дар подействовал по зову, но сделать это можно из любой точки мира, и вы всё время в
    точности знаете, как идут (или не идут) дела у ваших культистов.
- name: Украденная Корона
  slug: ukradennaya-korona
  tier: greater
  icon: images/icons/gifts/vorovstvo/ukradennaya-korona.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены и выберите целью видимое существо. Обожествлённый может украсть
    у него один божественный дар или сверхъестественную силу, но не целые Слова. Эта кража удаётся автоматически,
    хотя одновременно у существа нельзя отнять больше одной силы. Если Обожествлённый не знает, какую
    именно силу крадёт, Ведущий выбирает наугад. Цель не может пользоваться этой силой, пока Обожествлённый
    её не вернёт, хотя достойные противники могут каждое утро проходить спасбросок Духа, чтобы прекратить
    эффект. Обожествлённый может воспользоваться этой силой один раз без затрат Усилия, но тогда она возвращается
    к цели; иначе она остаётся украденной, пока он её не вернёт. Силы и врождённые дары, которые при применении
    длятся бессрочно, действуют до конца сцены. Этот дар можно применить к цели лишь раз за сцену, и защитно
    рассеять его могут только Обожествлённые со Словами, связанными с воровством, плутовством или обманом.
