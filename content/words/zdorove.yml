name: Здоровье
kind: canon
colors:
  glow: '#7fe8b8'
  deep: '#0d3123'
  dark: '#04140e'
icon: images/icons/words/zdorove.webp
description: |-
  Хлеб, дети и здоровье — эти вещи вечно в молитвах простого люда. Слово Здоровья предлагает хотя бы одну из них: оно изгоняет хвори и выправляет искажённую плоть. Чудеса Здоровья могут прогонять моровые поветрия и излечивать увечья, хотя для крупных деяний обычно нужны дары — за исключением сравнительно скромных исцелений. Мстительные полубоги Здоровья могут и насылать те самые поветрия, что способны излечить.

  При всей своей мощи целительные силы часто немало требуют от запасов тех, кто хочет ими воспользоваться. Некоторые дары требуют от исцеляемых приложить Усилие до конца дня, чтобы принять целительную мощь. Можно считать, что НИП и прочие, у кого нет указанного запаса Усилия, могут воспользоваться таким исцелением не чаще раза в день.

  Герои со Словом Здоровья обладают неуязвимой защитой от болезней и ядов и могут распознать их мгновенно. Они могут установить значение Телосложения равным 16 или 18, если оно уже равно 16 или больше. Божества Здоровья — из самых любимых в человеческих пантеонах.
gifts:
- name: Горн Жизни
  slug: gorn-zhizni
  tier: lesser
  icon: images/icons/gifts/zdorove/gorn-zhizni.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. Мгновенно исцелите все хиты, потерянные с конца вашего прошлого
    хода, при условии, что этот вред вас не убил.
- name: Исправленная Плоть
  slug: ispravlennaya-plot
  tier: lesser
  icon: images/icons/gifts/zdorove/ispravlennaya-plot.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Раз в раунд вы можете взглядом излечить у цели увечья, слепоту, отравления, уродства и врождённые
    пороки. Это не исцеляет урон по хитам, но может вернуть потерянные конечности и утраченные способности.
- name: Милосердный Взгляд
  slug: miloserdnyy-vzglyad
  tier: lesser
  icon: images/icons/gifts/zdorove/miloserdnyy-vzglyad.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Взглядом на цель в пределах видимости вы можете исцелить 2к6 плюс уровень персонажа очков повреждений.
    Однако цель должна приложить Усилие до конца дня, чтобы воспользоваться исцелением. НИП и прочие обычные
    смертные обычно могут воспользоваться этим даром не чаще раза в день.
- name: Наложение Рук
  slug: nalozhenie-ruk
  tier: lesser
  icon: images/icons/gifts/zdorove/nalozhenie-ruk.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Всякий раз, когда вы излечиваете человека от болезни или избавляете от яда, вы навсегда делаете
    его невосприимчивым к этой болезни или веществу. Кроме того, вы можете точно распознать любую болезнь
    с первого взгляда. Это распространяется и на последствия отравлений, и на незнакомые вам болезни.
    Если вы столкнулись с неизвестной вам напастью, распознавание придёт вместе с полным пониманием течения
    болезни, её смертоносности и путей передачи. Любую обычную хворь или болезнь вы можете исцелить одним
    касанием. Ваш максимум Влияния навсегда увеличивается на 1 очко благодаря той благодарности, которой
    вы, скорее всего, будете окружены.
- name: Природное Здоровье
  slug: prirodnoe-zdorove
  tier: lesser
  icon: images/icons/gifts/zdorove/prirodnoe-zdorove.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Ваш максимум хитов увеличивается на 3 дополнительных очка за уровень, включая уровни, полученные
    до взятия этого дара. Этот дар нельзя подавить.
- name: Усмиритель Чумы
  slug: usmiritel-chumy
  tier: lesser
  icon: images/icons/gifts/zdorove/usmiritel-chumy.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца сцены. Излечите все болезни и отравления в пределах видимости. Если
    Усилие потрачено до конца дня, охват исцеления расширяется на полмили вокруг героя, проникает сквозь
    стены и другие преграды, а вы немедленно узнаёте обо всех вызывающих болезни проклятиях и источниках
    заразы в этой области.
- name: Божественный Целитель
  slug: bozhestvennyy-tselitel
  tier: greater
  icon: images/icons/gifts/zdorove/bozhestvennyy-tselitel.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Чтобы купить этот дар, вам нужен культ почитателей и малый дар «Наложение Рук». Опасность, тяготы
    и болезни сопровождали человеческое существование с самого начала, а потому божества Здоровья часто
    бывали особенно любимы. Вам будут добровольно служить по меньшей мере столько исключительно преданных
    последователей, сколько у вас уровней персонажа. Этих друидов, целителей или жриц следует отображать
    характеристиками НИП «Умелый Маг», что делает их архимагами хотя бы одной связанной со Здоровьем традиции
    низкой магии, а также позволяет им выучить до трёх малых даров.
- name: Источник Жизни
  slug: istochnik-zhizni
  tier: greater
  icon: images/icons/gifts/zdorove/istochnik-zhizni.webp
  badges:
  - type: act
    text: Постоянно
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: день'
  body: Союзники в вашем присутствии автоматически стабилизируются при нуле хит-дайсов или хитов, если
    их тела не разорваны на куски. Действием приложите Усилие до конца дня, чтобы вернуть обычное смертное
    существо из мёртвых, если оно мертво менее суток и какая-то часть его тела осталась цела. Обожествлённых
    и прочих могучих сущностей оживить нельзя.
- name: Пылающая Живучесть
  slug: pylayuschaya-zhivuchest
  tier: greater
  icon: images/icons/gifts/zdorove/pylayuschaya-zhivuchest.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. Восстанавливайте по 1 хиту в раунд, пока не будете полностью здоровы.
    Как вариант, вы можете приложить Усилие до конца дня, чтобы исцелить 1 хит или хит-дайс всем союзникам
    в пределах 100 ярдов и поднять из мёртвых обычных смертных с 1 хит-дайсом, если они умерли в последние
    пять минут и не изувечены полностью. Получателям не нужно прикладывать Усилие, чтобы воспользоваться
    этим исцелением.
