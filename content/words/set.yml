name: Сеть
kind: supplement
colors:
  glow: '#5fe0ff'
  deep: '#0e2434'
  dark: '#050e16'
icon: images/icons/words/set.webp
description: |-
  Слово Сети предназначено для миров, где всемирная паутина или её подобие — обычная часть общества. В Арцеме такой основой для этого Слова могла бы стать Светлая Республика, но большинству сказочных миров Сеть предложить нечего.

  Обожествлённый Слова Сети обладает полной и беспрепятственной властью над вычислительными устройствами всех видов, включая любое устройство с микропроцессором. Он может управлять этими устройствами и любыми связанными между собой сообщениями, которые они передают, а также создавать такие устройства из ничего подходящими дарами или чудесами. Впрочем, во многом как и со Словом Инженерии, Обожествлённый не может создать вычислительную технику, опережающую ту, что вообще существует в мире кампании.

  Обожествлённые Сети поднимают своё Мышление до 16, или до 18, если оно уже равно 16 или больше. Они всегда фактически подключены к любому вычислительному устройству в пределах мили, зная его назначение и местоположение, а также любые иные устройства, что находятся с ним в одной сети. Они могут мысленно взаимодействовать с таким железом, будто у них есть прямая связь с этими узлами, и могут отправлять данные на такие машины и получать их с них. Они всегда преуспевают в любых проверках, связанных со взломом небожественной защиты.
gifts:
- name: Воин Правок
  slug: voin-pravok
  tier: lesser
  icon: images/icons/gifts/set/voin-pravok.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены, чтобы переписать любой файл данных, хранящийся в пределах мили,
    изменив его и все связанные с ним записи так, чтобы они соответствовали желаемым данным. Если нужный
    файл находится на связанной машине дальше мили, вместо этого нужно приложить Усилие до конца дня.
- name: Интернет Моих Вещей
  slug: internet-moih-veschey
  tier: lesser
  icon: images/icons/gifts/set/internet-moih-veschey.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Обожествлённый может выбрать вычислительное устройство в пределах мили и работать
    с ним так, будто полностью управляет всеми его возможностями, отдавая один приказ за раунд действием
    В ход. Он может наблюдать за окружением устройства, как если бы стоял рядом с ним, — есть ли у того
    на деле телесные датчики или нет. Устройство, на котором он сосредоточен, можно менять раз в раунд.
- name: Крушение Головок
  slug: krushenie-golovok
  tier: lesser
  icon: images/icons/gifts/set/krushenie-golovok.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие и выберите целью видимую машину или устройство, работа которого опирается на
    вычислительную технику, — не больше здания. Всё вычислительное железо в нём немедленно и полностью
    выгорает, а сгоревшие возможности Обожествлённый оставляет за собой. Предметы, которые держит достойный
    противник, и машины, которыми он управляет, к этому дару невосприимчивы.
- name: Личная Передача
  slug: lichnaya-peredacha
  tier: lesser
  icon: images/icons/gifts/set/lichnaya-peredacha.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены, чтобы исчезнуть и мгновенно возникнуть из любого вычислительного
    устройства в пределах мили. Этот дар не может перенести пользователя больше чем на десять миль в общей
    сложности за час.
- name: Переписать Программу
  slug: perepisat-programmu
  tier: lesser
  icon: images/icons/gifts/set/perepisat-programmu.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня, чтобы изменить программу отдельного устройства любым угодным вам
    образом. Программа должна отвечать тому, на что устройство телесно способно, но она может проявлять
    большую меру суждения и разборчивости в исполнении желаний Обожествлённого. Скажем, электронную дверь,
    которой приказано оставаться закрытой для солдат, можно наделить способностью по камерам определять,
    похожи ли те или иные существа на солдат, и рассуждать об этом по-человечески. Устройство может стать
    в целом искусственно разумным, но исполнять будет своё особое назначение, будто наделённое человеческим
    умом.
- name: Слияние Данных
  slug: sliyanie-dannyh
  tier: lesser
  icon: images/icons/gifts/set/sliyanie-dannyh.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: день'
  body: Обожествлённый может задать вопрос; если ответ хранится в данных любого вычислительного устройства
    в пределах мили или может быть из них выведен, ответ немедленно ему предоставляется. Если данные хранятся
    на связанных компьютерах дальше мили, Обожествлённый должен приложить Усилие до конца дня, чтобы получить
    ответ.
- name: Вирусная Мысль
  slug: virusnaya-mysl
  tier: greater
  icon: images/icons/gifts/set/virusnaya-mysl.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. Обожествлённый передаёт мысль связанной сети. Каждый разумный пользователь
    устройств, подключённых сейчас к этой же сети, получает эту мысль и будет склонен считать её истинной,
    пока и если она не будет опровергнута его личным опытом или убедительной очевидностью. Достойные противники
    могут пройти спасбросок Духа, чтобы противиться. Обожествлённый не может управлять тем, как люди отнесутся
    к своему новому убеждению; он может лишь передать мысль.
- name: Ткач Паутины
  slug: tkach-pautiny
  tier: greater
  icon: images/icons/gifts/set/tkach-pautiny.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Обожествлённый безотчётно заставляет вычислительную сеть возникать вокруг него, если её ещё нет.
    Подходящая миру техника — спутники, наземные линии или передатчики беспроводной связи — просто начинает
    существовать, без швов встраиваясь в существующее железо и проходя незамеченной для меньших противников
    в округе, которые поверят, что она была здесь всегда. Сеть расширяется со скоростью в милю радиуса
    за день вокруг Обожествлённого, не требует ухода или внешнего питания и сама собой подключается к
    любой существующей сети, которая не защищена нарочно от внешних подключений. Для более местных нужд
    Обожествлённый может сотворить до половины тонны новейшего вычислительного оборудования и сетевых
    материалов за день, потратив на это десять минут сосредоточения. Этот дар нельзя применить как чудо.
- name: Чёрная Дыра
  slug: chernaya-dyra
  tier: greater
  icon: images/icons/gifts/set/chernaya-dyra.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: 'Обожествлённый указывает определённую тему для запрета — частную или общую. Ни одна сеть, связанная
    с чем бы то ни было в пределах мили от Обожествлённого, не сможет нести данные, относящиеся к этой
    теме: ни неподвижные файлы, ни телефонные разговоры, ни переписку, ни изображения. Этот запрет длится,
    даже если Обожествлённый перестаёт быть подключённым к сети, пока он сам его не снимет, пока он не
    будет рассеян божественными силами или пока сеть не будет разрушена телесно и построена заново из
    новых частей.'
