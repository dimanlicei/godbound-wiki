name: Насекомые
kind: supplement
colors:
  glow: '#e8b45a'
  deep: '#2e2410'
  dark: '#120e06'
icon: images/icons/words/nasekomye.webp
description: |-
  Владыки роя и множества, Обожествлённые Насекомых правят и мерзкими полчищами, и хитиновыми чудовищами. Они владеют силами живучести, голода и бездумного напора.

  Как и большинство Слов, связанных с одним видом животных, Слово Насекомых может подражать силам Слова Зверей применительно к насекомым и всякой букашечьей твари. Кроме того, оно может призывать силы, связанные с самой природой насекомых: многочисленностью, бездумным голодом, способностью действовать, будучи разорванным на части, и паразитическим управлением другими существами.

  Обожествлённые Слова Насекомых обладают неуязвимым иммунитетом к вреду от насекомых и от полученных из них ядов. Божественные существа насекомой природы всё же могут им навредить, но должны прикладывать Усилие до конца дня за каждый раунд, когда этого хотят. Обожествлённые могут общаться с насекомыми, будто те разумны как люди, и полностью повелевать немагическими насекомыми. Если поблизости нет опасных роёв, насекомые в бою малополезны, но будут послушно шпионить и действовать без оглядки на самосохранение. Приказы, отданные Обожествлённым, будут исполняться, пока насекомые не разбредутся или не потеряют сосредоточенность.
gifts:
- name: Мерзостный Яд
  slug: merzostnyy-yad
  tier: lesser
  icon: images/icons/gifts/nasekomye/merzostnyy-yad.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. У Обожествлённого отрастают ядовитые жвалы, когти, жала или иное телесное оружие,
    либо его оружие покрывается ядом, отчего наносит 1к10 урона. Любое живое существо, поражённое этим
    даром, автоматически получает 1 очко урона в следующем раунде от оставшегося яда. По усмотрению Обожествлённого
    яд может лишь парализовать противника, доведённого до нуля хитов.
- name: Плоть Многих
  slug: plot-mnogih
  tier: lesser
  icon: images/icons/gifts/nasekomye/plot-mnogih.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Обожествлённый рассыпается в рой насекомых на свой выбор; летающие
    насекомые двигаются со скоростью его обычного передвижения. В этом облике он не может применять наступательные
    силы и атаковать, но обретает иммунитет к любой атаке, которая не уничтожила бы разом целый рой насекомых.
    Насекомые должны оставаться в пределах 30 футов друг от друга, и Обожествлённый вновь собирается воедино
    где угодно в этих пределах, когда отзывает Усилие.
- name: Прыжок Мухи
  slug: pryzhok-muhi
  tier: lesser
  icon: images/icons/gifts/nasekomye/pryzhok-muhi.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Обожествлённый мгновенно перепрыгивает на расстояние до 30 футов,
    самопроизвольно уходя от любой физической атаки или вреда, которых можно избежать таким уклонением.
- name: Созвать Рой
  slug: sozvat-roy
  tier: lesser
  icon: images/icons/gifts/nasekomye/sozvat-roy.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. Обожествлённый создаёт одну Маленькую Толпу насекомых на каждые
    три уровня персонажа с округлением вверх. Эти рои обладают боевыми характеристиками Толпы Мерзкого
    Роя, но могут летать со скоростью 60 футов за действие Перемещения и вместе способны нести до 50 фунтов
    веса. Рои существуют, пока не будут уничтожены или пока Обожествлённый их не развеет. Этот дар нельзя
    применить снова, пока все прежние рои не будут развеяны или уничтожены.
- name: Хитиновая Живучесть
  slug: hitinovaya-zhivuchest
  tier: lesser
  icon: images/icons/gifts/nasekomye/hitinovaya-zhivuchest.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Плоть Обожествлённого твёрда и стойка к ранам, что даёт ему естественный класс защиты 3. Он может
    отрастить утраченные конечности за день, включая голову, и обезглавливанием одним его из строя не
    вывести.
- name: Червь Внутри
  slug: cherv-vnutri
  tier: lesser
  icon: images/icons/gifts/nasekomye/cherv-vnutri.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: день'
  body: Когда враг доведён до нуля хитов атакой Обожествлённого, тот может приложить Усилие до конца дня,
    чтобы этой же атакой ввести в павшего личинку. Жертва приходит в себя с одним хитом и становится полностью
    и безоговорочно подвластна воле Обожествлённого. Обожествлённый может по желанию разделять её чувства
    и говорить с нею телепатически. Меньшие противники этому управлению противиться не могут; достойные
    противники получают спасбросок Духа, чтобы противиться особенно отвратительным требованиям. Если жертва
    трижды подряд преуспеет в спасброске, Обожествлённый должен либо дать личинке погибнуть, либо приказать
    ей убить носителя, выйдя наружу насекомым размером с собаку — на выбор Обожествлённого, без сколько-нибудь
    заметных боевых способностей. Обожествлённый может дать личинке умереть или выйти в любой миг, если
    пожелает. Одновременно у Обожествлённого может быть заражённых жертв не больше его уровня.
- name: Летать, Рыть и Буравить
  slug: letat-ryt-i-buravit
  tier: greater
  icon: images/icons/gifts/nasekomye/letat-ryt-i-buravit.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Обожествлённый способен летать со скоростью, вдвое превышающей его обычное передвижение, и проходить
    сквозь земляные или деревянные преграды и поверхности со своей обычной скоростью, проделывая отверстие
    до четырёх футов в поперечнике и такой глубины, какую пожелает.
- name: Миллион Жвал
  slug: million-zhval
  tier: greater
  icon: images/icons/gifts/nasekomye/million-zhval.webp
  badges:
  - type: act
    text: Действие
  - type: smite
    text: Кара
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. Извержение всепожирающих насекомых обрушивается на все выбранные
    цели, растения и сооружения в радиусе тридцати футов на уровень Обожествлённого. Меньшие противники
    получают 1к6 урона за уровень Обожествлённого, а отдельные существа с 1 ХД или Толпы из таких существ
    уничтожаются сразу, если не обладают особой защитой. Достойные противники получают 1к8 урона за два
    уровня и могут пройти спасбросок Стойкости, чтобы уполовинить его. Обычные растения и лёгкие деревянные
    постройки уничтожаются, крепкие деревянные — сильно повреждаются. После нападения насекомые исчезают.
- name: Тысяча Крыльев
  slug: tysyacha-krylev
  tier: greater
  icon: images/icons/gifts/nasekomye/tysyacha-krylev.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие. Обожествлённый превращается в обычное насекомое на свой выбор, не обретая при
    этом особых сил, но получая любой полёт или движение в воде, доступные этому насекомому, — пока Усилие
    приложено. Если Усилие приложено до конца сцены, он может превратить так видимую цель. Меньшие противники
    сопротивляться не могут, но достойные противники могут пройти спасбросок Стойкости, чтобы сбросить
    эффект. Превращение длится, сколько пожелает Обожествлённый, и может быть либо чисто телесным, либо
    наделять цель и разумом насекомого.
