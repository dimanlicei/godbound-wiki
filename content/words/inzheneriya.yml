name: Инженерия
kind: supplement
colors:
  glow: '#9fd4e0'
  deep: '#1e262c'
  dark: '#0b1013'
icon: /images/icons/words/inzheneriya.webp
description: |-
  Слово Инженерии — замещающее Слово, призванное занять место Мастерства в кампаниях с развитой техникой, какая встретится в игре о современности или о далёком будущем. Мастерство рассчитано на миры, где самое передовое устройство — это арбалет или акведук, тогда как Инженерия больше подходит для кампаний с рюкзачными боеголовками.

  Обожествлённый Слова Инженерии может действием В ход мгновенно создать любое обычное устройство, которое способен нести обычный человек. «Обычное устройство» — это всё, что вообще продаётся на законных или чёрных рынках, включая обычное оружие и боеприпасы, но не оружие массового поражения, не уникальные существующие предметы и не диковинную опытную технику. Пищей такие устройства быть не могут. Созданное исчезает или испаряется через несколько часов после того, как Обожествлённый и его спутники перестают им пользоваться.
gifts:
- name: Благословенные Чертежи
  slug: blagoslovennye-chertezhi
  tier: lesser
  icon: /images/icons/gifts/inzheneriya/blagoslovennye-chertezhi.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Обожествлённый мгновенно знает, как управлять любым транспортом, звездолётом или устройством,
    которое видит, и обладает наитийным пониманием устройства и расположения зданий, звездолётов и прочих
    крупных сооружений, включая их слабые места и технические возможности. Это знание недостаточно точно,
    чтобы служить картой, но нужный путь к любому механизму, отсеку или узлу всегда отыщется.
- name: Блистательное Изобретение
  slug: blistatelnoe-izobretenie
  tier: lesser
  icon: /images/icons/gifts/inzheneriya/blistatelnoe-izobretenie.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. Обожествлённый создаёт устройство, которым может пользоваться только
    он сам и которое в совершенстве подражает малому дару любого другого Слова, кроме Колдовства. Обычную
    цену в Усилии, если она есть, платят как за сам дар, и устройство остаётся годным до следующего применения
    этого дара. «Блистательное Изобретение» применимо лишь раз в день.
- name: Взять Штурвал
  slug: vzyat-shturval
  tier: lesser
  icon: /images/icons/gifts/inzheneriya/vzyat-shturval.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: 'Приложите Усилие до конца сцены и выберите видимое устройство. Пока Усилие приложено, вы обретаете
    полную власть над его работой и отдаёте приказы действиями В ход. Обожествлённый может управлять лишь
    видимыми частями устройства: имея дело со звездолётом, он может править люками, видимыми двигателями
    и внешним вооружением, но чтобы управлять внутренними механизмами, ему нужен доступ к мостику. Обожествлённый
    не может принудить устройство сделать то, что невозможно для его обычного оператора. Одновременно
    можно управлять лишь одной машиной.'
- name: Долговечное Мастерство
  slug: dolgovechnoe-masterstvo
  tier: lesser
  icon: /images/icons/gifts/inzheneriya/dolgovechnoe-masterstvo.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Обожествлённый может сотворить любое обычное устройство, какое
    поднимет одной рукой. Если приложить Усилие до конца дня, устройство может быть размером с грузовик
    или челнок. Оно существует бесконечно и полностью заряжено всякий раз, когда Обожествлённый к нему
    прикасается.
- name: Научный Метод
  slug: nauchnyy-metod
  tier: lesser
  icon: /images/icons/gifts/inzheneriya/nauchnyy-metod.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Труды Обожествлённого способны возвести обычную технику или сооружения меньше дома — за сцену,
    меньше завода — за день, меньше города — за перерыв между сессиями, если только на это уходит больше
    дня. Материалы для постройки всё равно нужны.
- name: Починка Создателя
  slug: pochinka-sozdatelya
  tier: lesser
  icon: /images/icons/gifts/inzheneriya/pochinka-sozdatelya.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Обожествлённый возвращает видимый механизм или предмет в исходное,
    запитанное и целое состояние. Починяя предметы больше куба со стороной 20 футов, он восстанавливает
    20-футовый куб повреждённого. Починяя крупные сооружения и машины, считайте, что почин возвращает
    20% предельной прочности предмета.
- name: Душа Машины
  slug: dusha-mashiny
  tier: greater
  icon: /images/icons/gifts/inzheneriya/dusha-mashiny.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня, когда Обожествлённый касается устройства не больше челнока или
    крупного грузовика. Устройство мгновенно обретает разумность и человеческий уровень мышления и может
    свободно применять свои возможности, как сочтёт нужным, и общаться через присоединённые к нему устройства.
    Устройства будут дружелюбны и послушны Обожествлённому, если только не обретут некий смысл, противный
    их истинному владельцу, — в этом случае они не сделают ничего ему во вред. Устройства рады служить
    так, как задумано, и обычно этим довольны; они не подчинятся приказам, ведущим к их уничтожению, если
    только такие приказы не отвечают их назначению. О том, что было до пробуждения, устройства не помнят.
- name: Передний Край
  slug: peredniy-kray
  tier: greater
  icon: /images/icons/gifts/inzheneriya/peredniy-kray.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: 'Раз за сессию Обожествлённый может совершить решительный прорыв в существующей общедоступной
    технике: создать работающее клонирование, изобрести антигравитацию, излечить целый круг врождённых
    болезней или сделать нечто подобное, опередив общий уровень техники кампании. Ведущий может наложить
    запрет на достижения, слишком чуждые миру. Хотя такая техника обычно слишком громоздка или капризна,
    чтобы приносить пользу в приключении или в бою, она может служить оправданием для трат Владычества,
    делая Невозможные изменения Неправдоподобными, а Неправдоподобные — Правдоподобными. Смотря по тому,
    как Обожествлённый распространяет эту технику, она может постепенно войти и в общий технический уровень
    кампании, позволяя врождённой силе Обожествлённого пользоваться ею и давая обычным инженерам возможность
    её строить. Пока техника не стала общей, для её создания и управления ею нужен неповторимый гений
    Обожествлённого. Этот дар можно применить как чудо, но, если он не взят даром, поддерживать его достаточно
    долго, чтобы техника вошла в кампанию насовсем, невозможно.'
- name: Слабое Место
  slug: slaboe-mesto
  tier: greater
  icon: /images/icons/gifts/inzheneriya/slaboe-mesto.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Атаки Обожествлённого, требующие броска попадания, против машин, синтетических форм жизни и сооружений
    всегда успешны и наносят по меньшей мере 1 очко урона, что бы ни стояло на пути, кроме неуязвимой
    защиты. Дары, применённые против таких целей, бросают кубы урона дважды с выбором лучшего результата.
    Неразумные устройства и машины не больше грузовика Обожествлённый может уничтожить прикосновением
    действием В ход, если в этот миг ими никто не управляет.
