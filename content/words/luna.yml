name: Луна
kind: canon
colors:
  glow: '#cdd8ff'
  deep: '#1a2140'
  dark: '#080c1c'
icon: images/icons/words/luna.webp
description: |-
  Слово Луны правит страстным безрассудством, сломанной логикой, бредовыми видениями и иррациональными убеждениями. Хотя это Слово не властно создавать осязаемые физические эффекты, оно способно выжигать себе путь сквозь чужие умы, оставляя шрамы, калечащие жертв до конца их дней… или пока Обожествлённый не смилуется.

  Обожествлённые Луны обладают неуязвимой защитой от сил, воздействующих на разум и чувства или читающих их. Любая попытка применить такие силы против Обожествлённого немедленно наносит нападающему 1к6 ментального урона за уровень персонажа, если Обожествлённый того пожелает. Основным действием Обожествлённый может изучить существо и определить все значимые психические расстройства, получая описание каждого в одно предложение.
gifts:
- name: Восторг Делирия
  slug: vostorg-deliriya
  tier: lesser
  icon: images/icons/gifts/luna/vostorg-deliriya.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие и выберите целью видимое душевнобольное существо. Пока Усилие приложено, вы можете
    своим Основным действием заставить существо выполнить Основное действие по вашему выбору, но не самоубийственное.
    Существо выполняет приказы в полную меру своих сил, как если бы это была его собственная задумка.
    Достойные противники могут пройти спасбросок Духа, чтобы противостоять приказу, если он противен их
    собственным желаниям.
- name: Ласка Одержимости
  slug: laska-oderzhimosti
  tier: lesser
  icon: images/icons/gifts/luna/laska-oderzhimosti.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены и выберите целью одно видимое существо или до Маленькой Толпы
    меньших противников. Цель немедленно начинает верить в одно утверждение по вашему выбору и считает
    этот факт самым важным в своей жизни, действуя соответственно в пределах своего характера. Достойные
    противники получают спасбросок Духа, чтобы стать невосприимчивыми к этому дару до конца сцены, а затронутые
    цели остаются в плену этой идеи неделю, прежде чем станут доступны обычным убеждениям в её ошибочности.
- name: Непризнанная Правда
  slug: nepriznannaya-pravda
  tier: lesser
  icon: images/icons/gifts/luna/nepriznannaya-pravda.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены и укажите конкретный факт или мысль. Все присутствующие существа,
    которых вы выбрали целью, отныне не способны думать об этом факте или признавать его, если только
    этого не требует их физическое здоровье. Да и тогда они признают его лишь в той мере, в какой это
    необходимо для сохранения жизни. На меньших противников этот дар действует бессрочно, а достойные
    противники в начале каждого раунда получают спасбросок Духа, чтобы сбросить его и стать невосприимчивыми
    к нему на сцену. Существо может находиться под действием только одной «Непризнанной Правды» одновременно.
- name: Отражения Луны
  slug: otrazheniya-luny
  tier: lesser
  icon: images/icons/gifts/luna/otrazheniya-luny.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены и выберите конкретную галлюцинацию или ложное ощущение, которое
    внезапно воспримут все видимые цели вокруг вас. Эта галлюцинация не может нанести цели реального урона,
    и цель подсознательно избегает основанных на ней действий, которые причинили бы ей физический вред.
    Незаметным, правдоподобным галлюцинациям цель не сопротивляется, если у неё нет причин усомниться
    в своих чувствах. Достойные противники, которым что-то угрожает, которые подавлены или сомневаются
    в видении, могут в начале каждого раунда пройти спасбросок Духа, чтобы стать невосприимчивыми к этому
    дару до конца сцены; любая жертва освобождается, как только получает урон по хитам.
- name: Поцелованный Луной
  slug: potselovannyy-lunoy
  tier: lesser
  icon: images/icons/gifts/luna/potselovannyy-lunoy.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Вы владеете аурой безумия и смятения как магическим оружием, нанося 1к10 ментального
    урона любой видимой цели. Существа, доведённые до нуля хитов, либо убивают себя, либо остаются навсегда
    безумными — как вы выберете, — восстанавливая при этом 1 хит.
- name: Успокоить Подёрнутые Рябью Воды
  slug: uspokoit-podernutye-ryabyu-vody
  tier: lesser
  icon: images/icons/gifts/luna/uspokoit-podernutye-ryabyu-vody.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены, чтобы свести на нет любую известную вам атаку, наносящую эмоциональный
    или ментальный урон по хитам. Действием вы можете излечить психические расстройства всех видимых целей
    — включая вызванные враждебным применением даров Луны и имеющие чисто биологическую или токсическую
    природу, — и Усилие для этого прикладывать не нужно. Этот дар не действует на существ, чей род от
    природы и по сути мыслит кажущимся безумным образом.
- name: Молоко Безумия
  slug: moloko-bezumiya
  tier: greater
  icon: images/icons/gifts/luna/moloko-bezumiya.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: 'Приложите Усилие до конца дня и выберите целью видимое существо, указав конкретную одержимость,
    ложное убеждение или иное безумие, которым оно должно быть поражено. Всякий, кто увидит поражённую
    цель, должен пройти спасбросок Духа или заразиться тем же безумием, становясь новым его переносчиком.
    Успешный спасбросок делает цель невосприимчивой к этой заразе. Вы можете указать, каких именно людей
    должно затронуть безумие: по именам, по сословиям или по областям. На первом уровне заразиться могут
    не более двухсот человек, и это число удваивается с каждым следующим уровнем. Безумие не может побудить
    к самоубийственному поведению, но может заставить жертв действовать на пределе их природного характера.'
- name: Плач Бледной Дочери
  slug: plach-blednoy-docheri
  tier: greater
  icon: images/icons/gifts/luna/plach-blednoy-docheri.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Вы можете разделять чувства любого душевнобольного человека, которого видели прежде. Вы можете
    по желанию общаться с ним телепатически, хотя достойные противники могут пройти спасбросок Духа, чтобы
    закрыться от вашего голоса на 24 часа. Основным действием вы можете приложить Усилие до конца сцены
    и появиться рядом с любой такой целью, если она находится в пределах мили от вас.
- name: При Свете Луны
  slug: pri-svete-luny
  tier: greater
  icon: images/icons/gifts/luna/pri-svete-luny.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Меньшие противники никогда не сочтут ваши действия неразумными или неуместными, пока вы находитесь
    рядом с ними. Они будут защищать себя и своих близких и станут сопротивляться попыткам их откровенно
    ограбить или искалечить, но ни в какой момент не воспримут ваши действия как противозаконные или безумные.
    Как минимум, они будут считать, что вам положено быть там, где вы оказались, и что вы вправе делать
    то, что делаете. Неестественность этих мыслей может дойти до них уже после того, как вы уйдёте.
