name: Небо
kind: canon
colors:
  glow: '#9ccfff'
  deep: '#0d2942'
  dark: '#04121f'
icon: images/icons/words/nebo.webp
description: |-
  Слово Неба правит погодой, полётом, молнией и ветром. Осенённые его мощью движутся по воздуху так же легко, как по земле, владеют молнией как оружием или губят целые города бурей и ветром. Чудеса неба могут прогнать враждебную погоду, поразить цель ударом молнии, вызвать ветер, чтобы поднять и перенести что-либо, или совершить иной подвиг власти над воздухом.

  Героям со Словом Неба никогда не вредит падение, им не нужно дышать, и они обладают неуязвимой защитой от электричества, холода и вредоносных звуков. Они могут установить значение Ловкости равным 16 или 18, если оно уже равно 16 или больше.
gifts:
- name: Глаза в Вышине
  slug: glaza-v-vyshine
  tier: lesser
  icon: images/icons/gifts/nebo/glaza-v-vyshine.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Получите вид с высоты птичьего полёта на милю вокруг себя, охватывая всё взглядом достаточно быстро,
    чтобы сразу заметить нужных вам людей или предметы. Вы можете сосредоточиться на отдельных местах
    в пределах этой мили, наблюдая всё происходящее, но не можете расслышать обычную речь. Это зрение
    не проникает сквозь крыши и другие укрытия.
- name: Дождь Молний
  slug: dozhd-molniy
  tier: lesser
  icon: images/icons/gifts/nebo/dozhd-molniy.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Выберите точку в пределах видимости; каждая желаемая цель в пределах 100 футов получает кость
    1к6 электрического урона, когда её окутывает облако молний. Разрядов достаточно, чтобы убить слабых,
    но уничтожить предметы они не могут.
- name: Облака Внизу
  slug: oblaka-vnizu
  tier: lesser
  icon: images/icons/gifts/nebo/oblaka-vnizu.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Наполните воздух вокруг себя туманом в радиусе до 300 футов. Вы и ваши союзники
    видите сквозь него, а прочие с обычными чувствами не видят дальше пяти футов вокруг себя. Эти облака
    гасят любой обычный огонь и позволяют каждому союзнику внутри игнорировать первые 5 очков урона огнём,
    получаемые каждый раунд.
- name: Плеть Бури
  slug: plet-buri
  tier: lesser
  icon: images/icons/gifts/nebo/plet-buri.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Владейте электричеством как дальнобойным оружием на дистанции до 200 футов либо
    окутайте молнией своё оружие. Урон составляет не менее 1к10 и считается магическим оружием. Атаки
    по мокрым или закованным в металл противникам всегда наносят не менее 1 очка урона, даже при промахе.
- name: Поющий Ветер
  slug: poyuschiy-veter
  tier: lesser
  icon: images/icons/gifts/nebo/poyuschiy-veter.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Управляйте погодой в пределах мили — от полного штиля до ливней такой силы,
    что валят хрупкие постройки и делают невозможной обычную стрельбу из лука. Перемены погоды происходят
    мгновенно при применении дара и длятся, пока Усилие приложено. После его возвращения погода быстро
    возвращается к обычному состоянию.
- name: Сапфировые Крылья
  slug: sapfirovye-krylya
  tier: lesser
  icon: images/icons/gifts/nebo/sapfirovye-krylya.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Герой может летать вдвое быстрее своей обычной скорости передвижения. Если его
    ничто не отвлекает и он может лететь по прямой, он разгоняется до 100 миль в час.
- name: Глас Ветров
  slug: glas-vetrov
  tier: greater
  icon: images/icons/gifts/nebo/glas-vetrov.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Вы можете сосредоточиться на определённой точке в пределах десяти миль, чтобы слышать всё происходящее
    там, если только она не отрезана от наружного воздуха. Вы можете говорить в эту точку, и услышат вас
    только там. Если вы потратите действие на крик, противники в пределах 100 футов от вас получают урон
    вашей кости Схватки, если она к ним применима.
- name: Удар Грома
  slug: udar-groma
  tier: greater
  icon: images/icons/gifts/nebo/udar-groma.webp
  badges:
  - type: act
    text: Действие
  - type: smite
    text: Кара
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Обрушьте титанический разряд молнии на точку в пределах видимости.
    Каждая выбранная цель в пределах 200 футов поражается током, получая урон, равный вашему уровню в
    очках. Против Толп разряд наносит 1к10 урона напрямую за каждые два уровня персонажа героя с округлением
    вверх. Выжившие остаются оглушёнными, пока не пройдут спасбросок Морали или Стойкости.
- name: Ярость Небес
  slug: yarost-nebes
  tier: greater
  icon: images/icons/gifts/nebo/yarost-nebes.webp
  badges:
  - type: act
    text: Действие
  - type: smite
    text: Кара
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. До конца сцены, находясь под открытым небом, вы можете поражать
    одну цель или Толпу в пределах видимости разрядом, наносящим урон, равный вашему уровню, со спасброском
    Стойкости, чтобы уполовинить его. Эти разряды могут разрушать сооружения не прочнее каменного здания.
    Вызов таких разрядов — действие Кары, а потому его нельзя применять два раунда подряд.
