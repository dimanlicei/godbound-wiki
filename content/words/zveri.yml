name: Звери
kind: canon
colors:
  glow: '#dcd67a'
  deep: '#26240f'
  dark: '#0f0e06'
icon: /images/icons/words/zveri.webp
description: |-
  Слово царства животных. Дары Зверя можно применять к любому природному или магическому животному, но не к созданиям, целиком слепленным из колдовства или невозможного ремесла. Большинство существ человеческого разума зверями не считаются, хотя некоторые особенно первобытные или дикие сущности могут быть сочтены таковыми. Чудеса Слова Зверя связаны с перенятием звериных черт, наделением ими других, полным или частичным превращением, повелеванием зверями и призывом животных.

  Некоторые силы дают владельцу полный или частичный облик животного либо позволяют превратить другого. Если это применяется как проклятие, герой может наделить цель звериным разумом или оставить ей собственный рассудок в новой оболочке. Если это благословение или собственное превращение, прежний разум сохраняется, но с чутьём того, как пользоваться природными способностями зверя. Если атаковать природным оружием существа, небольшие, но опасные создания используют кость урона 1к6, размером с волка или медведя — 1к8, а более крупные — 1к10. Таким образом, превращение смертных в свирепых зверей на деле не улучшит их боевых умений, а лишь изменит их облик и даст природный способ передвижения зверя. Хотя здешние дары этого не оговаривают, иные чудеса или дары Слова Зверя могут за дополнительное Усилие даровать особые способности или свойства животной формы.

  Герои со Словом Зверя могут говорить с животными. Неразумные звери всегда исполнят просьбы, не противные их природе.
gifts:
- name: Глаза Кота
  slug: glaza-kota
  tier: lesser
  icon: /images/icons/gifts/zveri/glaza-kota.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: 'Ваши чувства сверхъестественно остры: вы видите в полной темноте, безупречно слышите любой звук
    в пределах ста ярдов и идёте по следу по запаху.'
- name: Далёкий Вой
  slug: dalekiy-voy
  tier: lesser
  icon: /images/icons/gifts/zveri/dalekiy-voy.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Вы можете издали общаться с любым животным, чьё местоположение вам известно
    с точностью до мили. Вы можете заимствовать его чувства, если оно позволит. До животных, проведших
    рядом с вами хотя бы неделю, вы можете дотянуться, где бы они ни были.
- name: Клык и Коготь в Крови
  slug: klyk-i-kogot-v-krovi
  tier: lesser
  icon: /images/icons/gifts/zveri/klyk-i-kogot-v-krovi.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: 'Приложите Усилие. Вы обладаете природным оружием или можете мгновенно его явить: оно наносит
    1к10 повреждений и считается магическим. Против природных или магических зверей эти когти или клыки
    всегда бьют по классу защиты 9, играючи вспарывая шкуры и чешую таких врагов.'
- name: Неприручённая Воля
  slug: nepriruchennaya-volya
  tier: lesser
  icon: /images/icons/gifts/zveri/nepriruchennaya-volya.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Пока оно приложено, никакая внешняя магия или принуждение не могут заставить
    вас делать или чувствовать что-либо против вашей воли. Вы можете применить этот дар даже после проваленного
    спасброска или уже получив ментальный эффект.
- name: Узы Единства
  slug: uzy-edinstva
  tier: lesser
  icon: /images/icons/gifts/zveri/uzy-edinstva.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: день'
  body: Вы можете связать себя узами с животным, сделав его продолжением своего духа и обретя с ним обмен
    чувствами и общение. Оно использует свои обычные характеристики, но его атаки считаются магическим
    оружием, а его хит-дайсы вдвое больше вашего уровня. Если оно погибает, оно исчезает, но его можно
    призвать обратно, приложив Усилие до конца дня. За ту же цену его можно телепортировать к себе. Одновременно
    можно связать лишь одно животное, а люди, покорённые даром «Покорить Зверя Внутри», должны быть обычными
    смертными.
- name: Учуять Добычу
  slug: uchuyat-dobychu
  tier: lesser
  icon: /images/icons/gifts/zveri/uchuyat-dobychu.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие, чтобы чутьём узнать местоположение и виды всех зверей в радиусе мили. Вы можете
    телепатически призвать любого из них прийти к вам так быстро, как он сможет это сделать без риска.
    Магические или разумные звери могут отказаться прийти, если пожелают.
- name: Мантия Из Многих Шкур
  slug: mantiya-iz-mnogih-shkur
  tier: greater
  icon: /images/icons/gifts/zveri/mantiya-iz-mnogih-shkur.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: день'
  body: Примите облик любого зверя или гибрида, природного или магического. Либо превратите видимое живое
    существо в природного зверя; чтобы затронуть достойного противника, приложите Усилие до конца дня
    — он к тому же получает спасбросок Стойкости, чтобы противостоять. Если это применено как благословение,
    человеческая цель может прекратить превращение по своей воле. Проклятых превращением не вернуть обратно
    ничем, кроме другого дара или столь же мощного рассеивания.
- name: Повелитель Дикой Природы
  slug: povelitel-dikoy-prirody
  tier: greater
  icon: /images/icons/gifts/zveri/povelitel-dikoy-prirody.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Животные чутьём служат вам и повинуются даже до смерти, выполняя приказы так, будто наделены человеческим
    разумом. Магические или разумные звери получают спасбросок Духа, и им нельзя приказать поступать так,
    как кажется им самоубийственным или полностью противным их природе.
- name: Покорить Зверя Внутри
  slug: pokorit-zverya-vnutri
  tier: greater
  icon: /images/icons/gifts/zveri/pokorit-zverya-vnutri.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Победив противника в бою и сведя его к нулю хит-дайсов, вы можете решить усмирить его, если использовали
    несмертельную атаку. Такая усмирённая жертва приходит в себя с 1 хит-дайсом и навсегда становится
    подвластна вашим дарам Зверя, как если бы была животным.
