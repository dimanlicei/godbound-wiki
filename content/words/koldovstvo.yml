name: Колдовство
kind: canon
colors:
  glow: '#c9a4ff'
  deep: '#221338'
  dark: '#0c0718'
icon: images/icons/words/koldovstvo.webp
description: |-
  Колдовство — необычное Слово, воплощающее связь с основополагающими законами мироздания и глубокими, неявными тайнами их работы. У Колдовства нет собственных чудес, и само по себе оно не может создавать эффекты или подражать своим дарам. Вместо этого владение его дарами позволяет Обожествлённому применять гибкие и мощные силы теургии.

  Обожествлённые, связанные со Словом Колдовства, устанавливают значение Интеллекта равным 16 или 18, если оно уже равно 16 или больше. Кроме того, они играючи отметают заклинания меньших магов. Мгновенной способностью персонаж может приложить Усилие до конца сцены, чтобы мгновенно свести на нет любое заклинание низкой магии, творимое в его присутствии, либо изгнать или уничтожить любого конструкта низкой магии или призванную сущность. Это противодействие не работает против теургии и тайных сил, лишь похожих на заклинания низкой магии.
gifts:
- name: Адепт Врат
  slug: adept-vrat
  tier: lesser
  icon: images/icons/gifts/koldovstvo/adept-vrat.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Вы посвящены во Врата — скромнейшую ступень теургии, всё же недоступную никому, кроме могущественнейших
    смертных чародеев. В рамках этого обучения вы можете выбрать четыре призыва Врат для освоения и можете
    выучить больше по мере того, как будете их находить.
- name: Безупречная Пауза
  slug: bezuprechnaya-pauza
  tier: lesser
  icon: images/icons/gifts/koldovstvo/bezuprechnaya-pauza.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: по желанию'
  body: Когда вы творите теургический призыв или заклинание низкой магии, вы можете приложить Усилие прямо
    перед тем, как оно сработает. Тогда заклинание задерживается и может быть выпущено действием в любой
    момент после этого, а приложенное Усилие возвращается в конце той сцены. Вы можете задержать больше
    одного заклинания, если готовы приложить Усилие к каждому, но выпуск заклинания требует вашего действия
    на ход.
- name: Большая Павеза Власти
  slug: bolshaya-paveza-vlasti
  tier: lesser
  icon: images/icons/gifts/koldovstvo/bolshaya-paveza-vlasti.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. На это время вы невосприимчивы ко всем заклинаниям низкой магии
    и получаете бонус +4 ко всем спасброскам против теургии. Если теургический призыв обычно не даёт спасброска,
    вы всё равно можете его совершить — но без бонуса, — чтобы противостоять его действию.
- name: Гнев Колдуна
  slug: gnev-kolduna
  tier: lesser
  icon: images/icons/gifts/koldovstvo/gnev-kolduna.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Ваша кость Схватки может вредить даже достойным противникам — тем врагам, у
    кого хит-дайсов больше, чем у вас уровней. Эта сила действует и на те дары, что позволяют применять
    кость Схватки как часть своего эффекта, усиливая такие силы.
- name: Обжигающая Воля
  slug: obzhigayuschaya-volya
  tier: lesser
  icon: images/icons/gifts/koldovstvo/obzhigayuschaya-volya.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: Если вас поразили, пока вы удерживаете сосредоточение — например, творя теургический призыв, —
    вы можете приложить Усилие до конца сцены, чтобы сохранить сосредоточение, не потерять заклинание
    и нанести ударившему вас противнику кость 1к8 урона напрямую как мистическую отдачу.
- name: Проницательный Глаз Знания
  slug: pronitsatelnyy-glaz-znaniya
  tier: lesser
  icon: images/icons/gifts/koldovstvo/pronitsatelnyy-glaz-znaniya.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: Без Усилия
  body: Сосредоточившись на миг, вы можете распознать любую действующую в области низкую магию или теургию,
    определив её общее назначение. Прочие присутствующие виды магии вы отмечаете, но получаете лишь смутное
    ощущение опасности или блага. Этот взгляд немедленно выявляет всех теургов и практиков низкой магии
    в пределах видимости.
- name: Совершенство Понимания
  slug: sovershenstvo-ponimaniya
  tier: lesser
  icon: images/icons/gifts/koldovstvo/sovershenstvo-ponimaniya.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: 'Вы поразительно быстрый ученик в магии. Вы можете освоить любой путь низкой магии за месяц, тратя
    по неделе на каждую ступень посвящения вашего учителя, и вам не нужно посвящать этому Факт. Теургические
    заклинания вы также учите несоизмеримо быстрее: по одному дню на призыв любой степени. Вы сами собой
    понимаете любую низкую магию или теургию, применённую против вас или в вашем присутствии, зная её
    назначение, пределы и степень силы. Вы также можете узнать автора магического творения, если видели
    другие образцы его работы.'
- name: Адепт Пути
  slug: adept-puti
  tier: greater
  icon: images/icons/gifts/koldovstvo/adept-puti.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Вы посвящены в Путь — вторую ступень теургических таинств. Чтобы овладеть ею, нужно уже быть адептом
    Врат. В рамках этого обучения вы осваиваете три призыва Пути и можете выучить больше по мере того,
    как будете их находить.
- name: Адепт Трона
  slug: adept-trona
  tier: greater
  icon: images/icons/gifts/koldovstvo/adept-trona.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Вы посвящены в Трон — глубочайшую степень тайн теургии. Чтобы овладеть ею, нужно быть адептом
    Пути. В рамках этого обучения вы осваиваете два призыва Трона и можете выучить больше по мере того,
    как будете их находить.
- name: Повелитель Меньших Путей
  slug: povelitel-menshih-putey
  tier: greater
  icon: images/icons/gifts/koldovstvo/povelitel-menshih-putey.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. После часа размышлений вы можете выбрать одну традицию низкой магии, изучению
    которой вы посвятили не менее дня вместе с её практиком любой ступени мастерства. Пока Усилие не возвращено,
    вы можете творить заклинания как архимаг этого пути. Пока этот дар действует, вы, если пожелаете,
    полностью невосприимчивы к заклинаниям этого пути.
