name: Лёд
kind: canon
colors:
  glow: '#8fe4ff'
  deep: '#0b2436'
  dark: '#04101a'
icon: /images/icons/words/led.webp
description: |-
  Слово Льда повелевает не только льдом и жестоким снегом, но и увяданием, тлением и иссушением зимних месяцев. Оно губит растения, сковывает землю и обдирает край ледяными ветрами. Среди его милостей есть и силы паралича и неподвижности, что оставляют жертв застывшими и безмолвными, как изваяние из свежего льда.

  Обожествлённые Льда обладают неуязвимым иммунитетом к холоду и льду. Основным действием они могут заморозить предметы и окружение в пределах 30 футов; существа, не защищённые от холода, получают 1 очко урона, а Толпы — 3. Существо или Толпа могут получить этот урон лишь раз за сцену. Действием они могут сотворить изо льда простые орудия и предметы в пределах 30 футов, хотя такие сооружения не могут служить действенной преградой достойному противнику.
gifts:
- name: Бледное Восхождение
  slug: blednoe-voshozhdenie
  tier: lesser
  icon: /images/icons/gifts/led/blednoe-voshozhdenie.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Обожествлённый и горстка выбранных им слуг обретают способность проходить сквозь
    лёд и снег, будто те неосязаемы, и подниматься даже по отвесным обледенелым поверхностям, как по ровной
    земле. Пока идёт снег или крупа и пока Усилие приложено, они могут летать с удвоенной обычной скоростью.
- name: Зимний Дворец
  slug: zimniy-dvorets
  tier: lesser
  icon: /images/icons/gifts/led/zimniy-dvorets.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Действием Обожествлённый может сотворить до двадцатифутового
    куба льда или снега в любой желаемой форме. Если сделать из него преграду толщиной не менее фута,
    она поглощает втрое больше урона, чем уровень Обожествлённого, прежде чем в ней пробьётся отверстие
    размером с существо, а меньшие противники не могут ей навредить без особых орудий или подходящих источников
    жара. При отрицательных температурах сооружение стоит вечно, иначе рушится через сутки и полностью
    тает через двое.
- name: Ледяные Оковы
  slug: ledyanye-okovy
  tier: lesser
  icon: /images/icons/gifts/led/ledyanye-okovy.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. До Маленькой Толпы меньших противников или один достойный противник
    могут быть скованы льдом; достойные противники получают спасбросок Стойкости, чтобы противостоять.
    Скованные противники не могут совершать действий, требующих телесного движения, и по усмотрению Обожествлённого
    могут получать по 1 очку урона за раунд за уровень Обожествлённого, или по 3 за уровень для Толп.
    Противники, сведённые к нулю хитов, по выбору Обожествлённого либо замерзают насмерть, либо коченеют
    до беспомощности. Скованные противники могут в конце каждого своего раунда проходить спасбросок Стойкости,
    чтобы вырваться; при успехе они снова могут действовать в свой следующий ход.
- name: Лютый Холод
  slug: lyutyy-holod
  tier: lesser
  icon: /images/icons/gifts/led/lyutyy-holod.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Обожествлённый может владеть убийственным морозом как дальнобойным оружием в
    пределах видимости, нанося 1к10 повреждений и замораживая поражённые жидкости и предметы. Против растительных
    существ и особенно чувствительных к холоду эта способность всегда попадает и наносит двойной урон.
- name: Одеяние Белейшего Холода
  slug: odeyanie-beleyshego-holoda
  tier: lesser
  icon: /images/icons/gifts/led/odeyanie-beleyshego-holoda.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Ледяная плоть Обожествлённого даёт естественный класс защиты 3, а его бездонный холод — неуязвимый
    иммунитет к огню. Куда бы он ни шёл, за ним вьются лёгкие снежные вихри.
- name: Пасть Зимы
  slug: past-zimy
  tier: lesser
  icon: /images/icons/gifts/led/past-zimy.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: Без Усилия
  body: Раз за бой, по усмотрению Обожествлённого, когда он убивает живое существо или Толпу, он получает
    их предельное число хит-дайсов в виде дополнительных хитов. Если новый итог превышает его обычный
    максимум, излишек теряется после боя.
- name: Вихрь Падающего Снега
  slug: vihr-padayuschego-snega
  tier: greater
  icon: /images/icons/gifts/led/vihr-padayuschego-snega.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Обожествлённый рассыпается в порыв льда и снега и появляется
    вновь где угодно в пределах десяти миль на уровень, где сейчас есть снег или лёд объёмом с человека.
    Если между Обожествлённым и точкой назначения тянется непрерывная полоса снега или льда, дальность
    неограниченна.
- name: Король/Королева Зимы
  slug: korol-koroleva-zimy
  tier: greater
  icon: /images/icons/gifts/led/korol-koroleva-zimy.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие. Обожествлённый может воспринимать любое место в этом мире, где есть лёд, снег
    или температура ниже нуля, будто стоит там сам. Его голос слышен там в порывах ледяного холода, и
    раз в день он может приложить Усилие до конца дня, чтобы применить дар или чудо Зимы так, будто он
    присутствует лично, приложив обычное для этого Усилие.
- name: Морозное Сердце
  slug: moroznoe-serdtse
  tier: greater
  icon: /images/icons/gifts/led/moroznoe-serdtse.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: 'Приложите Усилие до конца дня. Область радиусом до пяти миль на уровень Обожествлённого навсегда
    погружается в самое сердце Зимы: температура падает ниже нуля, немедленно наметает несколько футов
    снега и льда. Все растения в области сразу гибнут или уходят в зимнюю спячку, и почти все запертые
    там животные погибнут за считанные дни, если не готовы к зиме. Путешествие для неснаряжённых становится
    почти невозможным, а неподготовленные и не имеющие крова, скорее всего, погибнут за считанные часы.
    Эта зима длится, пока Обожествлённый не смягчится или пока способность не будет применена снова. По
    желанию Обожествлённый может вместо этого просто вызывать снежные бури или наметать сугробы где угодно
    в этом радиусе.'
