name: Мор
kind: canon
colors:
  glow: '#c2e07a'
  deep: '#1b2a10'
  dark: '#0a1106'
icon: /images/icons/words/mor.webp
description: |-
  Владыки мора, голода и пожирающих полчищ — такие Обожествлённые несут за собой лишь саранчу, бедствие и страдание. Они владеют силами многочисленности, болезни и голода, чтобы карать целые народы.

  Обожествлённые Слова Мора обладают неуязвимым иммунитетом к болезням, ядам и вреду от насекомых, от произведённых ими токсинов и от прочих паразитов вроде крыс. Они могут по своему усмотрению общаться с гнусом и направлять его, и эти грязные полчища чутьём понимают общий замысел Обожествлённого. Хотя насекомые и крысы опасны для большинства, против достойного противника в бою они бесполезны. Однако они будут послушно соглядатайствовать и действовать без оглядки на самосохранение. Приказы, отданные им Обожествлённым, исполняются в течение одной сцены, после чего они разбредаются или теряют сосредоточенность.

  Божеств этого Слова боятся, а не любят.
gifts:
- name: Голодная Хватка
  slug: golodnaya-hvatka
  tier: lesser
  icon: /images/icons/gifts/mor/golodnaya-hvatka.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Пока это Усилие приложено, те, кто находится в пределах одной мили на уровень
    персонажа от Обожествлённого, будут получать от еды и питья лишь малую долю питательности. Плоды сгниют,
    съестные припасы испортятся в кладовых, а мясо за ночь покроется опарышами. Те, кто в итоге не умрёт
    от голода, наверняка уйдут из проклятой округи.
- name: Имя Мне Легион
  slug: imya-mne-legion
  tier: lesser
  icon: /images/icons/gifts/mor/imya-mne-legion.webp
  badges:
  - type: act
    text: Мгновенно
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие. Обожествлённый рассыпается в рой насекомых или грызунов по своему выбору, причём
    летающие насекомые движутся со скоростью, равной его обычной. В этом облике он не может применять
    враждебные силы или атаковать, но и сам невосприимчив к любой атаке, которая не уничтожила бы разом
    целый рой насекомых или крыс. Гнус должен держаться в пределах 30 футов друг от друга, и Обожествлённый
    вновь собирается воедино где угодно в этих пределах, когда возвращает Усилие. Обожествлённый может
    рефлекторно рассыпаться в рой насекомых, чтобы избежать внезапного вреда, приложив Усилие до конца
    сцены Мгновенным действием, — так он рефлекторно уходит от любой физической атаки или вреда, от которых
    мыслимо было бы увернуться.
- name: Иссушить Землю
  slug: issushit-zemlyu
  tier: lesser
  icon: /images/icons/gifts/mor/issushit-zemlyu.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Сорок акров растений мгновенно гибнут, а земля под ними проклята
    бесплодием на поколение, если это не обратить силами того же Слова. Как вариант, растения и живое
    или срубленное дерево можно по желанию обратить в пепел в радиусе 50 футов. На деревянные предметы,
    которые кто-то держит или несёт, это не действует, но здания или повозки уничтожить можно. Растительные
    чудовища получают 1к12 повреждений за уровень.
- name: Осквернить Плоть
  slug: oskvernit-plot
  tier: lesser
  icon: /images/icons/gifts/mor/oskvernit-plot.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие. Ваше прикосновение или успешные атаки оружием вызывают хворь по вашему выбору.
    Достойные противники получают спасбросок Стойкости, чтобы противостоять. Хворь можно ограничить только
    ими или же позволить ей заразить окружающих обычным путём. Болезнь проявляется через 1к6 часов и достигает
    полной силы за сутки. Смертельные хвори убивают за 1к6 дней без магического исцеления. Как вариант,
    приложив Усилие до конца сцены, вы можете автоматически насылать чудовищную изнуряющую болезнь как
    магическое оружие 1к10 с дальностью 200 футов. Применение этой силы в первый раунд незаметно ни для
    наблюдателей, ни для жертвы, но со второго раунда появляются видимые опухоли и наросты. Меньшие противники
    умрут от рака через 1к6 месяцев после того, как вы применили к ним этот дар, если не будет магического
    исцеления, — даже если при попадании вы решите не наносить урона.
- name: Призвать Рой
  slug: prizvat-roy
  tier: lesser
  icon: /images/icons/gifts/mor/prizvat-roy.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. Обожествлённый вызывает по одной Маленькой Толпе насекомых или
    грызунов на каждый свой уровень персонажа. Эти насекомые имеют боевые характеристики Толпы Мерзкого
    Роя, но по желанию могут летать (если это насекомые) и сообща способны нести до 50 фунтов груза. Эти
    рои существуют, пока их не уничтожат или пока Обожествлённый их не развеет. Применить дар снова нельзя,
    пока все прежние рои не развеяны или не уничтожены.
- name: Тошнотворная Хворь
  slug: toshnotvornaya-hvor
  tier: lesser
  icon: /images/icons/gifts/mor/toshnotvornaya-hvor.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены и выберите цель. Она заболевает, теряя половину своих текущих
    хит-дайсов или хитов с округлением вверх. Достойные противники получают спасбросок Стойкости, чтобы
    противостоять. Потерянные хит-дайсы возвращаются в конце сцены, если существо не умерло. Этот дар
    не складывается сам с собой.
- name: Бледный Конь
  slug: blednyy-kon
  tier: greater
  icon: /images/icons/gifts/mor/blednyy-kon.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Чтобы купить этот дар, нужно уже иметь большой дар «Носитель Мора». Обожествлённый воплощает божественное
    право нести смерть и страдание как заслужившим их, так и невинным. Он может выбрать по одному малому
    дару из Слов Смерти, Меча и Зверей. Кроме того, он получает дополнительные очки Владычества за то,
    что сеет повсеместное разорение и страдание.
- name: Владыка Саранчи
  slug: vladyka-saranchi
  tier: greater
  icon: /images/icons/gifts/mor/vladyka-saranchi.webp
  badges:
  - type: act
    text: Действие
  - type: smite
    text: Кара
  - type: eff
    text: 'Усилие: день'
  body: Чтобы купить этот дар, нужно уже иметь малый дар «Призвать Рой». Приложите Усилие до конца дня.
    Извержение пожирающей саранчи обрушивается на все желаемые цели, растения и постройки в пределах тридцати
    футов на уровень Обожествлённого. Меньшие противники получают 1к6 повреждений за уровень Обожествлённого,
    а существа в 1 ХД или Толпы из таких существ отвратительно облепляются и пожираются, если у них нет
    особой защиты. Достойные противники получают 1к8 повреждений за каждые два уровня со спасброском Стойкости,
    чтобы уполовинить его. Обычные растения и лёгкие деревянные постройки уничтожаются, а прочные деревянные
    сильно повреждаются. После нападения эти насекомые разлетаются в миллион сторон, и подавляющее большинство
    быстро гибнет столь же загадочно, как и появилось.
- name: Носитель Мора
  slug: nositel-mora
  tier: greater
  icon: /images/icons/gifts/mor/nositel-mora.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Чтобы купить этот дар, нужно уже иметь малый дар «Осквернить Плоть». Приложите Усилие до конца
    дня. Обожествлённый заражает грызунов, вшей или комаров в городской местности — например, в человеческом
    городе — особенно злокачественной болезнью. Через неделю двери будут заколочены, а власти начнут паниковать,
    поскольку закон и порядок постепенно рухнут под натиском мора. Возможны даже бунты и резня. Через
    месяц не останется почти ничего, кроме гниющих тел на улицах и тлеющих погребальных костров. Без доступа
    к божественной целительной магии поражённый мором город потеряет до 90% населения и может уже никогда
    не оправиться.
