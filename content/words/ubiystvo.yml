name: Убийство
kind: canon
colors:
  glow: '#ff9aa6'
  deep: '#2a0c12'
  dark: '#0f0406'
icon: images/icons/words/ubiystvo.webp
description: |-
  Есть миллион способов, которыми люди убивают друг друга, и почти столько же обстоятельств, в которые можно поместить эти смерти. Обожествлённые Убийства — не боги войны и редко ищут открытого боя. Вместо этого они ведают самим деянием беззаконного убийства. Орудия этих божеств — нож в спину, яд в чаше и самое непотребное ритуальное жертвоприношение. Их силы крепче всего в делах внезапной засады или нежданного предательства — там, где даже могущественнейшее божество битвы может пасть от непредвиденного вероломства. Точно так же Слово Убийства правит тлеющей ненавистью и внезапной жаркой яростью, что толкают людей убивать в порыве гнева или горькой мести.

  Действием Обожествлённый Убийства может неотвратимо и мгновенно убить любое одно существо в пределах видимости, у которого предельное число хит-дайсов меньше половины его уровня с округлением вверх, при условии, что существо не ожидает опасности. Существ, убитых божеством, связанным с Убийством, нельзя магически оживить без согласия Обожествлённого.

  В просвещённых краях Людей божеств Убийства обычно считают всецело злыми, низменными и жестокими.
gifts:
- name: Глаза Крови
  slug: glaza-krovi
  tier: lesser
  icon: images/icons/gifts/ubiystvo/glaza-krovi.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Вы изучаете жертву убийства и немедленно обретаете полное и связное понимание того, как, почему
    и кем существо было убито. Как вариант, изучите видимое существо и узнайте, было ли оно лично причастно
    к смертоубийственному насилию против определённой цели, которую вы держите в уме, получив краткое
    видение того, как всё происходило.
- name: Жажда Убить
  slug: zhazhda-ubit
  tier: lesser
  icon: images/icons/gifts/ubiystvo/zhazhda-ubit.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены и выберите целью видимое существо, внушив ему внезапное и всепоглощающее
    желание убить выбранную вами цель, которую оно не любит и которой не предано глубоко. Если у жертвы
    нет правдоподобного повода желать цели смерти, эта жажда убийства длится лишь сцену; те же, кто питает
    к цели подлинную ненависть, будут затронуты бессрочно. Пока жажда держится, они воспользуются лучшей
    доступной возможностью убить цель, невзирая на собственную безопасность и последствия. Достойные противники
    получают спасбросок Духа, чтобы противостоять этому принуждению.
- name: Злонамеренное Предвидение
  slug: zlonamerennoe-predvidenie
  tier: lesser
  icon: images/icons/gifts/ubiystvo/zlonamerennoe-predvidenie.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Вы обладаете неуязвимой защитой от ядов. Кроме того, всякий раз, когда кто-то пытается устроить
    вам засаду или застать вас врасплох, вы не только не застигнуты врасплох, но и получаете немедленный
    дополнительный раунд действия ещё до броска инициативы.
- name: Ловчий Смерти
  slug: lovchiy-smerti
  tier: lesser
  icon: images/icons/gifts/ubiystvo/lovchiy-smerti.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены и назначьте цель, которую намерены убить. Затем выберите определённую
    общественную или ремесленную роль либо даже личность смертного, которая, по-вашему, позволит вам подобраться
    к цели ближе всего. Меньшие противники сами собой полагают, что вы принадлежите к этой роли или являетесь
    этим человеком, вопреки любым свидетельствам обратного. Достойные противники получают спасбросок Духа,
    чтобы раскрыть подлог, если вы привлечёте их внимание. Личина держится, пока вы её не прекратите —
    обычно прикончив свою добычу.
- name: Сладкий Поцелуй Освобождения
  slug: sladkiy-potseluy-osvobozhdeniya
  tier: lesser
  icon: images/icons/gifts/ubiystvo/sladkiy-potseluy-osvobozhdeniya.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. В следующий раз, когда в этой сцене вы поцелуете цель, вы можете
    отравить её ядом по своему выбору. Подробности действия могут быть любыми, каких вы пожелаете, и сколь
    угодно медленными или быстрыми, но яд всегда должен в итоге привести к смерти цели. Меньшие противники
    не могут противиться этому яду, а достойные противники могут пройти спасбросок Стойкости, чтобы получить
    лишь урон по хитам, равный вашему уровню персонажа.
- name: Смертоубийство
  slug: smertoubiystvo
  tier: lesser
  icon: images/icons/gifts/ubiystvo/smertoubiystvo.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Свободным Мгновенным действием вы можете одной мыслью призвать себе в руку любое обычное оружие
    — нож, гарроту или даже лук. Оно считается магическим оружием 1к10 с предельной дальностью 200 футов.
    Если вы атакуете застигнутую врасплох цель, атака автоматически попадает с максимальным уроном. Всякое
    существо, убитое этим даром, умирает в полной тишине. Вы можете призвать новое оружие в любой момент,
    даже в конце своего хода или посреди чужого, — и ранее призванное растворится чёрным дымом.
- name: Всякая Рука, Поднятая Против Тебя
  slug: vsyakaya-ruka-podnyataya-protiv-tebya
  tier: greater
  icon: images/icons/gifts/ubiystvo/vsyakaya-ruka-podnyataya-protiv-tebya.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня и выберите целью любое видимое существо, которое когда-либо отнимало
    жизнь или становилось причиной чужой смерти, — неважно, насколько оправданно. Отныне убийство этого
    существа не будет считаться преступным или хотя бы принципиально недопустимым ни в окружающем его
    обществе, ни в любой общине, куда оно потом переберётся, — как бы это ни случилось. НИП с глубокой
    душевной привязанностью к цели всё же будут защищать её жизнь, но прочие не станут вмешиваться иначе
    как за немалую плату или иное наёмничье побуждение. Более того, любое существо, желающее убить цель,
    немедленно и чутьём узнаёт о её беззащитности. Достойные противники могут пройти спасбросок Духа,
    чтобы осознать несуразность этой внезапной травли, но меньшим противникам она покажется совершенно
    логичной и естественной. Это состояние длится, пока вы не освободите жертву, причём одновременно оно
    может затрагивать лишь одного достойного противника.
- name: Окровавленный Саван
  slug: okrovavlennyy-savan
  tier: greater
  icon: images/icons/gifts/ubiystvo/okrovavlennyy-savan.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня, когда вы — или слуга, наделённый одним из ваших даров, — кого-то
    убиваете. Это деяние обладает неуязвимой защитой от любой магии или божественного дара, что раскрыли
    бы виновника. Если вы совершили убийство лично и ваш уровень равен уровню прорицателя или выше, вы
    можете даже управлять тем, что эти силы покажут тем, кто взялся расследовать дело, — например, выставить
    убийцей-предателем супруга или союзника вашей жертвы. Более того, меньшие противники в непосредственной
    близости от убийства будут совершенно не способны опознать в вас виновника, даже если видели, как
    вы это сделали, или слышали ваше прямое признание. Единственное исключение из этой неуязвимой защиты
    — дар «Глаза Крови», который всё ещё способен открыть правду.
- name: Чёрная Пирамида
  slug: chernaya-piramida
  tier: greater
  icon: images/icons/gifts/ubiystvo/chernaya-piramida.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Этот дар требует, чтобы Обожествлённый основал культ в свою честь. Он немедленно получает 2 постоянных
    очка Влияния и за цену 1 приложенного очка Влияния может даровать один из своих малых даров избранному
    приверженцу на всё время, пока это очко приложено. По усмотрению Ведущего успешные массовые убийства,
    ритуальные жертвоприношения достойных противников и прочие зверства, творимые культом Обожествлённого,
    должны приносить ему и дополнительные очки Владычества.
