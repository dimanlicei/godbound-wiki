name: Судьба
kind: canon
colors:
  glow: '#b6c6e8'
  deep: '#1e2436'
  dark: '#0a0d17'
icon: /images/icons/words/sudba.webp
description: |-
  Обожествлённый, связавший Слово Судьбы, овладел теми зыбкими промежутками, что лежат между несомненным и невозможным. Он может сделать почти невозможное предначертанной неизбежностью для человека или отыскать ту щель, сквозь которую можно ускользнуть от иначе неотвратимой гибели.

  Обожествлённый — хозяин собственной судьбы. Он обладает неуязвимой защитой от ментального влияния и чтения мыслей и может заставить попытки последнего давать любые результаты, какие пожелает.
gifts:
- name: Вытянуть Нить
  slug: vytyanut-nit
  tier: lesser
  icon: /images/icons/gifts/sudba/vytyanut-nit.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Обожествлённому суждено пережить свои опасности. Его базовый класс защиты становится равен 3,
    и его невозможно застать врасплох.
- name: Отменить Последствие
  slug: otmenit-posledstvie
  tier: lesser
  icon: /images/icons/gifts/sudba/otmenit-posledstvie.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: сцена'
  body: 'Приложите Усилие до конца сцены. Действия Обожествлённого в текущем раунде полностью не замечаются
    всеми вокруг: о них не остаётся ни памяти, ни отклика, кроме непосредственной самозащиты. Даже слежение
    или запись не уловят деяний Обожествлённого под этим эффектом. Достойные противники могут пройти спасбросок
    Духа, чтобы заметить действия Обожествлённого.'
- name: Прочесть Знаки
  slug: prochest-znaki
  tier: lesser
  icon: /images/icons/gifts/sudba/prochest-znaki.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Обожествлённый может взглянуть на человека и получить общее представление о его прошлом и наиболее
    вероятном будущем. Он узнаёт краткое описание рода занятий, нынешних устремлений и одно предложение
    о наиболее вероятной участи в ближайший год, а также предельное число хит-дайсов или уровень персонажа.
- name: Разбить Оковы
  slug: razbit-okovy
  tier: lesser
  icon: /images/icons/gifts/sudba/razbit-okovy.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: сцена'
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца сцены. Все союзные существа в пределах видимости освобождаются от любых
    эффектов, воздействующих на разум, и магических проклятий. Если приложить Усилие до конца дня, эти
    подопечные до конца сцены становятся невосприимчивы к одному ментальному эффекту или влияющему на
    разум дару по выбору Обожествлённого.
- name: Разрушитель Имени
  slug: razrushitel-imeni
  tier: lesser
  icon: /images/icons/gifts/sudba/razrushitel-imeni.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены и выберите целью видимого человека, чтобы лишить его судьбы. Знавшие
    жертву больше не узнают её и не поверят, что она — тот, кем себя называет, даже если косвенные свидетельства
    неопровержимы. Жертва может попытаться начать новую жизнь, но вернуть прежнюю не сможет, пока Обожествлённый
    её не отпустит. Достойные противники могут пройти спасбросок Духа, чтобы противостоять этой силе.
- name: Стойкость Бытия
  slug: stoykost-bytiya
  tier: lesser
  icon: /images/icons/gifts/sudba/stoykost-bytiya.webp
  badges:
  - type: act
    text: Постоянно
  - type: act
    text: Мгновенно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: день'
  body: Обожествлённый невосприимчив к любому эффекту, который убил бы его напрямую, не нанося положенного
    урона. Так, заклинания смерти, смертельные яды, окаменение и прочие эффекты мгновенной смерти его
    не касаются. Несмертельные побочные последствия могут действовать как обычно. Мгновенным действием
    он может приложить Усилие до конца дня, чтобы свести на нет удар или магию, которые убили бы его иным
    образом, но сделать это можно лишь раз в день.
- name: Переписать Судьбу
  slug: perepisat-sudbu
  tier: greater
  icon: /images/icons/gifts/sudba/perepisat-sudbu.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Определённому существу в пределах видимости можно в подробностях
    предписать судьбу на срок до одной недели на уровень Обожествлённого либо назначить одно предначертанное
    событие или бессрочное состояние на некий момент в будущем. Дико невероятные события и решения предписать
    нельзя, но маловероятные можно сделать несомненными — включая безвременную кончину. Если цель — достойный
    противник или если описанная судьба требует для своего исполнения участия достойных противников, все
    причастные получают спасбросок Духа, чтобы отвергнуть свою роль в навязанной судьбе.
- name: Раствориться в Полотне
  slug: rastvoritsya-v-polotne
  tier: greater
  icon: /images/icons/gifts/sudba/rastvoritsya-v-polotne.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: 'Приложите Усилие до конца дня. Обожествлённый растворяется в текущей обстановке, становясь безликим,
    никем не замечаемым членом какой-нибудь присутствующей группы из двух и более человек: стражи, глазеющих
    зевак, легионов нежити или даже собственного отряда союзников. Его нельзя выбрать целью, на него не
    действуют никакие атаки и силы, а о его изначальном присутствии забывают, но он разделяет судьбу группы.
    Если вся группа будет убита, он появится рядом с одним из трупов с 1 оставшимся хитом. Обожествлённый
    может оставаться погружённым в группу до суток и выйдет из неё где-нибудь рядом с кем-то из её членов.
    Погружённый в группу, он не может действовать, но имеет общее представление о том, чем группа занята
    и где находятся её члены. Достойные противники могут пройти спасбросок Духа, чтобы не забыть о присутствии
    Обожествлённого, но чтобы действительно вернуть его в своё присутствие, требуется подходящее чудо
    рассеивания или истребление всей группы.'
- name: Узурпировать Судьбу
  slug: uzurpirovat-sudbu
  tier: greater
  icon: /images/icons/gifts/sudba/uzurpirovat-sudbu.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня и выберите меньшего противника или свежий человеческий труп в пределах
    видимости. Цель исчезает, а Обожествлённый принимает её личность и природную судьбу. Он может пользоваться
    как атрибутами выбранного существа, так и своими, но сохраняет собственные хиты и уровень персонажа.
    Он обладает неуязвимой защитой от любых магических попыток раскрыть его подлог, кроме проверок Слов
    Судьбы или Взора, которые разрешаются обычным противостоянием. Он автоматически знает всё, что знала
    цель, хотя, возможно, ему придётся сосредоточиться на конкретных темах, чтобы выудить это знание.
    Подлог заканчивается, когда Обожествлённый его прекращает или как только он приложит Усилие по любой
    причине. По окончании изначальная цель, если была жива, появляется там, где находилась в момент первого
    применения дара, ничего не зная о случившемся с тех пор. Трупы не возвращаются никогда. Поглотив имя,
    Обожествлённый может по желанию вновь принимать эту личину, прикладывая Усилие до конца дня, но не
    может дважды за одни сутки принять одно и то же имя. При повторном принятии имени изначальный носитель,
    если ещё жив, снова исчезает и снова возвращается по окончании действия силы.
