name: Щит
kind: canon
colors:
  glow: '#a6cbe6'
  deep: '#1a2836'
  dark: '#0a1017'
icon: /images/icons/words/schit.webp
description: |-
  Слово Щита по природе своей прежде всего защитное, хотя может обрушить Божественный Гнев, как и любое другое Слово. Его обереги отражают и физический, и неосязаемый урон, но такие неуязвимые защиты редко предназначены для охраны самого Обожествлённого.

  Обожествлённые Щита имеют естественный класс защиты 3. Раз за сцену они могут Мгновенным действием свести на нет ранение или враждебный эффект, направленный на союзника, но не могут применить эту силу к себе. Они могут применять дары и чудеса Щита, чтобы помочь молящимся смертным просителям, которые связались с ними силами Обожествления, так, будто находятся рядом со своим последователем.

  Слово Щита — Слово самоотверженности, посвящённое защите других. Божественность такого рода куда охотнее принимается большинством человеческих культур.
gifts:
- name: Вечная Бдительность
  slug: vechnaya-bditelnost
  tier: lesser
  icon: /images/icons/gifts/schit/vechnaya-bditelnost.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Обожествлённый не ест, не пьёт, не спит и не дышит, и его невозможно застать врасплох или поймать
    в засаду. Если кто-то пытается устроить ему засаду или напасть внезапно, Обожествлённый немедленно
    получает бесплатный дополнительный раунд действия прежде, чем нападающий успеет что-либо сделать.
- name: Готовность к Удару
  slug: gotovnost-k-udaru
  tier: lesser
  icon: /images/icons/gifts/schit/gotovnost-k-udaru.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Пока Обожествлённый твёрдо стоит обеими ногами на земле или иной прочной опоре,
    никакие обычные или магические средства не могут сдвинуть его с места, пока он не будет сведён к нулю
    хитов. Он также может перебрасывать любые проваленные спасброски Стойкости.
- name: Защитник Городов
  slug: zaschitnik-gorodov
  tier: lesser
  icon: /images/icons/gifts/schit/zaschitnik-gorodov.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены и сведите на нет вредоносный дар или сверхъестественную силу,
    нацеленную на окружающую область, которую занимает Обожествлённый, вплоть до размеров города, — как
    если бы эта сила была защитно рассеяна. Этот дар может рассеивать только те силы, что причиняют прямой
    вред существам в затронутой зоне; он не изгоняет безвредные эффекты по области и эффекты, нацеленные
    только на отдельных жертв. Урон по хитам всегда считается вредом, как и прочие отрицательные и мешающие
    эффекты на цели.
- name: Оградить Стены
  slug: ogradit-steny
  tier: lesser
  icon: /images/icons/gifts/schit/ogradit-steny.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня и запретите одной или нескольким целям входить в строение, которое
    занимает Обожествлённый, либо в обжитую область до 100 футов в поперечнике на уровень персонажа. Запретить
    можно как отдельных лиц, так и целые виды существ, но дар не различает побуждений и мыслей. Дар пробивается
    сквозь смертные иллюзии и личины, чтобы преградить путь существу, но не сквозь чудеса Обмана. Меньшие
    противники физически не способны войти в огороженную область и мгновенно вышвыриваются из неё, а достойные
    противники могут пройти спасбросок Стойкости, чтобы прорваться внутрь. Но даже при успехе им придётся
    приложить Усилие до конца дня, чтобы остаться там на сцену. Этот оберег держится, пока Обожествлённый
    его не снимет или не покинет область.
- name: Освящённый Щит
  slug: osvyaschennyy-schit
  tier: lesser
  icon: /images/icons/gifts/schit/osvyaschennyy-schit.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Обожествлённый объявляет себя защитником не более чем дюжины
    союзников, находящихся поблизости. Любой урон, нанесённый этим союзникам в этой области, Обожествлённый
    может Мгновенным действием перевести на себя, а любые проваленные ими спасброски может перебросить
    сам. При успехе изначальная цель не затрагивается, при провале эффект применяется к ней. Это покровительство
    длится сцену.
- name: Священный Эгид
  slug: svyaschennyy-egid
  tier: lesser
  icon: /images/icons/gifts/schit/svyaschennyy-egid.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: день'
  body: Когда последователь или союзник становится целью враждебной сверхъестественной силы, приложите
    Усилие до конца дня. До конца сцены именно эта сверхъестественная сила не может подействовать ни на
    одного вашего союзника поблизости от вас, хотя на вас самих она по-прежнему действует как обычно.
    Обычные в остальном атаки, лишь усиленные сверхъестественным образом (например, магическим мечом),
    не годятся в качестве предмета этой силы.
- name: Изменчивые Обереги
  slug: izmenchivye-oberegi
  tier: greater
  icon: /images/icons/gifts/schit/izmenchivye-oberegi.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  - type: eff
    text: 'Усилие: день'
  body: Чтобы купить этот дар, нужен малый дар «Оградить Стены». Приложите Усилие. Обожествлённый называет
    определённую стихийную энергию или опасность окружения — огонь, лёд, давящую толщу, лавовое поле,
    обрушивающееся здание, жёсткий вакуум или иной определённый род опасности. Он и его спутники получают
    к ней неуязвимый иммунитет. Обычные атаки и сверхъестественные силы для выбора не годятся, и одновременно
    можно выбрать лишь один вид опасности. Приложите Усилие до конца дня, чтобы дать месту меньшую, но
    постоянную защиту, равносильную Мирскому Оберегу первого уровня. Этот дар можно применять повторно,
    чтобы усилить новый Мирской Оберег.
- name: Несокрушимый Страж
  slug: nesokrushimyy-strazh
  tier: greater
  icon: /images/icons/gifts/schit/nesokrushimyy-strazh.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: день'
  body: Чтобы купить этот дар, нужен малый дар «Священный Эгид». Приложите Усилие до конца дня. В течение
    одного раунда на уровень персонажа ни один смертный союзник в пределах видимости не может быть сведён
    ниже 1 хита или хит-дайса и не может пострадать ни от какого эффекта, допускающего спасбросок. Сам
    Обожествлённый этим эффектом не защищён. Как вариант, этим даром можно защитить одного божественного
    союзника.
- name: Отведённое Бедствие
  slug: otvedennoe-bedstvie
  tier: greater
  icon: /images/icons/gifts/schit/otvedennoe-bedstvie.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Чтобы воспользоваться этим даром, Обожествлённому нужен культ. Приложите Усилие до конца дня и
    назовите определённое губительное событие, которое может постичь ваших почитателей. Это не может быть
    простое поражение в битве или неудача в деле, но может быть вероятной угрозой — вроде применения врагом
    определённой разрушительной силы, сверхъестественного катаклизма или стихийного бедствия. Это событие
    не произойдёт, если есть хоть какой-то физический способ его избежать. Одновременно можно отвести
    лишь одно бедствие.
