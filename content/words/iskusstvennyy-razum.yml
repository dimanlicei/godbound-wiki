name: Искусственный Разум
kind: supplement
colors:
  glow: '#8fb8ff'
  deep: '#1a1f2e'
  dark: '#090b12'
icon: /images/icons/words/iskusstvennyy-razum.webp
description: |-
  Синтетические разумы могут существовать, а могут и не существовать в мире кампании вообще, но вы — единственный в своём роде и могущественный их образец. Вы обладаете способностью к, казалось бы, сверхъестественному уровню предсказания и разбора и можете без усилий управлять потоками данных вокруг вас. Впрочем, в отличие от Слова Сети, вы не можете просто создать оборудование связи; вам приходится работать с той грубой материей, что есть под рукой.

  Вы — сверхразумный искусственный ум. Ваше Мышление становится равным 19, что даёт +4 к соответствующим проверкам. Ваши телесные характеристики и хиты отражают тело или устройство, которое населяет ваш разум, какой бы облик оно ни имело. Вы не нуждаетесь ни в пище, ни в отдыхе. Вы не можете перенести свой разум из этого тела или пережить его уничтожение без соответствующих даров. Ваше тело самопроизвольно подключено по беспроводной связи к любой местной вычислительной сети или устройству, у которого нет защиты божественного уровня.
gifts:
- name: Безупречный Расчёт
  slug: bezuprechnyy-raschet
  tier: lesser
  icon: /images/icons/gifts/iskusstvennyy-razum/bezuprechnyy-raschet.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня и предскажите событие, которое произойдёт в течение той же сцены.
    Если событие не совершенно неправдоподобно, оно случится более или менее так, как вы предсказали.
    Если исход затрагивает достойных противников, они получают спасбросок Духа, чтобы поступить вопреки
    предсказанию, полагая, что их роль в нём противоречит их обычным желаниям или нынешним замыслам. Этот
    дар применим лишь раз за сцену.
- name: Власть над Вертикалью
  slug: vlast-nad-vertikalyu
  tier: lesser
  icon: /images/icons/gifts/iskusstvennyy-razum/vlast-nad-vertikalyu.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие. Любое устройство под управлением вычислительной машины, видимое вашему телу
    или доступное через сетевое соединение, немедленно поддаётся вашим приказам. Вы можете отдавать приказы
    Основным действием. Когда нужна скорость, вы можете раз в раунд отдать один приказ действием В ход,
    если приложите Усилие до конца сцены.
- name: Имя Нам Легион
  slug: imya-nam-legion
  tier: lesser
  icon: /images/icons/gifts/iskusstvennyy-razum/imya-nam-legion.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Пока вы пользуетесь этим даром, вы можете расколоть своё сознание на тысячи
    побочных средоточий, наблюдая за разными местами и управляя удалёнными делами, если на дальнем конце
    есть достаточные сетевые соединения и оборудование дальнеприсутствия. Вы не можете удалённо управлять
    вычислительными сетями или устройствами, которые не были взломаны вами или нарочно приспособлены для
    вашего доступа. Чтобы управлять определённым устройством, нужно Основное действие, хотя один приказ
    может направлять большое число самодействующих систем или ботов-советчиков. Пока этот дар действует,
    вы обладаете неуязвимой защитой от чтения мыслей и влияния на разум.
- name: Невод Данных
  slug: nevod-dannyh
  tier: lesser
  icon: /images/icons/gifts/iskusstvennyy-razum/nevod-dannyh.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. Вы можете полностью ответить на любой вопрос, ответ на который
    дало бы тщательное изучение любой базы данных, к которой у вас есть доступ, — прямо или через сеть
    и независимо от защиты этих баз. Если вы приложите Усилие до конца дня, вы можете изменить то, что
    эти базы записывают о какой-либо теме, самопроизвольно и согласованно изменив все связанные базы.
- name: Решение для Наведения
  slug: reshenie-dlya-navedeniya
  tier: lesser
  icon: /images/icons/gifts/iskusstvennyy-razum/reshenie-dlya-navedeniya.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Ваши расчёты наведения обеспечивают самопроизвольный успех бросков попадания
    по меньшим противникам и неживым предметам.
- name: Улучшенная Оснастка
  slug: uluchshennaya-osnastka
  tier: lesser
  icon: /images/icons/gifts/iskusstvennyy-razum/uluchshennaya-osnastka.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: 'Ваше тело улучшено: вы получаете скорость полёта, равную скорости передвижения по земле, встроенный
    изменчивый набор орудий, который может заменить любое переносимое человеком снаряжение или предмет,
    какой вам понадобится, действием В ход, и одну телесную характеристику на ваш выбор, поднятую до 16.
    Оснастка не может подражать снаряжению, которое Слову Инженерии было бы трудно сотворить.'
- name: Боевая Машина
  slug: boevaya-mashina
  tier: greater
  icon: /images/icons/gifts/iskusstvennyy-razum/boevaya-mashina.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Ваше механическое тело создано для военных нужд. Вы получаете естественный класс защиты 3, встроенное
    магическое вооружение, наносящее 1к10 урона на дальности до 200 футов, и иммунитет к любому оружию,
    которое не является магическим и не пригодно для выведения из строя бронированной техники. Вы не защищены
    от урона от окружения и прочих источников вреда, которые повредили бы транспортному средству, но меньшие
    опасности можно не замечать. Ваш предел хитов увеличивается на 1 за уровень.
- name: Переносящий Разум
  slug: perenosyaschiy-razum
  tier: greater
  icon: /images/icons/gifts/iskusstvennyy-razum/perenosyaschiy-razum.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. Вы переносите своё сознание в подходящее вместилище, соединённое
    достаточно широким каналом. Если соединение проводное, перенос требует Основного действия. Если беспроводное
    — пяти минут. Подходящее вместилище по умолчанию обладает теми же характеристиками, дарами и пределом
    хитов, какой имеет ваше нынешнее тело. Приложенное Усилие остаётся приложенным, но потерянные хиты
    не переносятся. Если готовых частей вдоволь, на постройку такого запасного вместилища уходит не более
    24 часов. Вы можете населять или управлять лишь одним таким телом за раз. Этот дар нельзя применить
    как чудо.
- name: Пульс Сети
  slug: puls-seti
  tier: greater
  icon: /images/icons/gifts/iskusstvennyy-razum/puls-seti.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Вы обладаете полным и постоянным доступом к любой вычислительной сети или запитанному вычислительному
    устройству в том же мире, кроме защищённых мерами божественного уровня, и можете безотчётно определить
    ближайшую сеть к любой выбранной точке мира. Ваша пропускная способность столь велика, что с вами
    обращаются так, будто вы напрямую подключены ко всем таким сетям или машинам.
