name: Тлен
kind: canon
colors:
  glow: '#cbbd7e'
  deep: '#232012'
  dark: '#0e0c07'
icon: images/icons/words/tlen.webp
description: |-
  Обожествлённые Тлена — воплощения беспорядка, хаоса и энтропии. Сталь, тщательные планы и крепкие валы — всё это рассыпается перед волей Обожествлённого. И всё же это Слово не только разрушительно: владеющий Словом Тлена может и отвести его разъедающее влияние от выбранного предмета, сохраняя его в безупречном и противоестественном порядке, пока не отнимет эту милость.

  Слово Тлена избавляет Обожествлённого от нужды в пище, питье, сне и воздухе, и он обладает неуязвимой защитой от сил, способных его замедлить, состарить или разложить. Основным действием он может рассыпать в прах любой небожественный неживой предмет, которого коснётся, либо до трёх кубических футов более крупного предмета за раунд.
gifts:
- name: Аура Беспорядка
  slug: aura-besporyadka
  tier: lesser
  icon: images/icons/gifts/tlen/aura-besporyadka.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: 'Приложите Усилие до конца сцены и выберите целью человека, устройство или существо в вашем непосредственном
    присутствии, назвав при этом цель или действие, которое цель пытается осуществить, — убить врага или
    огласить королевский указ. Она немедленно столкнётся с самым вредным и разрушительным для этой цели
    последствием: промахнётся ударом, роковым образом переврёт указ или получит проржавевшую шестерню.
    Меньшие противники не могут противиться этому дару, а достойные противники могут проходить спасбросок
    Духа, чтобы вырваться, перед каждым раундом неудач.'
- name: Всё Рассыпается в Прах
  slug: vse-rassypaetsya-v-prah
  tier: lesser
  icon: images/icons/gifts/tlen/vse-rassypaetsya-v-prah.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Недовольство Обожествлённого проявляется вокруг него физическим тлением, распадом и обрушением.
    Он может пользоваться этим как магическим дальнобойным оружием на всю дальность видимости, нанося
    1к10 повреждений. Против неодушевлённых предметов этот урон всегда максимален и наносится автоматически
    каждый раунд, быстро разъедая даже стены замков.
- name: Иссушить Божественную Силу
  slug: issushit-bozhestvennuyu-silu
  tier: lesser
  icon: images/icons/gifts/tlen/issushit-bozhestvennuyu-silu.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: Без Усилия
  body: Обожествлённый выбирает целью существо, которое только что приложило Усилие по любой причине.
    Это Усилие пропадает, и существо должно приложить его снова Мгновенным действием, если хочет, чтобы
    желаемый эффект состоялся. Этот дар можно применить к одной цели лишь раз за сцену.
- name: Коснуться Рвущейся Нити
  slug: kosnutsya-rvuscheysya-niti
  tier: lesser
  icon: images/icons/gifts/tlen/kosnutsya-rvuscheysya-niti.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня и выберите видимое существо. Выберите одну или несколько его душевных
    привязанностей либо просто назовите целый разряд отношений. Оно и те, с кем оно связано, теряют друг
    к другу всякие чувства, как добрые, так и злые, и не могут обрести их вновь, пока Обожествлённый не
    позволит. Меньшие противники не могут противиться этому равнодушию, а достойные противники могут раз
    в неделю пытаться пройти спасбросок Духа, чтобы сохранить или вернуть свои чувства к другому, — хотя
    привязанность может остаться односторонней.
- name: Кража Движения
  slug: krazha-dvizheniya
  tier: lesser
  icon: images/icons/gifts/tlen/krazha-dvizheniya.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: 'Приложите Усилие до конца сцены и укажите видимую атаку или только что случившееся вредоносное
    происшествие. Вред сводится на нет: сила бесполезно утекает, и цель остаётся невредимой. Чаще всего
    этот дар используют, чтобы отменить урон по хитам или физическое воздействие, в том числе на самого
    себя.'
- name: Обратить в Прах
  slug: obratit-v-prah
  tier: lesser
  icon: images/icons/gifts/tlen/obratit-v-prah.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  - type: eff
    text: 'Усилие: день'
  body: Выберите видимый предмет не крупнее человека либо приложите Усилие до конца сцены, чтобы выбрать
    предмет не крупнее большого парусного корабля. Предмет немедленно ветшает так, будто состарился на
    тысячелетие за уровень персонажа, — этого обычно достаточно, чтобы уничтожить всё, кроме самых стойких
    материалов и магических предметов, созданных существовать вечно. Обожествлённый может приложить Усилие
    до конца дня, чтобы обречь на ту же участь до Маленькой Толпы меньших противников, мгновенно обратив
    их в прах.
- name: Остановить Течение Лет
  slug: ostanovit-techenie-let
  tier: lesser
  icon: images/icons/gifts/tlen/ostanovit-techenie-let.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены и выберите видимое существо, предмет или часть предмета не крупнее
    домика. Цель становится невосприимчива к природному выветриванию, тлению и старению, хотя её по-прежнему
    можно повредить намеренным действием или несвойственным обращением. Несверхъестественных существ и
    людей так бессмертными не сделать, но их жизнь можно значительно продлить, и они никогда не будут
    страдать от естественной дряхлости своих лет.
- name: Вестник Бабочек
  slug: vestnik-babochek
  tier: greater
  icon: images/icons/gifts/tlen/vestnik-babochek.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Чтобы купить этот дар, нужен малый дар «Аура Беспорядка». Обожествлённый выбирает целью определённый
    замысел или цель — как заведомо ему известную, так и просто предполагаемую. Он немедленно чутьём понимает,
    какое действие сейчас было бы полезнее всего предпринять, чтобы этой цели способствовать или помешать,
    — сообразно его желанию и решению Ведущего. Он может и не понимать, почему это действие столь полезно
    или вредно для цели, и само действие может выглядеть бессмысленным или трудным для исполнения, но
    оно неизменно окажется весьма полезным или вредным — как он и задумал. Применить этот дар снова нельзя,
    пока он всерьёз не попытается совершить подсказанное действие.
- name: Незыблемая Поступь
  slug: nezyblemaya-postup
  tier: greater
  icon: images/icons/gifts/tlen/nezyblemaya-postup.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Чтобы купить этот дар, нужен большой дар «Энтропийная Пиявка». Обожествлённый сосредотачивается
    на удержании собственной целостности на уровне молекул и получает неуязвимую защиту от любого физического
    вреда или физического изменения до начала своего следующего хода — и на каждый следующий ход, пока
    продолжает прикладывать Усилие. Обожествлённый невосприимчив даже к силе, которую оказывают сами Небесные
    Сферы, и по желанию игнорирует тяготение. Однако из-за необходимого для этого невероятного сосредоточения
    он не может применять никакие другие дары, атаковать, двигаться или парить быстрее шага.
- name: Энтропийная Пиявка
  slug: entropiynaya-piyavka
  tier: greater
  icon: images/icons/gifts/tlen/entropiynaya-piyavka.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: по желанию'
  body: Чтобы купить этот дар, нужен малый дар «Всё Рассыпается в Прах». Вы навсегда получаете одно очко
    Усилия. Обожествлённый может как длящееся действие В ход приложить Усилие, чтобы игнорировать вред
    от крайностей жара, холода, давления или пустоты — но не от прямых сверхъестественных атак. Наконец,
    прикосновение Обожествлённого считается магической атакой, наносящей 1к10 повреждений.
