name: Обращение
kind: homebrew
colors:
  glow: '#c3e08f'
  deep: '#1f2a16'
  dark: '#0b1108'
icon: /images/icons/words/obraschenie.webp
description: |-
  Слово Обращения повелевает всеми видами физических трансформаций, как самого обладателя, так и тех, на кого направлена его сила. Обращение — очень физическое, осязаемое Слово, и оно не изменяет сознание, выходя за рамки необходимого для использования новых конечностей или имитации чужого облика. Оно формирует плоть по желанию владельца. При обращении в другую форму немагическая одежда и личные предметы либо исчезают, либо трансмутируют в соответствие с новой формой. Исчезнувшие предметы появляются, когда обернувшийся возвращается в форму, в которой их можно носить или использовать, а изменённые предметы принимают свой первоначальный вид. Обращённые предметы, сброшенные Обожествлённым, остаются в своей новой форме, пока он не изменит обличие.

  Обожествлённый, связанный со словом Обращения, неуязвим к любым нежелательным эффектам, изменяющим его форму, не считая простых повреждений, но включая увечья, татуировки, клейма или калечащие операции. Один раз в день они могут затянуть свои собственные раны, исцеляя количество хит-пойнтов, равные их уровню, мгновенным действием.
gifts:
- name: Десять Тысяч Шкур
  slug: desyat-tysyach-shkur
  tier: lesser
  icon: /images/icons/gifts/obraschenie/desyat-tysyach-shkur.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие. Вы можете превратиться в любое существо размером не меньше мыши и не больше
    лося. В этом облике вы сохраняете свои атрибуты, хит-пойнты и боевые бонусы, но можете использовать
    те типы движения, которые естественны для вашей новой формы. Вы можете общаться со зверями своего
    вида, когда носите их форму. Если вы приложили усилие до конца сцены, вы можете использовать этот
    дар На Ходу.
- name: Зализать Раны
  slug: zalizat-rany
  tier: lesser
  icon: /images/icons/gifts/obraschenie/zalizat-rany.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Вы сливаете воедино разорванную плоть и сломанные кости своей формы, на короткое время становясь
    сгустком жизненной силы. Приложите Усилие до конца дня для исцеления 1d6 хит-пойнтов за три уровня,
    округленных вверх. До начала следующего хода вы невосприимчивы к физическому оружию и повреждениям
    от объектов.
- name: Личина Честного Смертного
  slug: lichina-chestnogo-smertnogo
  tier: lesser
  icon: /images/icons/gifts/obraschenie/lichina-chestnogo-smertnogo.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие. Вы можете принять облик любого гуманоида, включая точное копирование наблюдаемого
    вами человека. Голос и физическое поведение дублируются идеально, но вы не получаете никаких специальных
    знаний о том, как цель ведёт себя или говорит. Этому телу можно придать любое состояние, но ваши собственные
    статистические данные остаются неизменными. Если вы приложите усилие до конца сцены, вы можете использовать
    этот дар На Ходу.
- name: Навык Заимствованной Формы
  slug: navyk-zaimstvovannoy-formy
  tier: lesser
  icon: /images/icons/gifts/obraschenie/navyk-zaimstvovannoy-formy.webp
  badges:
  - type: act
    text: Мгновенно
  body: Приняв облик существа, вы можете перенять и его особые способности. Хотя вы не можете имитировать
    связанные слова, божественные дары, теургию или другое изученное колдовство, вы можете получить каменный
    взгляд Медузы, пламенное дыхание дракона или какой-либо другой сверхъестественный дар. За каждый принятый
    дар нужно приложить усилие; когда вы расстаетесь с формой, эти усилия возвращается в конце сцены.
- name: Плазматическая Форма
  slug: plazmaticheskaya-forma
  tier: lesser
  icon: /images/icons/gifts/obraschenie/plazmaticheskaya-forma.webp
  badges:
  - type: act
    text: Действие
  body: Приложите Усилие. Вы можете размягчать и разжижать свою форму, что позволяет проходить через любые
    барьеры, проницаемые для жидкости, и двигаться с обычной скоростью. Эта жидкая форма может сохранять
    человеческий облик, но она слишком мягкая, чтобы манипулировать предметами, атаковать противника или
    использовать агрессивные способности, хотя вы невосприимчивы к немагическому оружию.
- name: Хватающие Когти
  slug: hvatayuschie-kogti
  tier: lesser
  icon: /images/icons/gifts/obraschenie/hvatayuschie-kogti.webp
  badges:
  - type: act
    text: В свой ход
  body: Приложите Усилие. Вы можете проявлять когти или другое естественное оружие в любой форме, включая
    человеческое обличье. Они наносят 1d10 повреждений и считаются магическими. Вы также можете приложить
    дополнительное Усилие на создание яда, который убьет или обездвижит меньшего противника, и достойного
    противника, провалившего спасбросок Стойкости, причем яд применяется к каждой физической атаке, которую
    вы совершаете в этой сцене. Против толп меньших противников этот яд вместо эффекта наносит максимальный
    урон.
- name: Величие Изнутри
  slug: velichie-iznutri
  tier: greater
  icon: /images/icons/gifts/obraschenie/velichie-iznutri.webp
  badges:
  - type: act
    text: Постоянно
  body: Природные способности оборотня к трансформации усиливаются, позволяя ему принимать чрезвычайно
    крупные формы, такие как дракон, скромный дом или небольшой парусник. У смертного, обращенного в очень
    большую форму, размером не меньше слона, будет 3 хит-дайса, если его родные хит-дайсы еще не превышают
    этот показатель.
- name: Лепка Плоти и Кости
  slug: lepka-ploti-i-kosti
  tier: greater
  icon: /images/icons/gifts/obraschenie/lepka-ploti-i-kosti.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. Вы можете изменить физическую форму видимого объекта в любую форму,
    которую вы сами способны принять. Достойные противники могут сделать бросок на спасбросок Стойкости,
    чтобы противостоять этому изменению. Этот дар не может исцелить цель или восстановить изуродованные
    органы или конечности; повреждение сохранится и в новой форме. Это превращение постоянно, пока Обожествлённый
    не вернёт Усилие или оно не будет развеяно.
- name: Обманчивые Лики
  slug: obmanchivye-liki
  tier: greater
  icon: /images/icons/gifts/obraschenie/obmanchivye-liki.webp
  badges:
  - type: act
    text: Постоянно
  body: При подражании людям вы инстинктивно знаете их язык и нужные для сохранения фасада действия, даже
    если у вас не было возможности узнать правильные ответы или действия. Когда вы хотите что-то сделать,
    вы знаете, как это сделал бы оригинал. Достойные противники, за которых вы себя выдаете, могут сделать
    спасбросок духа, чтобы блокировать этот дар.
- name: Тело Холодной Стали
  slug: telo-holodnoy-stali
  tier: greater
  icon: /images/icons/gifts/obraschenie/telo-holodnoy-stali.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Вы можете превратиться в неодушевленный предмет размером не меньше
    ножа и не больше повозки. Этот предмет могут использовать без вреда для вас, но попытки сломать его
    или разобрать на части влияют на ваши хит-пойнты. Во время превращения вы осознаете окружающую обстановку
    и можете перемещать или иным образом одушевлять части предмета. Обратное превращение требует действия.
