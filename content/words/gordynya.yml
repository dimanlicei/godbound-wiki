name: Гордыня
kind: homebrew
colors:
  glow: '#ffd97a'
  deep: '#382c08'
  dark: '#151003'
icon: /images/icons/words/gordynya.webp
description: 'Слово Греха: Гордыня, грех великих. Лишь немногие способны по-настоящему быть запятнанными
  грехом Гордыни, многие из грешников лишь прикрываются им для своей защиты или же меняют его слишком
  быстро на другие. Но истинные короли, цари, владыки и командиры, что пропитались им и не отдались другим
  порокам, по-настоящему могут быть им прокляты. Принявший на себя грех Гордыни обязан иметь факт, связывающий
  его с тем или иным видом социальной или иной иерархической верхушки. Запятнавший себя грехом Гордыни
  может поднять любую из своих характеристик до 18, олицетворяя гордость за тот или иной атрибут. Помимо
  этого, несущий грех Гордыни никогда не теряет лица, будь то глупые шутки или суровые раны, он всегда
  будет выглядеть как достойный уважения субъект.'
gifts:
- name: Величайший из тиранов
  slug: velichayshiy-iz-tiranov
  tier: lesser
  icon: /images/icons/gifts/gordynya/velichayshiy-iz-tiranov.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложив усилие на день, вы начинаете проецировать в реальный мир величие вашей искажённой, но
    великой души. Все, кого вы считаете противником в радиусе 90 футов от вас, должны пройти спасбросок
    духа, дабы не сбежать в панике, недостойные противники бегут вне зависимости от результата спасброска.
- name: Владения Нечистого
  slug: vladeniya-nechistogo
  tier: lesser
  icon: /images/icons/gifts/gordynya/vladeniya-nechistogo.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Вы можете объявить башню, бастион, деревню или любой другой участок территории не более 1 квадратной
    мили за уровень персонажа своим доменом. Сделав это, вы мгновенно начинаете получать информацию, что
    могут знать бесы или другие слуги ада, проживающие в этом месте. Помимо этого, нечестивая мощь вашего
    домена создаёт сложности врагам, увеличивая им сложность и масштаб чудес, что они хотят применить
    по отношению к вашей территории, на 1.
- name: Вызов достойного
  slug: vyzov-dostoynogo
  tier: lesser
  icon: /images/icons/gifts/gordynya/vyzov-dostoynogo.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: сцена'
  body: Приложив усилие на сцену, вы бросаете вызов избранному достойному противнику; при его согласии
    обе стороны восстанавливают все свои усилия, что были потрачены на сцену, а так же лишаются возможности
    атаковать кого-либо помимо другого дуэлянта. При этом союзники с обоих сторон не способны атаковать
    дуэлянтов или исцелять их. При отказе противник, отказавшийся в дуэли, оглашается недостойным, и все
    его спасброски получают помеху в размере -4 до смерти противника или пока дуэль не будет принята.
- name: Гнев царя
  slug: gnev-tsarya
  tier: lesser
  icon: /images/icons/gifts/gordynya/gnev-tsarya.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: день'
  body: Приложив усилие на день, отмеченный гордыней становится в стойку, каждая атака, что нанесла ему
    урон, должна быть отвечена. Вы попадаете автоматически по атаковавшему вас противнику за каждую атаку,
    что нанесла вам урон.
- name: Лезвие души
  slug: lezvie-dushi
  tier: lesser
  icon: /images/icons/gifts/gordynya/lezvie-dushi.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Выберите одну форму оружия, что отображает душу персонажа. Вы можете призвать это оружие усилием
    воли и оно наносит 1d10 душам врагов, имея при этом радиус в 50 футов. Это оружие невозможно разрушить
    или забрать у обожествлённого, покуда он жив.
- name: Лик владыки
  slug: lik-vladyki
  tier: lesser
  icon: /images/icons/gifts/gordynya/lik-vladyki.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Нечестивая власть вашей души выходит за рамки обычного внешнего вида, отныне ваш дух заставляет
    недостойных противников видеть вас как их истинного владыку. Недостойные противники более не могут
    напасть на вас без особо веской причины, как например нанесения урона или явные козни против них.
    Ваша харизма так же вырастает до 19.
- name: Душа Короля
  slug: dusha-korolya
  tier: greater
  icon: /images/icons/gifts/gordynya/dusha-korolya.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: Без Усилия
  body: Необходим Лик владыки. Мощь вашей души достигает своего апогея. Ваша броня становится 3, и вы
    больше не можете получать преимущества от брони или щитов для увеличения рейтинга брони, а вместо
    бонуса от ловкости к броне вы можете получать его за счёт вашего показателя харизмы. Вместе с этим
    вы становитесь неуязвимы для атак и воздействий на ваш разум и душу.
- name: Корона Великого
  slug: korona-velikogo
  tier: greater
  icon: /images/icons/gifts/gordynya/korona-velikogo.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: 'Усилие: сцена'
  body: Корона не делает великими, но именно истинно великие делают корону великой. Отныне ни хладное
    дыхание несотворённых, ни пламя анти-жрецов не может потушить искру вашей мощи, ведь именно вы делаете
    божественность великой, а не она вас. Так же, приложив усилие на сцену, вы можете рассеять атакующие
    рассеивания, что были применены по отношению к вам.
- name: Недостижимый
  slug: nedostizhimyy
  tier: greater
  icon: /images/icons/gifts/gordynya/nedostizhimyy.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: день'
  body: Приложив усилие на день, сила вашей власти расширяется вплоть до нападок ваших врагов. До начала
    вашего следующего хода все атаки и силы, направленные на вас или на то, чтобы вам навредить, промахиваются
    или вовсе не задевают вас. Хотя массовые атаки всё ещё могут задеть ваших союзников.
