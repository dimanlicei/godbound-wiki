name: Тоннели (Анафема)
kind: anathema
colors:
  glow: '#c7a97e'
  deep: '#221a12'
  dark: '#0d0a07'
icon: /images/icons/words/tonneli-anafema.webp
description: |-
  Слово Тоннелей уже Слова Земли и сосредоточено на подземных понятиях: пещерах, тьме, зарытых сокровищах и незрячей жизни. Оно может лепить и придавать форму необработанному камню почти как Слово Земли, но лишено крепости скалы и силы творить великие каменные громады. Взамен оно обретает власть над тьмой внизу, над сокрытыми самоцветами земли и над удушающим ужасом безвоздушной, беспросветной гробницы. Когда оно убивает, оно убивает зловонными парами и смертоносным жаром трещин, что разверзаются на дне мира.

  Связанные с глубинными местами земли чутьём воспринимают своё окружение на всю дальность видимости, зная обо всех предметах как бы прямым пространственным сознанием. Это чувство не различает цветов, но достаточно тонко, чтобы ощутить узор чернил на бумаге. Они не нуждаются в воздухе, пище и воде и обладают неуязвимой защитой от вреда камнем, землёй и подземными опасностями окружения. Им сами собой повинуются любые обычные пещерные твари.

  Божества Тоннелей часто глубоко почитаемы нечеловеческими народами, но человеческие культуры обычно отвергают их как непостижимых и чуждых — за редкими исключениями.
gifts:
- name: Беспредельная Тьма
  slug: bespredelnaya-tma
  tier: lesser
  icon: /images/icons/gifts/tonneli-anafema/bespredelnaya-tma.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены, чтобы до конца сцены полностью погасить все небожественные источники
    света в пределах ста футов на уровень персонажа, создав зону совершенной черноты. Огонь всё ещё горит,
    но не даёт ни капли света, и никакое новое освещение создать нельзя, пока дар действует. Этот радиус
    тьмы движется вместе с вами. Достойные противники могут пройти спасбросок Духа, чтобы нарочно создать
    свет, но видеть созданный ими свет будут только они сами. Ослеплённые существа обычно не могут применять
    дальние атаки и бросают атаки ближнего боя дважды, беря худший результат.
- name: Благословение Безглазых
  slug: blagoslovenie-bezglazyh
  tier: lesser
  icon: /images/icons/gifts/tonneli-anafema/blagoslovenie-bezglazyh.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: по желанию'
  body: Вы обладаете неуязвимой защитой от жара и едких веществ, даже если они не связаны с подземными
    опасностями. Действием В ход вы можете приложить Усилие, чтобы распространить своё незрячее чувство
    и независимость от воздуха и пищи на своих спутников на всё время, пока Усилие приложено.
- name: Ваятель Пещер
  slug: vayatel-pescher
  tier: lesser
  icon: /images/icons/gifts/tonneli-anafema/vayatel-pescher.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Вы переделываете до куба в 20 футов необработанной земли или камня на уровень персонажа, разрушая
    его или придавая ему форму по своему желанию. Перемена происходит недостаточно быстро, чтобы служить
    ловушкой для подвижных врагов, но если сделать из неё преграду, у той будут хиты, вдвое превышающие
    ваш уровень, за каждый фут толщины, и повредить её смогут лишь существа с подходящими орудиями, способностями
    или природной силой, достаточной, чтобы её проломить.
- name: Прорывающий Недра
  slug: proryvayuschiy-nedra
  tier: lesser
  icon: /images/icons/gifts/tonneli-anafema/proryvayuschiy-nedra.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Вы можете проходить сквозь необработанный камень или землю, как сквозь пустоту. При желании вы
    оставляете за собой самоподдерживающийся тоннель чуть шире вашего роста; Мгновенным действием вы можете
    снять свою поддержку с любого созданного вами тоннеля и дать природе его обрушить.
- name: Сокровища Земли
  slug: sokrovischa-zemli
  tier: lesser
  icon: /images/icons/gifts/tonneli-anafema/sokrovischa-zemli.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие, чтобы чутьём ощутить местоположение любых металлов, самоцветов, воды и иных
    веществ под землёй в радиусе 100 футов на уровень персонажа. Каждый день вы можете сотворить этого
    добра на столько очков Богатства, сколько у вас уровней персонажа. Вода и прочие недрагоценные вещества
    ограничены кубом в десять футов на уровень в день.
- name: Удушающий Ужас
  slug: udushayuschiy-uzhas
  tier: lesser
  icon: /images/icons/gifts/tonneli-anafema/udushayuschiy-uzhas.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены и выберите целью одно видимое существо или до Большой Толпы меньших
    противников. Цели должны пройти спасбросок Духа, иначе они слепнут и их охватывает жуткое ощущение
    удушающей ловушки. Затронутые существа не могут совершать никаких действий и могут в конце каждого
    своего раунда проходить спасбросок Духа, чтобы прервать эффект. Меньшие противники автоматически получают
    эмоциональный урон в хитах, равный вашему уровню персонажа, независимо от спасброска; сведённые к
    нулю хитов, они падают в беспомощной панике до конца сцены, после чего восстанавливают 1 хит.
- name: Поглотить Город
  slug: poglotit-gorod
  tier: greater
  icon: /images/icons/gifts/tonneli-anafema/poglotit-gorod.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня и выберите целью видимое место радиусом до 30 футов на уровень персонажа.
    Земля раскалывается огромным провалом, поглощающим всё в этих пределах. Провал образуется сравнительно
    медленно, так что подвижные цели внутри могут спастись, если каждый раунд отдаляются от его середины
    хотя бы на 30 футов, а вот постройки и неподвижные цели рушатся вниз на погибель. Вы можете решить,
    сомкнётся ли провал после или останется ямой в сотню футов глубиной. Если применить дар в море, образовавшийся
    водоворот утянет вниз любой неподвижный корабль над ним.
- name: Стигийский Ветер
  slug: stigiyskiy-veter
  tier: greater
  icon: /images/icons/gifts/tonneli-anafema/stigiyskiy-veter.webp
  badges:
  - type: act
    text: Действие
  - type: smite
    text: Кара
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. Вы выдыхаете убийственное облако раскалённых подземных паров, нанося
    1к10 повреждений за уровень персонажа каждой выбранной цели в конусе длиной 30 футов на уровень и
    шириной 30 футов на уровень у дальнего края. Эти пары считаются огненным, ядовитым и едким уроном
    и уничтожают всё, что не крепче каменного здания.
- name: Хранитель Всего, Что Внизу
  slug: hranitel-vsego-chto-vnizu
  tier: greater
  icon: /images/icons/gifts/tonneli-anafema/hranitel-vsego-chto-vnizu.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня и укажите определённого человека, предмет или род предметов, который
    вы физически способны поднять. Если такой предмет находится где угодно ниже уровня земли в пределах
    полумили на уровень персонажа, вы извлекаете его из земли, как бы хорошо он ни охранялся и ни был
    спрятан. И наоборот, вы можете вместо этого перенести себя и своих спутников в любое выбранное подземное
    место в пределах полумили на уровень. Этот дар не может перенести вас или ваших союзников более чем
    на десять миль в общей сложности в час.
