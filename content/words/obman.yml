name: Обман
kind: canon
colors:
  glow: '#bfc3e0'
  deep: '#20202c'
  dark: '#0b0b12'
icon: images/icons/words/obman.webp
description: |-
  Искусства Обмана — это искусства скрытности, иллюзий и лжи. Искусный плут умеет распознавать подлоги не хуже, чем их творить, и его чудеса могут как навязывать обман чужим умам, так и разоблачать его. Дары скрытности и сокрытия обычно действуют, пока герой избегает внимания и ведёт себя неприметно. Насилие, громкие звуки и появление прямо перед стражей или иными бдительными людьми грозят потерей укрытости.

  Герои со Словом Обмана могут поднять Ловкость или Харизму до 16 — в зависимости от того, предпочитают ли они скрытность или ложь. Если значение уже равно 16 или больше, его можно установить равным 18.
gifts:
- name: Безукоризненное Изящество Лжеца
  slug: bezukoriznennoe-izyaschestvo-lzhetsa
  tier: lesser
  icon: images/icons/gifts/obman/bezukoriznennoe-izyaschestvo-lzhetsa.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Вашу ложь невозможно распознать как ложь ни магией, ни иными особыми способностями, включая способности
    Слова Обмана. Меньшие противники всегда поверят ей, если только она не совершенно неправдоподобна,
    не невыносима для их чувств или не вынудит их навредить себе.
- name: Знакомое Лицо
  slug: znakomoe-litso
  tier: lesser
  icon: images/icons/gifts/obman/znakomoe-litso.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие, чтобы слиться с населением или группой. Если они не высматривают чужаков нарочно,
    никто не станет вас беспокоить, пока вы сами того не захотите, и вы будете чутьём знать, как себя
    вести, говорить и вести дела, чтобы не привлекать внимания. Такое слияние работает даже с существами,
    ничем не похожими на людей.
- name: Игра Теней
  slug: igra-teney
  tier: lesser
  icon: images/icons/gifts/obman/igra-teney.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Вы можете создавать безупречные иллюзии звука, запаха и облика, хотя на ощупь
    они неосязаемы. Иллюзия появляется где угодно в пределах видимости, может достигать 30 футов в поперечнике
    и способна двигаться и выглядеть живой без дальнейшего внимания с вашей стороны, пока к ней приложено
    Усилие. Невидимость иллюзией не является.
- name: Идеальный Маскарад
  slug: idealnyy-maskarad
  tier: lesser
  icon: images/icons/gifts/obman/idealnyy-maskarad.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Мгновенно примите облик любого гуманоида, которого вы видели. Только достойные
    противники или те, кто хорошо знает этого человека лично, имеют хоть какой-то шанс пройти спасбросок
    Духа против обмана — если только вы не сделаете чего-то вопиюще не соответствующего образу. Вы чутьём
    копируете голос, одежду, повадки и ожидаемые привычки поведения.
- name: Немигающий Глаз Обманщика
  slug: nemigayuschiy-glaz-obmanschika
  tier: lesser
  icon: images/icons/gifts/obman/nemigayuschiy-glaz-obmanschika.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Вы всегда распознаёте, когда вам пытаются солгать или вас обмануть. Вы видите сквозь смертные
    иллюзии и личины. На других Обожествлённых со Словом Обмана этот дар не действует.
- name: Скрытый Шаг
  slug: skrytyy-shag
  tier: lesser
  icon: images/icons/gifts/obman/skrytyy-shag.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Меньшие противники не имеют никакой возможности вас обнаружить, пока вы держитесь
    вне их непосредственной близости и не привлекаете внимания. Достойные противники могут попытаться
    пройти спасбросок Духа, чтобы противостоять, когда вы рядом.
- name: Непроницаемый Обман
  slug: nepronitsaemyy-obman
  tier: greater
  icon: images/icons/gifts/obman/nepronitsaemyy-obman.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  body: Вы заявляете нечто, что сами считаете ложью, и прикладываете Усилие. Все, кто слышит вас в этот
    миг, поверят сказанному, хотя достойные противники получают спасбросок Духа. Спасбросок также даётся,
    если им предъявят доказательство обратного или если ложь для них невыносима. Эта вера сохранится даже
    после возвращения Усилия, если только её не опровергнут явные свидетельства или ложь не окажется слишком
    мучительной, чтобы в неё верить.
- name: Убеждение в Ошибке
  slug: ubezhdenie-v-oshibke
  tier: greater
  icon: images/icons/gifts/obman/ubezhdenie-v-oshibke.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  body: 'Приложите Усилие. Все выбранные вами присутствующие проникаются убеждением, что одно из их верований
    по вашему выбору на самом деле — чудовищная ложь, которую им навязали: будь то существование бога
    или верность супруга. Достойные противники получают спасбросок Духа. Они могут пересмотреть это убеждение
    в ошибке, когда Усилие будет возвращено, но сделают это лишь под сильнейшим давлением чувств или очевидных
    фактов.'
- name: Ходячий Призрак
  slug: hodyachiy-prizrak
  tier: greater
  icon: images/icons/gifts/obman/hodyachiy-prizrak.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Меньшие противники не могут вас обнаружить, если только вы не атакуете их или
    иначе не привлечёте вопиющего внимания, — даже если вы стоите прямо перед НИП. Достойные противники
    имеют шанс заметить вас по спасброску Духа, если вы окажетесь рядом с ними или если они нарочно ищут
    спрятавшихся врагов. Атаки и громкие действия всегда привлекают внимание. Покупка этого дара возвращает
    стоимость «Скрытого Шага», если он уже был.
