name: Приказ
kind: canon
colors:
  glow: '#ffd98f'
  deep: '#332a10'
  dark: '#130f06'
icon: /images/icons/words/prikaz.webp
description: |-
  Слово Приказа говорит о повиновении, предводительстве и власти. Обожествлённый Приказа может принудить других подчиниться его воле и принять его правление, но не может тронуть сердца тех, кем повелевает. Хотя покорённые подданные будут исполнять приказы дотошно и разумно, собственной инициативы они проявлять не станут, если только не разделяют желаний Обожествлённого.

  Герои со Словом Приказа могут установить значение своей Харизмы равным 16, или 18, если оно уже равно 16 или больше. Они могут общаться с любым разумным существом, понимая его и будучи понятыми. Их приказы всегда понимают верно, хотя повиновение будет зависеть от их красноречия или применения даров.
gifts:
- name: Мудрость Лейтенанта
  slug: mudrost-leytenanta
  tier: lesser
  icon: /images/icons/gifts/prikaz/mudrost-leytenanta.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие, прежде чем отдать приказ человеку или группе у вас на службе. Пока Усилие приложено,
    вы можете потратить действие, чтобы позаимствовать чувства любого отдельного члена группы или телепатически
    связаться с любым из них или со всеми сразу, а они могут связаться с вами. Подопечный может разорвать
    эту связь, но вы немедленно об этом узнаёте. Эффект прекращается, когда Усилие возвращено или приказ
    исполнен.
- name: Преданное Сердце Солдата
  slug: predannoe-serdtse-soldata
  tier: lesser
  icon: /images/icons/gifts/prikaz/predannoe-serdtse-soldata.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Видимое существо, у которого хит-дайсов не больше вашего уровня и которое добровольно присягает
    вам на верность, оказывается связано своей клятвой полностью. Только магическое принуждение может
    заставить его ослушаться или предать вас, пока вы не освободите его от эффекта, — даже при самоубийственных
    или противоестественных приказах. Этот дар не может затрагивать в общей сложности более ста человек
    на уровень персонажа.
- name: Сердца и Умы
  slug: serdtsa-i-umy
  tier: lesser
  icon: /images/icons/gifts/prikaz/serdtsa-i-umy.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Поймите истинные побуждения и намерения любого собеседника —
    Ведущий изложит их в нескольких предложениях. Достойные противники получают спасбросок Духа, чтобы
    скрыть правду.
- name: Стража! Взять его!
  slug: strazha-vzyat-ego
  tier: lesser
  icon: /images/icons/gifts/prikaz/strazha-vzyat-ego.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: 'До Маленькой Толпы прислужников или до полудюжины отдельных слуг могут появиться в вашем нынешнем
    месте, если они находятся в пределах десяти миль от Обожествлённого. Призвать можно только официально
    присягнувших последователей Обожествлённого, и их нельзя призвать туда, куда они не смогли бы практически
    добраться своими силами. Призванные слуги появляются там, откуда логичнее всего было бы войти: силы
    Обожествлённого заставили их поспешить на зов ещё до того, как он прозвучал.'
- name: Тысяча Верных Воинов
  slug: tysyacha-vernyh-voinov
  tier: lesser
  icon: /images/icons/gifts/prikaz/tysyacha-vernyh-voinov.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Видимый НИП немедленно становится к вам расположен и делает для вас всё, что
    сделал бы для начальника или нанимателя. Достойные противники получают спасбросок Духа, чтобы противостоять
    этому эффекту. Готовность сотрудничать сохраняется и после возвращения Усилия, если только ею не злоупотребляют
    и она не совершенно невероятна.
- name: Цепь Подчинения
  slug: tsep-podchineniya
  tier: lesser
  icon: /images/icons/gifts/prikaz/tsep-podchineniya.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: по желанию'
  body: 'Вы способны опознать истинного вожака в любой группе или общественной обстановке. Кроме того,
    вы можете приложить Усилие: группа НИП, являющихся меньшими противниками, будет чутьём повиноваться
    вам, как своему начальнику или нанимателю. Если обстоятельства или незатронутые люди обратят их внимание
    на странность происходящего, они получают спасбросок Духа.'
- name: Непобедимый Железный Генерал
  slug: nepobedimyy-zheleznyy-general
  tier: greater
  icon: /images/icons/gifts/prikaz/nepobedimyy-zheleznyy-general.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Все солдаты-НИП, служащие под вашим началом, получают +1 хит-дайс, бонус к попаданию, равный вашему
    уровню, и Мораль 11. Ваша воля сама собой известна всем вашим офицерам, и вы всегда знаете местоположение,
    состояние и общие дела всех воинских отрядов, признающих ваше командование.
- name: Носитель Алой Короны
  slug: nositel-aloy-korony
  tier: greater
  icon: /images/icons/gifts/prikaz/nositel-aloy-korony.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Ваша законность как правителя непоколебима. Вы чутьём знаете обо всех общеизвестных крупных событиях
    в группах и общинах, которыми правите или управляете, и можете в любой момент донести свою волю до
    наместников и чиновников, хотя они не могут ответить напрямую. Каждый месяц вы получаете одно дополнительное
    бесплатное очко Владычества, но тратить его можно только на собственные земли или подвластные организации.
    Впрочем, новые Обожествлённые не начинают игру с запасом таких очков.
- name: Порабощающий Крик
  slug: poraboschayuschiy-krik
  tier: greater
  icon: /images/icons/gifts/prikaz/poraboschayuschiy-krik.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня и отдайте приказ. Если он обращён к группе, все меньшие противники
    числом до Огромной Толпы немедленно исполняют что угодно, кроме самоубийственного приказа или требования
    не защищаться от очевидной опасности, — при условии, что они ещё не ведут бой против Обожествлённого.
    Повиновение этому единственному приказу длится сцену. Если приказ обращён к одной цели, ещё не сражающейся
    с Обожествлённым, от неё можно требовать чего угодно, пока Обожествлённый её не отпустит. Достойные
    противники получают спасбросок Духа, чтобы противостоять этому управлению.
