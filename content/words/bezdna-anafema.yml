name: Бездна (Анафема)
kind: anathema
colors:
  glow: '#b58cff'
  deep: '#1a0f2e'
  dark: '#080614'
icon: /images/icons/words/bezdna-anafema.webp
description: |-
  Словом Бездны Обожествлённый не столько владеет, сколько оно владеет им. Оно отнимает у него всё, что хоть отдалённо напоминает живую человечность, взамен даруя вечную не-жизнь и наполняя его члены беспросветным холодом пустоты, известной также как Несотворённая Ночь. Таких зовут анафемой или личами, хотя смертным глазам они могут показаться княгиней-вампиром, мумифицированным царём или архинекромантом. Это не столько Слово, которым овладевают, сколько кощунственная напасть, которую претерпевают в погоне за извращённым долголетием или запретной силой. С природным ходом смерти или тления оно связано мало — куда больше с их извращением.

  Осквернённый Бездной Обожествлённый выглядит мертвецом и безразличен к таким нуждам живых, как еда, сон и дыхание. Его естественный класс защиты равен 3, а Телосложение и Интеллект подняты до 16 или до 18, если уже равны 16 или больше.

  ИЗЪЯНЫ: лич получает кость урона 1к10 за каждый раунд, что находится под огнём или солнечным светом, и может рассчитывать на ненависть и страх со стороны большинства здравомыслящих живых существ. Слуги Непобедимого Солнца будут неустанно на него охотиться, хотя он может найти собственных непотребных союзников во тьме меж звёзд.
gifts:
- name: Взгляд в Бездну
  slug: vzglyad-v-bezdnu
  tier: lesser
  icon: /images/icons/gifts/bezdna-anafema/vzglyad-v-bezdnu.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: В пустоте обретается безумие, но также и кощунственное знание — быть может, задержавшееся отражение
    тех, кто в прошлом продал или потерял там свои души. Приложите Усилие до конца сцены, чтобы узнать
    любой факт или преуспеть в любой проверке интеллектуального атрибута, посильной превосходнейшему и
    узко сведущему смертному мудрецу.
- name: Владыка Ужаса
  slug: vladyka-uzhasa
  tier: lesser
  icon: /images/icons/gifts/bezdna-anafema/vladyka-uzhasa.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Нежить, являющаяся меньшими противниками, в вашем присутствии абсолютно покорна вашим приказам
    и не может намеренно вам навредить. Отданные вами приказы будут исполняться с человеческим разумением
    и некро-самоубийственной преданностью, пока такая нежить не пробудет вне вашего присутствия не менее
    24 часов, после чего вернётся к обычному поведению. Вы можете попытаться так же поработить нежить
    — достойного противника — Действием, но цель получает спасбросок Духа, чтобы стать невосприимчивой
    к этому дару на сцену.
- name: Костяной Отец
  slug: kostyanoy-otets
  tier: lesser
  icon: /images/icons/gifts/bezdna-anafema/kostyanoy-otets.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Вы поднимаете либо по одной Маленькой Толпе нежити в 1 ХД на
    уровень с округлением вверх, либо одну высшую нежить с хит-дайсами не более чем вдвое больше вашего
    уровня. Чтобы создать высшую нежить, нужно работать с несколькими трупами, умершими не более месяца
    назад и не получившими погребальных обрядов. Нежить рабски предана вам, пока эта сила не будет применена
    снова, после чего она рассыпается в прах. Высшую нежить можно сохранить за 1 очко Влияния или Владычества.
- name: Потусторонние Обереги
  slug: potustoronnie-oberegi
  tier: lesser
  icon: /images/icons/gifts/bezdna-anafema/potustoronnie-oberegi.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Вы невосприимчивы к любой враждебной низкой магии или теургии, применённой прямо против вас. Обычные
    атаки по вам, состоящие из зарядов потусторонней силы или иных чисто магических проявлений, бесполезно
    рассыпаются, если на кости атаки выпало нечётное число, — даже если иначе они попали бы по вашему
    классу защиты или поразили бы вас автоматически. Эта защита не распространяется на атаки физическим
    оружием, усиленные магией, но распространяется на полностью эмоциональные или ментальные обычные атаки.
    Обожествлённый со Словом Колдовства может приложить Усилие до конца дня, чтобы обойти эти обереги
    на сцену.
- name: Прикосновение Пустоты
  slug: prikosnovenie-pustoty
  tier: lesser
  icon: /images/icons/gifts/bezdna-anafema/prikosnovenie-pustoty.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Ваша нечестивая мощь, потусторонняя сила или бездонная злоба дают вам магическую атаку 1к10 с
    дальностью 200 футов. При успешном попадании вы можете Мгновенным действием приложить Усилие до конца
    сцены, чтобы получить вдвое больше хитов исцеления, чем нанесли урона, — но не выше вашего обычного
    максимума хитов.
- name: Разум из Железа и Слоновой Кости
  slug: razum-iz-zheleza-i-slonovoy-kosti
  tier: lesser
  icon: /images/icons/gifts/bezdna-anafema/razum-iz-zheleza-i-slonovoy-kosti.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Вы обладаете неуязвимой защитой от чтения мыслей и прочих эффектов, влияющих на ваш разум или
    чувства.
- name: Злоба Вечного
  slug: zloba-vechnogo
  tier: greater
  icon: /images/icons/gifts/bezdna-anafema/zloba-vechnogo.webp
  badges:
  - type: act
    text: В свой ход
  - type: smite
    text: Кара
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня, совершая обычную атаку. Потусторонней ли мощью, непотребным ли
    прозрением, но эта атака при попадании наносит урон напрямую. Даже при промахе она наносит урон как
    обычно. Атакам, усиленным этим даром, никакая другая сила не может дать максимальный урон.
- name: Тёмные Тайны
  slug: temnye-tayny
  tier: greater
  icon: /images/icons/gifts/bezdna-anafema/temnye-tayny.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены, когда цель ваших способностей совершает спасбросок. Она немедленно
    получает штраф -4 к этому спасброску против этой способности. Этот дар можно применить лишь раз на
    один спасбросок, но как Мгновенный его можно применить уже после броска цели.
- name: Филактерия
  slug: filakteriya
  tier: greater
  icon: /images/icons/gifts/bezdna-anafema/filakteriya.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: 'У вас есть филактерия, извлечённое сердце или иное вместилище вашей прежней жизни, которое можно
    уничтожить обычным насилием. Пока эта филактерия цела, вас нельзя убить окончательно: вы возродитесь
    из смерти за 24 часа из самого крупного оставшегося обломка. Если филактерия уничтожена, вы можете
    создать её заново, но она станет действенной лишь через полгода. Вы мгновенно узнаёте о любом уничтожении
    своей филактерии, и хотя можете её прятать или охранять, вы не можете зачаровать её нарочно так, чтобы
    уберечь от вреда.'
