name: Слизь
kind: homebrew
colors:
  glow: '#b6f07a'
  deep: '#173312'
  dark: '#081507'
icon: images/icons/words/sliz.webp
description: ''
gifts:
- name: Живые кусочки
  slug: zhivye-kusochki
  tier: lesser
  icon: images/icons/gifts/sliz/zhivye-kusochki.webp
  badges:
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите усилие, вы отращиваете дополнительные конечности, будь то руки, ноги, щупальца и т.д.
    Созданные таким способом конечности имеют ХД, равное уровню персонажа. Щупальца достаточно сильны,
    дабы поднять вес, соразмерный весу человека, при использовании для захвата конечности используют модификатор
    персонажа и его дары.
- name: Изменчивая форма
  slug: izmenchivaya-forma
  tier: lesser
  icon: images/icons/gifts/sliz/izmenchivaya-forma.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  body: Ваше тело изменчиво и гибко, вы можете просачиваться сквозь мельчайшие щели, прилипать к любым
    вещам, а так же изменять свою форму и габариты. Приложите усилие и измените свой облик с идеальной
    точностью.
- name: Корка стихий
  slug: korka-stihiy
  tier: lesser
  icon: images/icons/gifts/sliz/korka-stihiy.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: день'
  body: Приложите усилие до конца дня, получив стихийный урон, вы создаёте для себя особую корку, что
    делает вас иммунным к этой стихии.
- name: Обед!
  slug: obed
  tier: lesser
  icon: images/icons/gifts/sliz/obed.webp
  badges:
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите усилие, вы используете внутренние запасы кислоты, дабы создать оружие с радиусом до
    100 футов и уроном 1d10 кислотой.
- name: Тело слизи
  slug: telo-slizi
  tier: lesser
  icon: images/icons/gifts/sliz/telo-slizi.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Ваша плоть плывёт вокруг опасностей и изолирует токсины. Ваш натуральный класс брони равен 3,
    и вы иммунны к ядам. Вы можете применить яд прикосновением, если ранее вы проглотили дозу или получили
    её другим способом, таким образом удаляя токсин из своего тела. Этот класс брони не улучшается бронёй
    или щитами. Вы так же снижаете урон от немагического оружия по себе на 1.
- name: Большой Блоппа
  slug: bolshoy-bloppa
  tier: greater
  icon: images/icons/gifts/sliz/bolshoy-bloppa.webp
  badges:
  - type: eff
    text: 'Усилие: день'
  body: Приложите усилие на день, вы увеличиваетесь в размерах колоссально, становясь иммунным к любым
    атакам оружием, а ваши атаки теперь наносят урон по площади с радиусом в 10 футов.
- name: Насильная дегидрация
  slug: nasilnaya-degidratsiya
  tier: greater
  icon: images/icons/gifts/sliz/nasilnaya-degidratsiya.webp
  badges:
  - type: act
    text: Действие
  - type: smite
    text: Кара
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите усилие на сцену. Вы или ваш кусочек набрасываются на цель, начиная высасывать воду/отдавать
    кислотой вашего противника на выбор. Меньший противник автоматически умирает, достойный противник
    должен пройти проверку уклонения, дабы получить половину урона. При провале противник кидает спасбросок
    телосложения в конце каждого своего хода для освобождения. Урон равен 1 урону за уровень персонажа.
- name: Симбиоз
  slug: simbioz
  tier: greater
  icon: images/icons/gifts/sliz/simbioz.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Вы сливаетесь с союзным разумным существом. Вы можете делиться друг с другом здоровьем, при спасброске
    вы можете пройти его за напарника, ваши усилия становятся общими. При совершении атаки вы, как симбиот,
    можете использовать результат броска попадания для себя.
