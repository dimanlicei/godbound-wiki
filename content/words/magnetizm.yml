name: Магнетизм
kind: homebrew
colors:
  glow: '#a9c4e0'
  deep: '#182636'
  dark: '#080e16'
icon: images/icons/words/magnetizm.webp
description: 'Слово Сотворения: Магнетизм. Обожествлённые, связанные со словом Магнетизма, обладают невероятным
  контролем над природными магнитными полями, но так же искусственными и способны создавать свои собственные
  магнитные поля. Поднимите свой показатель Интеллекта или Харизмы на выбор до 16, если показатель уже
  равен или выше 16, то он становится 18. Обожествлённый Магнетизма способен создавать воздействие, схожее
  с магнитным полем, даже если материал не имеет природного. Обожествлённый способен передвигаться по
  потолку и стенам так, словно бы ходит по земле, и не может быть сбит с ног.'
gifts:
- name: Буря мыслей
  slug: burya-mysley
  tier: lesser
  icon: images/icons/gifts/magnetizm/burya-mysley.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: сцена'
  body: Приложив усилие на сцену, обожествлённый окутывает цель магнитными полями, вызывая приступы боли
    и головокружения. Цель замедляется в половину до окончания этой сцены или же до тех пор, пока не сможет
    рассеять этот дар. Эффект усиливается при применении на автоматонов, в то время как нежить и конструкты
    без выраженных органов или металлических частей не страдают от этого дара.
- name: Властный щит
  slug: vlastnyy-schit
  tier: lesser
  icon: images/icons/gifts/magnetizm/vlastnyy-schit.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите усилие, вы создаёте вокруг выбранного союзника магнитное поле, похожее на сферу, что
    отталкивает любые атаки, использующие металлы и подверженные магнетизму материалы. Выбранный союзник
    получает полный иммунитет к подобным атакам и несчастным случаям, связанным с подверженными магнетизму
    материалами, пока усилие остаётся приложенным.
- name: Воплощая Чертеж
  slug: voploschaya-chertezh
  tier: lesser
  icon: images/icons/gifts/magnetizm/voploschaya-chertezh.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложив усилие на день, вы создаёте механизм, достаточно простой для полного понимания оного
    обожествлённым; имея достаточное количество сырья, вы воплощаете чертеж в жизнь. Сырьё не обязательно
    должно быть обработанным, но сама машина или механизм не должны включать в себя ничего, что обожествлённый
    не понимает или не способен реплицировать силой своих слов и фактов.
- name: За Пределами
  slug: za-predelami
  tier: lesser
  icon: images/icons/gifts/magnetizm/za-predelami.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Собственное магнитное поле обожествлённого становится достаточно сильным, что бы стать его щитом,
    ваша броня становится 3, и она не может быть улучшена за счёт брони или щитов. За счёт собственного
    магнитного поля обожествлённый получает скорость полёта, равную его передвижению, так же он может
    застывать в воздухе так же, словно бы имея под ногами твёрдую поверхность, или же замедлять своё падение.
- name: Искажая путь
  slug: iskazhaya-put
  tier: lesser
  icon: images/icons/gifts/magnetizm/iskazhaya-put.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: Прикладывая усилие на сцену, обожествлённый изменяет путь одной единственной атаки противника
    или союзника, заставляя её промахнуться или же попасть в цель по вашему выбору, атака не способна
    задеть самого атакующего, но это не значит, что последствия изменения траектории не могут нанести
    урон атакующему.
- name: Искатель истинного пути
  slug: iskatel-istinnogo-puti
  tier: lesser
  icon: images/icons/gifts/magnetizm/iskatel-istinnogo-puti.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Задайте мастеру вопрос, касающийся местоположения интересующего вас объекта, субъекта, локации
    или события. Мастер обязан дать развёрнутый ответ о местоположении желаемого с точностью до 1. Вопрос
    можно задать вновь, если искомое успешно найдено или же началась новая сессия.
- name: Лишенный света
  slug: lishennyy-sveta
  tier: lesser
  icon: images/icons/gifts/magnetizm/lishennyy-sveta.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложить усилие, вы создаёте могучее магнитное поле радиусом в 30 футов, что рассеивает первые
    2 единицы урона молнией, холодом и огнём каждый ход.
- name: Владыка полюсов
  slug: vladyka-polyusov
  tier: greater
  icon: images/icons/gifts/magnetizm/vladyka-polyusov.webp
  badges:
  - type: act
    text: Действие
  - type: smite
    text: Кара
  - type: eff
    text: 'Усилие: сцена'
  body: Приложив усилие на сцену, выберите полюса и две точки в вашем поле зрения; в зависимости от полюсов
    они начнут мгновенно сближаться или же отдаляться, не в силах преодолеть свою полярность. Если же
    одной из точек выбрано существо, оно обязано приближаться на 45 футов в ход к другой точке или отдаляться
    на такое же расстояние.
- name: Волей Гаусса
  slug: voley-gaussa
  tier: greater
  icon: images/icons/gifts/magnetizm/voley-gaussa.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: день'
  body: Приложив усилие на день, обожествлённый достигает своего абсолюта в плане скорости. Вы получаете
    дополнительный раунд действия. Если вы используете действия для атаки, вы получаете дополнительную
    атаку для обоих ваших ходов, все ваши броски на попадания и урон для этих атак кидаются дважды и выбирается
    лучший результат. Если же вы решаете потратить одно из действий на движение, то вы сами становитесь
    снарядом гаусс-орудия, запуская себя с невероятной скоростью в выбранную сторону. На своём пути вы
    разрушаете любые строения, не состоящие из небесных материалов, и наносите 1 единицу урона за уровень
    персонажа, урон считается утроенным для толп. Рывок может быть использован лишь единожды.
- name: Животный Магнетизм
  slug: zhivotnyy-magnetizm
  tier: greater
  icon: images/icons/gifts/magnetizm/zhivotnyy-magnetizm.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: 'Усилие: сцена'
  body: Природная привлекательность обожествлённого становится сильнее, чем когда-либо, своим присутствием
    вы приковываете взгляды толп. В радиусе 30 футов противники отвлекаются на вас, получая штраф на проверки
    против союзников обожествлённого, если противник не имеет серьёзных причин игнорировать огромный интерес.
    Приложив усилие на сцену, вы можете сделать центром внимания своего союзника.
