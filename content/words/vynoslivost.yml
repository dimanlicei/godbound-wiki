name: Выносливость
kind: canon
colors:
  glow: '#c2d3ae'
  deep: '#242a20'
  dark: '#0e100c'
icon: /images/icons/words/vynoslivost.webp
description: |-
  Слово Выносливости — это Слово стойкости, решимости и неослабного усилия. Его чудеса дают выжить даже перед лицом верной смерти, обрести силы там, где изнеможение иначе взяло бы своё, и противиться нежеланному колдовству или проклятиям.

  Обожествлённый, осенённый этим Словом, устрашающе трудно уязвим физически, но Слово не отражает источники ментального или духовного урона и принуждения — вроде Божественного Гнева от Знания или принуждения от Приказа. Как ориентир: если дело требует спасброска Духа, Выносливость это не остановит. Её чудеса не распространяют иммунитеты на других, если не сказано иначе.

  Герои Выносливости устанавливают значение Телосложения равным 19, что даёт им бонус атрибута +4. Кроме того, следует считать, что Обожествлённый способен обходиться без еды, питья, дыхания и сна по меньшей мере в десять раз дольше, чем отборный человеческий воин, если его к тому вынудят.
gifts:
- name: Бросить Вызов Железу
  slug: brosit-vyzov-zhelezu
  tier: lesser
  icon: /images/icons/gifts/vynoslivost/brosit-vyzov-zhelezu.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Отмените одну физическую атаку или случай телесного повреждения.
    Этот дар не может отвести ментальные или духовные виды урона либо магические эффекты, которые обычно
    вызывают спасбросок Духа. При длящейся опасности, наносящей урон каждый раунд, эта неуязвимость распространяется
    лишь на один раунд урона.
- name: Живучесть Амаранта
  slug: zhivuchest-amaranta
  tier: lesser
  icon: /images/icons/gifts/vynoslivost/zhivuchest-amaranta.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Каждые пятнадцать минут вы исцеляете один потерянный хит за каждые три уровня персонажа с округлением
    вверх, пока остаётесь живы.
- name: Крепче Этого
  slug: krepche-etogo
  tier: lesser
  icon: /images/icons/gifts/vynoslivost/krepche-etogo.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Станьте невосприимчивы к одной физической опасности или особой атаке, пока Усилие
    приложено. Приспособиться к оружию, дарам или заклинаниям нельзя, но можно стать невосприимчивым к
    дыханию дракона, взгляду василиска, яду зверя или жерлу вулкана.
- name: Неутомимое Рвение
  slug: neutomimoe-rvenie
  tier: lesser
  icon: /images/icons/gifts/vynoslivost/neutomimoe-rvenie.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Вам больше не нужно есть и спать. Выберите один проект Влияния, за который вы взялись. Прибавьте
    1 к действующему на нём Влиянию, поскольку вы работаете над задачей без сна.
- name: Презрение Стихий
  slug: prezrenie-stihiy
  tier: lesser
  icon: /images/icons/gifts/vynoslivost/prezrenie-stihiy.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Чтобы получить этот дар, нужен малый дар «Тело Железной Воли». Вы обладаете почти непробиваемой
    защитой от стихийного урона во всех его видах — вроде магических огненных шаров или призванных молний.
    От таких атак вы получаете лишь половину урона, и они не могут снизить ваши хиты ниже 1, если только
    у вас уже не 1 хит.
- name: Тело Железной Воли
  slug: telo-zheleznoy-voli
  tier: lesser
  icon: /images/icons/gifts/vynoslivost/telo-zheleznoy-voli.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Ваш естественный класс защиты равен 3. Вы неуязвимы для любого природного урона от окружения —
    от крайнего жара, холода, давления, излучения или пустоты. Если такие силы применены против вас как
    оружие или опасность, они действуют как обычно. Доспехи и щиты этот базовый класс защиты не улучшают.
- name: Не Бойся Стали
  slug: ne-boysya-stali
  tier: greater
  icon: /images/icons/gifts/vynoslivost/ne-boysya-stali.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие. Ваша решимость или сверхъестественная стойкость позволяют вам отмахиваться от
    малых бед этого мира. Вы получаете на 1 очко урона меньше из всех источников урона, физических и магических.
    По желанию приложите Усилие до конца дня, чтобы на сцену стать невосприимчивым к атакам меньших противников
    без магического оружия.
- name: Несокрушимый
  slug: nesokrushimyy
  tier: greater
  icon: /images/icons/gifts/vynoslivost/nesokrushimyy.webp
  badges:
  - type: act
    text: Постоянно
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: день'
  body: Чтобы купить этот дар, нужен малый дар «Тело Железной Воли». Приложите Усилие до конца дня. До
    начала вашего следующего хода вы обладаете неуязвимой защитой от любой физической, осязаемой атаки
    или эффекта заклинания. Ментальный и духовный вред или урон при этом не отражаются. Кроме того, ваш
    естественный класс защиты теперь равен 1, и его нельзя улучшить доспехами или щитами.
- name: Неумирающий
  slug: neumirayuschiy
  tier: greater
  icon: /images/icons/gifts/vynoslivost/neumirayuschiy.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Вас можно свести к нулю хитов, изувечить или сжечь, но по-настоящему убить нельзя ничем, кроме
    действия или содействия дара от Слова, божественного чуда или усиленной даром атаки. Если вас не убили,
    вы за час отрастаете обратно до одного хита из самого крупного оставшегося куска.
