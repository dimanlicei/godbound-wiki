name: Титанопад
kind: homebrew
colors:
  glow: '#ffab6b'
  deep: '#2e1c10'
  dark: '#120a06'
icon: images/icons/words/titanopad.webp
description: Божественная суть объединяет вас и вашего богохода, делая единым божественным существом.
  Отныне ваш богоход имеет интеллект достаточный для выполнения любых команд пилота, пока способен слышать
  ваш голос или получать от вас прямые команды. Богоход отныне так же перенимает здоровье, броню и умения
  пилота, если те лучше его собственных.
gifts:
- name: Амплификатор могущества
  slug: amplifikator-moguschestva
  tier: lesser
  icon: images/icons/gifts/titanopad/amplifikator-moguschestva.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: Прикладывая усилие, богоход включает форсаж из-за чего способен двигается с двойной скоростью,
    а так же приложив усилие на сцену, богоход приобретает способность к полёту за счёт механических крыльев
    или любых других умений.
- name: Беспринципный бараж
  slug: besprintsipnyy-barazh
  tier: lesser
  icon: images/icons/gifts/titanopad/besprintsipnyy-barazh.webp
  badges:
  - type: act
    text: Действие
  - type: smite
    text: Кара
  - type: eff
    text: 'Усилие: день'
  body: Прикладывая усилие на день, вы актвизируете всё возможное вооружение что считаеться оружием богохода,
    нанося 1d8 урона за оружие по одиночной цели или же 1d6 урона за орудие по области с радиусом в 30
    футов в пределах 500 футов, оружие не обязано быть дальнобойным, но должно быть установлено на сам
    богоход.
- name: Недвижимый бастион
  slug: nedvizhimyy-bastion
  tier: lesser
  icon: images/icons/gifts/titanopad/nedvizhimyy-bastion.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Прикладывая усилия, ваш богоход останавливается на месте становясь нерушимым бастионом. Все кости
    урона бросаемые против вас, кидаються дважды и выбираеться наихудший.
- name: Синхронизация мира
  slug: sinhronizatsiya-mira
  tier: lesser
  icon: images/icons/gifts/titanopad/sinhronizatsiya-mira.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Вы обретаете интуитивное понимание божественной машинатории, что позволяет вам понимать приблизительную
    область в 20 километров, где находится механизм и его состояние. Вы так же способны синхронизировать
    своего богохода с божественным механизмом при прямом нахождении, получая контроль над областью в сфере
    механизма.
- name: Странник стального идеала
  slug: strannik-stalnogo-ideala
  tier: lesser
  icon: images/icons/gifts/titanopad/strannik-stalnogo-ideala.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: 'Усилие: по желанию'
  body: Ваша стальная оболочка не ведает страхов любого мира. Ваш богоход полностью иммуннен к даже самым
    экстремальным климатическим условиям, а обвалы не могут оставить вас. Прикладывая усилие, вы можете
    распространить вашу защиту и на союзников.
- name: Живой завод
  slug: zhivoy-zavod
  tier: greater
  icon: images/icons/gifts/titanopad/zhivoy-zavod.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Ваш богоход становится самостоятельной производственной линией, что способен чинить себя, других
    богоходов или же создать свой производственный завод для любых понимаемых вами технологиями.
- name: Трон пилота
  slug: tron-pilota
  tier: greater
  icon: images/icons/gifts/titanopad/tron-pilota.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: Без Усилия
  body: В любой момент вы можете выйти из богохода оставив на своём месте свою идеальную копию или копию
    того кого вы заранее внесли в систему, позволяя богоходу двигаться самостоятельно с учётом заложенной
    личности, а так же используя все свои дары которыми вы сами владеете. Синхронизация всё ещё остаётся,
    из-за чего и богоход и его пилот всё ещё связаны хит-дайсами.
