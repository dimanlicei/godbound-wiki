name: Ночь
kind: canon
colors:
  glow: '#a8b6ff'
  deep: '#141a30'
  dark: '#070a16'
icon: /images/icons/words/noch.webp
description: Сновидения, сон, тьма и спокойствие можно найти под знаменем ночи. Ночь проходит над многими
  местами одновременно и проникает даже в самые охраняемые покои. Слово Ночи может совершать чудеса, включающие
  сон, слепоту, стремительный переход во тьме и физическую неосязаемость. Для лучшего эффекта этим дарам
  зачастую нужны слабо освещённые зоны. Герои со Словом Ночи могут идеально видеть в темноте. Им не нужен
  сон, а их действия никогда не станут невольной причиной пробуждения спящих вокруг них.
gifts:
- name: Дорога Теней
  slug: doroga-teney
  tier: lesser
  icon: /images/icons/gifts/noch/doroga-teney.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Шагните в одну тень и выйдите из ближайшей к желаемому месту,
    если оно находится в пределах мили. Этот дар не может переместить вас более чем на десять миль суммарно
    за один час.
- name: Ножи Ночи
  slug: nozhi-nochi
  tier: lesser
  icon: /images/icons/gifts/noch/nozhi-nochi.webp
  badges:
  - type: act
    text: В свой ход
  body: Приложите Усилие. Теперь вы способны сгущать тьму в оружие с дальностью 200 футов. При использовании
    для атак оно наносит 1к10 повреждений и считается магическим оружием. Противники, доведённые до нуля
    хит-пойнтов, могут быть либо убиты, либо усыплены, либо навсегда ослеплены по вашему выбору.
- name: Приветствуя Закат
  slug: privetstvuya-zakat
  tier: lesser
  icon: /images/icons/gifts/noch/privetstvuya-zakat.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Создайте вокруг себя тьму любой формы до 30 футов радиусом. Вы можете видеть
    сквозь неё, а она может следовать за вами.
- name: Проклятье Их Глазам
  slug: proklyate-ih-glazam
  tier: lesser
  icon: /images/icons/gifts/noch/proklyate-ih-glazam.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Выберите цель в пределах видимости. Меньшие противники ослеплены, в то время как достойные противники
    получают спасбросок Стойкости, чтобы противостоять дару, и требуют Приложить Усилие до конца сцены,
    чтобы дар на них подействовал. При желании вы можете ослепить цель к определённым людям или вещам.
    Те, кто выборочно ослеплён, не осознают свою слепоту, пока на неё не укажет кто-то другой, или они
    не столкнутся с ней физически. Слепота длится сколько вам угодно для меньших противников, а для достойных
    противников заканчивается по окончании сцены. Слепые враги обычно получают -4 ко всем броскам на попадание
    в ближнем бою и не имеют каких-либо значимых шансов попасть дальними атаками, если у них нет других
    сверхчеловеческих чувств.
- name: Темнеющая Лестница
  slug: temneyuschaya-lestnitsa
  tier: lesser
  icon: /images/icons/gifts/noch/temneyuschaya-lestnitsa.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Вы можете летать или двигаться по вертикальным поверхностям со своей обычной скоростью, при условии,
    что вас окружает темнота настолько плотная, что невозможно отличить белую нить от чёрной. Способность
    продолжает действовать один раунд после попадания на яркий свет.
- name: Тихое Безмолвие Сна
  slug: tihoe-bezmolvie-sna
  tier: lesser
  icon: /images/icons/gifts/noch/tihoe-bezmolvie-sna.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены и выберите точку в поле зрения. Все меньшие противники в пределах
    50 футов от этой точки должны пройти спасбросок Духа или уснуть. Вы можете задавать сны или кошмары
    спящего, если видите его, хотя достойные противники могут спастись броском. Вы можете отправлять и
    получать сообщения через сны с соратниками по пантеону и близкими, если они это позволяют.
- name: Говорящий в Снах
  slug: govoryaschiy-v-snah
  tier: greater
  icon: /images/icons/gifts/noch/govoryaschiy-v-snah.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Вы можете общаться с теми, кого видели раньше, с помощью общих снов, которые
    они идеально запомнят. Вы также можете подглядывать за их снами, чтобы получить представление о том,
    что их больше всего беспокоит, и определить их местоположение. Сопротивляющиеся достойные противники
    получают спасбросок Духа, чтобы избежать действия дара.
- name: Плоть Тени
  slug: plot-teni
  tier: greater
  icon: /images/icons/gifts/noch/plot-teni.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Станьте почти неосязаемой тенью, неспособной влиять на реальный мир или проходить
    сквозь твёрдые объекты, но с неуязвимой защитой против немагических атак, но не заклинаний.
- name: Тьма в Полдень
  slug: tma-v-polden
  tier: greater
  icon: /images/icons/gifts/noch/tma-v-polden.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Вы приносите или рассеиваете ночь в радиусе до мили за уровень.
    Ночью луна будет в той фазе, в которой вы захотите, в то время, как изгнанная ночь оставляет в небе
    солнце. При желании вы можете гарантировать, что ни один из спящих меньших противников в зоне действия
    дара не проснётся ни от чего, за исключением серьёзной физической травмы, или посылать им определённые
    сновидения.
