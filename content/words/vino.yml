name: Вино
kind: canon
colors:
  glow: '#ee8fa6'
  deep: '#33101c'
  dark: '#14060c'
icon: images/icons/words/vino.webp
description: |-
  Несмотря на название, под Слово Вина подпадают все вещества, изменяющие сознание, — будь то дурманящее зелье или священное вино, — а также состояния опьянения, отравления, исступлённого неистовства и общественного разложения.

  Владеющие Словом Вина могут поднять Харизму или Телосложение до 16, или до 18, если значение уже равно 16 или больше. Они обладают неуязвимым иммунитетом к ядам и способны по желанию сотворить немагическое дурманящее зелье в количестве, достаточном для Большой Толпы людей, — например, обратить воду в фонтане в вино.

  Некоторые силы вызывают или используют пристрастия к дурману. Пристрастившийся совершит почти любое разумное деяние в обмен на желанное зелье. Меньшие противники должны проходить спасбросок по худшему из своих спасбросков Стойкости или Духа, чтобы не совершить даже весьма пагубных или кощунственно безнравственных поступков в обмен на предложение вожделенного вещества. Магически вызванные пристрастия длятся, пока Обожествлённый не освободит жертв, и в достаточном размахе способны подорвать целые общины. Именно поэтому вокруг божеств Вина в прошлом столь охотно возникали культы и почему смертные власти столь яростно стремились их подавить или искоренить.
gifts:
- name: Венец Благоуханных Лоз
  slug: venets-blagouhannyh-loz
  tier: lesser
  icon: images/icons/gifts/vino/venets-blagouhannyh-loz.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Осмотрев кого-то на протяжении действия, Обожествлённый может ощутить уже имеющиеся пристрастия
    к дурману у окружающих. Обожествлённый может погасить телесные и душевные пристрастия у любого числа
    целей в пределах видимости. Если он приложит Усилие до конца сцены, он также может вызвать пристрастие
    к любому веществу или занятию, которому предаются в его присутствии, у количества целей до Маленькой
    Толпы; достойные противники могут пройти спасбросок Стойкости, чтобы противостоять. Вызванным Обожествлённым
    пристрастиям можно позволить идти обычным чередом либо сделать их телесно безвредными для цели, чтобы
    та могла неистово злоупотреблять и всё равно возвращаться за новым.
- name: Вода в Вино
  slug: voda-v-vino
  tier: lesser
  icon: images/icons/gifts/vino/voda-v-vino.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: день'
  body: Обожествлённый может изменить природу любого видимого съедобного или употребляемого вещества,
    придав ему свойства дурмана по своему выбору. Он с равной лёгкостью обратит воду в вино и вино в яд.
    Употребляющие не отравятся сверх меры, если Обожествлённый того не позволит; если же вещество создано
    как отрава, употребивший должен пройти спасбросок Стойкости или умереть. Если Обожествлённый приложит
    Усилие до конца дня, зачарованное вещество можно настроить так, чтобы оно действовало только на определённых
    людей или разряды целей.
- name: Грохот Барабанов и Тарелок
  slug: grohot-barabanov-i-tarelok
  tier: lesser
  icon: images/icons/gifts/vino/grohot-barabanov-i-tarelok.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Обожествлённый обретает неуязвимый иммунитет к магическому влиянию на разум и чтению мыслей. Если
    он становится целью такой силы, он может Мгновенным действием приложить Усилие до конца сцены, чтобы
    применить дар Вина или любое чудо к нападающему, как если бы тот был видимой целью, заплатив обычную
    цену в Усилии за эту способность.
- name: Проказы Сатира
  slug: prokazy-satira
  tier: lesser
  icon: images/icons/gifts/vino/prokazy-satira.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня, чтобы мгновенно появиться рядом с любым существом под действием
    дурмана, пристрастия или вызванных вами даров опьянения, независимо от расстояния. По желанию вы можете
    разделять чувства магически пристрастившейся или опьянённой цели без затрат Усилия, сосредоточившись
    на одно действие, и общаться с ней как вам угодно.
- name: Раб Вакханалии
  slug: rab-vakhanalii
  tier: lesser
  icon: images/icons/gifts/vino/rab-vakhanalii.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены и выберите целью либо до Большой Толпы существ, либо одного достойного
    противника, вкусившего любое вещество, сотворённое или «благословлённое» вами. Их немедленно захлёстывает
    чувство по вашему выбору, и они действуют на пределе своего характера, выражая это чувство. Вы можете
    направить это чувство на выбранного человека или простую мысль. Чувство длится до конца сцены; достойные
    противники могут пройти спасбросок Стойкости, чтобы остаться почти незатронутыми, — хотя даже успешный
    спасбросок вынуждает их приложить Усилие до конца дня, чтобы сдержать порыв. Успешный спасбросок делает
    цель невосприимчивой к дальнейшим применениям этой силы в течение сцены.
- name: Хмельной Мираж
  slug: hmelnoy-mirazh
  tier: lesser
  icon: images/icons/gifts/vino/hmelnoy-mirazh.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: 'Чтобы купить этот дар, нужно уже иметь малый дар «Раб Вакханалии». Приложите Усилие. Обожествлённый
    насылает и направляет видения у всех опьянённых сейчас существ в пределах двухсот футов. Он может
    сделать эти видения объективно настоящими для тех, кто их переживает: призрачные ступени выдерживают
    их вес, воображаемые ножи в их руках режут, а фантомные ямы их поглощают. Цели, затронутые вредоносными
    видениями, могут каждый раунд проходить спасбросок Стойкости, чтобы не получить урона; при провале
    они получают одно очко урона за каждые два уровня персонажа с округлением вверх. Толпы получают тройной
    урон.'
- name: Горько-сладкая Трапеза
  slug: gorko-sladkaya-trapeza
  tier: greater
  icon: images/icons/gifts/vino/gorko-sladkaya-trapeza.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены, чтобы освятить сделку, заключённую в обмен на некое дурманящее
    вещество, на утоление пристрастия либо такую, где совместное вкушение подобного принято по обычаю,
    — например, договор, скреплённый бокалом вина. Цель нельзя магически принудить к этой сделке, но ей
    можно угрожать или иначе сулить неприятные последствия. Как только сделка заключена, цель обязана
    её исполнить, хотя сам Обожествлённый своими обещаниями не связан. Если цель нарушит сделку, Обожествлённый
    мгновенно об этом узнаёт. Год и один день жертва больше не получает спасбросков против сил Обожествлённого
    и никогда не может уклониться от его атак. Меньших противников, нарушивших сделку, в этот срок можно
    убить мгновенно с любого расстояния, если Обожествлённый того пожелает.
- name: Исступлённое Неистовство Менады
  slug: isstuplennoe-neistovstvo-menady
  tier: greater
  icon: images/icons/gifts/vino/isstuplennoe-neistovstvo-menady.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Чтобы купить этот дар, нужно уже иметь малый дар «Раб Вакханалии». Приложите Усилие до конца дня,
    чтобы наделить своих последователей свирепой силой. Такие обезумевшие последователи способны голыми
    руками разорвать даже живого быка и пожрать окровавленную плоть, обретая неистовую живучесть, — как
    и любую иную несчастную жертву. Все последователи-НИП, которые сейчас опьянены, пристрастились или
    чьи чувства вы направляете, получают +1 хит-дайс, бонус к попаданию, равный вашему уровню, и Мораль
    12. Несмотря на бессмысленную, извивающуюся ярость, они чутьём поймут, как лучше вам угодить, и нападут
    на любого врага или совершат любое непотребство, если это доставит вам удовольствие. Они будут невосприимчивы
    к любому иному магическому влиянию на разум, пока длится эта оргия насилия, — примерно в течение сцены.
- name: Карналии
  slug: karnalii
  tier: greater
  icon: images/icons/gifts/vino/karnalii.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Где бы Обожествлённый ни задержался дольше двух недель, он, скорее всего, окажет глубоко разъедающее
    влияние на нравы местных жителей. Такие нарушения начнутся как тайные и постыдные, но, когда пройдёт
    достаточно времени, могут привести к безудержному попранию некогда священных гражданских, нравственных
    и религиозных законов. Обожествлённый может по своей воле ускорять или сдерживать этот ход, в зависимости
    от того, насколько сильно хочет избежать внимания местных властей. Этот дар сперва подействует на
    самых недовольных в обществе, а затем, в зависимости от строгости или укоренённости обычаев затронутого
    города, может в итоге вызвать суровые меры со стороны блюстителей закона. Но какими бы ни были эти
    меры, пока Обожествлённый остаётся в городе, окончательное скатывание в разнузданную анархию неизбежно.
