name: Лень
kind: homebrew
colors:
  glow: '#aab0cc'
  deep: '#1e2030'
  dark: '#0b0c14'
icon: /images/icons/words/len.webp
description: 'Слово Греха: Ленность. Каждый демон лени несёт в себе ту самую ленность, что может ломать
  их жизни в самых ужасных местах, но именно поэтому они крайне хитры и социальны, дабы находить себе
  подходящих исполнителей или же создавать решения таких проблем. Повысьте свой Интеллект или же Харизму
  до 18 в зависимости от того, как именно вы решаете свои проблемы. Демоны лени часто имеют большое количество
  слуг, вы получаете второго демона-помощника или же толпу бесов в зависимости от вашего уровня как ваших
  личных помощников.'
gifts:
- name: Демонический Оутсорс
  slug: demonicheskiy-outsors
  tier: lesser
  icon: /images/icons/gifts/len/demonicheskiy-outsors.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Потратив количество домино, равное своему уровню вплоть до 10, демон лени создаёт свой нечестивый
    мануфакторий, что способен заменить собою работу 100 мастеров-людей за каждое вложенное домино. Если
    избранник слова хочет создать более одного мануфактория, то он обязан потратить удвоенное, утроенное
    и т.д. количество домино. Мануфакторий полностью самостоятелен и требует от своего владельца лишь
    мысленной команды, дабы начать свою работу, хоть ресурсы и поступают из самого ада для производства,
    но мануфакторий не способен производить объекты искусства в любом виде.
- name: Недвижимая смерть
  slug: nedvizhimaya-smert
  tier: lesser
  icon: /images/icons/gifts/len/nedvizhimaya-smert.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: 'Приложив усилие на день, призовите стационарное орудие в свободном радиусе 50 футов от вас. Турель
    имеет с вами мысленную связь, что позволяет ей видеть то, что видит призыватель, и наоборот. Турель
    имеет рейтинг брони, равный 5, и хп, равное удвоенному значению уровня, спасбросок, равный 12 минус
    уровень призывателя, и не способна передвигаться. Турель имеет 1 действие и 1 атаку за действие. Турель
    атакует с +5 на попадание и наносит 1d8+2 урона с радиусом в 150 футов. Усиление: тратя своё действие,
    призыватель нацеливает турель для лучшего выстрела, атака попадает автоматически и прошивает до 5
    футов не божественной материи.'
- name: Пакт Кости и Злобы
  slug: pakt-kosti-i-zloby
  tier: lesser
  icon: /images/icons/gifts/len/pakt-kosti-i-zloby.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: 'Подписывая этот пакт, обе стороны добровольно принимают друг друга как своих Покровителей или
    же Исполнителей. Исполнитель обязуется помогать Покровителю в достижении целей последнего, в то время
    как Покровитель обязуется снабжать исполнителя необходимыми ему ресурсами. Обе стороны знают точное
    местоположение друг друга и способны общаться телепатически на любом расстоянии. Всего с каждой стороны
    может быть по 1 участнику на 3 уровня обожествлённого вплоть до 3, с округлением в большую сторону.
    Обе стороны обязаны иметь душу и не подчиняться другой стороне из-за любого вида контроля над разумом.
    Усиление Лени: При наличии слова Греха: Лени у обоих сторон, исполнитель получает дополнительное ХД,
    равное уровню своего сильнейшего Покровителя, с максимумом в 10 ХД.'
- name: Пакт Молота
  slug: pakt-molota
  tier: lesser
  icon: /images/icons/gifts/len/pakt-molota.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: 'Усилие: день'
  body: 'Подписывая этот пакт, группа лиц назначается исполнителем воли своего Покровителя. Отряд вплоть
    до большой орды получает из-за этой связи 1 ХД каждому члену орды, а бонус к попаданию становится
    равным уровню Покровителя. Мораль орды становится равной 12. Усиление Лени: вне зависимости от природы
    толпы, Покровитель может призвать их к себе за усилие до конца дня или же воскресить, если те пали.'
- name: Тысяча и одна рука
  slug: tysyacha-i-odna-ruka
  tier: lesser
  icon: /images/icons/gifts/len/tysyacha-i-odna-ruka.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: 'Усилие: сцена'
  body: 'Демоны лени никогда не остаются одни, даже если они на самом деле одни. Тысячи невидимых слуг
    странствуют по их пятам, дабы передать им предмет, заключить сделку или же сообщить информацию кому-либо
    из известного демону окружения. Демон всегда может взаимодействовать с известными ему НПС и объектами,
    они моментально оказываются у него, если он их имеет, за счёт слуг, даже если до этого он и не нуждался
    в нём. Усиление: Демонический Оутсорс: приложите усилие на сцену, на время следующей сцены в вашем
    прямом распоряжении появится ваш мануфакторий, что находится к вам ближе всего, после чего он вновь
    вернётся на своё место. Усиление: Пакт Молота: ваши верные миньоны всегда имеют достаточное количество
    жизненно необходимого оборудования и припасов для путешествия.'
- name: Эврика
  slug: evrika
  tier: lesser
  icon: /images/icons/gifts/len/evrika.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Умственная активность — необходимый, но утомительный процесс, потому всё должно быть просто и
    эффективно. Раз в сцену демон лени может задать мастеру вопрос о том, как проще всего исполнить свой
    шаг в плане, бою или тактике, дабы достичь определённого результата. Недостижимый результат всё ещё
    останется недостижимым, но путь к нему станет проще. (использовать на свой страх и риск)
- name: Заёмная сила
  slug: zaemnaya-sila
  tier: greater
  icon: /images/icons/gifts/len/zaemnaya-sila.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: день'
  body: Ваша связь с исполнителем ваших контрактов крепчает, и вместе с ней ваша вера в него. Приложив
    усилие на день, вы передаёте усилие тому, с кем вы заключили контракт, что ещё должен быть исполнен.
    Исполнитель может прикладывать это усилие до тех пор, пока истинный хозяин не получит его обратно.
- name: Нарушитель порядка
  slug: narushitel-poryadka
  tier: greater
  icon: /images/icons/gifts/len/narushitel-poryadka.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: сцена'
  body: Тот, кто нарушает ваше ленное время отдыха, должен быть наказан. Приложив усилие на сцену, вы
    помечаете противника приоритетной целью для ваших конструктов, призванных существ и слуг, для которых
    броня цели считается равной 9, а урон считается максимальным. Целью может быть выбрано как одиночное
    лицо, так и группа существ, так и фракция, но лишь на эту сцену.
- name: Подушка мой друг, а кровать моя крепость
  slug: podushka-moy-drug-a-krovat-moya-krepost
  tier: greater
  icon: /images/icons/gifts/len/podushka-moy-drug-a-krovat-moya-krepost.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: Без Усилия
  body: 'Не гоже владыке без своей крепости: имея свободное пространство 10 на 10 футов, вы можете призвать
    своё скромное укрытие, что обеспечит вас и ещё десяток существ за каждый ваш уровень всем необходимым
    для хорошего отдыха, став так же укрытием от любых природных угроз. Лишь существа, приглашённые хозяином
    покоев, могут войти. Атака в любой форме будет замечена, как и попытка проникновения или же попытка
    сдвинуть конструкцию. Оружие, не предназначенное для сноса укреплённых сооружений, не может навредить
    постройке, имеющей при этом количество Хит-Дайсов, равное уровню хозяина, умноженному на 4. Сооружение
    невозможно покинуть никак иначе, кроме предназначенного выхода. При разрушении сооружения все, кто
    находился внутри, оказываются снаружи в незанятом пространстве.'
