name: Песнь
kind: canon
colors:
  glow: '#d9a5ff'
  deep: '#2a1436'
  dark: '#110818'
icon: /images/icons/words/pesn.webp
description: |-
  Музыка — одна из древнейших сил красоты в мире, сложившаяся бессчётными способами у бессчётных культур и цивилизаций. Связанный со Словом Песни властвует над созвучием и звуком во всех их видах.

  Одарённые Песнью могут установить значение Харизмы равным 16 или 18, если оно уже равно 16 или больше. Они обладают неуязвимым иммунитетом к звуковым атакам, враждебным эффектам на основе звука и к попыткам заглушить издаваемые ими звуки — даже кляпом или физическим удалением голосовых связок, — и могут действием В ход призвать любой музыкальный инструмент, которым когда-либо пользовались. Они могут по желанию извлекать музыку, не мешая никаким другим своим действиям, и без особых усилий играют на любом инструменте на пике человеческого мастерства. Божества Песни легко принимаются просвещёнными цивилизациями и часто щедро ими любимы.
gifts:
- name: Арфист Играет на Струнах Сердца
  slug: arfist-igraet-na-strunah-serdtsa
  tier: lesser
  icon: /images/icons/gifts/pesn/arfist-igraet-na-strunah-serdtsa.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Своей музыкой наполните выбранных слушателей мощным чувством, обращённым на
    цель или предмет по вашему выбору. До Огромной Толпы меньших противников в пределах слышимости затронуты,
    пока Усилие приложено. Достойные противники могут пройти спасбросок Духа, чтобы противостоять; при
    провале они оправятся не более чем за сутки. Люди под таким влиянием будут действовать на пределе
    своего природного характера; бойцы, наполненные страхом или отчаянием, должны пройти проверку Морали.
    Союзникам, наполненным отвагой, по усмотрению Ведущего можно дать Мораль 11 или бонус к спасброскам
    Духа.
- name: Куплет Бессмертной Славы
  slug: kuplet-bessmertnoy-slavy
  tier: lesser
  icon: /images/icons/gifts/pesn/kuplet-bessmertnoy-slavy.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Ваша музыка вдохновляет того, кто иначе был бы повержен, позволяя
    ему стряхнуть страшнейшие удары. Ваш союзник обретает неуязвимую защиту от любого вреда до начала
    своего следующего хода. Вы можете применить эту силу и для собственной пользы, а как Мгновенную её
    можно включить уже после того, как урон или эффекты брошены.
- name: Напев Диссонанса
  slug: napev-dissonansa
  tier: lesser
  icon: /images/icons/gifts/pesn/napev-dissonansa.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Ваш голос или музыка становятся оружием, наносящим 1к10 базового эмоционального
    урона на дальности до 200 футов. Против жёстких неодушевлённых предметов — стекла, металла, камня
    или керамики — ваш голос наносит урон напрямую и за каждый раунд применения может пробить отверстие
    размером с человека глубиной в фут за уровень.
- name: Несокрушимая Гармония
  slug: nesokrushimaya-garmoniya
  tier: lesser
  icon: /images/icons/gifts/pesn/nesokrushimaya-garmoniya.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены и выберите видимое существо или Толпу. Вы входите в совершенное
    созвучие с ними и их действиями. Вы обретаете неуязвимую защиту от всех их атак и сил, а они — такую
    же от ваших. Это длится до конца сцены или пока вы не решите сбить ритм; жертва может защитно рассеять
    эффект, если у неё есть подходящее Слово, но спасброском противостоять не может. Такое созвучие можно
    удерживать против достойного противника до двух раундов на уровень Обожествлённого. Если созвучие
    удерживалось не меньше раундов, чем у цели хит-дайсов, она должна быть готова хотя бы попытаться терпеть
    Обожествлённого — если только не враждебна ему непримиримо и по веской причине. Этот дар даёт хотя
    бы краткую возможность попытаться найти общий язык или договориться о перемирии с большинством разумных
    противников.
- name: Поэзия в Движении
  slug: poeziya-v-dvizhenii
  tier: lesser
  icon: /images/icons/gifts/pesn/poeziya-v-dvizhenii.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Пока вы непрерывно поёте или играете на музыкальном инструменте, все меньшие противники считают
    ваш класс защиты равным 3, и вы можете повторить любой проваленный спасбросок Уклонения. Достойным
    противникам даётся спасбросок Духа, чтобы считать ваш класс защиты обычным.
- name: Созвучие Творения
  slug: sozvuchie-tvoreniya
  tier: lesser
  icon: /images/icons/gifts/pesn/sozvuchie-tvoreniya.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие. Пока Обожествлённый поёт или играет на своём инструменте, он может вызывать
    к жизни живоподобные подобия, действующие по его желанию, если те в основном держатся общего замысла
    сочинения. Эти призванные подобия не годятся для боя против достойных противников, но могут навалиться
    на меньшего противника и одолеть его. Обожествлённый может приложить Усилие до конца сцены, чтобы
    вызвать Маленькую Толпу из них с характеристиками обычных людей. Они тают, как только Обожествлённый
    прекращает музыку.
- name: Хор, Подобный Дальнему Грому
  slug: hor-podobnyy-dalnemu-gromu
  tier: lesser
  icon: /images/icons/gifts/pesn/hor-podobnyy-dalnemu-gromu.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Ваш голос или музыка пробиваются сквозь любую немагическую преграду и могут быть слышны на расстоянии
    до десяти миль на уровень персонажа. Вы можете настроить этот звук так, чтобы его слышали только определённые
    люди или группы, и слышать любые их ответы, если они пропеты. Требования созвучия у этого дара означают,
    что он не может усиливать большинство атак и враждебных сил. Приложите Усилие до конца сцены как действие,
    чтобы оглушить до Огромной Толпы меньших противников или одного достойного противника. Достойные противники
    могут проходить спасбросок Стойкости в конце каждого своего раунда, чтобы прекратить этот эффект.
- name: Зов Сирены
  slug: zov-sireny
  tier: greater
  icon: /images/icons/gifts/pesn/zov-sireny.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Прекрасный голос или чарующая музыка Обожествлённого влекут неосторожных на
    погибель. Выберите видимое существо, Маленькую Толпу или одного достойного противника, который вас
    слышит. У меньших противников нет защиты, и их неизбежно повлечёт навстречу своей участи, даже если
    это верная смерть — например, прыжок за борт. Достойным противникам даётся спасбросок Духа, чтобы
    противостоять коварной мелодии. В тот раунд, когда вы прерываете этот эффект, вы можете автоматически
    попасть по цели любой атакой, и ваш бросок урона автоматически даёт максимум. Нельзя применять этот
    дар дважды к одной цели в одной сцене. Если цель выживет, она получает бонус +4 ко всем будущим спасброскам
    Духа против этого дара.
- name: Темп Нарастает
  slug: temp-narastaet
  tier: greater
  icon: /images/icons/gifts/pesn/temp-narastaet.webp
  badges:
  - type: act
    text: Действие
  - type: smite
    text: Кара
  - type: eff
    text: 'Усилие: сцена'
  - type: eff
    text: 'Усилие: день'
  body: Чтобы купить этот дар, нужен малый дар «Хор, Подобный Дальнему Грому». Приложите Усилие до конца
    сцены, если дар применяется на завершении песни или музыкального сочинения длиной хотя бы в пару минут.
    Приложите Усилие до конца дня, если он применяется без всякого музыкального нарастания. Ваш голос
    или музыка становятся неудержимой волной звукового разрушения. Все каменные, стеклянные, деревянные
    и металлические сооружения крупнее доспеха разлетаются на куски в полосе шириной 20 футов и длиной
    50 футов на уровень. Враги в этой зоне получают по одному очку урона за уровень персонажа, а Толпы
    — 1к6 напрямую за уровень. Вы можете сузить область эффекта и пощадить отдельных людей или предметы,
    но только при использовании подготовленного варианта этого дара.
- name: Хозяин/Хозяйка Мелодии
  slug: hozyain-hozyayka-melodii
  tier: greater
  icon: /images/icons/gifts/pesn/hozyain-hozyayka-melodii.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: по желанию'
  body: Вы полностью управляете всеми звуками в области вашей линии взгляда. Мгновенным действием вы можете
    создать или изменить любой звук в этой области, включая гашение или перенаправление звуковых атак
    и магии на основе звука, а также подделку голосов и слов. Сосредоточившись на одно действие, вы можете
    ясно слышать и понимать всю речь в затронутой области независимо от языка и незаметно общаться с находящимися
    в ней людьми. Вы всегда успешно проходите проверки скрытности и слуха, связанные со звуком. Кроме
    того, вы всегда знаете о любом почитателе, который поёт песню или играет на инструменте, которым вы
    его лично обучили, и можете приложить Усилие, чтобы наделить либо собрание меньших приверженцев, либо
    одного достойного почитателя одним из ваших малых даров. Они сохраняют его, пока это Усилие приложено.
