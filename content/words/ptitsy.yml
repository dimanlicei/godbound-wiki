name: Птицы
kind: supplement
colors:
  glow: '#9fd6f2'
  deep: '#1d3040'
  dark: '#0a141c'
icon: /images/icons/words/ptitsy.webp
description: |-
  Слово Птиц — пример тех сил, что могут быть дарованы образцу одного-единственного вида животных. Такие дары не мощнее Слова Зверей, но могут коснуться сил или милостей, слишком частных для более широкого Слова.

  Связанные со Словом Птиц могут летать со своей базовой скоростью передвижения и свободно общаться с любым пернатым существом. Немагические птицы никогда не причинят им вреда по своей воле и подчинятся даже самоубийственным приказам Обожествлённого, выполняя их с разумением и пониманием обычного человека. Впрочем, птицы легко отвлекаются, и потому удержать их на службе таким образом дольше одной сцены за раз нельзя.
gifts:
- name: Багряное Пике Хищника
  slug: bagryanoe-pike-hischnika
  tier: lesser
  icon: /images/icons/gifts/ptitsy/bagryanoe-pike-hischnika.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены и выберите видимую цель в пределах мили. Обожествлённый мгновенно
    оказывается рядом с целью, если между ними нет преграды, которую нельзя облететь. До конца сцены Обожествлённый
    может действием Перемещения переноситься к цели, куда бы та ни двинулась, пока она остаётся в пределах
    мили. Если цель — меньший противник, Обожествлённый может своей атакой автоматически её обезоружить
    либо подхватить и унести, убив или оставив совершенно беспомощной, пока не отпустит.
- name: Вершина Стаи
  slug: vershina-stai
  tier: lesser
  icon: /images/icons/gifts/ptitsy/vershina-stai.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Обожествлённый может телепатически связаться с любой отдельной
    птицей, которую он лично видел прежде, смотреть её глазами и слышать то, что слышит она. Обычными
    птицами и птицами — меньшими противниками можно повелевать так, как если бы они были рядом. Достойным
    противникам приказывать нельзя, но и помешать Обожествлённому связаться с ними или разделить их чувства
    они не могут. Эта связь длится сцену.
- name: Глаза Охотящегося Ястреба
  slug: glaza-ohotyaschegosya-yastreba
  tier: lesser
  icon: /images/icons/gifts/ptitsy/glaza-ohotyaschegosya-yastreba.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: 'Приложите Усилие. Обожествлённый обретает невероятную остроту зрения: он видит при любом освещении
    и ясно различает мельчайшие детали любой цели ближе горизонта. Немагическая скрытность против него
    бесполезна, а обычным образом спрятанные предметы и особенности местности бросаются в глаза.'
- name: Когти и Клюв
  slug: kogti-i-klyuv
  tier: lesser
  icon: /images/icons/gifts/ptitsy/kogti-i-klyuv.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. У Обожествлённого отрастают острые когти, бритвенный клюв, режущие перья или
    иное природное оружие, подобающее птице. Это оружие ближнего боя наносит 1к10 урона. В первый раз
    за сцену, когда Обожествлённый совершает атаку в падении с высоты не менее 50 футов, атака попадает
    автоматически, а урон бросается дважды с выбором лучшего результата.
- name: Пернатая Мантия
  slug: pernataya-mantiya
  tier: lesser
  icon: /images/icons/gifts/ptitsy/pernataya-mantiya.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Обожествлённый принимает облик птицы — не меньше колибри и не больше самой крупной обычной птицы
    этих краёв. Это превращение не меняет особых способностей Обожествлённого, и он не получает никаких
    неприродных способностей новой птичьей формы. Превращение длится сколько угодно и отменяется действием
    В ход. Если Обожествлённый приложит Усилие до конца сцены, он может применить такое же превращение
    к любой цели в пределах видимости; достойные противники получают спасбросок Стойкости, чтобы противостоять,
    и до конца сцены становятся невосприимчивы к этой силе. Меньшие противники сопротивляться не могут.
    Превращение сохраняется, пока Обожествлённый не отпустит их или пока способность не будет рассеяна.
    Превращённые птицы не подпадают под врождённую власть этого Слова над птицами.
- name: Песнь Соловья
  slug: pesn-solovya
  tier: lesser
  icon: /images/icons/gifts/ptitsy/pesn-solovya.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Песнь Обожествлённого — человеческая ли, птичья ли — чарует слушателей.
    Песнью можно передать одну простую мысль, и она может затронуть до Большой Толпы слушателей. Слушатели
    поверят, что эта мысль верна, или станут исполнять её до предела своего природного нрава и личного
    благополучия. Мысли, которые не противоречат наблюдаемой очевидности или природным склонностям, будут
    считаться верными и впредь, пока не окажутся опровергнуты. Меньшие противники не могут противиться
    этой песни, но достойные противники могут пройти спасбросок Духа, чтобы стать невосприимчивыми к ней
    до конца сцены.
- name: Быстрота Штормового Ветра
  slug: bystrota-shtormovogo-vetra
  tier: greater
  icon: /images/icons/gifts/ptitsy/bystrota-shtormovogo-vetra.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Скорость полёта Обожествлённого удваивается, а при путешествии по суше без остановок он может
    разгоняться до 100 миль в час. Преследуя летящее существо или убегая от него, он неизменно уходит
    от цели или настигает её. Приложив Усилие Мгновенным действием, Обожествлённый может наделить видимое
    существо своей скоростью полёта на всё время, пока Усилие приложено. Одно такое приложение делит силу
    полёта с полудюжиной союзников. Если владелец потеряет сознание или отзовёт Усилие, союзники немедленно
    и невредимо опустятся на землю.
- name: Принц Воздуха
  slug: prints-vozduha
  tier: greater
  icon: /images/icons/gifts/ptitsy/prints-vozduha.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: 'Любое летящее или находящееся в воздухе существо или предмет подпадает под гнев Обожествлённого:
    его атаки по таким целям всегда наносят максимальный урон, а любые наступательные силы, применённые
    против таких целей, накладывают -2 на их спасброски и наносят максимальный урон либо дают наибольший
    возможный результат броска. Если применить этот дар как чудо, он действует один раунд.'
- name: Творец Крыльев
  slug: tvorets-krylev
  tier: greater
  icon: /images/icons/gifts/ptitsy/tvorets-krylev.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Обожествлённый может создать из ничего до Маленькой Толпы обычных
    птиц или призвать Большую Толпу местных птиц, которые прибудут в течение десяти минут. Эта Толпа обладает
    боевыми характеристиками Толпы человеческих солдат, но со скоростью полёта 60 футов, ограниченными
    возможностями что-либо держать и хватать и невосприимчивостью к любому немагическому источнику урона,
    который не убил бы заметное число отдельных птиц, — например, к выпадам копья одного человека. Обожествлённый
    может управлять лишь одной Толпой за раз, а смена приказов Толпе требует ещё одного действия. Эти
    птицы абсолютно преданы и будут выполнять приказы, пока не будут уничтожены или пока не кончится сцена.
