name: Люди
kind: canon
colors:
  glow: '#e2cf9d'
  deep: '#2a2418'
  dark: '#100e09'
icon: /images/icons/words/lyudi.webp
description: |-
  Обожествлённый Людей — воплощение человеческих множеств и тех городских сплетений камня, дерева и глиняного кирпича, что возникают, когда человечество собирается вместе и стремится возвыситься. Его влияние простирается на зачастую безликое население его владений — на простых мужчин и женщин, которые составляют общину, а не толпу. Он также властен над зданиями города и его глубинными основами, повелевая камнем и улицей, как другой Обожествлённый повелевает огнём или яростной молнией.

  Связанные со Словом Людей могут перемещаться где угодно в городе, проходя сквозь стены и прочие постройки, будто их нет. Они безупречно сливаются с местными жителями, говорят на их языке и знают о городе всё, что знает обычный его обитатель. Побывав в городе однажды, они сохраняют это знание, даже уйдя прочь, и оно обновляется важнейшими текущими событиями. Только достойные противники имеют хоть какой-то шанс раскрыть этот облик горожанина — и то лишь после общения вблизи и при успешном спасброске Духа.

  Для целей этого Слова «город» — это любая осознающая себя, непрерывная община числом более 999 человек, границы которой простираются до самых дальних построек, населённых теми, кто считает себя горожанами.
gifts:
- name: Единый со Многими
  slug: edinyy-so-mnogimi
  tier: lesser
  icon: /images/icons/gifts/lyudi/edinyy-so-mnogimi.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: 'Вы чутьём связаны с простыми горожанами города, пока находитесь в его пределах. Горожане, являющиеся
    меньшими противниками, никогда не начнут насилие первыми, если их не раззадорить всерьёз, и всегда
    окажут те услуги или помощь, которые их не слишком обременят. Вы сами собой ощущаете видных лиц города,
    их местонахождение и общую роль: главарей воровских гильдий, тайных делателей королей, градоначальников
    и известных чиновников, а также всеми любимых столпов общины.'
- name: Незримые Баррикады
  slug: nezrimye-barrikady
  tier: lesser
  icon: /images/icons/gifts/lyudi/nezrimye-barrikady.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: 'Чтобы получить этот дар, нужен дар «Сердце Города». Находясь в связанном городе, приложите Усилие
    до конца сцены и выберите целью до Большой Толпы подопечных в том же городе, независимо от того, знаете
    ли вы, где они, и ощущаете ли их. Они не могут покинуть свою нынешнюю округу: любой путь прочь оказывается
    почему-то перекрыт или сбивает их с толку. По желанию Обожествлённый может вместо этого проклясть
    их так, чтобы любая дорога неизменно выводила их в определённое место. Меньшие противники не могут
    противиться этому дару, а достойные противники могут пройти спасбросок Уклонения, чтобы стать невосприимчивыми
    на сутки. Проклятие длится, пока Обожествлённый не освободит их или пока оно не будет рассеяно; достойные
    противники получают новый спасбросок каждые 24 часа.'
- name: Отвага Множества
  slug: otvaga-mnozhestva
  tier: lesser
  icon: /images/icons/gifts/lyudi/otvaga-mnozhestva.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. Вы вдохновляете и поддерживаете горожан того города, где сейчас
    находитесь. Каждый обычный смертный горожанин получает +1 ХД, бонус к попаданию, равный вашему уровню,
    и Мораль 12, когда сталкивается с угрозой городу в целом. Вы можете исключить из этого блага отдельные
    группы или враждебных местных жителей. Пока дар действует, эта отважная гражданская сила считается
    Достоинством, которое не добавляет группировке новых Бед и которым нельзя пожертвовать при поражении
    в конфликте. Дар и Достоинство действуют, пока вы их не прекратите или не примените дар к другому
    городу. Этот дар нельзя использовать как чудо.
- name: Отец Камня и Улицы
  slug: otets-kamnya-i-ulitsy
  tier: lesser
  icon: /images/icons/gifts/lyudi/otets-kamnya-i-ulitsy.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. Вы можете вызвать к жизни постройки и городские сооружения в духе
    любого известного вам города. Одно применение этого дара создаёт постройки в пределах куба в сто футов
    на уровень персонажа; здания вырастают и складываются в течение часа. Можно вызвать любое сооружение,
    подобающее городу, даже если местность лишена нужных материалов. Здания снабжены обычной обстановкой
    и предметами, подходящими для их назначения. Этот дар нельзя использовать как чудо.
- name: Сердце Города
  slug: serdtse-goroda
  tier: lesser
  icon: /images/icons/gifts/lyudi/serdtse-goroda.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: У вас глубокая, сочувственная связь с выбранным городом, такая, что даже присутствие Мирского
    или Эмпирейского Оберега не может помешать вашей воле. Пока вы лично находитесь в области действия
    Оберега и пока сам Оберег в границах города, его сила уменьшается на ваш уровень персонажа. Однако
    если вы примените свои способности во вред городу в целом, а не лишь нескольким зданиям или людям,
    этот дар нельзя будет применить в том же городе год и один день. Вы можете поддерживать такую связь
    со столькими человеческими городами, сколько у вас уровней персонажа. Город может быть связан лишь
    с одним Обожествлённым за раз.
- name: Скользнуть Меж Булыжников
  slug: skolznut-mezh-bulyzhnikov
  tier: lesser
  icon: /images/icons/gifts/lyudi/skolznut-mezh-bulyzhnikov.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены, стоя на улице, в переулке или на городском проезде. Вы и ваши
    спутники на той же улице мгновенно переносятся в любое место на другой улице того же города. Меньшие
    противники в точке отбытия или прибытия не заметят в вашем перемещении ничего необычного, объяснив
    его себе как быстрый уход или чьё-то присутствие, которого они не приметили.
- name: Шёпот Толпы
  slug: shepot-tolpy
  tier: lesser
  icon: /images/icons/gifts/lyudi/shepot-tolpy.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: день'
  body: Чтобы получить этот дар, нужен дар «Сердце Города». Вы можете говорить с любым человеком в любом
    связанном городе или подслушивать его, если вы с ним встречались. Разговор слышите только вы и цель,
    а подслушивание вовсе незаметно. Меньшие противники не могут противиться этой силе, а достойные противники
    могут пройти спасбросок Духа, чтобы стать невосприимчивыми на сцену; при провале они не догадываются,
    что их подслушивают. Приложив Усилие до конца дня, вы можете отправить послание любой группе в связанном
    с вами городе — от одного человека до целого ремесла, культа или всего населения. Получатели не обязаны
    внять вашему посланию, но воспримут его как внутреннее озарение.
- name: Пастырь Людей
  slug: pastyr-lyudey
  tier: greater
  icon: /images/icons/gifts/lyudi/pastyr-lyudey.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: 'Приложите Усилие до конца дня. Находясь в городе или на пустом пригодном для жизни участке не
    менее тысячи футов в поперечнике, Обожествлённый может создать Маленькую Толпу горожан числом до двадцати
    четырёх человек. Их не творят из ничего: они, скорее всего, уже направлялись сюда — за минуты или
    за месяцы — сами толком не зная почему. Одна из тайн мироздания в том, что их могло притянуть к Обожествлённому
    ещё до того, как он сам понял, что они ему понадобятся. Эти новые горожане будут беспрекословно повиноваться
    Обожествлённому, пока не будут уничтожены или пока он не применит дар снова, после чего прежние пришедшие
    обретают свободу, оставаясь благорасположенными к призвавшему, — хотя жизнью ради него рисковать не
    станут, если эта верность не будет заслужена по-настоящему. Горожане сражаются как обычные человеческие
    солдаты и снабжены обычными умениями и орудиями своих ремёсел. У этого дара есть две разновидности:
    Обожествлённый со Словом Мастерства может создавать горожан, похожих на предельно живоподобных конструктов,
    лишённых всякой воли, кроме как исполнять свою роль. Как вариант, если применить дар там, где ещё
    витает достаточно недавно умерших или упорно неупокоенных человеческих душ, Обожествлённый со Словом
    Смерти может поднять эти души, чтобы они населили новые тела, — и те могут помнить, а могут и не помнить
    о прежней жизни и о том, кем были. И автоматоны, и наделённые душами тела рассыплются, если потом
    покинут город; они не стареют и не могут продолжить род.'
- name: Принять Скипетр
  slug: prinyat-skipetr
  tier: greater
  icon: /images/icons/gifts/lyudi/prinyat-skipetr.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: 'Усилие: по желанию'
  body: Чтобы получить этот дар, нужен дар «Сердце Города». Приложите Усилие. Пока вы остаётесь в связанном
    городе и пока Усилие приложено, его обитатели бессознательно принимают вас за своего законного правителя.
    Вам будут повиноваться так, как повиновались бы градоначальнику, властителю, городскому совету или
    иной верховной власти города, — в той мере, в какой цель вообще уважает кого-либо из них. Даже достойные
    противники, скорее всего, будут чутьём относиться к вам как к настоящему правителю ваших владений,
    хотя до почтительности дело может и не дойти. Этот дар крайне незаметен и пробивается даже сквозь
    приглушающее действие Эмпирейских или Мирских Оберегов. Обитатели, покинувшие город, могут пройти
    спасбросок Духа, чтобы сбросить эту врождённую почтительность, если её у них решительно оспорят, но
    по возвращении она подействует на них вновь.
- name: Столпы Дрожат
  slug: stolpy-drozhat
  tier: greater
  icon: /images/icons/gifts/lyudi/stolpy-drozhat.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: 'Чтобы получить этот дар, нужен дар «Сердце Города». Что дано, то может быть и отнято. Вы проклинаете
    некогда любимый город или какое-то строение в нём. Если целью выбрано городское здание, оно обрушится,
    нанося всем внутри урон, равный уровню персонажа Обожествлённого. Одним проклятием можно обрушить
    целый дворцовый комплекс. Если проклятие обращено на весь город, тот перестаёт быть работоспособным:
    обычные горожане начинают драться друг с другом, и весь город будет покинут и разорён в течение месяца,
    если эту силу не рассеять или если Обожествлённый не смягчится. Большинство Обожествлённых применяют
    этот дар, чтобы покарать дерзких и ускорить собственное умиротворение. Некоторые видят в нём последнюю,
    злобную меру, чтобы лишить победившего врага богатой добычи.'
