name: Желание
kind: canon
colors:
  glow: '#ffa0e0'
  deep: '#33112c'
  dark: '#130610'
icon: /images/icons/words/zhelanie.webp
description: |-
  Слово Желания говорит о влечениях любого рода — как плотских, так и умственных. Оно правит хотением и теми уступками, на которые идут ради утоления мучительной нужды.

  Избранники Желания автоматически поднимают Харизму до 18. Если Харизма уже равна 18, Слово Желания поднимет её до 19, давая бонус +4. По их усмотрению другие находят их романтически привлекательными независимо от своих обычных и природных вкусов.
gifts:
- name: Невыносимая Красота
  slug: nevynosimaya-krasota
  tier: lesser
  icon: /images/icons/gifts/zhelanie/nevynosimaya-krasota.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: 'Против разумных существ — будь то свободные автоматоны, нежить или живые создания — Обожествлённый
    обладает эффективным классом защиты 3, поскольку они не решаются его ударить. Первая атака, которую
    любое существо или Толпа совершает по нему в каждом бою, автоматически промахивается: они медлят с
    ударом.'
- name: Порабощающая Страсть
  slug: poraboschayuschaya-strast
  tier: lesser
  icon: /images/icons/gifts/zhelanie/poraboschayuschaya-strast.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Слова, жесты и внимание Обожествлённого столь дурманящи, что жертва теряет способность
    противиться его желаниям. Его внимание считается атакой магическим оружием 1к10 с дальностью, достаточной,
    чтобы поразить любую цель, способную его видеть. Урон этого дара эмоциональный, он подтачивает волю
    жертвы; если жертва сведена этим эффектом к нулю хитов или хит-дайсов, она восстанавливает один хит
    и до конца сцены становится полной рабой Обожествлённого, выполняя любое несамоубийственное действие,
    но по её окончании возвращает себе самообладание. Этот дар действует только на разумные цели со свободной
    волей, и его применение очевидно сверхъестественно как для наблюдателей, так и для самой цели.
- name: Пылающая Нужда
  slug: pylayuschaya-nuzhda
  tier: lesser
  icon: /images/icons/gifts/zhelanie/pylayuschaya-nuzhda.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Пробудите неодолимое желание к человеку, вещи, роду занятий или к пребыванию в некоем месте. Цели
    будут добиваться желаемого на пределе своего характера — большинство людей пойдёт на всё, кроме легко
    раскрываемых преступлений, — и будут испытывать от этого острое наслаждение. Если приложить Усилие
    до конца сцены, Обожествлённый может затронуть до Большой Толпы целей поблизости. Достойные противники
    получают спасбросок Духа, чтобы противостоять этой силе. Эффект длится, пока не будет рассеян или
    пока Обожествлённый не освободит жертву.
- name: Самообладание
  slug: samoobladanie
  tier: lesser
  icon: /images/icons/gifts/zhelanie/samoobladanie.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Обожествлённый обладает неуязвимым иммунитетом к любому ментальному эффекту, который повлиял бы
    на его желания или поступки. Приложив Усилие до конца сцены, он может на эту сцену распространить
    этот иммунитет на всех союзников в пределах 200 футов.
- name: Утолить Сердце
  slug: utolit-serdtse
  tier: lesser
  icon: /images/icons/gifts/zhelanie/utolit-serdtse.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Погасите желание в сердце видимой цели — к человеку, цели, полу, роду занятий или месту. Ничто,
    связанное с изъятым предметом, больше не сможет заинтересовать цель или доставить ей удовольствие,
    хотя дисциплинированные люди могут всё равно иметь с этим дело из чувства долга. Достойные противники
    получают спасбросок Духа, чтобы противостоять. Если приложить Усилие до конца сцены, Обожествлённый
    может затронуть до Большой Толпы целей поблизости. Эффект длится, пока не будет рассеян или пока Обожествлённый
    не отпустит цель.
- name: Чутьё Блудницы
  slug: chute-bludnitsy
  tier: lesser
  icon: /images/icons/gifts/zhelanie/chute-bludnitsy.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Выберите видимую цель. Получите полное понимание её романтических вкусов, любых значимых удовольствий,
    которые она себе позволяет, и того её желания, которое наиболее уместно для интересов или целей Обожествлённого.
    Если вопрос сформулирован как «что цель хочет в обмен на такую-то услугу или одолжение», раскрывается
    наиболее вероятная необходимая приманка — по решению Ведущего. При использовании против достойного
    противника Обожествлённый должен приложить Усилие до конца сцены.
- name: Мука Желания
  slug: muka-zhelaniya
  tier: greater
  icon: /images/icons/gifts/zhelanie/muka-zhelaniya.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены и выберите видимую цель размером до Большой Толпы. Вложите в неё
    несамоубийственное желание определённой вещи или действия; если цель не тратит хотя бы одно действие
    в свой раунд на это занятие или на добывание этой вещи, она получает одно очко эмоционального урона
    за уровень Обожествлённого. Если она сведена этим к нулю хит-дайсов или хитов, то восстанавливает
    один хит и до конца сцены становится неспособна делать что-либо, кроме как гнаться за этим желанием.
    Достойные противники могут в начале каждого своего раунда пытаться пройти спасбросок Духа, чтобы прекратить
    действие силы, но каждая такая попытка наносит одно очко урона за уровень Обожествлённого. После успешного
    спасброска цель невосприимчива к этому дару до конца сцены. Одновременно можно вложить лишь одно желание,
    и длится оно до конца сцены.
- name: Раб Желания
  slug: rab-zhelaniya
  tier: greater
  icon: /images/icons/gifts/zhelanie/rab-zhelaniya.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены и выберите видимую разумную цель. Меньшие противники становятся
    полными и вечными рабами Обожествлённого, оказывая любую услугу, кроме откровенно самоубийственной.
    Достойные противники получают спасбросок Духа, чтобы противостоять этой силе; если их не освободят,
    порабощение длится, пока не будет рассеяно или пока они не проведут не менее 24 часов вообще без какого-либо
    соприкосновения с поработившим их Обожествлённым.
- name: Яблоко Раздора
  slug: yabloko-razdora
  tier: greater
  icon: /images/icons/gifts/zhelanie/yabloko-razdora.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Обожествлённый должен предложить видимой цели нечто желанное для неё — человека, вещь или услугу
    — в обмен на некое одолжение или действие с её стороны. Если цель сильно желает предложенного и не
    имеет важной причины отказаться от сделки, она обязана согласиться и добросовестно исполнить свою
    часть. Если предложенное — недостаточная плата или у цели есть веская причина не соглашаться, достойный
    противник может пройти спасбросок Духа, чтобы противостоять этой силе и стать невосприимчивым к ней
    до конца сцены. Меньшие противники не получают спасброска даже против чудовищно невыгодных сделок.
    Этот дар не может побудить цель к самоубийственному или глубоко противному её природе поступку. Если
    Обожествлённый пообещает услугу и не исполнит её, то на год и один день он не сможет успешно пройти
    ни одного спасброска против обиженной цели и уклониться ни от одной её атаки. Дар действует незаметно,
    и затронутая цель обычно не заподозрит магического влияния, если только сделка не была явно неравной.
