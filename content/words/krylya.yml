name: Крылья
kind: canon
colors:
  glow: '#bfe3ff'
  deep: '#12304a'
  dark: '#061421'
icon: /images/icons/words/krylya.webp
description: Связанные со Словом Крыльев обладают огромными ангельскими крыльями, могут летать со скоростью,
  вдвое превышающей их базовую скорость передвижения, и свободно общаться с любым пернатым существом.
  Немагические птицы никогда не причинят им вреда по своей воле и подчинятся даже самоубийственным приказам
  Обожествлённого, выполняя их с разумением и пониманием обычного человека. Впрочем, птицы легко отвлекаются,
  и потому удержать их на службе таким образом дольше одной сцены за раз нельзя.
gifts:
- name: Ангельский Глас
  slug: angelskiy-glas
  tier: lesser
  icon: /images/icons/gifts/krylya/angelskiy-glas.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Голос Обожествлённого — в человеческом ли облике, в птичьем —
    чарует слушателей. Одну простую просьбу можно ненавязчиво донести до слушателей числом до Большой
    Толпы. Подопечные будут стараться исполнить её до предела своего характера и личного благополучия
    до конца сцены. Просьбы, отвечающие их природным склонностям, будут исполняться и дальше, пока не
    выяснится обратное. Меньшие противники не могут противиться этому дару, а достойные противники могут
    пройти спасбросок Духа, чтобы стать невосприимчивыми к нему до конца сцены.
- name: Глаза Охотящегося Ястреба
  slug: glaza-ohotyaschegosya-yastreba
  tier: lesser
  icon: /images/icons/gifts/krylya/glaza-ohotyaschegosya-yastreba.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: 'Приложите Усилие. Обожествлённый обретает невероятную остроту зрения: он видит при любом освещении
    и ясно различает мельчайшие детали любой цели ближе горизонта. Немагическая скрытность против него
    бесполезна, а обычным образом спрятанные предметы и особенности местности при взгляде сверху бросаются
    в глаза.'
- name: Гром Среди Ясного Неба
  slug: grom-sredi-yasnogo-neba
  tier: lesser
  icon: /images/icons/gifts/krylya/grom-sredi-yasnogo-neba.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены и выберите видимую цель в пределах мили. Обожествлённый мгновенно
    оказывается рядом с целью, если между ними нет преграды, которую нельзя облететь. До конца сцены Обожествлённый
    может использовать своё действие передвижения, чтобы броситься к цели, как бы далеко та ни переместилась,
    — лишь бы она оставалась в пределах мили. Если цель — меньший противник, Обожествлённый может своей
    атакой автоматически смять или выпотрошить её силой падения либо подхватить её на лету, убив или сделав
    совершенно беспомощной, пока не отпустит.
- name: Пернатая Мантия
  slug: pernataya-mantiya
  tier: lesser
  icon: /images/icons/gifts/krylya/pernataya-mantiya.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Обожествлённый принимает облик птицы — не меньше колибри и не больше самой крупной обычной птицы
    этих краёв. Это превращение не меняет особых способностей Обожествлённого, и он не получает никаких
    неприродных способностей новой птичьей формы. Превращение длится сколько угодно и отменяется действием
    В ход. Если Обожествлённый приложит Усилие до конца сцены, он может применить такое же превращение
    к любой цели в пределах видимости; достойные противники получают спасбросок Стойкости, чтобы противостоять,
    и до конца сцены становятся невосприимчивы к этой силе. Меньшие противники сопротивляться не могут.
    Превращение сохраняется, пока Обожествлённый не отпустит их или пока способность не будет рассеяна.
    Превращённые птицы не подпадают под врождённую власть этого Слова над птицами.
- name: Перья Бритвенной Стали
  slug: perya-britvennoy-stali
  tier: lesser
  icon: /images/icons/gifts/krylya/perya-britvennoy-stali.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Крылья Обожествлённого вспыхивают смертоносными бритвенно-острыми перьями, способными
    обезглавить или выпотрошить любого врага не хуже меча. Это оружие ближнего боя наносит 1к10 повреждений.
    Первый раз за сцену, когда владелец совершает атаку в пикировании с высоты не менее 50 футов по данному
    противнику, атака автоматически попадает, а урон бросается дважды с выбором лучшего результата. Кроме
    того, Обожествлённый может метать свои бритвенные перья на дальность до 200 футов.
- name: Принц Воздуха
  slug: prints-vozduha
  tier: lesser
  icon: /images/icons/gifts/krylya/prints-vozduha.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Обожествлённый может телепатически связаться с любой отдельной
    птицей, которую он лично видел прежде, смотреть её глазами и слышать то, что слышит она. Обычными
    птицами и птицами — меньшими противниками можно повелевать так, как если бы они были рядом. Достойным
    противникам приказывать нельзя, но и помешать Обожествлённому связаться с ними или разделить их чувства
    они не могут. Эта связь длится сцену.
- name: Быстрота Штормового Ветра
  slug: bystrota-shtormovogo-vetra
  tier: greater
  icon: /images/icons/gifts/krylya/bystrota-shtormovogo-vetra.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Скорость полёта Обожествлённого удваивается, а при путешествии по суше без остановок он может
    разгоняться до 100 миль в час. Преследуя летящее существо или убегая от него, он неизменно уходит
    от любой цели или настигает её, если только у той нет божественной быстроты. Кроме того, гром его
    крыльев столь силён, что все дальнобойные атаки по находящемуся в воздухе Обожествлённому считают
    его класс защиты равным 1.
- name: Вершина Стаи
  slug: vershina-stai
  tier: greater
  icon: /images/icons/gifts/krylya/vershina-stai.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Обожествлённый может создать из ничего до Маленькой Толпы обычных
    птиц или призвать Большую Толпу местных птиц, которые прибудут в течение десяти минут. Эта Толпа обладает
    боевыми характеристиками Толпы человеческих солдат, но со скоростью полёта 60 футов, ограниченными
    возможностями что-либо держать и хватать и невосприимчивостью к любому немагическому источнику урона,
    который не убил бы заметное число отдельных птиц, — например, к выпадам копья одного человека. Обожествлённый
    может управлять лишь одной Толпой за раз, а смена приказов Толпе требует ещё одного действия. Эти
    птицы абсолютно преданы и будут выполнять приказы, пока не будут уничтожены или пока не кончится сцена.
- name: Ярость Серафима
  slug: yarost-serafima
  tier: greater
  icon: /images/icons/gifts/krylya/yarost-serafima.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: 'Любое летящее или находящееся в воздухе существо или предмет подвластны гневу Обожествлённого:
    его атаки по таким противникам всегда попадают и наносят максимальный урон, а любые враждебные силы,
    применённые к таким целям, дают -2 к их спасброскам и наносят максимальный урон либо дают максимально
    возможный бросаемый эффект.'
