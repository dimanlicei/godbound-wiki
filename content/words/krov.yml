name: Кровь
kind: canon
colors:
  glow: '#ff7a86'
  deep: '#3b0a10'
  dark: '#140407'
icon: images/icons/words/krov.webp
description: |-
  Связанные со Словом Крови не могут погибнуть от немагического оружия, если только кто-то не потратит немало времени вне боя, чтобы разрубить их на куски и сжечь дотла или иначе разделать их противоестественно живучую плоть магическими орудиями; при нуле хитов они, как обычно, просто теряют сознание.

  Герои со Словом Крови также поднимают Телосложение до 16 или до 18, если оно уже равно 16 или больше.
gifts:
- name: Испить из Родника Жизни
  slug: ispit-iz-rodnika-zhizni
  tier: lesser
  icon: images/icons/gifts/krov/ispit-iz-rodnika-zhizni.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Обожествлённый крадёт жизненную силу своих величайших врагов. Раз за ход, нанося урон достойному
    противнику, он может исцелить себе 2 очка повреждений.
- name: Кража Жизненной Силы
  slug: krazha-zhiznennoy-sily
  tier: lesser
  icon: images/icons/gifts/krov/krazha-zhiznennoy-sily.webp
  badges:
  - type: act
    text: Действие
  - type: smite
    text: Кара
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Вы поражаете выбранного живого противника в пределах видимости,
    нанося половину от (кость урона 1к8 за уровень персонажа) с округлением вверх. Нанесённый урон восстанавливает
    вам столько же хитов. Любое существо, связанное со Словом Крови, невосприимчиво к этой силе.
- name: Кровавое Кукловодство
  slug: krovavoe-kuklovodstvo
  tier: lesser
  icon: images/icons/gifts/krov/krovavoe-kuklovodstvo.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Вы оживляете собственную кровь, создавая щупальца, конечности или иные отростки,
    способные вытягиваться на шестьдесят футов и выдерживать ваш вес. Эти отростки можно перерубить уроном,
    равным вашему уровню, но вам это вреда не причиняет, и вы можете воссоздать их действием В ход.
- name: Кровавый Клинок
  slug: krovavyy-klinok
  tier: lesser
  icon: images/icons/gifts/krov/krovavyy-klinok.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Вы создаёте оружие ближнего боя или наделяете его способностью вашей крови вытягивать
    жизнь. При атаке оно наносит 1к10 повреждений и считается магическим оружием. Всякий, кого вы поразили
    атакой этим оружием, в этом раунде наносит вам на одно очко урона меньше любыми своими атаками против
    вас; эффект не складывается.
- name: Пожиратель Сути
  slug: pozhiratel-suti
  tier: lesser
  icon: images/icons/gifts/krov/pozhiratel-suti.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. Эта сила позволяет Обожествлённому поглотить любой малый дар, заклинание
    или способность, применённые против него враждебно. Кроме того, нападающий до конца дня не сможет
    снова воспользоваться поглощённой силой, пока сам не приложит Усилие до конца дня и не пройдёт успешный
    спасбросок Стойкости. Пытаться он может начиная со следующего раунда после того, как сила была «съедена».
- name: Поля Бойни
  slug: polya-boyni
  tier: lesser
  icon: images/icons/gifts/krov/polya-boyni.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Противоестественная жизненная сила питает вас и позволяет вашей обнажённой плоти сносить большинство
    ударов. Ваш естественный класс защиты равен 3. Кроме того, любой умирающий враг в пределах 100 футов
    исцеляет Обожествлённому 1 очко повреждений, если истекает кровью на ту же поверхность или землю,
    на которой стоит персонаж. Для этого Обожествлённый должен быть босым.
- name: Алый Поводок
  slug: alyy-povodok
  tier: greater
  icon: images/icons/gifts/krov/alyy-povodok.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: день'
  body: Вы всегда знаете точное местоположение, душевное состояние и телесное здоровье любого, чью свежепролитую
    кровь вы когда-либо пробовали. Вы можете говорить с ним через кровь, и он может отвечать. Вы можете
    приложить Усилие до конца дня, чтобы принудить затронутого меньшего противника совершить любое действие,
    занимающее не больше сцены, даже самоубийственное. Для этой силы довольно даже капли крови размером
    с укол булавки, если она пролита за последние 20 часов.
- name: Врата Крови и Плоти
  slug: vrata-krovi-i-ploti
  tier: greater
  icon: images/icons/gifts/krov/vrata-krovi-i-ploti.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Вместо действия передвижения вы можете выйти из любой лужи крови не меньше мыши в пределах 100
    футов от вас. Это касается и любых истекающих кровью живых существ — вы вырываетесь из них так, что
    кроваво убиваете любого меньшего противника. Проделанное с достойным противником это, скорее всего,
    выбьет его из колеи, но иного вреда не причинит. Вы постоянно ощущаете точное местоположение всех
    свежих источников пролитой крови в пределах досягаемости. Приложив Усилие до конца сцены, вы можете
    применить эту силу как Кару, равнозначную Божественному Гневу, против достойного противника, из которого
    вы вышли.
- name: Окровавленный Джаггернаут
  slug: okrovavlennyy-dzhaggernaut
  tier: greater
  icon: images/icons/gifts/krov/okrovavlennyy-dzhaggernaut.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. До начала вашего следующего хода вы обладаете неуязвимой защитой
    от любой физической атаки. Ментальный и духовный вред или урон при этом не игнорируются.
