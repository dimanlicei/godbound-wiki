name: Алчность
kind: homebrew
colors:
  glow: '#ffcf63'
  deep: '#332807'
  dark: '#130e03'
icon: /images/icons/words/alchnost.webp
description: 'Слово Греха: Алчность. Несмотря на то что алчность тяжело отличима от других грехов по своему
  смыслу, такое не стоит говорить демонам, что стали гонцами этого греха, ведь каждый из них знает это
  рвущее желание иметь всё лишь для себя без капли милосердия для других, без крохи благочестия для всех
  — ведь всё должно принадлежать лишь им. Ваша алчность шепчет вам настоящую цену вещей, что попадают
  в ваши руки, будь то деньги, книги, неизвестные артефакты или животные. Вы безупречно понимаете, какую
  ценность в себе несёт предмет и какова она для владельца.'
gifts:
- name: Без Жалости
  slug: bez-zhalosti
  tier: lesser
  icon: /images/icons/gifts/alchnost/bez-zhalosti.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: Единожды за цель, приложив усилие, ваша алчность влечёт вас к отчаянной безжалостности даже к
    самому себе во имя вашей выгоды, вы перенимаете ранение, что было нанесено вашему союзнику или объекту,
    который вы хотите защитить. Потратив единицу богатства, вы можете аннулировать этот урон для себя.
- name: Безжалостная Страсть
  slug: bezzhalostnaya-strast
  tier: lesser
  icon: /images/icons/gifts/alchnost/bezzhalostnaya-strast.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложив усилие на день, вы вызываете у одиночной цели или толпы нездоровую одержимость каким-либо
    видом ценности или субъектом. Эта нездоровая одержимость может проявляться по-разному, от собирательства
    хлама до сталкерства и попыток «присвоить» себе объект своей одержимости. Но вне зависимости от цели
    одержимости она будет приносить проблемы и забирать на себя всё внимание цели данного проклятия. Достойные
    противники могут пройти спасбросок духа для преодоления этой одержимости, недостойные противники автоматически
    проваливают спасбросок, становясь одержимыми объектом алчности.
- name: Гончая Черного Рынка
  slug: gonchaya-chernogo-rynka
  tier: lesser
  icon: /images/icons/gifts/alchnost/gonchaya-chernogo-rynka.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Ваше чутьё на алчность и ценности усиливается, отныне вы не только способны определять ценность,
    но и находить самого подходящего покупателя, что способен купить вещь по наилучшей цене. Данный дар
    не создаёт желающего купить у вас что-то, но даёт инстинктивное понимание того, где быстрее, лучше
    или в принципе возможно сбыть тот или иной предмет. Радиус вашего чутья ограничен исключительно вашим
    уровнем — его масштаб равен половине уровня, округлённой в большую сторону.
- name: Дьявольская Сделка
  slug: dyavolskaya-sdelka
  tier: lesser
  icon: /images/icons/gifts/alchnost/dyavolskaya-sdelka.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Заключая сделку, вы приспособились манипулировать чужой алчностью в свою выгоду. Ваши особо крупные
    сделки (ценность исчисляется в богатстве, особо редких вещах, услугах или ином другом жёстком эквиваленте,
    что может оценить мастер) приносят вам больше выгоды, а ваши траты забирают меньше. Данный дар применяется
    исключительно при заключении договоров с персонажами мастера, что способны оплатить выставленную цену.
- name: Жабий Резерв
  slug: zhabiy-rezerv
  tier: lesser
  icon: /images/icons/gifts/alchnost/zhabiy-rezerv.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Ваша алчность таит в себе вашу опору, получите 2 хп за каждый уровень, что вы имеете, и по 2 хп
    за каждый последующий уровень. За каждую единицу богатства, что вы имеете при себе во время начала
    боя, вы получаете 1 ХД с максимумом в 10 ХД.
- name: Клад чахнущего Змея
  slug: klad-chahnuschego-zmeya
  tier: lesser
  icon: /images/icons/gifts/alchnost/klad-chahnuschego-zmeya.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Богатства и роскошь стали вашей крепостью. Избрав здание любой формы и размера, вы можете превратить
    одну из комнат в свою казну. Подобная казна превращается в отдельное измерение, что будет расширяться
    под ваши запросы, но с пределом в сотню футов за уровень персонажа, она всё ещё не будет способна
    перемещаться. Вы получаете инстинктивное понимание того, кто и что находится внутри вашей казны ежесекундно,
    и способны применять дары в её области так, словно бы вы находитесь там.
- name: Вор Асклепия
  slug: vor-asklepiya
  tier: greater
  icon: /images/icons/gifts/alchnost/vor-asklepiya.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: Без Усилия
  body: Единожды за цель вы можете похитить её исцеление. Будь то разовое исцеление в раунде или постоянное
    малое восстановление, вы похищаете эффект целительной силы для себя. Разовые случаи исцеления и вампиризм
    могут быть украдены единожды, в то время как дары, позволяющие регенерировать каждый ход, применяются
    на вас в течение числа раундов, равного вашему уровню. Усилия, затраченные на исцеление, не возвращаются
    их владельцу за потерянное исцеление, и они могут снова его применить.
- name: Златое Руно
  slug: zlatoe-runo
  tier: greater
  icon: /images/icons/gifts/alchnost/zlatoe-runo.webp
  badges:
  - type: eff
    text: Без Усилия
  body: Выберите две фракции, которые получат ваш дар. Одна из фракций получает факт «алчное общество»,
    что усиливает алчность тех, кто причастен напрямую к этой фракции. Вторая же фракция получает «пламенные
    амбиции» как факт, что усиливает амбиции и мотивацию всех членов фракции, напрямую причастных к ней.
    Таким образом вы можете проклясть и возвысить лишь фракцию, чей масштаб не превышает ваш уровень,
    поделённый на 2 в большую сторону. Так же этот дар невозможно имитировать чудом.
- name: Мастерство Мародёра
  slug: masterstvo-marodera
  tier: greater
  icon: /images/icons/gifts/alchnost/masterstvo-marodera.webp
  badges:
  - type: act
    text: Действие
  - type: smite
    text: Кара
  - type: eff
    text: 'Усилие: день'
  body: 'Приложив усилие на день, жажда наживы и богатств толкает вас всё дальше за пределы ваших сил.
    Совершите атаку, что по попаданию нанесёт удвоенный урон и украдёт нечто ценное у него. Данный дар
    может быть использован только в бою. Бросьте 1d20, чтобы определить украденную ценность, и сравните
    со списком: 1 — ваше чутьё вас подвело, вы попытались урвать больше, чем можете унести, и лишь разъярили
    противника, не получив ничего; 2-7 — вы получаете нечто ценное, что может быть продано за 1 богатство
    правильному человеку; 8-13 — вы получаете осколок души и, объединив его с 1 богатством, превращаете
    в монету душ, равную 1 домино; 14-19 — вы получаете секрет, что хранит жертва, связанный с его богатством
    или тайной целью; 20 — вы крадёте усилие жертвы и можете восстановить себе одно усилие, что ранее потратили.'
