name: Взор
kind: canon
colors:
  glow: '#8fdcea'
  deep: '#152a34'
  dark: '#071115'
icon: /images/icons/words/vzor.webp
description: |-
  Врождённая сила Слова Взора — невозможность быть ослеплённым, каким бы ни было освещение и повреждения глаз, а также неуязвимая способность видеть сквозь личины, зрительные иллюзии и силы невидимости в непосредственном окружении. Прочих чувств это не касается. Эта чудовищная сила восприятия также поднимает значение Мудрости до 19, давая модификатор атрибута +4.

  Примечание: обычно ослеплённые или иначе лишённые зрения бойцы получают -4 к попаданию в ближнем бою и вовсе не могут попасть дальними атаками, если у них нет сверхчеловеческих чувств, это возмещающих.
gifts:
- name: Второе Зрение
  slug: vtoroe-zrenie
  tier: lesser
  icon: /images/icons/gifts/vzor/vtoroe-zrenie.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Смотрите глазами цели, будь то человек или зверь. Она должна находиться прямо
    рядом с вами, либо вы должны были касаться её прежде. Достойные противники получают спасбросок Духа,
    чтобы не дать вам подсесть на их зрение, и второй спасбросок Духа, чтобы ощутить ваше внимание.
- name: Незримый Взору
  slug: nezrimyy-vzoru
  tier: lesser
  icon: /images/icons/gifts/vzor/nezrimyy-vzoru.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие, чтобы стать невидимым вместе со своими спутниками. Прочих чувств это не касается,
    и хитрый или звериный противник может выследить вас по запаху или звуку не хуже прежнего. Достойные
    противники получают спасбросок Духа, чтобы противостоять.
- name: Окна Души
  slug: okna-dushi
  tier: lesser
  icon: /images/icons/gifts/vzor/okna-dushi.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Всякий, кто встретится с вами взглядом, до конца сцены не сможет вас обмануть или притвориться
    перед вами. Достойные противники получают спасбросок Духа, чтобы противостоять.
- name: Опустить Завесу
  slug: opustit-zavesu
  tier: lesser
  icon: /images/icons/gifts/vzor/opustit-zavesu.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Ослепите видимую цель или верните ей зрение, даже если её глаза уничтожены.
    Достойные противники получают спасбросок Духа и могут быть исцелены; меньшие противники слепы, пока
    вы не решите иначе. Действует на количество меньших противников до Маленькой Толпы.
- name: Орлиный Глаз
  slug: orlinyy-glaz
  tier: lesser
  icon: /images/icons/gifts/vzor/orlinyy-glaz.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: 'Приложите Усилие. Вы видите с совершенной ясностью на расстояние до десяти миль, и на вас не
    действует немагическая тьма или тень. Вы могли бы прочесть пергамент при мерцающем свете фонаря за
    много миль, будь у вас хоть малейшая линия взгляда. Кроме того, нет ничего слишком быстрого, чтобы
    ваш глаз этого не уследил: вы могли бы сосчитать оперение выпущенной стрелы или высмеять напёрсточника.'
- name: Пронзающий Взгляд
  slug: pronzayuschiy-vzglyad
  tier: lesser
  icon: /images/icons/gifts/vzor/pronzayuschiy-vzglyad.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие. Сосредоточившись на миг, вы можете по желанию видеть сквозь землю и камень.
    Ни гора, ни стена замка не заслонят вашего взгляда. Вы также можете приложить Усилие до конца сцены,
    чтобы немедленно заметить в области всё, что было кем-то намеренно укрыто или спрятано, даже если
    оно за предметом или зарыто. Если вы ищете что-то определённое, оно само собой откроется вам — либо
    станет ясно, что его здесь нет.
- name: Бдение Дозорной Башни
  slug: bdenie-dozornoy-bashni
  tier: greater
  icon: /images/icons/gifts/vzor/bdenie-dozornoy-bashni.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Вы можете выбрать отдельного человека, место размером до города или даже организацию — определённый
    рыцарский Орден или сеть культистов — и задать любое условие, при срабатывании которого ваше внимание
    мгновенно обратится к ним, включая полное понимание того, что вызвало событие. Другими чувствами в
    этом видении пользоваться нельзя, но видно достаточно хорошо, чтобы читать по губам. Вы можете так
    следить за столькими событиями одновременно, сколько у вас уровней. Достойные противники получают
    спасбросок Духа, чтобы осознать, что привлекли сверхъестественное внимание. Это зрение пробивает всё,
    кроме божественных оберегов, направленных именно против Слова Взора.
- name: Всевидящее Око
  slug: vsevidyaschee-oko
  tier: greater
  icon: /images/icons/gifts/vzor/vsevidyaschee-oko.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Чтобы получить этот большой дар, нужно уже иметь малый дар «Орлиный Глаз». Пока вы занимаете высшую
    точку в своём окружении — великую башню или горную вершину, — вы можете приложить Усилие, чтобы расширить
    дальность дара «Орлиный Глаз» до тысячи миль. Это грозное зрение пользуется и «Пронзающим Взглядом»,
    если этот дар у вас тоже есть.
- name: Рождённый в Сорочке
  slug: rozhdennyy-v-sorochke
  tier: greater
  icon: /images/icons/gifts/vzor/rozhdennyy-v-sorochke.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Вас и ваших ближайших спутников нельзя выследить или зрительно обнаружить магией, и никакая подобная
    сила не может установить ваше местоположение. Вы чувствуете, когда другие пытаются применить такие
    способности, включая Слово Взора, к вам или вашим ближайшим спутникам, и можете опознать их, если
    они ниже уровнем. За каждый свой уровень вы можете одновременно распространить эту же защиту на ещё
    одного человека или определённое место (не больше крупного здания или небольшого форпоста) за пределами
    вашего непосредственного присутствия.
