name: Проворство
kind: canon
colors:
  glow: '#8fe6d4'
  deep: '#16302c'
  dark: '#071412'
icon: /images/icons/words/provorstvo.webp
description: |-
  Слово Проворства дарует дары стремительности и невозможного изящества. Чудеса этой силы могут заключаться в том, чтобы выполнить некую задачу за считанные мгновения, уйти от иначе неотвратимой опасности или отозваться на событие прежде, чем его виновник вообще успеет начать. Впрочем, Проворство — это не Странствие, и его перемещения обычно ограничены одним конкретным местом или коротким расстоянием, а не быстрым переносом между далёкими краями.

  Героев со Словом Проворства невозможно застать врасплох. Они могут поднять Ловкость до 16 или до 18, если она уже равна 16 или больше.
gifts:
- name: Буря Разражается
  slug: burya-razrazhaetsya
  tier: lesser
  icon: /images/icons/gifts/provorstvo/burya-razrazhaetsya.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: Перед первым раундом каждого боя или ситуации, где всё решают мгновения, вы можете приложить Усилие
    до конца сцены, чтобы получить один бесплатный дополнительный раунд прежде, чем начнёт действовать
    кто-либо другой. Два героя, применившие этот дар, бросают встречные проверки Ловкости, чтобы определить,
    кто ходит первым.
- name: Быстрее Солнца
  slug: bystree-solntsa
  tier: lesser
  icon: /images/icons/gifts/provorstvo/bystree-solntsa.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Ваша скорость передвижения вдвое выше, чем у самого быстрого вашего преследователя
    или вашей добычи, но не менее 60 футов за действие передвижения. Если вы гонитесь за добычей, обладающей
    божественными дарами, позволяющими уходить от преследования, быстрее оказывается участник с большим
    числом хит-дайсов, а при равенстве — по броску монеты.
- name: Все Направления как Одно
  slug: vse-napravleniya-kak-odno
  tier: lesser
  icon: /images/icons/gifts/provorstvo/vse-napravleniya-kak-odno.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Вы передвигаетесь по отвесным и нависающим поверхностям так, будто это ровная земля. Вы без труда
    проходите пересечённую местность. Вы обладаете неуязвимой защитой от толчков и попыток сбить вас с
    ног.
- name: Мерцающее Продвижение
  slug: mertsayuschee-prodvizhenie
  tier: lesser
  icon: /images/icons/gifts/provorstvo/mertsayuschee-prodvizhenie.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Мгновенно достигните любого места, которое видите невооружённым
    глазом вплоть до горизонта, — а это обычно около трёх миль для персонажа, стоящего на ровной местности.
    С большой высоты предельная дальность вдесятеро больше.
- name: Прогулка Между Каплями Дождя
  slug: progulka-mezhdu-kaplyami-dozhdya
  tier: lesser
  icon: /images/icons/gifts/provorstvo/progulka-mezhdu-kaplyami-dozhdya.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: 'Ваш естественный класс защиты равен 3. Вас не может задеть ничто, не движимое замыслом, если
    вы сами того не позволите: падающие предметы никогда вас не заденут, если только их не привела в движение
    чья-то воля причинить вам вред. Ловушки, рассчитанные на нарушителя, имеют шанс вас поразить. Доспехи
    и щиты вам не помогают.'
- name: Туман над Водой
  slug: tuman-nad-vodoy
  tier: lesser
  icon: /images/icons/gifts/provorstvo/tuman-nad-vodoy.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. До конца вашего хода вы можете игнорировать при движении любую
    твёрдую материю, при условии, что закончите путь там, где физически можете находиться. Во время этого
    немыслимо быстрого рывка вы не можете воздействовать на мир, но обладаете неуязвимой защитой от всех
    немагических форм вреда. Если в конце хода вы окажетесь внутри твёрдого предмета, вас безвредно вытолкнет
    из него в ближайшее свободное место.
- name: Быстрее Мысли
  slug: bystree-mysli
  tier: greater
  icon: /images/icons/gifts/provorstvo/bystree-mysli.webp
  badges:
  - type: act
    text: Мгновенно
  - type: smite
    text: Кара
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены, когда кто-либо видимый объявляет действие. Вы получаете бесплатное
    действие и передвижение целого раунда прежде, чем он успеет совершить задуманное. Если ваше действие
    делает его замысел невозможным, его действие пропадает впустую. Как дар Кары, этот дар нельзя применять
    два раунда подряд.
- name: Всеохватывающее Присутствие
  slug: vseohvatyvayuschee-prisutstvie
  tier: greater
  icon: /images/icons/gifts/provorstvo/vseohvatyvayuschee-prisutstvie.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Дважды за свой ход, действием В ход, вы можете оказаться в любой точке в пределах
    100 футов от своего текущего положения, при условии, что вы могли бы мыслимо добраться туда своими
    силами.
- name: Неприкасаемый
  slug: neprikasaemyy
  tier: greater
  icon: /images/icons/gifts/provorstvo/neprikasaemyy.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены, чтобы до начала вашего следующего хода стать невероятно трудной
    мишенью. Физические атаки попадают по вам только на натуральной 20 — даже те атаки противников, которые
    обычно попадают автоматически. Как Мгновенный дар, его можно применить уже после броска на попадание.
