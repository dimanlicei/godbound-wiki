name: Лук
kind: canon
colors:
  glow: '#bfe0a0'
  deep: '#22301c'
  dark: '#0d1409'
icon: /images/icons/words/luk.webp
description: |-
  Слово Лука охватывает всех божеств дальнего боя — с луком, метательным копьём, пистолетом, ружьём, брошенным кинжалом или пущенной молнией. Герои с даром «Вездесущая Дальнобойность» могут вовсе не пользоваться физическим оружием, а метать заряды подходящей энергии. Такие заряды могут наносить стихийный урон, если герой связан с соответствующими Словами, а могут быть и физическими ударами сокрушительной божественной силы. Чудеса Лука связаны с невероятно точным уроном на огромных расстояниях либо с проклятием и срывом чужой попытки дальней атаки. Учтите, что преимущества даров Лука распространяются только на снаряды и иное оружие или заряды, вызванные дарами этого Слова. Они не действуют на дальние атаки от других Слов и на магию, которая просто применяется на расстоянии, — например, на дар «Божественный Гнев», доступный всем Словам.

  У героев со Словом Лука никогда не кончаются обычные боеприпасы. Они могут мгновенно призвать себе в руки любое дальнобойное или метательное оружие, которым пользовались, с любого расстояния, а их дальние атаки никогда не вредят цели, которую они не собирались задеть. Их дальние атаки всегда считаются магическими для преодоления защит.
gifts:
- name: Вездесущая Дальнобойность
  slug: vezdesuschaya-dalnoboynost
  tier: lesser
  icon: /images/icons/gifts/luk/vezdesuschaya-dalnoboynost.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Предельная дальность вашего дальнобойного оружия равна вашей естественной линии взгляда. Ваше
    метательное оружие всегда наносит не менее 1к10 повреждений и считается магическим оружием. Даже без
    лука или ружья вы можете метать заряды силы или призванное оружие, наносящие 1к10 повреждений.
- name: Ищущий Полёт
  slug: ischuschiy-polet
  tier: lesser
  icon: /images/icons/gifts/luk/ischuschiy-polet.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: сцена'
  body: Выберите видимую цель и приложите Усилие до конца сцены. Ваши дальние атаки находят её независимо
    от расстояния, считают её класс защиты равным 9 и полностью игнорируют укрытие — лишь бы у вашей стрелы
    был хоть какой-то путь до неё.
- name: Никто Не Вне Досягаемости
  slug: nikto-ne-vne-dosyagaemosti
  tier: lesser
  icon: /images/icons/gifts/luk/nikto-ne-vne-dosyagaemosti.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: Без Усилия
  body: У ваших дальних атак нет предельной дальности, если вы видите цель невооружённым глазом или знаете
    её местоположение с точностью до десяти футов. Эта способность действует только в пределах того же
    мира, в котором вы сейчас находитесь.
- name: Оперённая Буря
  slug: operennaya-burya
  tier: lesser
  icon: /images/icons/gifts/luk/operennaya-burya.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. По меньшим противникам вы всегда попадаете дальними атаками. Переливающийся
    урон вы можете распределить на любые другие цели в пределах досягаемости, подпадающие под действие
    этого дара.
- name: Преградить Алый Спуск
  slug: pregradit-alyy-spusk
  tier: lesser
  icon: /images/icons/gifts/luk/pregradit-alyy-spusk.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Вы обладаете неуязвимой защитой от обычных снарядов и получаете не более 1 очка
    урона за попадание от магических. Это касается только настоящего оружия — стрел, пуль, копий, камней
    требушета, — но не заклинаний и магических эффектов.
- name: Стрела Неодолимого Мастерства
  slug: strela-neodolimogo-masterstva
  tier: lesser
  icon: /images/icons/gifts/luk/strela-neodolimogo-masterstva.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Вы всегда попадаете по не подозревающей или неодушевлённой цели, какой бы маленькой она ни была
    и как бы глубоко ни укрывалась. По желанию вы можете приложить Усилие до конца сцены, чтобы ваша текущая
    или следующая дальняя атака нанесла максимальный урон и попала на любом результате, кроме натуральной
    1.
- name: Владыка Всего Падающего
  slug: vladyka-vsego-padayuschego
  tier: greater
  icon: /images/icons/gifts/luk/vladyka-vsego-padayuschego.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Перенаправьте любые дальние атаки оружием, происходящие в вашем присутствии,
    применив их бросок на попадание против новой цели. Атаки достойных противников можно перенаправить,
    только если они стреляют в вас. Снаряды можно перенаправить на любую цель, но одна жертва может быть
    выбрана таким образом не более чем для одной атаки за раунд. Те, кто также связан со Словом Лука,
    невосприимчивы к этой силе, как и прочие божества, связанные с луком.
- name: Дождь Скорби
  slug: dozhd-skorbi
  tier: greater
  icon: /images/icons/gifts/luk/dozhd-skorbi.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Против Толп кости урона ваших дальних атак бросаются напрямую, и к ним прибавляется
    ваш уровень. Так, Обожествлённый 4 уровня, стреляя из оружия 1к10 с бонусом атрибута +2, нанесёт Толпе
    от 7 до 16 хит-дайсов урона. Против целей, не собранных в Толпу, вы можете каждый раунд бросать свою
    кость Схватки против каждого подходящего противника в пределах видимости.
- name: Неумолимое Древко
  slug: neumolimoe-drevko
  tier: greater
  icon: /images/icons/gifts/luk/neumolimoe-drevko.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Ваши дальние атаки бьют с чудовищной силой, при попадании всегда нанося максимальный
    урон. Ваши снаряды пробивают немагические материалы любой толщины, чтобы прошить укрытие, заслоняющее
    цель, хотя доспех цели применяется как обычно.
