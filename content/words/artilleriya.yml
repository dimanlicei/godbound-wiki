name: Артиллерия
kind: homebrew
colors:
  glow: '#ffc07a'
  deep: '#2c1a0c'
  dark: '#0f0805'
icon: images/icons/words/artilleriya.webp
description: 'Слово Сотворения: Артиллерия. Герои Слова Артиллерии никогда не окажутся без обычной амуниции.
  Они могут мгновенно призвать любое тяжёлое дальнобойное оружие в 10 и более футов длиной. Их атаки с
  зоной поражения могут оставлять после себя кратеры до 30 футов в ширину и могут пробивать столько футов
  немагических укреплений, сколько у него уровней. Подобные атаки не могут различать врагов от друзей,
  нанося урон всем. Атаки их дальнобойным оружием с радиусом поражения всегда считаются напрямую против
  толп и считаются магическими.'
gifts:
- name: Из-за горизонта
  slug: iz-za-gorizonta
  tier: lesser
  icon: images/icons/gifts/artilleriya/iz-za-gorizonta.webp
  badges:
  - type: act
    text: Постоянно
  - type: act
    text: В свой ход
  body: Ваши дальнобойные атаки не имеют ограничения в дистанции до тех пор, пока цель не находится в
    другом мире. Если у вас есть относительно точное месторасположение (вплоть до 30 футов) выбранной
    вами цели, вам не нужно её видеть, хотя вы и получаете -4 на выстрел как штраф. Если усилие применено
    на ходу, ваши атаки оружием по площади наносят минимум 1d12 магического урона. Даже без оружия дальнего
    боя с зоной поражения, вы можете призывать болты силового поля с уроном 1d10, что могут считаться
    или же нет оружием с уроном по площади. Оружие Светлой республики в ваших руках работает даже без
    Эфирного Узла.
- name: Координаты переданы
  slug: koordinaty-peredany
  tier: lesser
  icon: images/icons/gifts/artilleriya/koordinaty-peredany.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Вы концентрируетесь, получая относительно точную карту местности вокруг в радиусе 2 миль за уровень.
    Эта карта делает вас осведомлённым о любой толпе существ и конструкций, что заинтересовали бы вас.
    Хотя при этом вы не можете различить одиночек или особые детали сооружений, вы можете различать врагов,
    союзников и нейтралов. Если вы нацелились на здание или толпу в радиусе созданной карты, считайте,
    что видите её для прицеливания.
- name: Принять Удар
  slug: prinyat-udar
  tier: lesser
  icon: images/icons/gifts/artilleriya/prinyat-udar.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите усилие на сцену, защитно развейте для себя один атакующий эффект, что нанёс бы ущерб
    по площади.
- name: Разрушитель Бункеров
  slug: razrushitel-bunkerov
  tier: lesser
  icon: images/icons/gifts/artilleriya/razrushitel-bunkerov.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите усилие на сцену, когда целитесь в что-то или кого-то, что защищён укрытием, дабы гарантировать,
    что ваша следующая или текущая атака попадёт и нанесёт максимальный урон, пробивая любое количество
    немагического материала на своём пути на любом результате, кроме 1. Дыра в 10 футов диаметром будет
    оставлена на пути к цели по совершению удара.
- name: Свистящий Рок
  slug: svistyaschiy-rok
  tier: lesser
  icon: images/icons/gifts/artilleriya/svistyaschiy-rok.webp
  badges:
  - type: act
    text: Действие
  - type: smite
    text: Кара
  - type: eff
    text: 'Усилие: день'
  body: Приложите усилие на день, вы призываете артиллерийскую пушку, что наносит 1d8 урона в радиусе
    30 футов в выбранной вами точке, в поле вашего зрения. Каждая пушка может стрелять в отдельно выбранную
    цель, или же может производиться выстрел со всех орудий в одну точку.
- name: Тяжелая Артиллерия
  slug: tyazhelaya-artilleriya
  tier: lesser
  icon: images/icons/gifts/artilleriya/tyazhelaya-artilleriya.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Ваше оружие с радиусом поражения и особые боеприпасы, что оставляют после своего применения зону
    с вредоносным эффектом, получают удвоение радиуса поражения. Оставленные после вашего оружия кратеры
    становятся труднопроходимой местностью для всех, кто проходит через неё.
- name: Безразличное Уничтожение
  slug: bezrazlichnoe-unichtozhenie
  tier: greater
  icon: images/icons/gifts/artilleriya/bezrazlichnoe-unichtozhenie.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложив усилие, ваши атаки оружием с радиусом поражения превращаются в абсолютный механизм разрушения.
    Ваши атаки считаются магическими для преодоления магических барьеров, результат кости повреждений
    считается напрямую при поражении защитных конструкций, способных поражать даже божественные материалы,
    хоть и с меньшей эффективностью, чем обычно, в зависимости уже от материала.
- name: Бесконечный Железный Дождь
  slug: beskonechnyy-zheleznyy-dozhd
  tier: greater
  icon: images/icons/gifts/artilleriya/beskonechnyy-zheleznyy-dozhd.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите усилие. Против толп добавьте ваш уровень к кости повреждений вашего оружия с радиусом
    поражения. Против целей же, что не являются толпой, вы можете использовать свою кость Схватки против
    всех целей в радиусе обзора за раз.
- name: Снаряды не падают в один и тот же кратер дважды
  slug: snaryady-ne-padayut-v-odin-i-tot-zhe-krater-dvazhdy
  tier: greater
  icon: images/icons/gifts/artilleriya/snaryady-ne-padayut-v-odin-i-tot-zhe-krater-dvazhdy.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите усилие, выберите до десяти союзников-индивидуумов в радиусе вашего оружия с радиусом
    поражения, они становятся неуязвимы к вашим атакам по площади и создаваемой вашими атаками и дарами
    труднопроходимой местности.
