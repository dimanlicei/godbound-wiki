name: Сон(V2.0)
kind: homebrew
colors:
  glow: '#c0aeff'
  deep: '#221a3a'
  dark: '#0d0819'
icon: /images/icons/words/son-v2-0.webp
description: |-
  Слово Снов властвует над сном и сновидениями. Оно заставляет других погружаться в воодушевляющие сны, которые длятся долго или терзают жертву бесконечными кошмарами.

  Обожествлённый Словом Снов не нуждается во сне, но может войти в состояние сна или выйти из него в любой момент по своему желанию. Он обладает неуязвимой защитой от ментального контроля и эмоционального манипулирования.
gifts:
- name: Мастер снов
  slug: master-snov
  tier: lesser
  icon: /images/icons/gifts/son-v2-0/master-snov.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: 'Усилие: сцена'
  body: Вы можете контролировать и манипулировать снами любого человека в радиусе 100 футов на уровень.
    Кроме того, вы можете блокировать любые попытки других повлиять на эти сны, потратив усилия на сцену.
    Достойные противники получают спасбросок Духа, чтобы противостоять манипулированию своими снами.
- name: Песочный человек
  slug: pesochnyy-chelovek
  tier: lesser
  icon: /images/icons/gifts/son-v2-0/pesochnyy-chelovek.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие на сцену и выберите точку в поле зрения. Все выбранные меньшие противники в пределах
    50 футов/уровня от этой точки засыпают. Достойные противники делают спасбросок Духа, чтобы сопротивляться.
    Эти жертвы просыпаются только от физического взаимодействия, Обожествлённый отпускает их, или же по
    окончании сцены они могут проснуться сами. Этот эффект может быть быстрым, например, люди сразу падают,
    или вызывать постепенно нарастающую усталость, побуждая жертв лечь спать, прежде чем сон их одолеет.
- name: Путеводитель сомнамбулы
  slug: putevoditel-somnambuly
  tier: lesser
  icon: /images/icons/gifts/son-v2-0/putevoditel-somnambuly.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите усилия ради сцены. Вы берёте под контроль спящего человека, которого можете видеть физически
    или в мире сновидений. Вы можете использовать его чувства и перемещаться, словно он сам, где бы он
    ни находился в физическом мире, пока его разум спит, не осознавая происходящего. Любая боль, причинённая
    телу, разбудит спящего и прекратит этот эффект, даже если используется дар Сноходца. Достойные противники
    получают спасбросок духа, чтобы снять это.
- name: Разговоры во сне
  slug: razgovory-vo-sne
  tier: lesser
  icon: /images/icons/gifts/son-v2-0/razgovory-vo-sne.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите усилия для этой сцены. Находясь рядом со спящим человеком или находясь в его сновидении,
    вы можете обратиться к его подсознанию и попросить его высказать правду. Вы можете задать ему ряд
    вопросов, соответствующих вашему уровню, на которые он должен ответить правдиво и подробно.
- name: Ты не можешь умереть во сне
  slug: ty-ne-mozhesh-umeret-vo-sne
  tier: lesser
  icon: /images/icons/gifts/son-v2-0/ty-ne-mozhesh-umeret-vo-sne.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Вы постоянно существуете частично как сон, у вас естественный класс брони 3, поскольку трудно
    поразить суть мысли. Раз в день, когда ваши хиты должны были бы опуститься до 0, вы просыпаетесь,
    понимая, что это был всего лишь кошмарный сон. Эффект, который должен был опустить ваши хиты до 0,
    отменяется, как будто его никогда и не было.
- name: Увидеть спящий разум
  slug: uvidet-spyaschiy-razum
  tier: lesser
  icon: /images/icons/gifts/son-v2-0/uvidet-spyaschiy-razum.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: В качестве действия вы можете увидеть самую большую мечту выбранного человека и его самый худший
    кошмар.
- name: Целебный сон
  slug: tselebnyy-son
  tier: lesser
  icon: /images/icons/gifts/son-v2-0/tselebnyy-son.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите усилия на весь день. В следующий раз, когда цель этой способности уснёт, она проснётся
    отдохнувшей и излечённой от болезней и любых магических проклятий.
- name: Вечный сон
  slug: vechnyy-son
  tier: greater
  icon: /images/icons/gifts/son-v2-0/vechnyy-son.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите усилия на день. Выбранная цель, которую можно увидеть физически или во сне, заточена
    в вечном сне. Её нельзя разбудить, пока вы её не освободите, и она будет медленно истощаться и умирать,
    если другие не позаботятся об её теле. Достойные противники получают спасбросок духа против этого
    эффекта.
- name: Мечты, ставшие явью
  slug: mechty-stavshie-yavyu
  tier: greater
  icon: /images/icons/gifts/son-v2-0/mechty-stavshie-yavyu.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие на день. Вы создаете существо из сна выбранного человека. Это может быть человек
    или животное, или может быть ужасный монстр из их кошмаров. Для выбранной цели эта сущность существует
    физически. Только цель и существа со способностью влиять на сны могут видеть это творение. Оно действует
    так, как ожидает цель, если вы не решите иначе. Для монстра кошмара у него есть одно действие, HD,
    равный удвоенному вашему уровню, бонус атаки, равный вашему уровню, и наносит 1d8 урона напрямую.
    Только один кошмар может существовать одновременно для данной цели, хотя он может казаться несколькими
    существами (орда крыс и т. д.) Существо не может влиять ни на кого, кроме выбранной цели. Эти невраждебные
    сущности длятся 1 день за уровень, в то время как кошмары существуют в течение продолжительности сцены.
    Все прекращают свое существование, если цель умирает.
- name: Сноходец
  slug: snohodets
  tier: greater
  icon: /images/icons/gifts/son-v2-0/snohodets.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Вы входите в состояние сна и можете отправлять и получать сообщения во снах
    от любого, кого вы видели или знаете его имя. Кроме того, вы можете выбрать физическое проникновение
    в сны человека. Это позволяет вам лично причинить вред или даже убить его в царстве снов. Во снах
    вы можете появляться как угодно, но вы не получаете никаких специальных знаний о том, как себя вести,
    если выдаете себя за людей. Пока вы физически находитесь в их сне, их нельзя разбудить никакими способами.
    Достойные Враги могут сделать Спасбросок Духа, чтобы противостоять вторжению в их сны, которое блокирует
    все аспекты. Если они успешно спасутся, вы не сможете попытаться связаться с ними снова, пока они
    не уснут в следующий раз. Когда вы высвобождаете эту силу, вы вновь появляетесь в мире смертных, где
    вы были раньше.
