name: Фея (Анафема)
kind: anathema
colors:
  glow: '#9df0c4'
  deep: '#17301f'
  dark: '#08140c'
icon: images/icons/words/feya-anafema.webp
description: |-
  Слово Дикости воплощает угасающее великолепие древних фэйри. Давным-давно, в самых дальних пределах родовой памяти человечества, фэйри первобытных лесов виделись жуткими, непостижимыми силами или пугающе своенравными хищниками, которым поклонялся странный народ. Человеческий Обожествлённый никогда не может обладать этим Словом. В отличие от человеческих божеств, фэйри не нуждаются в религиозном почитании и не ищут его, хотя некоторые нечеловеческие народы вроде сильвари или гоблей глубоко их чтут. Их сила — в нетронутой, первозданной глуши, и они не переживут гибели своего леса.

  Харизма и Ловкость фэйри автоматически подняты до 19, что даёт по +4 к каждой. Фэйри может общаться с любым существом, разумным или нет. Когда он говорит с животными, те отвечают так, будто наделены разумом. Обычные дикие звери никогда не нападут на фэйри и подчинятся несамоубийственным приказам. Он обладает неуязвимой защитой от деревянного оружия и предметов, растительных чудовищ и растительных ядов.

  ИЗЪЯНЫ: фэйри уязвимы для холодного железа и соли, освящённой человеческим жрецом. При такой атаке ни один его дар не может свести на нет полученный урон. Кроме того, их ненавидят и боятся слуги Непобедимого Солнца (подавляюще господствующей человеческой религии), которые считают их анафемой.
gifts:
- name: Властный Облик
  slug: vlastnyy-oblik
  tier: lesser
  icon: images/icons/gifts/feya-anafema/vlastnyy-oblik.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Ваш взгляд и присутствие становятся разрывающим сердце оружием, наносящим при
    успешном попадании 1к10 эмоционального урона видимой цели. Если цель сведена к нулю хитов, она восстанавливает
    1 хит и на 24 часа становится вашей полной рабой, совершая даже самоубийственные деяния. Применение
    этого дара явно магично для наблюдателей.
- name: Возвышенная Грация
  slug: vozvyshennaya-gratsiya
  tier: lesser
  icon: images/icons/gifts/feya-anafema/vozvyshennaya-gratsiya.webp
  badges:
  - type: act
    text: Постоянно
  - type: act
    text: Мгновенно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Вы источаете безупречное совершенство и обладаете неуязвимой защитой от любых сверхъестественных
    сил, что дурно сказались бы на вашей красоте или достоинстве. Сюда входят силы, выставляющие вас глупцом
    или ставящие в невыгодное положение в обществе (например, наваждения), но не обязательно те, что просто
    вас разозлят, — вроде кражи священной реликвии, пока вы на охоте. Мгновенным действием вы можете приложить
    Усилие до конца сцены, чтобы преуспеть в любой проверке атрибута.
- name: Королевские Владения
  slug: korolevskie-vladeniya
  tier: lesser
  icon: images/icons/gifts/feya-anafema/korolevskie-vladeniya.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Чтобы получить этот дар, нужен малый дар «Освятить Клятву». Теперь вы лично властвуете над участком
    леса примерно в пять миль радиусом на уровень персонажа. Вы мгновенно узнаёте о любых нарушителях
    и можете смотреть и слушать глазами и ушами любого лесного зверя, но лишь одного за раз. Чтобы рассеивать
    враждебные магические эффекты, направленные на ваши владения, вы можете тратить Влияние вместо приложения
    Усилия.
- name: Лесная Свита
  slug: lesnaya-svita
  tier: lesser
  icon: images/icons/gifts/feya-anafema/lesnaya-svita.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Чтобы купить этот дар, нужен малый дар «Королевские Владения». Вас сопровождает бессмертная свита
    лесных обитателей — от лучников и ловчих сильвари до младших фэйрийских придворных и герольдов, дриад,
    духов и преданной живности, включая волков, могучих лесных лосей и даже облака бабочек. Их представляет
    по одной Маленькой Толпе последователей воинского уровня на уровень персонажа, и в лесу они обладают
    непроницаемой скрытностью от всех вторгшихся существ, считающихся вашими меньшими противниками. Хотя
    их можно рассеять, они со временем вновь соберутся вокруг фэйри, пока стоит лес.
- name: Любимый Придворный
  slug: lyubimyy-pridvornyy
  tier: lesser
  icon: images/icons/gifts/feya-anafema/lyubimyy-pridvornyy.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Вы призываете младшего фэйрийского слугу с хит-дайсами, вдвое
    превышающими ваш уровень (но не более 10), классом защиты 4, бонусом к попаданию, равным его хит-дайсам,
    магическим уроном атаки 1к10, скоростью полёта 30 футов и Моралью 12. Этот химерический слуга неуязвим
    для немагического оружия, может явиться в любом правдоподобном облике по вашему желанию и будет служить
    вам разумно и с полным послушанием. Одновременно у вас может быть призван лишь один такой слуга. Если
    его убьют, слуга исчезает, но его или другого слугу можно призвать вновь.
- name: Освятить Клятву
  slug: osvyatit-klyatvu
  tier: lesser
  icon: images/icons/gifts/feya-anafema/osvyatit-klyatvu.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Заключая с кем-то сделку или договор, вы можете освятить его своей властью. К такой сделке нельзя
    принудить магией, но можно склонить более земными посулами. Если вы исполните букву договора полностью,
    ваша противная сторона обязана точно так же исполнить букву договора или же попасть в вашу власть.
    Нарушителя сделки можно покарать любыми проклятиями и несчастьями, какие вы сочтёте уместными, пока
    вы не помилуете его. Чтобы договориться с фэйри и не остаться при этом заложником какой-нибудь чудовищной
    и незаметной оговорки, обычно нужен успех во встречной проверке Мудрости или некое божественное прозрение.
- name: Призвать Дикую Охоту
  slug: prizvat-dikuyu-ohotu
  tier: lesser
  icon: images/icons/gifts/feya-anafema/prizvat-dikuyu-ohotu.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Призовите жутких фэйрийских скакунов для себя и своих спутников. Эти скакуны скачут со скоростью
    двадцать миль в час, и их всадники никогда не устают, не испытывают жажды и голода. Они пересекают
    любую местность, твёрдую и жидкую, а природные звери от них бегут. Если вы охотитесь за определённым
    существом, не укрытым божественной магией, скакуны чутьём поскачут к его местоположению. Они сами
    собой движутся хотя бы немного быстрее любого преследуемого существа, гоня его по земле, воде или
    воздуху. Этих скакунов можно убить любым магическим уроном, но призвать их снова несложно.
- name: Корона Страны Эльфов
  slug: korona-strany-elfov
  tier: greater
  icon: images/icons/gifts/feya-anafema/korona-strany-elfov.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Чтобы купить этот дар, нужен малый дар «Лесная Свита». Ваш максимум Влияния возрастает на два
    очка. Кроме того, все коренные нечеловеческие обитатели вашего лесного владения абсолютно вам покорны.
    Меньшие противники обязаны исполнять даже самоубийственные приказы, а достойные противники могут приложить
    Усилие до конца дня, чтобы отвергать ваши приказы на следующие 24 часа. Впрочем, это автоматически
    наносит им урон, равный вашему уровню. Такие мятежники автоматически проваливают любые спасброски
    против ваших даров, и любые ваши атаки по ним автоматически попадают. При этом они всё же могут приложить
    Усилие для автоматического спасброска, если такая способность у них есть. В древние времена вопрос
    об этой власти нередко становился поводом для смертоубийственных интриг среди фэйри.
- name: Одеяние Дикости
  slug: odeyanie-dikosti
  tier: greater
  icon: images/icons/gifts/feya-anafema/odeyanie-dikosti.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Чтобы купить этот дар, нужно уже иметь малый дар «Возвышенная Грация». Вы можете выбрать по одному
    малому дару из Слов Проворства, Удачи и Лука. Кроме того, ваш максимум Усилия навсегда возрастает
    на одно очко. К сожалению, вы лишаетесь пользы от этого большого дара всякий раз, когда покидаете
    лесистую местность.
- name: Полюби Меня и Отчайся
  slug: polyubi-menya-i-otchaysya
  tier: greater
  icon: images/icons/gifts/feya-anafema/polyubi-menya-i-otchaysya.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня, чтобы засиять ужасным всепоглощающим очарованием. Все меньшие противники
    в пределах 60 футов становятся вашими беспомощными рабами, вынужденными исполнять любой приказ, не
    самоубийственный и не совершенно немыслимый для них. Достойные противники должны приложить Усилие
    до конца сцены, иначе будут так же порабощены, — да и им придётся прикладывать Усилие до конца сцены
    в каждом раунде, когда они хотят напасть на вас или применить против вас враждебную силу. Эти чары
    разрушаются, если вы напрямую нападёте на одну из целей. Порабощение прекращается через полный час
    вне вашего присутствия.
