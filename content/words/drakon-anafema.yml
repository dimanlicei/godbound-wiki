name: Дракон (Анафема)
kind: anathema
colors:
  glow: '#ff9ec0'
  deep: '#2e1420'
  dark: '#12070d'
icon: /images/icons/words/drakon-anafema.webp
description: |-
  Могучие змии клыка и пламени правили большей частью известного мира несчётные тысячи лет, пока люди ещё жались по пещерам. Лишь великий катаклизм — или, быть может, явление первых человеческих божеств — положил конец этой древней тирании. Слово Дракона — образчик тех сил, какими некогда владели эти жуткие первообразы, или одного из редких их остатков: лютых и ужасных змеиных владык, способных навести ужас на армии. Человеческий Обожествлённый не может обладать этим Словом. В отличие от Обожествлённых, Драконам ни к чему культы и почитание: они предпочитают выжженные пустоши кишащим толпам и храмам.

  У Драконов базовый класс защиты 3, их безоружные атаки наносят 1к10 повреждений как магическое оружие, а Сила и Телосложение автоматически подняты до 18.

  ИЗЪЯНЫ: хотя Драконам глубоко поклоняются многие жестокие и чудовищные народы вроде огронов или гоблей, они совершенно враждебны Человеку и считаются анафемой слугами Непобедимого Солнца. Одного слуха о таком создании часто довольно, чтобы привлечь смертных Великих Героев, желающих попытать себя в драконоборстве. Человеческий Великий Герой всегда считается достойным противником, и если он выбросит натуральную 20 при атаке по дракону, её нельзя ни отменить, ни смягчить, а урон читается напрямую.
gifts:
- name: Вторая Шкура
  slug: vtoraya-shkura
  tier: lesser
  icon: /images/icons/gifts/drakon-anafema/vtoraya-shkura.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Основным действием вы можете превращаться в гуманоидные облики по своему выбору. Ваш преображённый
    образ одет и снаряжён любым обычным для принятой личины способом, и вы автоматически говорите на любом
    языке и перенимаете любые повадки, подобающие выбранному облику. Все ваши дары и врождённые силы остаются
    доступны и в человеческом облике.
- name: Дыхание Смерти
  slug: dyhanie-smerti
  tier: lesser
  icon: /images/icons/gifts/drakon-anafema/dyhanie-smerti.webp
  badges:
  - type: act
    text: Действие
  - type: smite
    text: Кара
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Вы выдыхаете волну некоего губительного вещества — огня, яда,
    бритвенно-острых самоцветов или чего угодно ещё, подходящего вашему замыслу. Этот дар можно взять
    несколько раз, чтобы обладать несколькими видами смертоносного дыхания. Дыхание наносит 1к6 повреждений
    за уровень персонажа, а Толпам — втрое больше. Цели и Толпы существ всего с 1 хит-дайсом гибнут мгновенно.
    Волна — это конус длиной до пятидесяти футов на уровень персонажа и такой же ширины на дальнем краю.
    Вы достаточно точны, чтобы не задеть нежелательные цели в этой области. Вы обладаете неуязвимой защитой
    от веществ, которые способны выдыхать.
- name: Жилы Змея
  slug: zhily-zmeya
  tier: lesser
  icon: /images/icons/gifts/drakon-anafema/zhily-zmeya.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Вы обладаете чудовищной телесной мощью. Приложите Усилие до конца сцены, бросая атаку или применяя
    силу, наносящую кости урона. Если это обычная атака, она автоматически удаётся и наносит максимальный
    урон. Если это враждебная сила, бросающая кости урона, бросьте их дважды и возьмите лучший результат.
    Вы играючи проламываете каменную кладку толщиной во столько футов, сколько у вас уровней персонажа,
    крушите деревянные постройки, носите тяжести весом с небольшой корабль и совершаете иные подвиги драконьей
    силы.
- name: Неистощимая Сокровищница
  slug: neistoschimaya-sokrovischnitsa
  tier: lesser
  icon: /images/icons/gifts/drakon-anafema/neistoschimaya-sokrovischnitsa.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: день'
  body: Ваша груда награбленных сокровищ бездонно велика. Вы всегда можете позволить себе всё, что стоит
    1 Богатство или меньше, и раз в неделю можете приложить Усилие до конца дня, чтобы позволить себе
    одну покупку величиной до 10 Богатства. Кроме того, каждую неделю вы можете совершать покупки на столько
    очков Богатства, сколько у вас уровней персонажа. Вашу сокровищницу невозможно успешно обокрасть,
    пока вы живы. Вы всегда знаете, где найти даже мельчайший самоцвет или монету и кто повинен в её пропаже.
- name: Ужас Небес
  slug: uzhas-nebes
  tier: lesser
  icon: /images/icons/gifts/drakon-anafema/uzhas-nebes.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: У вас есть крылья, и вы можете летать вдвое быстрее своей обычной наземной скорости. При непрерывном
    полёте на большие расстояния вы можете двигаться со скоростью до ста миль в час. Вы достаточно поворотливы,
    чтобы при нужде зависать в воздухе и выполнять иные хитрые воздушные манёвры.
- name: Шёпот Змея
  slug: shepot-zmeya
  tier: lesser
  icon: /images/icons/gifts/drakon-anafema/shepot-zmeya.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Ваши слова и взгляд вместе наводят на добычу гипнотическую покорность. Приложив Усилие до конца
    сцены и выбрав целью существо, которое на вас смотрит, вы можете на время взять его волю под свою
    власть. Меньшие противники спасброска не получают, достойные могут противиться спасброском Духа. Затронутые
    жертвы совершат любое приказанное вами деяние, не угрожающее их собственной жизни или жизни их близких.
    Достойные противники стряхивают это по окончании сцены, а меньшие противники остаются вам подвластны,
    пока не пробудут месяц полностью вдали от вашего голоса и присутствия.
- name: Железная Чешуя Бога-Змея
  slug: zheleznaya-cheshuya-boga-zmeya
  tier: greater
  icon: /images/icons/gifts/drakon-anafema/zheleznaya-cheshuya-boga-zmeya.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Вы сводите на нет иначе успешную атаку или источник физического
    урона. Удар может и достичь вас, но вы попросту слишком велики и сильны, чтобы он вам помешал. Как
    Постоянный эффект даёт прибавку в 2 хита за уровень персонажа к вашему максимуму хитов.
- name: Пожиратель Миров
  slug: pozhiratel-mirov
  tier: greater
  icon: /images/icons/gifts/drakon-anafema/pozhiratel-mirov.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Чтобы купить этот дар, нужен малый дар «Жилы Змея». Ваши Сила и Телосложение поднимаются до 19,
    давая бонус +4. Вы также обретаете полную невосприимчивость ко всем ментальным и эмоциональным атакам,
    способным вам навредить или поработить вас. Впрочем, от обмана это не защищает.
- name: Сокрушитель Полчищ
  slug: sokrushitel-polchisch
  tier: greater
  icon: /images/icons/gifts/drakon-anafema/sokrushitel-polchisch.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Весь физический урон, что вы наносите Толпам, можно читать напрямую — как от обычных атак, так
    и от даров. Физические атаки или наносящие физический урон силы, применённые против целей или Толп
    существ с предельным числом хит-дайсов, равным половине вашего уровня в хит-дайсах или меньше (с округлением
    вниз), автоматически удаются и мгновенно убивают несчастных. Если вы решите применить этот дар в рамках
    атаки, все существа, сведённые вами к нулю хитов, погибают, и усмирить их без смертельного исхода
    нельзя.
