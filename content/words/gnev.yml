name: Гнев
kind: homebrew
colors:
  glow: '#ff8a6b'
  deep: '#3d0f0f'
  dark: '#150404'
icon: images/icons/words/gnev.webp
description: 'Слово Греха: Гнев. Поднимите Силу или Телосложение до 18. Раз в сцену вы можете восстановить
  хп, равное уровню персонажа, ваши атаки одноручным оружием наносят 1d10, а двуручным — 1d12.'
gifts:
- name: Безумная ярость
  slug: bezumnaya-yarost
  tier: lesser
  icon: images/icons/gifts/gnev/bezumnaya-yarost.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Вы несёте лишь разрушение и боль, пусть ваши враги услышат вашу поступь и присоединятся к её мелодичному
    грохоту. Приложите усилие на день, все противники в радиусе 50 футов от вас должны пройти спасбросок
    духа, иначе они погрязнут в неуёмной ярости и будут нападать на ближайших к себе существ.
- name: Гремящая ярость
  slug: gremyaschaya-yarost
  tier: lesser
  icon: images/icons/gifts/gnev/gremyaschaya-yarost.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: '75%: ваши раны наполняют вас яростью, +1 усилие. 50%: промахи приводят вас в бешенство, после
    промаха ваша атака всегда успешна. 25%: безумная злоба наполняет вас, а урон ваших атак и сил бросается
    дважды.'
- name: Потаённая ненависть
  slug: potaennaya-nenavist
  tier: lesser
  icon: images/icons/gifts/gnev/potaennaya-nenavist.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите усилие, вы отмечаете противника, которого видели или знаете его имя, как объект своего
    гнева или ненависти, вы точно знаете, где расположен противник, а так же можете потратить действие
    перемещения и перенестись прямо к объекту своей ненависти.
- name: Распирающая злоба
  slug: raspirayuschaya-zloba
  tier: lesser
  icon: images/icons/gifts/gnev/raspirayuschaya-zloba.webp
  badges:
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите усилие, ваш размер увеличивается вместе с вашими возможностями поднимать и крушить объекты.
    Кроме того, ваши атаки считаются напрямую при попадании по толпам. Ваша броня при этом считается равной
    9, а входящий урон от любого источника уменьшается на 1.
- name: Расплата
  slug: rasplata
  tier: lesser
  icon: images/icons/gifts/gnev/rasplata.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Раз на сцену вы можете вернуть нанесённый вам урон в прошлом раунде рукопашной атакой, атака автоматически
    попадает, достойный противник совершает спасбросок духа, дабы уменьшить урон в половину.
- name: Стена гнева
  slug: stena-gneva
  tier: lesser
  icon: images/icons/gifts/gnev/stena-gneva.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Ваша плоть впитывает обуревающую вас ярость и гнев, превращая её в новую опору для вашего здоровья.
    Получите дополнительные 3 очка ХД за имеющиеся у вас уровни и за каждый последующий, что будет.
- name: Икона гнева
  slug: ikona-gneva
  tier: greater
  icon: images/icons/gifts/gnev/ikona-gneva.webp
  badges:
  - type: eff
    text: 'Усилие: день'
  body: Приложите усилие на день, вы высвобождаете всю свою ярость, ваши атаки всегда попадают и наносят
    максимальный урон, но вы теряете понимание, кто ваш друг или враг, из-за чего можете нанести урон
    и союзнику. Вы получаете на 2 единицы урона меньше. Каждый ход вы обязаны совершить атаку. Покуда
    вы находитесь в состоянии ярости, вы можете получить прямой урон, равный 1d8, что не может быть уменьшен,
    дабы перебросить проваленный спасбросок, что ограничил бы вас в сражении или заставил подчиняться
    чужой воле.
- name: Нечестивая кара
  slug: nechestivaya-kara
  tier: greater
  icon: images/icons/gifts/gnev/nechestivaya-kara.webp
  badges:
  - type: act
    text: Действие
  - type: smite
    text: Кара
  - type: eff
    text: 'Усилие: день'
  body: Приложите усилие на день, поддаваясь ярости внутри, обожествлённый обрушивается на врага, нанося
    серию ударов, 1d10 за уровень персонажа, достойный противник должен совершить спасбросок уклонения,
    дабы уменьшить полученный урон в половину. Ваша жгучая ярость не даёт ранам противника затянуться,
    кроме тех случаев, когда их излечивает.
- name: Таран ада
  slug: taran-ada
  tier: greater
  icon: images/icons/gifts/gnev/taran-ada.webp
  badges:
  - type: eff
    text: 'Усилие: день'
  body: Приложите усилие, вас обуревает ярость, и вы способны за рывок пройти расстояние, равное утроенной
    вашей скорости ходьбы. Вы способны совершать рывок в любом направлении, а преграды не способны вас
    сдержать, если же вы пытаетесь преодолеть преграду из божественных материалов, вы получаете 4 единицы
    урона за каждые 5 футов пробитого вами материала, или же обязаны приложить усилие на день для защиты
    себя.
- name: Тысяча столпов силы
  slug: tysyacha-stolpov-sily
  tier: greater
  icon: images/icons/gifts/gnev/tysyacha-stolpov-sily.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: день'
  body: Приложив усилие на день, ваша плоть рвётся, кости ломаются, а воля пала, но гнев — это всё, что
    осталось. Носитель слова распыляет свою ярость, игнорируя до начала своего следующего хода весь входящий
    урон. Несмотря на то что урон не уменьшает ваши ХД, вы всё ещё можете быть искалечены, но вы всё ещё
    превозмогаете боль, усталость и ужасающие раны, дабы испепелить ваших врагов. Помимо этого, вы становитесь
    иммунны к урону огнём и холодом на постоянное время, пока у вас есть этот дар.
