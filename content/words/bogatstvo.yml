name: Богатство
kind: canon
colors:
  glow: '#ffd873'
  deep: '#342a09'
  dark: '#130f04'
icon: images/icons/words/bogatstvo.webp
description: |-
  Богатство — Слово не только золота, но и всякого процветания. Твёрдое жалованье, полные кладовые, тёплая одежда и крепкие крыши — вот владения этого Слова. Некоторые его силы взаимодействуют с системой Группировок на стр. 134, даруя благословения или проклятия целым городам и странам.

  Некоторые дары Богатства позволяют создавать немагические предметы, и герой может этими силами создать огромные суммы золота или иных драгоценностей. Как общее правило, этими дарами можно создать достаточно Богатства, чтобы добиться любой насущной цели, но вызванная таким внезапным потоком самоцветов размером с кулак инфляция на какое-то время сделает бесполезными дальнейшие искусственные траты Богатства в этой области. Герой, действующий неспешнее и создающий этими дарами настоящие полезные вещи, такой инфляции не вызывает.

  Герои со Словом Богатства никогда не сидят без денег и всегда могут позволить себе всё, что стоит 1 Богатство или меньше. У них всегда достаточно еды, питья и одежды для себя и своих спутников — при необходимости взятых из ничего. Божества Богатства — из самых любимых в человеческих пантеонах.
gifts:
- name: Безупречное Воспроизведение
  slug: bezuprechnoe-vosproizvedenie
  tier: lesser
  icon: images/icons/gifts/bogatstvo/bezuprechnoe-vosproizvedenie.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие и коснитесь немагического предмета или домашнего животного не крупнее большой
    телеги. Каждую минуту где-то рядом с оригиналом появляется его безупречная копия — и так, пока Усилие
    не будет возвращено. Эти копии сохраняются и после возвращения Усилия.
- name: Вечно Достаточный Достаток
  slug: vechno-dostatochnyy-dostatok
  tier: lesser
  icon: images/icons/gifts/bogatstvo/vechno-dostatochnyy-dostatok.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Пока Усилие приложено, вы можете производить любые нужные вам обычные предметы
    или домашних животных — достаточно, чтобы снарядить или посадить в сёдла по сотне человек на уровень.
    Предметы и существа исчезают, как только Усилие возвращено. Предметы должны быть не крупнее лошади,
    а животные смирны и негодны для войны, хотя их можно забить или использовать иным обычным образом.
    Если Усилие оставалось приложенным достаточно долго, чтобы их успели съесть, они всё равно насытят
    съевших и после возвращения Усилия.
- name: Изобилие Процветания
  slug: izobilie-protsvetaniya
  tier: lesser
  icon: images/icons/gifts/bogatstvo/izobilie-protsvetaniya.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Потратьте Богатство, необходимое для покупки общедоступного предмета или услуги (не менее 1 очка),
    — и они появляются мгновенно. Услуги исполняются незримыми руками с хорошим качеством работы и занимают
    столько же времени, сколько заняли бы обычно. Питать этот дар может только «настоящее» Богатство,
    а не созданное магией или дарами.
- name: Иссушить Кошель
  slug: issushit-koshel
  tier: lesser
  icon: images/icons/gifts/bogatstvo/issushit-koshel.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены и выберите жертву в пределах видимости. Её достаток терпит немедленный
    и сокрушительный урон — от воров, поджога, несчастья или неудачной сделки. Она теряет имущества на
    одно очко Богатства за уровень Обожествлённого. Достойные противники могут пройти спасбросок Духа,
    чтобы противостоять. Те, кто распоряжается чужими деньгами или чьё имущество разбросано далеко, теряют
    лишь собственные средства или те, что поблизости. Если дар применён к тому, кто напрямую распоряжается
    казной или хозяйством группировки, его группировка на следующий ход группировок лишается пользы от
    одного связанного с хозяйством Достоинства, которым эта жертва ведает.
- name: Прокормить Множество
  slug: prokormit-mnozhestvo
  tier: lesser
  icon: images/icons/gifts/bogatstvo/prokormit-mnozhestvo.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие и благословите группировку с Мощью не выше 2 — самое большее город. Группировка
    получает Достоинство «У нас всегда хватает на жизнь», обеспечивающее её достаточными запасами еды,
    одежды и прочих нужд, каким бы безотрадным ни было окружение и какими бы недавними ни были потери.
    Это Достоинство можно использовать для защиты в подходящих конфликтах, но им нельзя пожертвовать при
    поражении, и держится оно, пока Обожествлённый не вернёт Усилие.
- name: Ремесло Созидания
  slug: remeslo-sozidaniya
  tier: lesser
  icon: images/icons/gifts/bogatstvo/remeslo-sozidaniya.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. За один раунд вы можете создать или воспроизвести любой обычный неодушевлённый
    предмет, который прежде видели, если он не крупнее телеги. Предмет остаётся навсегда, если создан
    в основном из пригодных уже существующих материалов. Если же его основные части сделаны из ничего,
    он существует лишь пока приложено Усилие.
- name: Вечно Довольно
  slug: vechno-dovolno
  tier: greater
  icon: images/icons/gifts/bogatstvo/vechno-dovolno.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: 'У вас и ваших спутников всегда есть любые нужные обычные предметы или ездовые животные, если
    они не крупнее небольшого парусного судна. Удача, предусмотрительность и странные стечения обстоятельств
    сговариваются доставить вам желаемое ровно тогда, когда оно нужно: каждый необходимый предмет находится
    в карманах, вьюках или поблизости. Эти предметы обычно исчезают или теряются, когда нужда в них отпадает,
    и они не могут воспроизвести точные копии особых вещей вроде ключей или печатей.'
- name: Гроза Воров
  slug: groza-vorov
  tier: greater
  icon: images/icons/gifts/bogatstvo/groza-vorov.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Меньшие противники совершенно не способны успешно обокрасть вас или ваших спутников скрытностью
    или мошеннической сделкой. Всякий раз, когда достойный противник пытается вас или ваших спутников
    обокрасть или обмануть на деньги, вы немедленно получаете видение этой попытки и можете совершить
    одно действие против вора, будто стоите рядом с ним, — а он вам в ответ ничего сделать не может. Если
    воров несколько, вы получаете по одному действию против каждого. Воры, являющиеся достойными противниками,
    могут пройти спасбросок Духа, чтобы ускользнуть от вашего внимания.
- name: Длань Златого Бога
  slug: dlan-zlatogo-boga
  tier: greater
  icon: images/icons/gifts/bogatstvo/dlan-zlatogo-boga.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие и прокляните или благословите группировку либо общину с Мощью не выше половины
    вашего уровня с округлением вверх. Вы можете либо даровать ей полезное Достоинство, связанное с процветанием
    или богатством, либо подавить имеющееся Достоинство, зависящее от денег или больших запасов. Дарованные
    Достоинства могут защищать, но ими нельзя пожертвовать при поражении. Эмпирейские Обереги этому эффекту
    не мешают, если только вся проклинаемая или благословляемая область не защищена оберегом. Проклятие
    или благословение проявляется очень быстро, в течение суток, и держится, пока Усилие приложено.
