name: Страсть
kind: canon
colors:
  glow: '#ff92c0'
  deep: '#3a0d22'
  dark: '#15050c'
icon: /images/icons/words/strast.webp
description: |-
  Слово Страсти повелевает сердцем, наполняя его чувствами, которых желает Обожествлённый, или изгоняя те, что оказались обременительны. Хотя эти чувства могут быть всепоглощающими, Обожествлённый не может предписать, что подопечные с ними сделают. В этом смысле Страсть побуждает цель к собственным поступкам, но не даёт прямого управления, как Слово Приказа.

  Герои со Словом Страсти одарены изяществом и пониманием сердца. Они могут установить значение своей Харизмы или Мудрости равным 16, или 18, если оно уже равно 16 или больше.
gifts:
- name: Затушить Свечу Сердца
  slug: zatushit-svechu-serdtsa
  tier: lesser
  icon: /images/icons/gifts/strast/zatushit-svechu-serdtsa.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Мгновенно погасите чувство у видимой цели. Вы можете полностью погасить конкретное чувство — страх,
    верность, любовь — или избирательно затушить его в отношении определённых людей или занятий. Цель
    не способна испытывать это чувство к выбранным предметам, пока вы не освободите её от эффекта. Меньшие
    противники затрагиваются автоматически, достойные противники могут пройти спасбросок Духа, чтобы противостоять
    этому усмирению.
- name: Знамя Страсти
  slug: znamya-strasti
  tier: lesser
  icon: /images/icons/gifts/strast/znamya-strasti.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Все НИП, являющиеся меньшими противниками, в пределах слышимости или видимости
    наполняются мощным чувством по вашему выбору, направленным на выбранный вами предмет. Достойные противники
    каждый раунд получают спасбросок Духа, чтобы сбросить его. Это чувство заставит их действовать на
    пределе своего характера и продержится ещё как минимум сутки после того, как Усилие будет возвращено.
- name: Сердце Льва
  slug: serdtse-lva
  tier: lesser
  icon: /images/icons/gifts/strast/serdtse-lva.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Вы обладаете неуязвимой защитой от страха и всех нежелательных эффектов, воздействующих на чувства.
    Вы можете Мгновенным действием приложить Усилие до конца сцены, чтобы разделить этот иммунитет со
    всеми союзниками в пределах 100 ярдов.
- name: Следуй за Ниточками
  slug: sleduy-za-nitochkami
  tier: lesser
  icon: /images/icons/gifts/strast/sleduy-za-nitochkami.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Изучая цель одно действие, вы можете определить полдюжины людей, наиболее значимых для неё эмоционально,
    узнав их внешность, имя, под которым их знает цель, и несколько слов, описывающих связь между ними.
    Меньшие противники не могут этому сопротивляться, достойные противники могут пройти спасбросок Духа,
    чтобы сохранить свои тайны.
- name: Сотворить Друга
  slug: sotvorit-druga
  tier: lesser
  icon: /images/icons/gifts/strast/sotvorit-druga.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены, чтобы обворожить видимое существо, пробудив в нём дружеские чувства
    и готовность к сотрудничеству с вами. Оно не станет подвергать эти чувства сомнению, какими бы иррациональными
    они ни были, и они сохранятся, пока вы явно его не предадите или не причините ему очевидный вред.
    Меньшие противники не имеют защиты от этой силы, достойные противники могут пройти спасбросок Духа,
    чтобы избежать чар.
- name: Ужасающий Облик
  slug: uzhasayuschiy-oblik
  tier: lesser
  icon: /images/icons/gifts/strast/uzhasayuschiy-oblik.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Все противники-НИП, которые вас видят или слышат, немедленно
    совершают проверку Морали. Меньшие противники бросают её со штрафом -2. Провалившие проверку обычно
    в ужасе бегут, хотя те, у кого нет путей отхода, могут сдаться на месте. Этот дар можно применить
    к одному противнику лишь раз за сцену, а на персонажей игроков он не действует.
- name: Глубоко Похороненная Песня
  slug: gluboko-pohoronennaya-pesnya
  tier: greater
  icon: /images/icons/gifts/strast/gluboko-pohoronennaya-pesnya.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: 'Приложите Усилие до конца дня и выберите фразу, музыкальный отрывок, образ или человека в вашем
    присутствии. В выбранный вами момент или обстоятельствах вид или восприятие этого предмета обрушивает
    на всех присутствующих эффект «Знамени Страсти». Вы можете определить обстоятельства сколь угодно
    точно и заранее выбрать эффект и предмет Знамени. Предельная дальность этого эффекта — одна миля на
    уровень Обожествлённого. Учтите, что эффект применяется к любой подходящей фразе, музыке или образу:
    если Обожествлённый применит эту силу к боевому знамени страны и велит ей срабатывать у дружественных
    солдат перед битвой, каждое союзное подразделение в пределах многих миль будет затронуто, если у него
    есть такое же знамя. А если Обожествлённый вложит страсть в традиционное приветствие, то затронут
    будет каждый, кто это приветствие услышит.'
- name: Заразная Страсть
  slug: zaraznaya-strast
  tier: greater
  icon: /images/icons/gifts/strast/zaraznaya-strast.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены, чтобы посеять в видимой цели зерно определённого эмоционального
    отношения к выбранному человеку или предмету. Если цель затронута, она становится заразной и передаёт
    это же отношение своим друзьям и знакомым в течение одного разговора. Зараза может распространиться
    на пять-шесть звеньев, прежде чем утратит магическую силу, — этого обычно достаточно, чтобы полностью
    захлестнуть деревню, двор или квартал. Меньшие противники не получают спасброска, достойные враги
    могут пройти спасбросок Духа, чтобы противостоять. Эффект длится, пока Обожествлённый не освободит
    жертв или пока чувство не станет вопиюще неуместным.
- name: Сердце как Глина
  slug: serdtse-kak-glina
  tier: greater
  icon: /images/icons/gifts/strast/serdtse-kak-glina.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены, чтобы полностью управлять чувствами подопечного, диктуя всё,
    что он ощущает, и его эмоциональное отношение к любым людям или предметам по вашему выбору. Меньшие
    противники совершенно беспомощны перед такой лепкой, и их можно довести до совершенно несвойственных
    им крайностей. Достойных противников можно лепить лишь в пределах их обычного эмоционального диапазона,
    и они могут пройти спасбросок Духа, чтобы противостоять. Чувства сохраняются вопреки любым невзгодам,
    пока Обожествлённый не отпустит подопечного.
