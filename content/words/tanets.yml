name: Танец
kind: canon
colors:
  glow: '#f0a2e8'
  deep: '#331434'
  dark: '#140816'
icon: /images/icons/words/tanets.webp
description: |-
  Танец — это сила страсти и движения, смысла в самом себе и слов без произнесения. Связанные со Словом Танца могут склонять сердца зрителей и попирать волю тех, кто вздумает им помешать. Впрочем, ту грацию, что это Слово дарует, оно может и отнять.

  Обожествлённые Танца могут поднять Ловкость или Харизму до 16 или до 18, если значение уже равно 16 или больше. Они могут — в своём роде — общаться с любым разумным гуманоидом, читая язык его тела и отвечая малыми, изысканно выразительными движениями. Танец для Обожествлённого и тех, кто танцует с ним, столь же восстанавливает силы, как сон и пища.
gifts:
- name: Выразить Душу
  slug: vyrazit-dushu
  tier: lesser
  icon: /images/icons/gifts/tanets/vyrazit-dushu.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Ваш танец передаёт мысль или чувство по вашему выбору, а также
    предмет этого чувства. Меньшие противники неизменно поверят этой мысли или проникнутся этим чувством
    и будут действовать сообразно ему на пределе своего природного характера. Достойные противники получают
    спасбросок Духа, чтобы противостоять этой мысли.
- name: Двигаться в Полной Гармонии
  slug: dvigatsya-v-polnoy-garmonii
  tier: lesser
  icon: /images/icons/gifts/tanets/dvigatsya-v-polnoy-garmonii.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены и укажите некую природную опасность или опасность окружения —
    чудовищную бурю, ревущее пламя, обрушивающееся здание или иное угрожающее обстоятельство. Вы и ваши
    спутники движетесь в совершенной гармонии с окружающим миром и до конца сцены неуязвимы для этой опасности,
    избегая любого урона и помех от этого хаоса.
- name: Идеальный Ритм
  slug: idealnyy-ritm
  tier: lesser
  icon: /images/icons/gifts/tanets/idealnyy-ritm.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Ваша сверхъестественная грация и чувство ритма дают вам базовый класс защиты 3. Вы невосприимчивы
    к урону от падения и не можете споткнуться, поскользнуться или быть силой сдвинуты с выбранного места
    враждебной силой.
- name: Искусный Уход в Сторону
  slug: iskusnyy-uhod-v-storonu
  tier: lesser
  icon: /images/icons/gifts/tanets/iskusnyy-uhod-v-storonu.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены, чтобы свести на нет одну физическую атаку против вас, от которой
    теоретически можно было бы увернуться. Если это была атака по области, вы ловко перемещаетесь так,
    чтобы оказаться сразу за пределами опасности.
- name: Неземная Грация
  slug: nezemnaya-gratsiya
  tier: lesser
  icon: /images/icons/gifts/tanets/nezemnaya-gratsiya.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Ваша поступь невозможно легка и изящна, что позволяет вам пересекать на полной
    скорости любую поверхность — жидкую, отвесную или иную, не способную выдержать ваш вес. Ваше движение
    никогда не приводит в действие обереги и ловушки, работающие от нажима.
- name: Неудержимая Энергия
  slug: neuderzhimaya-energiya
  tier: lesser
  icon: /images/icons/gifts/tanets/neuderzhimaya-energiya.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Вы обладаете неуязвимой защитой от всего, что лишает вас свободы движения, — физических пут, паралича
    или магических эффектов. Действием В ход вы можете приложить Усилие до конца сцены, чтобы до конца
    этого раунда свободно проходить сквозь твёрдые предметы и физические преграды вместе со спутниками,
    следующими за вами в тот же раунд.
- name: Вневременной Ритм
  slug: vnevremennoy-ritm
  tier: greater
  icon: /images/icons/gifts/tanets/vnevremennoy-ritm.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Вы должны уже обладать даром «Идеальный Ритм». Приложите Усилие до конца сцены и выберите целью
    одного видимого достойного противника или любое число меньших противников в пределах видимости. Жертвы
    теряют способность двигаться изящно и подконтрольно и лишаются действия передвижения каждый раунд.
    Чтобы безопасно сойти с места, им приходится тратить на это Основные действия. Достойные противники
    могут приложить Усилие до конца сцены, чтобы сбросить этот эффект, а меньшие противники затронуты,
    пока вы остаётесь в этой области. Если целью этой силы стал лишь один меньший противник, длительность
    бессрочна, и цель может быть доведена судорогами и дрожью до полной телесной беспомощности.
- name: Сотрясение Стен
  slug: sotryasenie-sten
  tier: greater
  icon: /images/icons/gifts/tanets/sotryasenie-sten.webp
  badges:
  - type: act
    text: Действие
  - type: smite
    text: Кара
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. Ваши шаги порождают губительную вибрацию, способную разрушить все
    выбранные вами прочные здания и сооружения в радиусе ста футов на уровень персонажа, будто землетрясением,
    — пощажены лишь укреплённые материалами божественного уровня. Вражеские существа в этой зоне получают
    урон, равный вашему уровню персонажа, а Толпы — тройной урон. Ваши союзники и цели, которых вы освободили
    от эффекта, никогда не страдают от обрушения.
- name: Танец Ужасающей Славы
  slug: tanets-uzhasayuschey-slavy
  tier: greater
  icon: /images/icons/gifts/tanets/tanets-uzhasayuschey-slavy.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Пока дар действует, ваш танец становится ужасающим или невозможно соблазнительным
    для врагов и считается магическим оружием, наносящим 1к10 эмоционального урона с дальностью до предела
    видимости. Против Толп этот урон читается напрямую. Если существо сведено этим уроном к нулю хитов,
    оно может быть либо сражено насмерть ужасом или красотой танца, либо принуждено бежать, либо соблазнено
    вам на службу до конца сцены. В последнем случае существо восстанавливает 1 хит и до конца сцены самоубийственно
    послушно.
