name: Земля
kind: canon
colors:
  glow: '#e0bd82'
  deep: '#2c2114'
  dark: '#110c07'
icon: /images/icons/words/zemlya.webp
description: |-
  Слово Земли даёт власть над камнем и почвой и взывает к твёрдости и неподатливости скалы. Чудеса Земли вращаются вокруг камня, земли, силы, твёрдости и прочности и могут ненадолго даровать эти качества герою или другим. Этим Словом можно уничтожить металл или очистить его из руды, но нельзя лепить его так же, как необработанный камень или почву.

  Герои со Словом Земли могут установить значение Силы или Телосложения равным 16 — в зависимости от того, что им ближе: мощь несущего камня или твёрдость сплошной скалы. Если выбранное значение уже равно 16 или больше, его можно установить равным 18.
gifts:
- name: Восстание Земли
  slug: vosstanie-zemli
  tier: lesser
  icon: /images/icons/gifts/zemlya/vosstanie-zemli.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Заставьте один видимый немагический каменный или металлический предмет не крупнее дома рассыпаться
    или обрушиться. Более крупные немагические сооружения можно обрушивать по частям. Обрушение может
    быть разрушительным, нанося 1к20 повреждений всем внутри, либо управляемым, чтобы находящиеся внутри
    не пострадали. На надетые доспехи и предметы эта сила не действует.
- name: Глаза Ярче Самоцветов
  slug: glaza-yarche-samotsvetov
  tier: lesser
  icon: /images/icons/gifts/zemlya/glaza-yarche-samotsvetov.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Пока оно приложено, вы можете видеть сквозь землю и камень. Сосредоточившись
    на миг, вы можете посмотреть наружу из любого самоцвета, которого когда-либо касались, где бы он теперь
    ни был.
- name: Говорящий с Камнем
  slug: govoryaschiy-s-kamnem
  tier: lesser
  icon: /images/icons/gifts/zemlya/govoryaschiy-s-kamnem.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Вы можете говорить с землёй или камнем, видя и воспринимая всё, чему они были
    свидетелями в выбранное вами время. Камни не мыслят так, как это понимают люди, но могут в точности
    передать все звуки и картины, что происходили при них. Однако вы должны указать определённое время,
    на котором сосредоточиться.
- name: Горные Жилы
  slug: gornye-zhily
  tier: lesser
  icon: /images/icons/gifts/zemlya/gornye-zhily.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Совершите один подвиг невозможной силы. Такой подвиг требует
    слишком большого сосредоточения, чтобы быть действенной атакой, но вы можете поднять, метнуть или
    сломать почти всё, до чего дотянетесь, — вплоть до размеров скромного дома или небольшого корабля.
- name: Идущий Сквозь Землю
  slug: iduschiy-skvoz-zemlyu
  tier: lesser
  icon: /images/icons/gifts/zemlya/iduschiy-skvoz-zemlyu.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Вы и ваши спутники можете проходить сквозь камень или почву, не нуждаясь в дыхании.
    Чтобы войти в земную толщу или выйти из неё, требуется действие. Этот дар работает и с природной землёй,
    и с обработанным камнем, и применим к почве любой плотности, не жиже грязи. Вы чувствуете полости
    в земле в пределах 100 футов.
- name: Непреклонность Камня
  slug: nepreklonnost-kamnya
  tier: lesser
  icon: /images/icons/gifts/zemlya/nepreklonnost-kamnya.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Ваш естественный класс защиты равен 3, и вы обладаете неуязвимой защитой от вреда камнем, землёй
    и погребением. Вам не нужно есть, пить и дышать. Доспехи и щиты этот базовый класс защиты не улучшают.
- name: Дрожь Сердца Мира
  slug: drozh-serdtsa-mira
  tier: greater
  icon: /images/icons/gifts/zemlya/drozh-serdtsa-mira.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня, чтобы вызвать местное землетрясение в точке в пределах видимости,
    сравняв с землёй большинство зданий в радиусе 300 футов и сбив меньших противников с ног. Опрокинутым
    придётся потратить действие передвижения, чтобы подняться. Полное разорение окрестностей занимает
    около шестидесяти секунд.
- name: Строитель Горных Пиков
  slug: stroitel-gornyh-pikov
  tier: greater
  icon: /images/icons/gifts/zemlya/stroitel-gornyh-pikov.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Каждый раунд создавайте, изменяйте или разрушайте каменное или земляное сооружение размером до
    20 × 20 × 20 футов в пределах вашей обычной линии взгляда. Сооружение может быть сколь угодно затейливым
    — в пределах ваших собственных творческих умений. Правила о том, как замуровывать жертв в стенах и
    зонах, см. на стр. 27. В ходе этого вы можете создавать обычную землю или камень. Существами, целиком
    состоящими из земли или камня, в этой области можно полностью управлять; достойным противникам даётся
    спасбросок Духа, чтобы противостоять.
- name: Ярость Лавины
  slug: yarost-laviny
  tier: greater
  icon: /images/icons/gifts/zemlya/yarost-laviny.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Земля содрогается и извергает каменные осколки. Приложите Усилие, чтобы владеть этими извержениями
    как магическим оружием 1к10, пока Усилие приложено. Пока дар действует, вашу кость Схватки можно применять
    к каждому меньшему противнику, стоящему на земле или камне в пределах видимости.
