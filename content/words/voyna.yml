name: Война
kind: canon
colors:
  glow: '#f0a884'
  deep: '#301a12'
  dark: '#120907'
icon: /images/icons/words/voyna.webp
description: |-
  Слово Войны — не просто о личной доблести в бою или обаянии героического полководца. Оно о столкновении множеств на кровавом поле и об организованном истреблении масс людей. Обожествлённые Войны могут и не блистать в поединке (хотя часто блистают), но никто не сравнится с ними в управлении крупными построениями вооружённых солдат. Они — неудержимые орудия тактического уничтожения, способные срежиссировать истребление целых армий меньших противников. Только армии во главе с великими героями и при поддержке противостоящих божеств могут надеяться победить бога войны в поле.

  Обожествлённые Войны могут поднять Силу или Мудрость до 16, а если значение уже 16 или больше — до 18, в зависимости от их подхода к войне. Кроме того, Обожествлённый Войны может укрыться в рядах любой армии, деля с ней костры и тяготы, говоря на её языке и чутьём понимая её настроения и нужды. К нему будут инстинктивно прислушиваться как к на редкость бывалому ветерану и источнику ценных советов, но при этом всякий раз удобно обходить повышениями и наградами, которые привлекли бы ненужное внимание. Пока бог войны бережно держится этой скромной роли, а армия не распущена, никакая сила в мире, сколь угодно великая, не распознает в нём никого, кроме очередного смертного солдата.
gifts:
- name: В Пролом
  slug: v-prolom
  tier: lesser
  icon: /images/icons/gifts/voyna/v-prolom.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Вы бросаетесь в схватку, ведя за собой славным примером. Все
    находящиеся рядом солдаты под вашим началом получают Мораль 12 и +1 хит-дайс за каждые три ваших уровня
    с округлением вверх.
- name: Глас Труб
  slug: glas-trub
  tier: lesser
  icon: /images/icons/gifts/voyna/glas-trub.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Мощным кличем и Основным действием Обожествлённый может донести свою волю даже сквозь хаотичный
    гвалт бушующего поля боя. Нужно ли обрушить фланг врага точно рассчитанным ударом резервной конницы,
    захлопнуть ловушку на другой стороне долины или разом сомкнуть щиты и вести отход с боем — солдаты
    под вашим началом услышат ваши раскатистые приказы и инстинктивно бросятся исполнять их как только
    смогут.
- name: Мастер Войны
  slug: master-voyny
  tier: lesser
  icon: /images/icons/gifts/voyna/master-voyny.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Вы ненадолго сосредотачиваетесь и получаете идеальную мысленную карту местности вокруг себя радиусом
    в две мили на уровень персонажа, схватывая с одного взгляда то, что ускользнуло бы и от лучшего смертного
    стратега. Эта карта показывает вам любое скопление интересующих вас существ размером с Толпу, даёт
    совершенное знание о местонахождении любых ваших солдат независимо от расстояния до них и помогает
    выявить очевидные слабые места в укреплениях сооружения. Вы также можете взглянуть на любое место
    прошлой битвы и мысленно увидеть, как она должна была разворачиваться, — при условии, что останки
    павших ещё можно найти на поле. Это могут быть как свежие трупы, так и выбеленные солнцем полузасыпанные
    кости.
- name: Павеза из Крови и Железа
  slug: paveza-iz-krovi-i-zheleza
  tier: lesser
  icon: /images/icons/gifts/voyna/paveza-iz-krovi-i-zheleza.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня, обороняя позицию или укрепление. До конца сцены Толпы солдат у
    вас на службе обладают неуязвимой защитой от атак существ, у которых хит-дайсов не больше, чем у вас
    уровней. Большинство враждебных сил после нескольких раундов боя с такими явно неуязвимыми защитниками
    прекратят штурм и обратятся в бегство.
- name: Познай Врага Своего
  slug: poznay-vraga-svoego
  tier: lesser
  icon: /images/icons/gifts/voyna/poznay-vraga-svoego.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Выберите целью видимую группу вооружённых солдат. Вы немедленно узнаёте цели и намеченную тактику
    этой группы не хуже самого осведомлённого из её командиров. Это не совсем чтение мыслей, а скорее
    инстинктивное и всеобъемлющее понимание того, чего добивается ваш враг, — на основе мгновенно схваченного
    и переработанного множества мельчайших примет вкупе с вашим божественным опытом. Достойные противники
    получают спасбросок Духа, чтобы их планы не были раскрыты. Одного этого дара нередко достаточно, чтобы
    принести богу войны победу.
- name: Пробудить Преторианцев
  slug: probudit-pretoriantsev
  tier: lesser
  icon: /images/icons/gifts/voyna/probudit-pretoriantsev.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. Вы призываете свиту солдат, павших в бою под вашим началом или
    бок о бок с вами. Они самоубийственно преданы вам и насчитывают одну Толпу на каждые два ваших уровня.
    Эти Толпы имеют характеристики солдат-ветеранов, бонус к попаданию, равный вашему уровню, и оружие,
    считающееся магическим для причинения вреда сверхъестественным существам, и могут выполнять любую
    службу, посильную отборным человеческим солдатам. Этот дар можно использовать лишь раз в день, и одновременно
    не может существовать больше предельно допустимого числа Толп. Вместо двух Маленьких Толп можно призвать
    одну Большую, а вместо двух Больших — одну Огромную. Созданные этим даром солдаты не помнят своей
    смерти, немногословны и не осознают своего сумеречного состояния. Они чутьём отзываются на невысказанные
    приказы Обожествлённого. Если их убьют снова, их можно призвать на следующий день — и этого они тоже
    помнить не будут.
- name: Форсированный Марш
  slug: forsirovannyy-marsh
  tier: lesser
  icon: /images/icons/gifts/voyna/forsirovannyy-marsh.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: день'
  body: Раз в день вы и любые ваши последователи можете двинуться по суше со скоростью десять миль в час,
    не нуждаясь в остановках на отдых или пищу. Так вы легко пересечёте любую местность, кроме самой непроходимой,
    — будь то обледенелые горы или тлеющие адские пустоши, — при условии, что теоретический путь через
    них существует. Вы можете держать этот темп, пока не остановитесь полностью, не атакуете врага или
    не будете атакованы. Вы всё ещё можете разведывать, идти по следу и даже пытаться соблюдать некоторую
    скрытность, не срывая марша. Если марш не был прерван, вы можете приложить Усилие до конца дня, чтобы
    держать темп ещё сутки, сверхъестественным образом обходясь даже без сна и прочих телесных нужд, но
    по-прежнему восстанавливая хиты и Усилие как обычно.
- name: Избранник Бога Войны
  slug: izbrannik-boga-voyny
  tier: greater
  icon: /images/icons/gifts/voyna/izbrannik-boga-voyny.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Этот дар требует, чтобы Обожествлённый основал воинский культ в свою честь. Он немедленно получает
    2 постоянных очка Влияния. За каждые три уровня с округлением вверх из числа его почитателей выдвигается
    Великий Герой. Обожествлённый наделяет каждого из своих Героев любыми тремя малыми дарами на выбор
    из Слов Лука, Приказа или Меча. Если Избранный герой убит, ему со временем найдётся замена. Это может
    случиться сразу же, если давний приверженец славно пал в пылу битвы с достойным противником, — или
    занять куда больше времени, если его жизнь была растрачена небрежно и невдохновляюще.
- name: Мясник Легионов
  slug: myasnik-legionov
  tier: greater
  icon: /images/icons/gifts/voyna/myasnik-legionov.webp
  badges:
  - type: act
    text: Действие
  - type: smite
    text: Кара
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня, чтобы уничтожить любую видимую Толпу меньших противников, ведущую
    бой с вами или вашими последователями. Их немедленно постигнет катастрофическая неудача — похищение
    знамени, гибель любимого предводителя от шальной стрелы или даже пустой слух, пущенный в задних рядах.
    Как бы то ни было, вражеская толпа быстро побежит, и в считанные секунды её перебьют, пленят или прогонят
    прочь безнадёжно деморализованной.
- name: Поднять Павшее Воинство
  slug: podnyat-pavshee-voinstvo
  tier: greater
  icon: /images/icons/gifts/voyna/podnyat-pavshee-voinstvo.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Чтобы получить этот дар, нужен малый дар «Мастер Войны». Приложите Усилие до конца дня, стоя на
    месте прошедшей битвы. Вы можете воскресить по одной Толпе павших солдат-ветеранов на каждый уровень
    персонажа, и они будут сражаться за вас в полную силу. Размер Толп остаётся на усмотрение Ведущего
    — в зависимости от того, насколько давно была битва и сколько народу там полегло. Хотя они и будут
    выполнять приказы, поднятые солдаты в своих мыслях будут заново вести ту же битву, в которой погибли,
    против тех же врагов. Они будут глухи к любым свидетельствам обратного и растают на рассвете.
