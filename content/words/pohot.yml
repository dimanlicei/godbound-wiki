name: Похоть
kind: homebrew
colors:
  glow: '#ff8fd0'
  deep: '#380b28'
  dark: '#14050f'
icon: images/icons/words/pohot.webp
description: 'Слово Греха: Похоть. Демоны похоти желанны всеми, будь то смертный или божество, их красота
  и невероятная выносливость манит их всех. Улучшите параметр Выносливости или Харизмы до 18. Вы становитесь
  иммунны к воздействию на ваш разум и эмоции. А так же интимная близость восстанавливает вам количество
  Хит-Дайсов, равное вашему уровню, но не выше максимального ХД партнёра, если вы готовы к его смерти.
  Вы можете оставить партнёру 1 ХД, дабы тот не умер от истощения.'
gifts:
- name: Запретные сны
  slug: zapretnye-sny
  tier: lesser
  icon: images/icons/gifts/pohot/zapretnye-sny.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложив усилие, вы можете вторгнуться в сон субъекта, чьё имя вы знаете или можете ощутить тем
    или иным способом. Вторгнувшись в сон, вы получаете полный контроль над ним, благодаря чему вы способны
    изменять его и модифицировать. Жертва может запомнить происходившее с ней во сне, если на то будет
    воля вторженца. Достойные противники могут пройти спасбросок Духа, дабы запомнить сон или же проснуться
    от него. Помимо этого, владелец слова Похоть, имеющий этот дар, способен окунаться в мир снов, словно
    бы владеет словом Сон или Ночь.
- name: Интуиция проститутки
  slug: intuitsiya-prostitutki
  tier: lesser
  icon: images/icons/gifts/pohot/intuitsiya-prostitutki.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Выберите видимую цель. Получите полное понимание их романтических вкусов, любых значительных удовольствий,
    которые они получают, и их желаний, которые наиболее соответствуют интересам или целям Обожествлённых.
    Если это сформулировать как вопрос о том, чего цель хочет в обмен на конкретную услугу, по мнению
    ГМ выявляется наиболее вероятное необходимое стимулирование. При использовании против достойного противника
    Обожествлённый должен Приложить Усилие для этой сцены.
- name: Невероятная красота
  slug: neveroyatnaya-krasota
  tier: lesser
  icon: images/icons/gifts/pohot/neveroyatnaya-krasota.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Обожествлённый имеет эффективный КД 3 из-за своей неописуемой красоты, что способна пошатнуть
    решимость любого. Первая атака, которую любое существо или толпа запускает в пользователя в каждом
    бою, является автоматическим промахом, поскольку он колеблется в своей атаке.
- name: Пылающая страсть
  slug: pylayuschaya-strast
  tier: lesser
  icon: images/icons/gifts/pohot/pylayuschaya-strast.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложив усилие, окунитесь в омут страсти и жестокости. Выбрав себя или союзника, что не является
    толпой, ваша страсть и боль врагов становятся сладким нектаром, что способны исцелять даже самые ужасающие
    раны. Единожды в ход, нанеся урон противнику, вы восстанавливаете 2 ХД.
- name: Форма похоти
  slug: forma-pohoti
  tier: lesser
  icon: images/icons/gifts/pohot/forma-pohoti.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Прикладывая усилие, вы принимаете облик существа, которого вожделеет цель, будь то реальный или
    нереальный человек/объект/монстр/химера. Достойный противник, пройдя спасбросок духа, осознаёт обман,
    но всё ещё не способен увидеть сквозь него. Вы так же способны принять свой более демонический облик
    без траты действий, получая при этом скорость полёта, равную скорости передвижения.
- name: Безумство Любви
  slug: bezumstvo-lyubvi
  tier: greater
  icon: images/icons/gifts/pohot/bezumstvo-lyubvi.webp
  badges:
  - type: act
    text: Действие
  - type: smite
    text: Кара
  - type: eff
    text: 'Усилие: день'
  body: Приложите усилие до конца дня, все противники или же орды в радиусе 100 футов становятся одержимы
    вашей красотой и будут сражаться друг с другом за вашу благосклонность. Достойный противник должен
    пройти спасбросок духа, в ином случае он так же поддастся зову и будет сражаться с другими.
- name: Касание суккуба
  slug: kasanie-sukkuba
  tier: greater
  icon: images/icons/gifts/pohot/kasanie-sukkuba.webp
  badges:
  - type: act
    text: Действие
  - type: smite
    text: Кара
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите усилие до конца сцены, ваше истощающее прикосновение усиливается, позволяя забрать жизнь
    врага даже лёгким прикосновением. Вы высасываете у цели 1 ХД за уровень персонажа. При убийстве таким
    образом душа убитого становится вашей. Данный дар не может быть использован теми, кто не владеет словом
    Похоти.
- name: Обжигающая страсть
  slug: obzhigayuschaya-strast
  tier: greater
  icon: images/icons/gifts/pohot/obzhigayuschaya-strast.webp
  badges:
  - type: act
    text: Действие
  - type: smite
    text: Кара
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. До конца сцены ваша страсть начинает пылать столь жарко, что
    опаляет других, нанося эмоциональный урон, равный вашему уровню, со спасброском Духа для половины.
    Призывы вашей страсти считаются Карой и, следовательно, не может использоваться два раунда подряд.
