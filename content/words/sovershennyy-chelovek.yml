name: Совершенный Человек
kind: supplement
colors:
  glow: '#f0c68a'
  deep: '#2e2418'
  dark: '#120e08'
icon: images/icons/words/sovershennyy-chelovek.webp
description: Вы — образец человеческих возможностей, отточенный до превосходной остроты одержимой волей,
  улучшенной наследственностью или слепым случаем. Любая характеристика ниже 13 поднимается до 13, а одна
  характеристика на ваш выбор может быть поднята до 18. Хотя вы, строго говоря, смертны, ваши превосходные
  дары всё же позволяют вам пользоваться всеми обычными правилами Обожествлённого, включая Божественную
  Ярость и приложение Усилия. Если вы связаны с дополнительными Словами, то, вероятно, через некий особый
  артефакт, который у вас нельзя отнять, или через какое-то единственное в своём роде магическое благословение.
gifts:
- name: Всё Своё
  slug: vse-svoe
  tier: lesser
  icon: images/icons/gifts/sovershennyy-chelovek/vse-svoe.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Вы отточили свои природные способности так, что они «незримы» для магических противодействий.
    Ваши дары и чудеса Слова Совершенного Человека нельзя рассеять ни оборонительно, ни наступательно,
    и они не воспринимаются как магия для эффектов, распознающих таковую. На вас не действует способность
    «Хладное Дыхание» Несотворённых и Эмпирейские Обереги. Ваши траты Влияния и Владычества, которые Правдоподобны
    и целиком опираются на способности Совершенного Человека, не замечают мирских оберегов.
- name: Выверенный Прицел
  slug: vyverennyy-pritsel
  tier: lesser
  icon: images/icons/gifts/sovershennyy-chelovek/vyverennyy-pritsel.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. До конца сцены все ваши броски попадания бросаются дважды, и
    берётся лучший результат.
- name: Лучший в Мире Х
  slug: luchshiy-v-mire-h
  tier: lesser
  icon: images/icons/gifts/sovershennyy-chelovek/luchshiy-v-mire-h.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Выберите занятие или роль — «учёный», «вор», «сыщик», «военачальник» и тому подобное. Вы самопроизвольно
    преуспеваете во всех проверках характеристик, связанных с этой ролью, если задача хотя бы теоретически
    по силам человеку. Этот дар можно взять больше одного раза.
- name: Народный Заступник
  slug: narodnyy-zastupnik
  tier: lesser
  icon: images/icons/gifts/sovershennyy-chelovek/narodnyy-zastupnik.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Ваши связи чрезвычайно полезны. Вы получаете дополнительное Влияние, равное вашему уровню персонажа,
    и лишнее очко Владычества каждый месяц, хотя это Влияние и Владычество можно тратить лишь на Правдоподобные
    изменения, которым могли бы помочь ваши знакомства и союзники из вашего прошлого или из приключений.
    Вы всегда можете найти местного знакомого, если это хоть сколько-нибудь правдоподобно, и такой знакомый
    всегда сможет предложить столько помощи, сколько мог бы обычный человек на важной должности.
- name: По Стенам
  slug: po-stenam
  tier: lesser
  icon: images/icons/gifts/sovershennyy-chelovek/po-stenam.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Благодаря ловкости или мастерству ваш естественный класс защиты становится равным 3. Вы можете
    взбираться по отвесным поверхностям со своей обычной скоростью передвижения, прыгать вертикально на
    половину этого расстояния и горизонтально — на всю её величину.
- name: Удача Смертного
  slug: udacha-smertnogo
  tier: lesser
  icon: images/icons/gifts/sovershennyy-chelovek/udacha-smertnogo.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: Когда атака или эффект опустил бы вас ниже 1 хита или вызвал бы вашу мгновенную гибель, вы можете
    приложить Усилие до конца сцены, чтобы свести его на нет, уклонившись или иначе избежав его полного
    действия.
- name: Гроза Улиц
  slug: groza-ulits
  tier: greater
  icon: images/icons/gifts/sovershennyy-chelovek/groza-ulits.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Ваше мастерство или решимость делают ваши атаки магическим оружием, наносящим 1к10 урона. Ваши
    обычные атаки всегда попадают по меньшим противникам, а отдельные меньшие противники или те, кто в
    малых Толпах, не могут навредить вам своими немагическими обычными атаками или немагическими особыми
    способностями. Если меньшие противники собраны в Толпу, их атаки и способности вредить вам могут.
- name: Несгибаемая Воля
  slug: nesgibaemaya-volya
  tier: greater
  icon: images/icons/gifts/sovershennyy-chelovek/nesgibaemaya-volya.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Ваша несокрушимая решимость даёт вам неуязвимую защиту от сил, влияющих на разум или читающих
    его, и огромную способность к сосредоточению. Раз за сцену Мгновенным действием вы можете счесть бросок
    попадания, спасбросок или проверку характеристики самопроизвольным успехом.
- name: Человеческая Твёрдость
  slug: chelovecheskaya-tverdost
  tier: greater
  icon: images/icons/gifts/sovershennyy-chelovek/chelovecheskaya-tverdost.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Отдохнув пять минут, восстановите свои хиты до половины предела с округлением вверх, если сейчас
    они ниже этого числа. Кроме того, раз в день Мгновенным действием вы можете приложить Усилие до конца
    дня, чтобы мгновенно восстановить половину своего предела хитов с округлением вверх.
