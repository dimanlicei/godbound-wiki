name: Смерть
kind: canon
colors:
  glow: '#c9ccd4'
  deep: '#1b1b20'
  dark: '#0a0a0d'
icon: /images/icons/words/smert.webp
description: |-
  Смерть ведома всему смертному, и это Слово даёт власть над этой неизбежной участью. Его чудеса отводят или приносят смерть, раскрывают подробности чьей-то гибели, повелевают неупокоенными мертвецами или создают беспокойную нежить.

  Герои со Словом Смерти могут действием повелевать нежитью в своём присутствии, отдавая приказ одной Толпе любого размера. Высшая нежить получает спасбросок Духа, чтобы противостоять, и ей нельзя приказать себя уничтожить. Действием В ход они также узнают подробности того, что, где и как умерло или умирает в пределах 100 футов от них.
gifts:
- name: Бледная Корона Манит
  slug: blednaya-korona-manit
  tier: lesser
  icon: /images/icons/gifts/smert/blednaya-korona-manit.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Вы можете призвать нежить, при необходимости мгновенно стягивая
    нужные части из ближайшего источника. Призывается одна высшая нежить с хит-дайсами не более чем вдвое
    больше вашего уровня, либо создаётся одна Маленькая Толпа низшей нежити в 1 ХД на каждые три ваших
    уровня с округлением вверх. Труп, обращаемый в высшую нежить, не должен был получить погребальных
    обрядов и не должен быть мёртв дольше месяца. Нежить предана вам, но рассыпается, когда вы примените
    этот дар снова. Призванные существа или Толпы можно сохранить бессрочно за 1 очко Владычества каждое.
- name: Жатва Белой Кости
  slug: zhatva-beloy-kosti
  tier: lesser
  icon: /images/icons/gifts/smert/zhatva-beloy-kosti.webp
  badges:
  - type: act
    text: Действие
  - type: smite
    text: Кара
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Действием вы можете мгновенно уничтожить любую враждебную низшую
    нежить в пределах видимости, если она является меньшими противниками. Прочая нежить в пределах видимости
    получает урон, равный вашему уровню в очках, утроенный для Толп.
- name: Мантия Покоя
  slug: mantiya-pokoya
  tier: lesser
  icon: /images/icons/gifts/smert/mantiya-pokoya.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Напасть на вас — значит умереть. Любой меньший противник, пытающийся
    причинить вам физический вред, получает 1 очко урона ещё до того, как его атака будет разрешена, а
    Толпы получают обычную кость 1к20. Противники с несколькими атаками за раунд получают этот урон лишь
    раз за раунд.
- name: Отказ в Милосердии
  slug: otkaz-v-miloserdii
  tier: lesser
  icon: /images/icons/gifts/smert/otkaz-v-miloserdii.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Те, кто сведён к нулю хит-дайсов или хитов в пределах 200 футов от вас, автоматически стабилизируются
    или умирают — как вы пожелаете. Если вы того захотите, согласные живые существа при нуле ХД или хитов
    рядом с вами могут продолжать действовать столько раундов, сколько у вас уровней, прежде чем неотвратимо
    падут замертво.
- name: Рука-Коса
  slug: ruka-kosa
  tier: lesser
  icon: /images/icons/gifts/smert/ruka-kosa.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Смерть в вашем взгляде или в вашем клинке, и вы можете пользоваться ею как магическим
    оружием. Оно имеет кость урона 1к10 и дальность 200 футов. Эта атака всегда наносит живым существам
    или нежити не менее 1 очка урона, даже если бросок на попадание промахнулся.
- name: Хранитель Могил
  slug: hranitel-mogil
  tier: lesser
  icon: /images/icons/gifts/smert/hranitel-mogil.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: по желанию'
  body: Вы точно узнаёте, где в пределах 200 футов находятся все трупы, нежить и останки, и кем они были
    при жизни. Вы можете определить, как именно они погибли, будто наблюдали их смерть лично. Если вы
    приложите Усилие, вы обладаете неуязвимой защитой от низшей нежити.
- name: Нет Освобождения
  slug: net-osvobozhdeniya
  tier: greater
  icon: /images/icons/gifts/smert/net-osvobozhdeniya.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие и выберите видимую цель. Она просто не может умереть, пока вы не вернёте Усилие.
    Сведённая к нулю хит-дайсов или хитов, она будет обездвижена в течение часа, а затем оживёт с одним
    хитом. Если её тело уничтожено или разбросано, она будет существовать в вечной мгле слепой агонии,
    пока магией или восстанавливающими чудесами не соберут части тела или пока Усилие не будет возвращено.
    Обожествлённый не может применить эту силу к себе самому.
- name: Пожинающее Слово
  slug: pozhinayuschee-slovo
  tier: greater
  icon: /images/icons/gifts/smert/pozhinayuschee-slovo.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца сцены и выберите цель на любом расстоянии. Достаточно жеста, если вы
    видите цель; иначе вы должны назвать имя, которое она считает своим истинным. Меньшие противники падают
    замертво, и их нельзя оживить без вашего дозволения. Для достойных противников Усилие должно быть
    приложено до конца дня, и им даётся спасбросок Стойкости, чтобы противостоять. Более того, чтобы Смерть
    до них дотянулась, достойные противники должны быть ранены — довольно даже одного очка урона.
- name: Призвать ко Дню
  slug: prizvat-ko-dnyu
  tier: greater
  icon: /images/icons/gifts/smert/prizvat-ko-dnyu.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. Любое обычное смертное существо может быть возвращено из мёртвых,
    если труп относительно цел, если оно не получило погребальных обрядов и не было отправлено в Рай и
    если оно мертво не дольше месяца. Оно оживает с 1 хит-дайсом. Обожествлённых и сверхъестественных
    существ так вернуть нельзя.
