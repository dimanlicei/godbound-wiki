name: Меч
kind: canon
colors:
  glow: '#c6dbe8'
  deep: '#232a30'
  dark: '#0d1014'
icon: /images/icons/words/mech.webp
description: |-
  Слово Меча — это Слово ближнего боя, прямого противостояния Обожествлённого и его противников. Чудеса Меча включают в себя безошибочные удары, сокрушительные атаки и чудесное избегание вреда в битве. Хотя эти чудеса весьма могущественны, на расстоянии они не работают.

  Возрождённые со Словом Меча считают все свои атаки оружием и безоружные атаки магическими, не могут быть обезоружены и могут Мгновенным действием призвать себе в руку любое оружие ближнего боя, которым они когда-либо пользовались. Воинские культуры дорожат ими.
gifts:
- name: Безошибочный Клинок
  slug: bezoshibochnyy-klinok
  tier: lesser
  icon: /images/icons/gifts/mech/bezoshibochnyy-klinok.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Ваша текущая или следующая атака в ближнем бою попадает на любом
    результате, кроме натуральной 1, и наносит максимальные повреждения. Этот удар пробивает любую защиту,
    кроме неуязвимой защиты от используемого оружия.
- name: Девять Железных Стен
  slug: devyat-zheleznyh-sten
  tier: lesser
  icon: /images/icons/gifts/mech/devyat-zheleznyh-sten.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Вы обладаете неуязвимой защитой против всех физических атак до
    начала вашего следующего раунда. Эта защита не касается опасностей окружения, заклинаний и других
    не-атакующих форм вреда. Как и все Мгновенные дары, этот можно использовать даже после того, как нападающий
    совершил успешный бросок на попадание.
- name: Жаждущая Бритва
  slug: zhazhduschaya-britva
  tier: lesser
  icon: /images/icons/gifts/mech/zhazhduschaya-britva.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Вы всегда попадаете своими атаками в ближнем бою по меньшим противникам. Бросок
    на попадание не нужен, но это преимущество касается только настоящих атак оружием ближнего боя или
    безоружных атак и не затрагивает прочие эффекты, требующие попадания по противнику для наложения враждебного
    эффекта.
- name: Презрение к Дистанции
  slug: prezrenie-k-distantsii
  tier: lesser
  icon: /images/icons/gifts/mech/prezrenie-k-distantsii.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Ваше действие передвижения может переместить вас в любую точку в пределах вашего движения, при
    условии, что путь к ней не преграждён и в конце пути есть цель, которую можно атаковать. Так герой
    может ринуться прямо на крышу или балкон, не проходя весь физический путь до них. Противников, которые
    слишком далеко, чтобы достичь их за один раунд, можно преследовать несколько раундов, но, настигнув,
    вы обязаны их атаковать. Это преследование может простираться даже в воздух, поддерживая героя, пока
    он не победит врага или не решит отступить, после чего он безопасно приземляется в точке под собой.
- name: Сквозь Красный Лес
  slug: skvoz-krasnyy-les
  tier: lesser
  icon: /images/icons/gifts/mech/skvoz-krasnyy-les.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Пока Усилие приложено, сражаясь с несколькими меньшими противниками или Толпой
    из них, вы можете решить получить повреждения так, как будто один из них — на выбор Ведущего — успешно
    по вам попал. После этого вы получаете неуязвимую защиту против атак оружием и безоружных атак остальных
    этих меньших противников до начала вашего следующего хода.
- name: Сталь Без Конца
  slug: stal-bez-kontsa
  tier: lesser
  icon: /images/icons/gifts/mech/stal-bez-kontsa.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Все ваши атаки оружием ближнего боя считаются магическим оружием и наносят кость повреждений 1к10+1.
    Даже безоружные атаки могут получать это преимущество при подходящем объяснении (например, бритвенные
    когти). Как и в случае прочих усиливающих оружие даров, вы можете использовать любой атрибут, чтобы
    модифицировать совершённые так атаки, при условии, что объясните, как он связан с вашим стилем боя.
- name: Перерезая Алую Дорогу
  slug: pererezaya-aluyu-dorogu
  tier: greater
  icon: /images/icons/gifts/mech/pererezaya-aluyu-dorogu.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Против противников, у которых хит-дайсов вдвое меньше, чем у вас уровней, или
    ещё меньше (но не менее 1), ваши броски повреждений в ближнем бою читаются напрямую и всегда максимальны.
    Переливающийся урон может быть применён к любым другим противникам, подходящим под это условие и находящимся
    в пределах 10 футов. Против Толп, состоящих из подходящих созданий, вы вместо этого просто бросаете
    кость повреждений напрямую, не максимизируя её. Этот дар не затрагивает кость Схватки.
- name: Путь Сквозь Войну
  slug: put-skvoz-voynu
  tier: greater
  icon: /images/icons/gifts/mech/put-skvoz-voynu.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Пока в этом раунде вы не совершаете бросок на попадание и не применяете враждебный
    эффект, вы обладаете неуязвимой защитой против всех атак оружием и безоружных атак. Кость Схватки
    при этом использовать всё ещё можно. Эта защита не действует против урона от окружения, заклинаний
    и магических эффектов. Если этот дар был сброшен или прекращён, повторно включить его в той же сцене
    нельзя.
- name: Сокрушающий Удар
  slug: sokrushayuschiy-udar
  tier: greater
  icon: /images/icons/gifts/mech/sokrushayuschiy-udar.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Ваши броски повреждений в ближнем бою и кости Схватки всегда дают максимально
    возможный результат. Действием на раунд вы можете разрушить перед собой преграду толщиной до пяти
    футов каменной кладки, снеся её ударом или в рамках своего действия передвижения. Магические вещества
    могут сопротивляться этой силе.
