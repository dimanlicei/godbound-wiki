name: Знание
kind: canon
colors:
  glow: '#9fd0ee'
  deep: '#122334'
  dark: '#060e16'
icon: images/icons/words/znanie.webp
description: |-
  Знание — это Слово понимания. Всё, что известно смертным учёным, находится в сфере действия этого Слова, вместе с тайнами прошлого и настоящего. Слово Знания не может пронзить завесу будущего, но может раскрыть практически что угодно о настоящем мире. Однако глубокие тайны мира кампании ему не по зубам. Факты или события, совершённые кем-то со Словом Обмана, позволяют их автору пройти спасбросок Духа, чтобы скрыть их от Слова Знания.

  Герои со Словом Знания могут установить значение своего Интеллекта или Мудрости равным 16. Если значение уже равно 16 или больше, его можно установить равным 18.
gifts:
- name: Весть Издалека
  slug: vest-izdaleka
  tier: lesser
  icon: images/icons/gifts/znanie/vest-izdaleka.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Узнайте, что происходит в конкретном месте или общине, где вы
    бывали, получив до трёх предложений о том, что Ведущий сочтёт для вас самым важным или наиболее значимым
    для ваших нынешних интересов.
- name: Иссечение Понимания
  slug: issechenie-ponimaniya
  tier: lesser
  icon: images/icons/gifts/znanie/issechenie-ponimaniya.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Действием сотрите у видимой цели знание языка, интеллектуального навыка или конкретной темы либо
    события. Этот дар не может стереть колдовские способности или иные силы, но длится, пока навык не
    будет выучен заново или Обожествлённый не смягчится. Достойные противники могут пройти спасбросок
    Духа, чтобы противостоять.
- name: Лучшие Планы
  slug: luchshie-plany
  tier: lesser
  icon: images/icons/gifts/znanie/luchshie-plany.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня и изложите план. Ведущий называет наиболее существенное осложнение
    или угрозу его исполнению, о которой вы ещё не знаете. Эту подсказку можно получить только один раз
    для каждой преследуемой цели; что считать другой целью, решает Ведущий.
- name: Лучший Способ
  slug: luchshiy-sposob
  tier: lesser
  icon: images/icons/gifts/znanie/luchshiy-sposob.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Получите от Ведущего одно предложение правдивой информации о
    наилучшем способе достичь вашей текущей цели или желания. Новую информацию этим даром получить нельзя,
    пока по уже полученной не предприняты действия или цель не заброшена.
- name: Обжигающая Истина
  slug: obzhigayuschaya-istina
  tier: lesser
  icon: images/icons/gifts/znanie/obzhigayuschaya-istina.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены и выберите видимую цель. Узнайте то знание о ней самой или её
    планах, которое она меньше всего хотела бы вам открыть — что именно, решает Ведущий. Достойные противники
    получают спасбросок Духа, чтобы противостоять этому незаметному дознанию.
- name: Открытая Истина
  slug: otkrytaya-istina
  tier: lesser
  icon: images/icons/gifts/znanie/otkrytaya-istina.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены и получите ответ на любой вопрос — при условии, что правду о нём
    не скрывают намеренно все, кто её знает. Ответ, как правило, краток, не более нескольких предложений.
- name: Всеведущий Учёный
  slug: vseveduschiy-uchenyy
  tier: greater
  icon: images/icons/gifts/znanie/vseveduschiy-uchenyy.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Вы овладели всеми сферами академического знания смертных. Вы всегда знаете ответ на любой вопрос,
    относящийся к такому знанию, если его знает хоть какой-нибудь смертный мудрец, и автоматически проходите
    проверки атрибутов на выполнение интеллектуальных задач, если они в пределах возможностей смертных.
- name: Неотразимый Вопрос
  slug: neotrazimyy-vopros
  tier: greater
  icon: images/icons/gifts/znanie/neotrazimyy-vopros.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. Задайте Ведущему любой вопрос о текущих или прошедших событиях
    и получите ответ в одно слово или короткую фразу. Эту силу нельзя использовать более одного раза по
    одной и той же теме, пока положение дел существенно не изменится.
- name: Обнаружить Дефект
  slug: obnaruzhit-defekt
  tier: greater
  icon: images/icons/gifts/znanie/obnaruzhit-defekt.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены и выберите цель — существо или организацию. Узнайте её нынешние
    слабости и наиболее уязвимые на этот момент места, включая любые скрытые способы, которыми её можно
    убить или уничтожить. Существа раскрывают свои хит-дайсы и общий запас Усилия.
