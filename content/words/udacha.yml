name: Удача
kind: canon
colors:
  glow: '#8ceb96'
  deep: '#123014'
  dark: '#061407'
icon: images/icons/words/udacha.webp
description: |-
  Слово Удачи в основном незаметно, без явных и очевидных эффектов других сфер. Вместо этого Удача просто осеняет тех, кто благословлён её силой, устраивая так, что дела для них складываются хорошо, а для тех, кто им не угодил, — очень плохо. Чудеса Удачи можно использовать, чтобы перекраивать судьбу, добиваясь, чтобы кажущиеся случайными события обернулись хорошо или плохо для тех, на кого обращено внимание героя.

  Герои, одарённые Словом Удачи, могут раз в день бросить 1к20. В любой момент этого дня они могут заменить свой или чужой бросок 1к20 на отложенный результат. Заменить бросок можно только один раз в день.
gifts:
- name: Девять Жизней
  slug: devyat-zhizney
  tier: lesser
  icon: images/icons/gifts/udacha/devyat-zhizney.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Автоматически перебрасывайте спасброски или вражеские броски на попадание, которые привели бы
    к гибели или смертельному ранению героя. Берётся второй результат, даже если он хуже.
- name: Засолить Удачу
  slug: zasolit-udachu
  tier: lesser
  icon: images/icons/gifts/udacha/zasolit-udachu.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие после того, как герой бросил кость на что-то важное. Кость перебрасывается, но
    исходный результат сохраняется. Когда Усилие возвращается, сохранённый результат можно отдать любому,
    кто находится рядом с героем, при условии, что тот бросает кость с тем же числом граней. Несогласные
    достойные противники могут пройти спасбросок Духа, чтобы отказаться от подарка. Этот дар может хранить
    только один бросок за раз.
- name: Мир Против Тебя
  slug: mir-protiv-tebya
  tier: lesser
  icon: images/icons/gifts/udacha/mir-protiv-tebya.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Герой получает способность использовать удачу как оружие с дальностью 100 футов,
    обрушивая на противника внезапные и совершенно невероятные бедствия обычными бросками на попадание.
    При атаке урон составляет 1к10 и считается магическим оружием. Источник этого невероятного невезения
    неразличим для смертных наблюдателей и несверхъестественных существ.
- name: Незамутнённое Благодеяние
  slug: nezamutnennoe-blagodeyanie
  tier: lesser
  icon: images/icons/gifts/udacha/nezamutnennoe-blagodeyanie.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Естественный класс защиты героя равен 3 — удача уводит его от опасностей. Если несчастье случайно
    обрушивается на кого-то из его группы, жертвой никогда не оказывается он сам. Доспехи и щиты этот
    базовый класс защиты не улучшают.
- name: Поворот Судьбы
  slug: povorot-sudby
  tier: lesser
  icon: images/icons/gifts/udacha/povorot-sudby.webp
  badges:
  - type: act
    text: Мгновенно
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Другое существо перебрасывает бросок, который, как вам известно,
    оно только что сделало.
- name: Проклятая Удача
  slug: proklyataya-udacha
  tier: lesser
  icon: images/icons/gifts/udacha/proklyataya-udacha.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: сцена'
  body: Одна цель, не являющаяся Толпой, проклята невезением. Она всегда будет проигрывать в азартных
    играх, с ней постоянно будут случаться разные неприятности несмертельного характера, и она всегда
    бросает дважды на попадания и спасброски, беря худший результат. Достойные противники могут пройти
    спасбросок Духа, чтобы противостоять, и требуют приложить Усилие до конца сцены. Эффект длится, пока
    вы не решите его снять, пока он не будет рассеян или пока не произойдёт определённое событие.
- name: Невозможная Победа
  slug: nevozmozhnaya-pobeda
  tier: greater
  icon: images/icons/gifts/udacha/nevozmozhnaya-pobeda.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Ровно один раз герой автоматически побеждает в конфликте или добивается своего в некой ситуации
    по слепой удаче. Это может быть и не полная победа, но основной цели он достигает. После этого он
    теряет дар, его стоимость возвращается, и купить его снова уже никогда нельзя. Чудеса Удачи не могут
    воспроизвести этот дар.
- name: Неизменное Везение
  slug: neizmennoe-vezenie
  tier: greater
  icon: images/icons/gifts/udacha/neizmennoe-vezenie.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Герой всегда может перебросить натуральную 1 на любой брошенной им кости. Он может определять
    исход любого случайного элемента в азартных или обычных играх.
- name: По Воле Случая
  slug: po-vole-sluchaya
  tier: greater
  icon: images/icons/gifts/udacha/po-vole-sluchaya.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Игрок объявляет событие в своём присутствии, которое не является
    совершенно невероятным, и оно происходит. Повреждения противникам ограничены костью 1к12 для сосредоточенного
    на одной цели бедствия либо костью 1к6 каждому для неприятностей, затрагивающих группу. Эта сила действует
    только на физические предметы и события, но не на разум и чувства.
