name: Пустыня
kind: canon
colors:
  glow: '#ffd98a'
  deep: '#3a2c11'
  dark: '#160f05'
icon: /images/icons/words/pustynya.webp
description: |-
  Владыка праха и запустения, Обожествлённый Слова Пустыни правит сухими пустошами и каменистыми бесплодными землями. Он призывает иссушающий воздух и убийственный зной своих владений и повелевает морочащими миражами и пустыми пространствами, что сбивают с пути незадачливого странника.

  Обожествлённый Пустыни обладает неуязвимой защитой от огня и любой температуры, встречающейся в обычной пустыне. Он не нуждается в пище и воде и обладает неуязвимой защитой от того, чтобы заблудиться, где бы он ни оказался. Многие его дары связаны с изменением пустынного окружения. Для этих даров «пустыня» — это любая засушливая песчаная или каменистая местность не менее ста одного фута в поперечнике; спорные случаи решает Ведущий. Такие «пустыни» могут быть как природными, так и рукотворными.
gifts:
- name: Ваятель Песка
  slug: vayatel-peska
  tier: lesser
  icon: /images/icons/gifts/pustynya/vayatel-peska.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Пока Усилие приложено, вы можете Основным действием придавать песку, осадочной
    породе и сухой земле в пределах видимости любую желаемую форму в объёме куба 20 футов на уровень персонажа.
    Сформованный песок после придания формы прочен, как песчаник. У созданных стен хиты равны уровню персонажа
    за каждый фут толщины; при достаточном уроне в них пробивается отверстие размером с существо.
- name: Лазурный Родник Оазиса
  slug: lazurnyy-rodnik-oazisa
  tier: lesser
  icon: /images/icons/gifts/pustynya/lazurnyy-rodnik-oazisa.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Призовите источник воды, заставив забить новый родник. Многократное применение этой способности
    может обеспечить водой почти любое число людей или за час размыть и разрушить немагические постройки.
    По усмотрению Обожествлённого призванная вода волшебно живительна и утоляет все потребности в пище
    тех, кто её пьёт. Эти родники существуют, пока их не рассеют или пока Обожествлённый не удалится больше
    чем на сто миль. Как вариант, Обожествлённый может вместо этого мгновенно уничтожить всю открытую
    воду и иссушить все природные родники в пределах двухсот футов на уровень персонажа, обратив обычную
    землю в песчаные пустоши.
- name: Мерцающий Мираж
  slug: mertsayuschiy-mirazh
  tier: lesser
  icon: /images/icons/gifts/pustynya/mertsayuschiy-mirazh.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены, чтобы вызвать иллюзию по своему выбору в пределах видимости.
    Созданная иллюзия может действовать самостоятельно, снабжена всеми нужными звуками и запахами и ведёт
    себя сообразно своему облику, но не может воздействовать на физические предметы и неосязаема. Обожествлённый
    может перемещать или изменять иллюзию Основным действием, пока она не исчезнет в конце сцены. Невидимость
    иллюзией не является, а вот ложная стена или гобелен — да.
- name: Меч Сирокко
  slug: mech-sirokko
  tier: lesser
  icon: /images/icons/gifts/pustynya/mech-sirokko.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Вы владеете печными ветрами и режущим песком как магическим оружием, нанося
    1к10 повреждений на всю дальность видимости. Против существ, которым для жизни нужна вода, эта атака
    всегда наносит не менее 1 очка урона, даже при промахе.
- name: Проклятие Праха
  slug: proklyatie-praha
  tier: lesser
  icon: /images/icons/gifts/pustynya/proklyatie-praha.webp
  badges:
  - type: act
    text: Действие
  - type: smite
    text: Кара
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. Вся местность по вашему выбору в радиусе до четверти мили на уровень
    персонажа немедленно обращается в пустыню. Если же нацелиться на одно видимое существо, оно иссыхает
    в обезвоженный труп. Достойные противники могут пройти спасбросок Стойкости, чтобы вместо этого получить
    урон, равный уровню Обожествлённого в очках. Существа из металла, камня, иссохшей плоти и прочих веществ
    без жидких составляющих этой силой не затрагиваются.
- name: Странник Среди Дюн
  slug: strannik-sredi-dyun
  tier: lesser
  icon: /images/icons/gifts/pustynya/strannik-sredi-dyun.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены и выберите целью одно существо или до Большой Толпы меньших противников.
    Цель безнадёжно теряется, каким бы простым и знакомым ни было её окружение, и не может найти выход
    из места или помещения, где находится. Это проклятие длится, пока Обожествлённый не освободит меньшего
    противника или пока достойный противник не пройдёт спасбросок Уклонения, который он может пытаться
    совершить в конце каждого своего раунда. Жертвы не замечают проклятия, пока действительно не попытаются
    покинуть место, где находятся.
- name: Владыка Пустого Предела
  slug: vladyka-pustogo-predela
  tier: greater
  icon: /images/icons/gifts/pustynya/vladyka-pustogo-predela.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: день'
  body: Вы сосредотачиваетесь на краткий миг и немедленно воспринимаете любой участок пустыни, связанный
    с той пустыней, на которой стоите. Если вы ищете в доступной области что-то определённое, вы автоматически
    это находите. Если вы приложите Усилие до конца дня, вы и ваши спутники можете мгновенно оказаться
    в любом связанном участке пустыни.
- name: Джинн Зыбучих Песков
  slug: dzhinn-zybuchih-peskov
  tier: greater
  icon: /images/icons/gifts/pustynya/dzhinn-zybuchih-peskov.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие, чтобы обратить своё тело в текучую бурю дыма и песка. В этом облике вы неуязвимо
    невосприимчивы к немагическому оружию и любым режущим или колющим телесным ранениям. Управлять физическими
    предметами в этом облике вы не можете, но можете применять свои дары и атаковать безоружно. Вы можете
    двигаться со своей обычной скоростью, проходить сквозь песок или землю, как сквозь пустоту, и протекать
    в любое отверстие или щель, куда пролезет хоть одна песчинка. Ваши вещи преображаются вместе с вами,
    хотя вы можете их сбросить, чтобы другие могли их подобрать, пока вы остаётесь преображённым.
- name: Ярость Самума
  slug: yarost-samuma
  tier: greater
  icon: /images/icons/gifts/pustynya/yarost-samuma.webp
  badges:
  - type: act
    text: Действие
  - type: smite
    text: Кара
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня, чтобы вызвать смертоносную бурю опаляющего печного жара и обдирающего
    кости песка. Все враги в пределах видимости получают 1к12 повреждений за каждые два ваших уровня с
    округлением вверх; достойным противникам даётся спасбросок Стойкости, чтобы уполовинить урон с округлением
    вверх. Толпы вместо броска получают 3 очка урона за уровень персонажа. Лёгкие деревянные постройки
    и подобные предметы уничтожаются ветрами, а более прочные здания вихрь обдирает и опаляет. По усмотрению
    владельца дар может поджечь легковоспламеняющиеся предметы.
