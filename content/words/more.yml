name: Море
kind: canon
colors:
  glow: '#6fd8f0'
  deep: '#062a38'
  dark: '#02121a'
icon: images/icons/words/more.webp
description: |-
  Слово Моря повелевает водой во всех её видах, но чаще всего — водой рек и океанов. Все существа, обитающие в воде, подвластны морю, а его воды могут унести благословенных далеко прочь либо раздавить и источить тех, кто не в милости. Чудеса моря могут крушить давящей толщей, вызывать несметные объёмы воды, управлять течением жидкостей или очищать целительной солью океанов.

  Герои со Словом Моря обладают неуязвимой защитой от холода, дышат водой, плавают вдвое быстрее своей обычной скорости и видят под водой с совершенной ясностью независимо от освещения. Они могут даровать эти преимущества своим спутникам — кроме невосприимчивости к холоду.
gifts:
- name: Живой Поток
  slug: zhivoy-potok
  tier: lesser
  icon: images/icons/gifts/more/zhivoy-potok.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Извергните поток воды под опасным давлением. Воду можно использовать как дальнобойное
    оружие на дистанции до 100 футов, нанося 1к10 повреждений и считаясь магическим оружием. За один раунд
    она разрушает фут земляных или деревянных преград. По воле владельца воду можно оставить после применения
    силы или дать ей исчезнуть.
- name: Идущий с Приливом
  slug: iduschiy-s-prilivom
  tier: lesser
  icon: images/icons/gifts/more/iduschiy-s-prilivom.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Войдите в водоём, достаточный, чтобы вас скрыть, и выйдите из
    любого такого же водоёма в пределах мили, появившись в ближайшем подходящем водоёме к желаемому месту.
    Если водоёмы соединены водами, достаточно широкими, чтобы пропустить существо вашего размера, дальность
    возрастает до ста миль.
- name: Повелитель Вод
  slug: povelitel-vod
  tier: lesser
  icon: images/icons/gifts/more/povelitel-vod.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Пока дар действует, вы можете превращаться в любое немагическое морское существо
    крупнее креветки и мельче кракена. Вы можете говорить со всей природной морской живностью и повелевать
    ею, чувствовать каждое живое существо под водой и на воде в пределах мили и призывать такую живность
    к себе по мере надобности. Разумные существа могут не подчиняться вашим зовам и приказам, если не
    пожелают. Корабли или флоты в вашем обществе неуязвимы для штормов и рифов.
- name: Сокрушающие Глубины
  slug: sokrushayuschie-glubiny
  tier: lesser
  icon: images/icons/gifts/more/sokrushayuschie-glubiny.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: 'Приложите Усилие до конца сцены. Уничтожьте любой немагический предмет, которого касаетесь, размером
    до 20 × 20 × 20 футов: он источается или сминается в щепу. Живые существа требуют обычной атаки оружием
    или безоружной атаки для попадания и не уничтожаются автоматически, хотя кость урона считается выпавшей
    на максимум.'
- name: Тайны Глубин
  slug: tayny-glubin
  tier: lesser
  icon: images/icons/gifts/more/tayny-glubin.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Вы ощущаете точное положение всех текущих жидкостей в пределах 200 футов, включая
    кровь в живых жилах. Коснувшись водоёма и ища определённую вещь или род предметов, вы узнаёте о каждом
    месте в пределах десяти миль, где такая вещь затонула, плывёт или лежит у кромки воды.
- name: Тело из Воды
  slug: telo-iz-vody
  tier: lesser
  icon: images/icons/gifts/more/telo-iz-vody.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Ваша плоть обтекает опасности и заключает в себе яды. Ваш естественный класс защиты равен 3, и
    вы невосприимчивы к ядам. Вы можете нанести яд прикосновением, если прежде проглотили его дозу или
    были ею поражены, — так вы этот яд извергаете. Этот класс защиты не улучшается щитами и доспехами.
- name: Рука Цунами
  slug: ruka-tsunami
  tier: greater
  icon: images/icons/gifts/more/ruka-tsunami.webp
  badges:
  - type: act
    text: Действие
  - type: smite
    text: Кара
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Вы наносите удар, который становится обрушивающейся волной шириной
    до 200 футов, высотой 30 футов и длиной 100 футов, прежде чем схлынуть. Небольшие здания и хрупкие
    сооружения уничтожаются, а существа получают урон, равный вашему уровню в очках, утроенный для Толп.
    Волну по желанию можно направить на меньшую площадь, она не вредит целям, которые вы хотите уберечь,
    и исчезает, разбившись, не оставляя местность затопленной.
- name: Укротитель Реки
  slug: ukrotitel-reki
  tier: greater
  icon: images/icons/gifts/more/ukrotitel-reki.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Объёмы воды не больше небольшой реки можно перенаправить, заставить течь по
    воздуху или двигаться иным невозможным образом. Вода может сносить здания или существа — в зависимости
    от объёмов — и достаточна, чтобы разогнать корабль в море вдесятеро против обычного. Течение продолжается,
    пока Усилие приложено, и им можно управлять действием на расстоянии до 1 000 футов от героя. Сам герой
    и его союзники никогда не сдвигаются этой водой против воли и не получают от неё вреда.
- name: Чистота Солёных Брызг
  slug: chistota-solenyh-bryzg
  tier: greater
  icon: images/icons/gifts/more/chistota-solenyh-bryzg.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Рассейте любой один магический эффект, нацеленный на вас или
    союзника, либо автоматически ему противостойте. До конца сцены этот эффект или дар не может подействовать
    на того, кого вы защитили, даже если будет применён снова. Как вариант, вместо этого вы можете подавить
    любой другой дар Обожествлённого на один раунд, как если бы это удалось чудом.
