name: Обожествление
kind: canon
colors:
  glow: '#ffe999'
  deep: '#3a3208'
  dark: '#151204'
icon: images/icons/words/obozhestvlenie.webp
description: |-
  Слово Обожествления — особое Слово. Его нельзя выбрать как связанное Слово, и собственных чудес у него нет. Вместо этого оно отражает те особые способности, что подобают взрастающему божеству и обретаются сами собой по мере роста его мощи.

  Многие силы обожествления действуют только на почитателей. Почитатель — это разумное существо, осознанно и добровольно посвятившее себя поклонению Обожествлённому или иной связанной со Словом божественной сущности, вроде бога-паразита или Сотворённого Бога. Почитателя могут вынудить обстоятельства или угрозы, но нельзя принудить или склонить магией. Почитатель может служить лишь одному божеству за раз. Тех, кто посвящает себя пантеону, приписывают к тому из богов, чьей природе они больше соответствуют, — знают они о том или нет. Почитатели могут отвернуться от бога, но не могут отречься от самого своего состояния. Самое большее, что им доступно, — найти нового бога, который примет их верность.

  Боги всегда знают, поклоняется ли им тот или иной человек, хотя и не имеют самопроизвольного знания о том, послушен ли этот почитатель. Они могут отвергнуть почитателя в любой момент или принять переход к себе чужой паствы. Бог не узнаёт сам собой о чьём-то решении ему поклоняться, но может определить это одним взглядом на нового почитателя.

  Боги всегда распоряжаются душами своих приверженцев. Они могут по своей воле обречь верных мертвецов на Ад, но иначе души умерших незримо и спящими витают подле своего бога либо отправляются в его рай. Душа, не укрытая раем, падёт в Ад, если её бог-покровитель будет убит.

  Единственный способ обрести дары обожествления — набирать уровни персонажа. Их можно использовать как есть, но Слово не даёт чудес, и чудесами нельзя подражать его силам.
gifts:
- name: 'Уровень 2: Принять Фимиам Веры'
  slug: uroven-2-prinyat-fimiam-very
  tier: lesser
  icon: images/icons/gifts/obozhestvlenie/uroven-2-prinyat-fimiam-very.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: 'Обретается на втором уровне: Обожествлённый становится способен принимать поклонение смертных
    верующих и может начать создавать собственный культ.'
- name: 'Уровень 3: Освятить Святилище'
  slug: uroven-3-osvyatit-svyatilische
  tier: lesser
  icon: images/icons/gifts/obozhestvlenie/uroven-3-osvyatit-svyatilische.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: день'
  body: 'Обретается на третьем уровне: почитатели Обожествлённого теперь могут освящать храмы и святилища
    своему божеству. В должным образом освящённом месте Обожествлённый может по своему выбору воспринимать
    всё, что происходит в его пределах, но должен нарочно решить смотреть. Он может нацелить дар или чудо
    на любого человека на священной земле по обычной цене в Усилии. Первое такое диво за день бесплатно,
    а каждое следующее требует от Обожествлённого приложить Усилие до конца дня. Должное освящение святилища
    требует обрядов и составов на Богатство, равное уровню Обожествлённого, и рост его уровня требует
    дополнительных трат. Если святилище осквернено, его нужно освятить заново за полную цену.'
- name: 'Уровень 3: Покарать Отступника'
  slug: uroven-3-pokarat-otstupnika
  tier: lesser
  icon: images/icons/gifts/obozhestvlenie/uroven-3-pokarat-otstupnika.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: 'Также на третьем уровне: Обожествлённый может мгновенно убить провинившегося почитателя или поразить
    его каким-нибудь изнуряющим страданием, подобающим его Словам. Эта мука длится столько, сколько пожелает
    Обожествлённый. Однако если почитателя примет другой бог, проклятие снимается.'
- name: 'Уровень 4: Услышать Молитву'
  slug: uroven-4-uslyshat-molitvu
  tier: lesser
  icon: images/icons/gifts/obozhestvlenie/uroven-4-uslyshat-molitvu.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: На четвёртом уровне Обожествлённый способен слышать молитвы своих верных. Обычно это подсознательный
    шелест или шёпот прошений, но при желании он может нарочно «прислушиваться» к определённым темам или
    людям, получая весть, когда эти темы всплывают или эти люди к нему обращаются. Обожествлённый может
    говорить со своими верными во время их молитв, хотя этот внутренний голос неявен и не принуждает к
    послушанию.
- name: 'Уровень 5: Узреть Просителя'
  slug: uroven-5-uzret-prositelya
  tier: lesser
  icon: images/icons/gifts/obozhestvlenie/uroven-5-uzret-prositelya.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: На пятом уровне Обожествлённый может, сосредоточившись на одно действие, увидеть конкретного почитателя
    и его окружение, зная о его нынешнем положении всё, что знает сам почитатель. Это не даёт глубокого
    или тонкого понимания происходящего, но достаточно, чтобы ясно представить его нынешние обстоятельства.
- name: 'Уровень 6: Знак Пророка'
  slug: uroven-6-znak-proroka
  tier: lesser
  icon: images/icons/gifts/obozhestvlenie/uroven-6-znak-proroka.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: На шестом уровне Обожествлённый может посвящать отдельных почитателей в избранные ученики или
    верховные жрецы. На каждый уровень Обожествлённого можно выбрать одного ученика, но верховный понтифик
    может быть только один. Ученики мгновенно становятся героическими смертными уровня, равного половине
    уровня их покровителя с округлением вверх, а верховный жрец — героическим смертным уровня самого Обожествлённого.
    И те и другие обычно берут таланты, отражающие сферу их покровителя, включая дар-другой. Как вариант,
    считайте учеников Умелыми Магами или Великими Героями из раздела смертных в бестиарии, а верховного
    жреца — малым Жутким. Само посвящение занимает лишь миг, но отнять его у служителя до его смерти нельзя,
    даже если позже он оставит службу своему богу.
- name: 'Уровень 7: Явиться Верным'
  slug: uroven-7-yavitsya-vernym
  tier: lesser
  icon: images/icons/gifts/obozhestvlenie/uroven-7-yavitsya-vernym.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: На седьмом уровне Обожествлённый может явиться перед молящимся почитателем, мгновенно представ
    пред ним, как бы далеко божество ни находилось — даже из иного мира. Впрочем, это явление длится не
    дольше сцены, после чего Обожествлённый возвращается на прежнее место и не может воспользоваться этим
    даром до следующего дня.
- name: 'Уровень 8: Благословить Народы'
  slug: uroven-8-blagoslovit-narody
  tier: lesser
  icon: images/icons/gifts/obozhestvlenie/uroven-8-blagoslovit-narody.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: На восьмом уровне Обожествлённый может избирательно благословлять или губить удачу той группировки,
    в которой немало его последователей. Если в группировке присутствует столько почитателей, сколько
    составило бы объединение на одну ступень Мощи меньше, Обожествлённый может избирательно прибавлять
    или вычитать 2 из любого броска её действия. Так, если в городе Мощи 2 наберётся верных на деревню
    Мощи 1, город будет подвластен влиянию Обожествлённого. Обожествлённый должен знать о том, что группировка
    предпринимает действие, влияющее на бросок, но лишь самые тайные и незаметные дела способны ускользнуть
    от внимания столь многочисленных почитателей и их молитв.
