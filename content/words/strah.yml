name: Страх
kind: canon
colors:
  glow: '#d79ad0'
  deep: '#20141f'
  dark: '#0c070c'
icon: images/icons/words/strah.webp
description: |-
  Обожествлённый Страха — посланник кошмара. Он несёт с собой неотвратимость ужасов и ожидание кошмаров, выжигая на смертных умах муку того, что ещё не случилось, и страх того, что ещё может статься. Даже безмозглые твари откликаются на ужасы, которых не способны по-настоящему осмыслить.

  Связанные со Словом Страха обладают неуязвимой защитой от сверхъестественных сил страха и автоматически дают Мораль 12 любым видимым слугам, ведь те боятся Обожествлённого куда сильнее врага. Одновременно любые враги, с которыми они сталкиваются, получают автоматический штраф -2 к Морали. Этот штраф и прочие страхи, насылаемые Обожествлённым, могут действовать даже на безмозглых или фанатичных противников. Если эти дары применяются против персонажей игроков, считайте, что у них базовая Мораль 12, к которой затем применяется штраф -2.
gifts:
- name: Аура Осязаемого Страха
  slug: aura-osyazaemogo-straha
  tier: lesser
  icon: images/icons/gifts/strah/aura-osyazaemogo-straha.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Естественный класс защиты Обожествлённого равен 3, ведь враги медлят его ударить. Меньшие противники
    с изменённой Моралью 6 или ниже слишком запуганы, чтобы нападать на Обожествлённого, если он не ударит
    первым, — да и тогда они скорее побегут.
- name: Внушить Страх
  slug: vnushit-strah
  tier: lesser
  icon: images/icons/gifts/strah/vnushit-strah.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены и выберите одну цель или Маленькую Толпу. Выберите одно понятие,
    деяние или род действий, размышлять о котором для них станет невыносимо страшно. Меньшие противники
    не смогут совершить это действие, если от него не зависит их жизнь, а достойные противники могут пройти
    проверку Морали, чтобы совершить его на один раунд, либо приложить Усилие до конца сцены, чтобы полностью
    стряхнуть страх. Существа, сбросившие эту силу, невосприимчивы к ней до конца сцены. В остальных случаях
    страх длится, пока Обожествлённый его не снимет.
- name: Копьё Даймоны
  slug: kope-daymony
  tier: lesser
  icon: images/icons/gifts/strah/kope-daymony.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: 'Приложите Усилие. Обожествлённый владеет смертным ужасом как оружием: его атаки наносят 1к10
    эмоционального урона и бьют на всю дальность видимости. Первый раз, когда противник поражён этой силой
    в бою, он должен пройти проверку Морали.'
- name: Напугать Незваного Гостя
  slug: napugat-nezvanogo-gostya
  tier: lesser
  icon: images/icons/gifts/strah/napugat-nezvanogo-gostya.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня и выберите определённое место. Оно должно быть либо не более тысячи
    футов в поперечнике, либо как-то связано с Обожествлённым силой другого Слова — например, связанный
    город или пустыня. Все нежеланные пришельцы испытывают всё нарастающее чувство страха. Эту растущую
    тревогу можно привязать к определённым явлениям, настоящим или мнимым, либо оставить просто зловещим
    предчувствием. Жертва должна проходить проверку Морали со штрафом -2 от Обожествлённого каждую минуту,
    что исследует это гиблое место, иначе бежит. Ужас длится, пока не будет рассеян. Достойный противник
    может пройти спасбросок Духа, чтобы сбросить его на сцену.
- name: Ощутить Трепет Души
  slug: oschutit-trepet-dushi
  tier: lesser
  icon: images/icons/gifts/strah/oschutit-trepet-dushi.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: Без Усилия
  body: Обожествлённый изучает видимую цель и узнаёт о любых её страхах, имеющих отношение к его интересам,
    получая достаточно подробностей, чтобы источник этих страхов стал понятен. Он может избирательно приглушать
    или усиливать такие ужасы. На полной силе жертва должна пройти проверку Морали или же действовать
    так, чтобы отвести или избежать этого страха, на пределе своего природного характера. Спокойствие
    или ужас длятся не более 24 часов либо пока Обожествлённый её не отпустит. Достойные противники получают
    спасбросок Духа против этого вторжения.
- name: Породить Древний Ужас
  slug: porodit-drevniy-uzhas
  tier: lesser
  icon: images/icons/gifts/strah/porodit-drevniy-uzhas.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Обожествлённый вызывает чудовищное воплощение самого страха,
    похожее на первобытную мерзость, поднятую из древнейших и глубже всего подавленных родовых воспоминаний
    человечества. Эти жуткие создания имеют вдвое больше «призрачных» хит-дайсов, чем уровень Обожествлённого,
    класс защиты 5, скорость полёта 30 футов, бонус к попаданию, равный их хит-дайсам, и наносят 1к10
    эмоционального урона; но их атаки всегда успешно попадают по породившей их сущности и бросают против
    неё 1к20 эмоционального урона. Они не способны совершать действия, не направленные на то, чтобы навредить
    своему источнику или ужаснуть его. Обожествлённый может породить лишь один такой ужас за раз. Цели,
    «убитые» этим воплощением, вместо смерти сводятся к 1 хиту и впадают в оцепенение. Все атаки, основанные
    на свете, — например, от Слова Солнца — наносят этой мерзости тройной урон.
- name: Почерневшее Сердце
  slug: pochernevshee-serdtse
  tier: lesser
  icon: images/icons/gifts/strah/pochernevshee-serdtse.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  - type: eff
    text: 'Усилие: по желанию'
  body: Обожествлённый обладает неуязвимой защитой от способностей, воздействующих на чувства. Он может
    приложить Усилие, чтобы распространить этот иммунитет на слуг в пределах видимости.
- name: Мантия Наваждения
  slug: mantiya-navazhdeniya
  tier: greater
  icon: images/icons/gifts/strah/mantiya-navazhdeniya.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: по желанию'
  - type: eff
    text: 'Усилие: день'
  body: 'Приложите Усилие. Вы можете пользоваться чувствами любого меньшего противника, который когда-либо
    провалил вызванную вами проверку Морали или был вами схожим образом напуган, воспринимая всё, что
    воспринимает он, без того, чтобы он осознавал ваше присутствие. Приложите Усилие до конца дня, чтобы
    мгновенно появиться у него за спиной, если он находится в пределах десяти миль на уровень Обожествлённого.
    Меньшие противники, скорее всего, умрут от испуга на месте. Достойные противники будут слишком ошарашены,
    чтобы отреагировать, если не пройдут спасбросок Духа, — да и тогда будут действовать последними. Обожествлённый
    может совершить против них одно любое действие: атаковать, применить дар или просто обронить загадочное
    замечание, прежде чем развоплотится обратно.'
- name: Мать/Отец Невыразимых Ужасов
  slug: mat-otets-nevyrazimyh-uzhasov
  tier: greater
  icon: images/icons/gifts/strah/mat-otets-nevyrazimyh-uzhasov.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Чтобы купить этот дар, нужно уже иметь малый дар «Породить Древний Ужас». Приложите Усилие до
    конца дня и выберите цель так же, как обычно для «Породить Древний Ужас». Порождённая вами жуткая
    мерзость будет пугающе настоящей во всех отношениях и нанесёт всем врагам настоящие 1к20 повреждений.
    Она задержится в этом мире и будет исполнять вашу волю до следующего рассвета.
- name: Неотвратимый Кошмар
  slug: neotvratimyy-koshmar
  tier: greater
  icon: images/icons/gifts/strah/neotvratimyy-koshmar.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Чтобы купить этот дар, нужно уже иметь малый дар «Ощутить Трепет Души». Приложите Усилие до конца
    дня и выберите один из страхов видимой цели. Этот страх неизбежно сбудется так скоро, как только возможно.
    Если страх затрагивает достойных противников, те могут пройти спасбросок Духа, чтобы дар на них не
    подействовал, но меньшие противники предпримут всё необходимое, чтобы страх сбылся, — намеренно или
    нет. Если страх касается неодушевлённых предметов или случайных событий, совпадение и случай приведут
    его к исполнению, если это вообще физически возможно. Применить этот дар к той же цели снова нельзя,
    пока страх не сбудется. Размах страха не может затрагивать более 100 действующих лиц.
