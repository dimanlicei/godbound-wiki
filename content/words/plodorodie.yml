name: Плодородие
kind: canon
colors:
  glow: '#a7e88a'
  deep: '#12300f'
  dark: '#061405'
icon: images/icons/words/plodorodie.webp
description: |-
  Плодородие земель и дети в семьях — два самых заветных желания простого люда, и Слово Плодородия дарует такие благословения. Немедленные чудеса обычно ненадолго влияют на желание, плотскую близость, урожаи и порчу, а дары Слова способны давать более длительные последствия.

  Герои со Словом Плодородия полностью управляют своим деторождением и могут установить значение Харизмы или Телосложения равным 16, или 18, если оно уже равно 16 или больше. Кроме того, Обожествлённый может исцелять врождённые пороки, обеспечивать благополучные роды или благословлять последователей уверенностью в здоровом зачатии и определять черты будущего ребёнка. Не угодивших ему смертных он может проклясть бесплодием. Божества Плодородия часто самые любимые в человеческих пантеонах.
gifts:
- name: Аура Плодовитости
  slug: aura-plodovitosti
  tier: lesser
  icon: images/icons/gifts/plodorodie/aura-plodovitosti.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Обожествлённый буквально светится жизненной силой и потенциалом, что делает его привлекательным
    и желанным на уровне чутья для большинства человеческих сообществ. Ему всегда будут давать презумпцию
    добрых намерений, пока не будет доказана его злонамеренность или вредительство. Кроме того, его максимум
    Усилия навсегда возрастает на одно очко.
- name: Благословить Дитя
  slug: blagoslovit-ditya
  tier: lesser
  icon: images/icons/gifts/plodorodie/blagoslovit-ditya.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. Обожествлённый проявляет особое участие к ребёнку не старше двенадцати
    лет, благословляя его божественной милостью. Это дитя неизбежно вырастет либо Умелым Магом, либо Великим
    Героем, хотя его будущее поклонение не предопределено само собой — о преданности придётся позаботиться.
    Обожествлённый может свободно распространить своё благословение на столько юных потенциальных Героев,
    сколько у него уровней персонажа.
- name: Вторая Весна
  slug: vtoraya-vesna
  tier: lesser
  icon: images/icons/gifts/plodorodie/vtoraya-vesna.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. Все союзники в пределах видимости освежаются, вновь обретая бодрость,
    как после сытной еды и отдыха, и исцеляют 1к6 хитов урона плюс уровень Обожествлённого. В отличие
    от большинства исцеляющих эффектов, получателям не нужно прикладывать Усилие, чтобы воспользоваться
    этим благословением.
- name: Найти Порчу
  slug: nayti-porchu
  tier: lesser
  icon: images/icons/gifts/plodorodie/nayti-porchu.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Вы чувствуете все яды, поветрия, ущерб окружающей среде и проклятия, наложенные
    на землю в пределах видимости. Вы получаете представление о людях или причинах, которые за этим стоят,
    если те не скрыты магией. Вы с первого взгляда узнаёте больных или разносящих болезнь существ и можете
    определить, какая зараза их поразила или какую они передают другим.
- name: Обильный Урожай
  slug: obilnyy-urozhay
  tier: lesser
  icon: images/icons/gifts/plodorodie/obilnyy-urozhay.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: Приложите Усилие до конца дня. Все сельскохозяйственные земли в радиусе одной мили на уровень
    персонажа от того места, где сейчас стоит Обожествлённый, будут вдвое урожайнее до наступления зимы.
    Именно этот дар чаще всех прочих оберегает последователей Обожествлённого от голода, вызванного перенаселением
    или неурожаем.
- name: Прикосновение Зелёных Пут
  slug: prikosnovenie-zelenyh-put
  tier: lesser
  icon: images/icons/gifts/plodorodie/prikosnovenie-zelenyh-put.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: сцена'
  body: Приложите Усилие до конца сцены. Растения в радиусе 50 футов вокруг выбранной точки в пределах
    видимости вырываются наружу и цепляются за врагов. Все противники в этой области в начале каждого
    раунда должны проходить спасбросок Уклонения, чтобы сбросить лозы и вернуть себе свободу движения,
    хотя драться на месте или вести дальний бой, если есть чем, они могут как обычно. Противники, подверженные
    вашей кости Схватки, получают её каждый раунд, пока остаются опутанными. Тех врагов, кто из-за этого
    доходит до нуля хит-дайсов, можно по усмотрению Обожествлённого либо полностью обездвижить, либо раздавить
    насмерть.
- name: Рог Изобилия
  slug: rog-izobiliya
  tier: lesser
  icon: images/icons/gifts/plodorodie/rog-izobiliya.webp
  badges:
  - type: act
    text: В свой ход
  - type: eff
    text: 'Усилие: по желанию'
  body: Приложите Усилие. Выберите вместилище не крупнее корзины, мешка или того самого рога, содержащее
    немагическое сельскохозяйственное вещество; пока Усилие приложено, запас не иссякнет, сколько бы из
    него ни брали.
- name: Бесконечное Изобилие
  slug: beskonechnoe-izobilie
  tier: greater
  icon: images/icons/gifts/plodorodie/beskonechnoe-izobilie.webp
  badges:
  - type: act
    text: Действие
  - type: eff
    text: 'Усилие: день'
  body: 'Чтобы получить этот дар, нужен малый дар «Обильный Урожай». Приложите Усилие до конца дня. Указанная
    вами земля в радиусе десяти миль становится невероятно плодородной: посевы всходят за считанные часы
    и кормят сколько угодно людей в этой области. Это плодородие сохраняется, пока вы не примените дар
    снова в другом месте.'
- name: Дева, Мать и Старуха
  slug: deva-mat-i-staruha
  tier: greater
  icon: images/icons/gifts/plodorodie/deva-mat-i-staruha.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Чтобы купить этот дар, вам нужен культ почитателей и малый дар «Аура Плодовитости». Божества Плодородия
    часто связывались с девственностью, браком, материнскими обязанностями, повивальным делом и прочими
    женскими трудами. В большинстве человеческих культур они вызывают тихое уважение и глубокое благоговение
    как естественный средоточий поклонения. Вам будут добровольно служить по меньшей мере столько исключительно
    преданных последователей, сколько у вас уровней персонажа. Этих друидов, целителей или жриц следует
    отображать характеристиками НИП «Умелый Маг», что делает их архимагами хотя бы одной связанной с плодородием
    традиции низкой магии, а также позволяет им выучить до трёх малых даров.
- name: Прародитель
  slug: praroditel
  tier: greater
  icon: images/icons/gifts/plodorodie/praroditel.webp
  badges:
  - type: act
    text: Постоянно
  - type: eff
    text: Без Усилия
  body: Чтобы купить этот дар, нужен малый дар «Благословить Дитя». Ближайшим последователям Обожествлённого
    необычайно везёт с продолжением рода. Они легко зачинают, редко сталкиваются с трудностями беременности
    или выкидышами и часто рожают двойни и даже тройни. В целом эта усиленная плодовитость охватывает
    население размером примерно с город и только верных почитателей. За поколение-другое этот дар может
    дать невероятный результат. В ближайшей же перспективе Обожествлённый получает два постоянных очка
    Влияния.
